<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ToolScout Affiliate Workflow</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#101828;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1480px;margin:auto;padding:28px 18px 80px}h1{letter-spacing:-.04em;margin-bottom:4px}.muted{color:#667085}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}.stat,.card,.pack,.notice{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px}.stat strong{font-size:28px;display:block}.notice{margin:12px 0;background:#fff8e8}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.bar input,.bar select,select,textarea{border:1px solid #d0d5dd;border-radius:10px;padding:9px;background:#fff;font:inherit}.bar input{min-width:260px}.grid{display:grid;gap:12px}.card{display:grid;grid-template-columns:210px 145px minmax(340px,1fr) 210px;gap:14px;align-items:start}.name{font-weight:800;font-size:17px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2f4f7;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;padding:8px 10px;border-radius:9px;background:#101828;color:#fff;text-decoration:none;border:0;cursor:pointer;font:inherit;font-size:12px}.btn.alt{background:#eef2f6;color:#101828}.details{font-size:12px;color:#667085;line-height:1.55}.req{margin:10px 0 0;padding-left:18px}.req li{font-size:12px;color:#475467;margin:3px 0}.guidance{margin-top:10px;padding:10px;background:#f8fafc;border-radius:10px;font-size:12px;color:#344054;line-height:1.55}.pack{margin:20px 0}.pack pre{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:10px;font-size:12px}.save{font-size:11px;color:#667085;margin-top:5px}@media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:1fr}.bar input{min-width:0;width:100%}}</style></head><body><div class="wrap"><h1>Affiliate Workflow</h1><div class="muted">Private ToolScout operating page · 100-tool affiliate pipeline</div><div id="constraints"></div><div class="stats" id="stats"></div><div class="pack"><b>Reusable application pack</b><pre id="pack">Loading…</pre></div><div class="bar"><input id="q" placeholder="Search tools"><select id="filter"><option value="">All statuses</option><option>active</option><option>approved_needs_link</option><option>submitted</option><option>appeal_pending</option><option>needs_info</option><option>ready_to_apply</option><option>program_exists</option><option>research_required</option><option>paused</option><option>rejected</option><option>no_program</option></select></div><div class="grid" id="list"></div></div><script>let data={tools:[],applicationPack:{},networkConstraints:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const labels={active:'Active',approved_needs_link:'Approved · link needed',submitted:'Submitted',appeal_pending:'Appeal pending',needs_info:'Needs info',ready_to_apply:'Ready to apply',program_exists:'Program exists',research_required:'Research required',paused:'Paused',rejected:'Rejected',no_program:'No program'};async function load(){const r=await fetch('/api/affiliate-workflow',{cache:'no-store'});if(!r.ok)throw Error('unauthorized');data=await r.json();render();}function render(){const counts={};data.tools.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);document.querySelector('#stats').innerHTML=[['Tools',data.tools.length],['Active',counts.active||0],['Submitted',(counts.submitted||0)+(counts.appeal_pending||0)],['Ready',(counts.ready_to_apply||0)+(counts.program_exists||0)],['Research',counts.research_required||0]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');document.querySelector('#constraints').innerHTML=(data.networkConstraints||[]).map(x=>`<div class="notice"><b>${esc(x.provider)}: ${esc(x.status)}</b><div class="details">${esc(x.next_action)}</div></div>`).join('');document.querySelector('#pack').textContent=Object.entries(data.applicationPack||{}).map(([k,v])=>`${k}: ${v}`).join('\n\n');const q=document.querySelector('#q').value.toLowerCase(),f=document.querySelector('#filter').value;document.querySelector('#list').innerHTML=data.tools.filter(t=>(!q||(t.name+' '+t.slug+' '+t.category).toLowerCase().includes(q))&&(!f||t.status===f)).map(t=>`<div class="card"><div><div class="name">${esc(t.name)}</div><div class="details">${esc(t.category)} · ${esc(t.commission||'Terms unverified')}</div></div><div><span class="pill">${esc(labels[t.status]||t.status)}</span><div class="save">${esc(t.updated_at||'')}</div></div><div><div class="details">${esc(t.next_action||'Research official affiliate programme and application requirements.')}</div>${(t.requirements||[]).length?`<ul class="req">${t.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${t.form_guidance?`<div class="guidance"><b>How to position ToolScout</b><br>${esc(t.form_guidance)}</div>`:''}<div class="actions" style="margin-top:10px">${t.application_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(t.application_url)}">Apply / open programme ↗</a>`:''}${t.affiliate_url?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(t.affiliate_url)}">Affiliate link ↗</a>`:''}<button class="btn alt" onclick="copyPack('${esc(t.slug)}')">Copy tailored application</button></div></div><div><select onchange="setStatus('${esc(t.slug)}',this.value)">${Object.keys(labels).map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${labels[s]}</option>`).join('')}</select><textarea id="n-${esc(t.slug)}" rows="3" placeholder="Notes / affiliate URL">${esc(t.notes||'')}</textarea><button class="btn alt" onclick="saveNote('${esc(t.slug)}')">Save note</button></div></div>`).join('');}async function patch(slug,body){const r=await fetch('/api/affiliate-workflow/'+encodeURIComponent(slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('save failed');await load();}function setStatus(slug,status){patch(slug,{status});}function saveNote(slug){const v=document.querySelector('#n-'+CSS.escape(slug)).value;const isUrl=/^https?:\/\//i.test(v.trim());patch(slug,isUrl?{affiliate_url:v.trim(),notes:'Affiliate URL supplied manually'}:{notes:v});}async function copyPack(slug){const t=data.tools.find(x=>x.slug===slug);const req=(t.requirements||[]).length?'\nRequirements to address:\n- '+t.requirements.join('\n- '):'';const guidance=t.form_guidance?'\n\nProgram-specific positioning: '+t.form_guidance:'';const text=`Tool: ${t.name}\nWebsite: ${data.applicationPack.website}\nApplicant: ${data.applicationPack.applicant}\nProject: ${data.applicationPack.project}\nPromotion method: ${data.applicationPack.promotion_method}\nAudience: ${data.applicationPack.audience}\nWhy join: ${data.applicationPack.why_join}\nTraffic: ${data.applicationPack.traffic_note}\nDisclosure: ${data.applicationPack.disclosure}${req}${guidance}`;await navigator.clipboard.writeText(text);}document.querySelector('#q').oninput=render;document.querySelector('#filter').onchange=render;load().catch(()=>document.body.innerHTML='<div class="wrap"><h1>Private access required</h1><p class="muted">Sign in through ToolScout private access and reload this page.</p></div>');</script></body></html>
