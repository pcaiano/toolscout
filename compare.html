<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare AI & Software Tools — ToolScout</title><meta name="description" content="Compare AI and software tools side by side and find the best fit for your needs."><style>body{font-family:Inter,system-ui,sans-serif;background:#f7f7f5;color:#111827;margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 20px 70px}nav{display:flex;justify-content:space-between;margin-bottom:55px}.brand{font-weight:800;font-size:22px;color:inherit;text-decoration:none}.links{display:flex;gap:18px;font-size:13px}.links a{color:#687180;text-decoration:none}h1{font-size:clamp(42px,7vw,68px);letter-spacing:-.06em;line-height:1;margin:0 0 14px}.intro p{color:#5f6875;font-size:18px}.selectors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:30px 0}.selectors select{padding:15px;border:1px solid #ddd;border-radius:12px;background:white;font:inherit}.table{overflow:auto;background:white;border:1px solid #e5e7eb;border-radius:18px}.row{display:grid;grid-template-columns:180px repeat(2,minmax(220px,1fr));min-width:650px;border-bottom:1px solid #eee}.row:last-child{border:0}.cell{padding:16px}.head{font-weight:800}.label{color:#687180;font-size:13px;font-weight:700}.note{font-size:12px;color:#8a919c;margin-top:28px}@media(max-width:650px){.selectors{grid-template-columns:1fr}}</style></head><body><div class="wrap"><nav><a class="brand" href="/toolscout/">ToolScout</a><div class="links"><a href="/toolscout/tools.html">Tools</a><a href="/toolscout/compare.html">Compare</a></div></nav><section class="intro"><h1>Compare tools.</h1><p>Put two tools side by side and see where each one fits best.</p></section><div class="selectors"><select id="a"></select><select id="b"></select></div><div id="table" class="table"></div><div class="note">Information is sourced and verified in our tool database. Pricing and features can change; check the provider before purchasing.</div></div><script>async function boot(){const tools=await fetch('/toolscout/data/tools.json').then(r=>r.json());const opts=tools.map(t=>`<option value="${t.slug}">${t.name}</option>`).join('');a.innerHTML=opts;b.innerHTML=opts;if(tools.length>1)b.value=tools[1].slug;const params=new URLSearchParams(location.search);if(params.get('tool'))a.value=params.get('tool');function render(){const x=tools.find(t=>t.slug===a.value),y=tools.find(t=>t.slug===b.value);if(!x||!y)return;const rows=[['Category',x.category,y.category],['Pricing',x.pricing,y.pricing],['Free plan',x.freePlan?'Yes':'No',y.freePlan?'Yes':'No'],['Features',x.features.join(', '),y.features.join(', ')],['Best for',x.bestFor.join(', '),y.bestFor.join(', ')],['Affiliate program',x.affiliateProgram||'Not connected',y.affiliateProgram||'Not connected']];table.innerHTML=`<div class="row"><div class="cell label">COMPARE</div><div class="cell head">${x.name}</div><div class="cell head">${y.name}</div></div>`+rows.map(r=>`<div class="row"><div class="cell label">${r[0]}</div><div class="cell">${r[1]}</div><div class="cell">${r[2]}</div></div>`).join('')}a.onchange=render;b.onchange=render;render()}boot();</script></body></html>
