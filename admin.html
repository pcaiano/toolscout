<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ToolScout Analytics</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f7f7f5;color:#111827;margin:0}.wrap{max-width:1200px;margin:auto;padding:32px 20px}.muted{color:#687180;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px}.num{font-size:32px;font-weight:800}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#f0f2f4;font-size:11px}.ok{font-weight:800}.warn{font-weight:800}@media(max-width:800px){.grid,.cols{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.cols{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>ToolScout Analytics</h1><p class="muted">Private analytics. Aggregated and session-based data only.</p><div class="grid"><div class="card"><div class="muted">Affiliate clicks</div><div class="num" id="clicks">—</div></div><div class="card"><div class="muted">Click sessions</div><div class="num" id="sessions">—</div></div><div class="card"><div class="muted">Clicks / session</div><div class="num" id="rate">—</div></div><div class="card"><div class="muted">Search intents</div><div class="num" id="intentCount">—</div></div></div><div class="cols"><div class="card"><h2>Top tools</h2><table><thead><tr><th>Tool</th><th>Clicks</th></tr></thead><tbody id="tools"></tbody></table></div><div class="card"><h2>Top intents</h2><table><thead><tr><th>Intent</th><th>Clicks</th></tr></thead><tbody id="intents"></tbody></table></div><div class="card"><h2>Acquisition sources</h2><table><thead><tr><th>Source</th><th>Clicks</th></tr></thead><tbody id="sources"></tbody></table></div><div class="card"><h2>Growth priorities</h2><table><thead><tr><th>Intent</th><th>Score</th><th>Status</th></tr></thead><tbody id="growth"></tbody></table></div></div></div><script>const API=(location.hostname==='trytoolscout.org'||location.hostname==='www.trytoolscout.org')?'https://trytoolscout.org/api/stats':'https://toolscout.luxurybuyerintelligence.workers.dev/api/stats';const BASE=(location.hostname==='trytoolscout.org'||location.hostname==='www.trytoolscout.org')?'':'https://trytoolscout.org';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const token=prompt('Admin token');const r=await fetch(API,{headers:{Authorization:'Bearer '+(token||'')}});if(!r.ok)throw 0;const d=await r.json(),c=Number(d.total?.clicks||0),s=Number(d.total?.sessions||0);document.querySelector('#clicks').textContent=c;document.querySelector('#sessions').textContent=s;document.querySelector('#rate').textContent=s?((c/s)*100).toFixed(1)+'%':'0%';document.querySelector('#intentCount').textContent=(d.searches||[]).length;const rows=(items,key,value)=>items.length?items.map(x=>`<tr><td>${esc(x[key])}</td><td>${esc(x[value])}</td></tr>`).join(''):'<tr><td colspan="2">No data yet</td></tr>';document.querySelector('#tools').innerHTML=rows(d.byTool||[],'tool_slug','clicks');document.querySelector('#intents').innerHTML=rows(d.byIntent||[],'intent_slug','clicks');document.querySelector('#sources').innerHTML=rows(d.bySource||[],'source','clicks');document.querySelector('#growth').innerHTML=(d.growth||d.opportunities||[]).map(x=>`<tr><td>${esc(x.intent_slug||x.intent)}</td><td>${esc(x.priorityScore??x.opportunity_score)}</td><td><span class="pill">${esc(x.action||x.status||'watch')}</span></td></tr>`).join('')||'<tr><td colspan="3">No priorities yet</td></tr>'}load().catch(()=>document.body.innerHTML='<div class="wrap"><h1>Analytics unavailable</h1><p class="muted">Check the deployment, D1 binding and admin token.</p></div>');</script></body></html>
