<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ToolScout Analytics</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f7f7f5;color:#111827;margin:0}.wrap{max-width:1100px;margin:auto;padding:32px 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px}.num{font-size:32px;font-weight:800}.muted{color:#687180;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>ToolScout Analytics</h1><p class="muted">Private analytics. Data is aggregated and anonymous.</p><div class="grid"><div class="card"><div class="muted">Clicks</div><div class="num" id="clicks">—</div></div><div class="card"><div class="muted">Anonymous sessions</div><div class="num" id="sessions">—</div></div><div class="card"><div class="muted">Click/session</div><div class="num" id="rate">—</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><h2>Top tools</h2><table><tbody id="tools"></tbody></table></div><div class="card"><h2>Top intents</h2><table><tbody id="intents"></tbody></table></div><div class="card"><h2>Search demand</h2><table><tbody id="searches"></tbody></table></div></div></div><script>async function load(){const token=prompt('Admin token');const r=await fetch('/api/stats',{headers:{Authorization:'Bearer '+(token||'')}});if(!r.ok)throw 0;const d=await r.json(),c=Number(d.total?.clicks||0),s=Number(d.total?.sessions||0);document.querySelector('#clicks').textContent=c;document.querySelector('#sessions').textContent=s;document.querySelector('#rate').textContent=s?((c/s)*100).toFixed(1)+'%':'0%';document.querySelector('#tools').innerHTML=(d.byTool||[]).map(x=>`<tr><td>${x.tool_slug}</td><td>${x.clicks}</td></tr>`).join('')||'<tr><td>No data yet</td></tr>';document.querySelector('#intents').innerHTML=(d.byIntent||[]).map(x=>`<tr><td>${x.intent_slug}</td><td>${x.clicks}</td></tr>`).join('')||'<tr><td>No data yet</td></tr>';document.querySelector('#searches').innerHTML=(d.searches||[]).map(x=>`<tr><td>${x.intent_slug}</td><td>${x.searches}</td></tr>`).join('')||'<tr><td>No data yet</td></tr>'}load().catch(()=>document.body.innerHTML='<div class="wrap"><h1>Analytics unavailable</h1><p>Check the deployment, D1 binding and admin token.</p></div>');</script></body></html>
