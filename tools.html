<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI & Software Tools — ToolScout</title><meta name="description" content="Browse and compare curated AI and software tools on ToolScout."><style>body{font-family:Inter,system-ui,sans-serif;background:#f7f7f5;color:#111827;margin:0}.wrap{max-width:1050px;margin:auto;padding:28px 20px 70px}nav{display:flex;justify-content:space-between;gap:20px;margin-bottom:55px}.brand{font-weight:800;font-size:22px;color:inherit;text-decoration:none}.links{display:flex;gap:18px;font-size:13px}.links a{color:#687180;text-decoration:none}.intro{max-width:700px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#6b7280;font-weight:700}h1{font-size:clamp(42px,7vw,68px);letter-spacing:-.06em;line-height:1;margin:16px 0}.intro p{color:#5f6875;font-size:18px;line-height:1.5}.search{margin:30px 0}.search input{width:100%;padding:17px 18px;border:1px solid #ddd;border-radius:14px;font:inherit;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.tool{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px}.tool h2{margin:0 0 5px;font-size:21px}.cat{font-size:12px;color:#7a828e;text-transform:uppercase;letter-spacing:.08em}.tool p{color:#5f6875;line-height:1.45}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#f0f2f4;border-radius:99px;padding:5px 8px;font-size:11px}.tool a{display:inline-block;margin-top:16px;background:#111827;color:white;text-decoration:none;padding:10px 13px;border-radius:10px;font-size:13px;font-weight:700}</style></head><body><div class="wrap"><nav><a class="brand" href="./">ToolScout</a><div class="links"><a href="./guides.html">Guides</a><a href="./compare.html">Compare</a></div></nav><section class="intro"><div class="eyebrow">Curated directory</div><h1>Tools worth knowing.</h1><p>Explore AI and software tools by category, use case and fit. We favour useful recommendations over giant lists.</p></section><div class="search"><input id="q" placeholder="Search tools, features or use cases…"></div><div id="grid" class="grid"></div></div><script>async function boot(){const tools=await fetch('./data/tools.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Tools unavailable');return r.json()});const grid=document.getElementById('grid');function render(){const q=document.getElementById('q').value.toLowerCase().trim();const rows=tools.filter(t=>[t.name,t.category,t.description,...(t.features||[]),...(t.bestFor||[])].join(' ').toLowerCase().includes(q));grid.innerHTML=rows.map(t=>`<article class="tool"><div class="cat">${t.category}</div><h2>${t.name}</h2><p>${t.description}</p><div class="chips">${(t.features||[]).slice(0,5).map(x=>`<span class="chip">${x}</span>`).join('')}</div><a href="./compare.html?tool=${encodeURIComponent(t.slug)}">Compare</a></article>`).join('')||'<p>No matching tools yet.</p>'}document.getElementById('q').addEventListener('input',render);render()}boot().catch(()=>document.getElementById('grid').innerHTML='<p>Unable to load the tool directory right now.</p>');</script></body></html>
