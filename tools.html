<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI & Software Tools — ToolScout</title><meta name="description" content="Browse and compare curated AI and software tools on ToolScout."><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,rgba(109,94,252,.09),transparent 28%),#f5f7fb}.wrap{max-width:1160px;margin:auto;padding:24px 22px 80px}nav{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:72px}.brand{font-weight:850;font-size:23px;letter-spacing:-.045em;color:#101828;text-decoration:none}.links{display:flex;gap:10px;font-size:13px}.links a{color:#667085;text-decoration:none;padding:9px 12px;border-radius:10px}.links a:hover{background:#fff;color:#101828}.intro{max-width:780px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#667085;font-weight:800}h1{font-size:clamp(48px,7vw,78px);letter-spacing:-.07em;line-height:.95;margin:14px 0 18px}.intro p{color:#667085;font-size:18px;line-height:1.6}.search{margin:34px 0 22px}.search input{width:100%;padding:18px 20px;border:1px solid #e1e6ed;border-radius:16px;font:inherit;background:rgba(255,255,255,.88);box-shadow:0 12px 30px rgba(16,24,40,.05);outline:0}.search input:focus{border-color:#a9b2c0;box-shadow:0 0 0 4px rgba(16,24,40,.05)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.tool{background:rgba(255,255,255,.95);border:1px solid #e2e7ed;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(16,24,40,.05);transition:.18s}.tool:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(16,24,40,.09)}.tool-head{display:flex;align-items:center;gap:13px}.tool-logo{width:46px;height:46px;border-radius:14px;background:#f2f4f7;border:1px solid #e5e9ef;display:grid;place-items:center;overflow:hidden;flex:0 0 46px}.tool-logo img{width:34px;height:34px;object-fit:contain}.fallback{font-weight:800;font-size:13px;color:#344054}.cat{font-size:11px;color:#7a8494;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.tool h2{margin:3px 0 0;font-size:21px;letter-spacing:-.03em}.tool p{color:#667085;line-height:1.5;font-size:14px;min-height:65px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:11px;background:#f2f4f7;border:1px solid #eaecf0;border-radius:999px;padding:6px 8px;color:#475467}.tool-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:15px;border-top:1px solid #eef1f4}.tool-link{font-size:13px;font-weight:750;color:#101828;text-decoration:none}.price{font-size:11px;color:#98a2b3}.note{font-size:12px;color:#98a2b3;margin-top:35px}@media(max-width:650px){nav{margin-bottom:54px}.links{gap:2px}h1{font-size:50px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><nav><a class="brand" href="./">ToolScout</a><div class="links"><a href="./guides.html">Guides</a><a href="./tools.html">Tools</a><a href="./compare.html">Compare</a></div></nav><section class="intro"><div class="eyebrow">Curated directory</div><h1>Tools worth knowing.</h1><p>Explore software by category, use case and fit. ToolScout favours useful recommendations over giant lists.</p></section><div class="search"><input id="q" aria-label="Search tools" placeholder="Search tools, features or use cases…"></div><div id="grid" class="grid"></div><div class="note">ToolScout may earn affiliate compensation from some links. Recommendations are based on fit, not affiliate payout.</div></div><script>
function logoUrl(t){try{return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(new URL(t.sourceUrl).hostname)+'&sz=128'}catch{return ''}}function initials(n){return String(n||'T').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}async function boot(){const tools=await fetch('./data/tools.json',{cache:'no-store'}).then(r=>r.json());const grid=document.getElementById('grid');function render(){const q=document.getElementById('q').value.toLowerCase().trim();const rows=tools.filter(t=>[t.name,t.category,t.description,...(t.features||[]),...(t.bestFor||[])].join(' ').toLowerCase().includes(q));grid.innerHTML=rows.map(t=>{const logo=logoUrl(t);return `<article class="tool"><div class="tool-head"><div class="tool-logo">${logo?`<img src="${logo}" alt="${t.name} logo" width="34" height="34" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}<span class="fallback" ${logo?'style="display:none"':''}>${initials(t.name)}</span></div><div><div class="cat">${t.category}</div><h2>${t.name}</h2></div></div><p>${t.description}</p><div class="chips">${(t.features||[]).slice(0,5).map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="tool-footer"><span class="price">${t.pricing}</span><a class="tool-link" href="./compare.html?tool=${encodeURIComponent(t.slug)}">Compare →</a></div></article>`}).join('')||'<div class="tool"><strong>No matching tools yet.</strong><p>Try a broader search term.</p></div>'}document.getElementById('q').addEventListener('input',render);render()}boot().catch(()=>document.getElementById('grid').innerHTML='<div class="tool"><strong>Unable to load the tool directory.</strong><p>Please try again shortly.</p></div>');</script></body></html>
