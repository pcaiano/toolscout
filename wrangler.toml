name = "toolscout"
main = "compute-router-worker.js"
compatibility_date = "2026-08-29"

[assets]
directory = "."
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = [
  "/",
  "/*.html",
  "/sitemap.xml",
  "/feed.xml*",
  "/best-*",
  "/*-vs-*",
  "/blog/*",
  "/news/*",
  "/whats-new*",
  "/tools",
  "/tools/*",
  "/guides*",
  "/compare*",
  "/methodology*",
  "/affiliate-disclosure*",
  "/privacy*",
  "/categories*",
  "/crm-tools*",
  "/seo-tools*",
  "/software-trends-index*",
  "/data/*",
  "/analytics*",
  "/api/stats*",
  "/api/events*",
  "/api/visitor*",
  "/api/confirmed-visitor*",
  "/api/traffic-integrity-health*",
  "/api/audience-event*",
  "/api/audience/*",
  "/api/engine-evidence*",
  "/api/distribution-event*",
  "/api/distribution/*",
  "/api/growth/*",
  "/api/runtime/*",
  "/api/seo/*",
  "/api/affiliate-coverage*",
  "/api/affiliate-replies*",
  "/api/catalog-autonomy*",
  "/api/recommend*",
  "/api/google-analytics/*",
  "/api/discovery-attribution-health*",
  "/api/command-center-truth-health*",
  "/api/command-center-autoload-health*",
  "/api/command-center-resilient-health*",
  "/api/autonomous-growth-health*",
  "/api/command-center-human-truth-health*",
  "/api/command-center-human-truth-final-health*",
  "/api/command-center-human-truth-details-health*",
  "/api/command-center-human-truth-chart-health*",
  "/mcp*",
  "/a2a*",
  "/embed*",
  "/distribution/feed.xml*",
  "/distribution/publisher-kit*",
  "/.well-known/toolscout-distribution.json*",
  "/.well-known/api-catalog*",
  "/.well-known/agent-card.json*",
  "/go/*",
  "/api/affiliate-workflow*",
  "/affiliate-workflow*",
  "/distribution-workflow*"
]

[vars]
GA4_PROPERTY_ID = "554080029"

[triggers]
crons = ["*/5 * * * *", "15 * * * *", "35 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "toolscout"
database_id = "cac6bc3c-d838-4edd-ba29-597030afb397"
migrations_dir = "migrations"
