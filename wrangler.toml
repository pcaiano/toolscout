name = "toolscout"
main = "dynamic-worker.js"
compatibility_date = "2026-08-29"

[assets]
directory = "."
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = ["/go/*"]

[triggers]
crons = ["15 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "toolscout"
database_id = "cac6bc3c-d838-4edd-ba29-597030afb397"
migrations_dir = "migrations"
