name: Visual Fix Deploy Once
# rerun 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-fix-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate redesign code
        run: |
          set -euo pipefail
          node --check public-redesign-runtime.js
          node --test tests/toolscout-v2-public-redesign.test.mjs
      - name: Deploy current main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Capture production visuals
        run: |
          set -euo pipefail
          mkdir -p shots
          urls=(
            "home|https://trytoolscout.org/"
            "tools|https://trytoolscout.org/tools"
            "guides|https://trytoolscout.org/guides"
            "compare|https://trytoolscout.org/compare"
            "whats-new|https://trytoolscout.org/whats-new"
            "publisher-kit|https://trytoolscout.org/distribution/publisher-kit"
            "figma|https://trytoolscout.org/tools/figma"
          )
          for item in "${urls[@]}"; do
            name="${item%%|*}"; url="${item#*|}"
            google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=3000 --screenshot="shots/${name}.png" "${url}?visual_fix=1"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: toolscout-visual-fix-shots
          path: shots/*.png
          retention-days: 1
