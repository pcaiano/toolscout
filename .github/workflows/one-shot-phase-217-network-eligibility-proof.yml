name: One Shot Phase 217 Network Eligibility Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-217-network-eligibility-proof.yml'

permissions:
  contents: read
  id-token: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Request scoped GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=toolscout-execution")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.value)process.exit(1);process.stdout.write(j.value)})")
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Run canonical bounded execution cycle
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --connect-timeout 10             --max-time 120             -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Accept: application/json"             https://trytoolscout.org/api/growth/execution/dispatch             | tee execution-result.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('execution-result.json','utf8'));
          if(x?.status==='failed'||x?.error) throw new Error(JSON.stringify(x));
          console.log('EXECUTION_OK='+JSON.stringify({ok:x?.ok??null,selected:x?.boundedExecution?.selectedInternalLane??null,network:x?.results?.distribution_network??null,autonomous:x?.results?.distribution_autonomous??null}));
          NODE

      - name: Prove post execution authority truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,subject_key,status,last_result,claimed_at,attempted_at,verified_at,updated_at
          FROM growth_execution_contract
          WHERE task_id='opportunity|surface:aitools-love|publisher_contact_discovery';
          SELECT executor,status,COUNT(*) n
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface')
            AND status IN ('pending','claimed','attempted','deferred','stalled','verified')
          GROUP BY executor,status ORDER BY executor,status;
          SELECT task_id,executor,action,subject_key,status,last_result,updated_at
          FROM growth_execution_contract
          WHERE action IN ('publisher_contact_discovery','execute_alternate_routes','verify_backlink_acquisition','autonomous_route_qualification')
            AND status IN ('pending','claimed','attempted','stalled')
          ORDER BY priority_score DESC,updated_at DESC LIMIT 20;
          SELECT event_type,status,detail,created_at
          FROM distribution_events
          WHERE created_at>=datetime('now','-30 minutes')
            AND (lower(COALESCE(detail,'')) LIKE '%aitools-love%' OR event_type LIKE 'authority_%')
          ORDER BY created_at DESC LIMIT 30;
          "
