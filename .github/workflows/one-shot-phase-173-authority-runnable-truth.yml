name: One Shot Phase 173 Authority Runnable Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-173-authority-runnable-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect runnable authority truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo AUTHORITY_TASKS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,subject_type,subject_key,status,priority_score,last_result,
                 claimed_at,attempted_at,verified_at,updated_at
          FROM growth_execution_contract
          WHERE action IN ('verify_backlink_acquisition','execute_alternate_routes','publisher_contact_discovery',
                           'autonomous_route_qualification','scale_proven_surface','backlink_reference_outreach')
            AND status IN ('pending','claimed','attempted','stalled')
          ORDER BY CASE status WHEN 'claimed' THEN 0 WHEN 'attempted' THEN 1 WHEN 'pending' THEN 2 ELSE 3 END,
                   priority_score DESC,updated_at DESC
          LIMIT 30;
          "
          echo ENGINE_RUNS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,detail,evidence_json
          FROM engine_runs
          WHERE (engine='growth' AND mission='execution_contract')
             OR (engine='distribution' AND mission IN ('network_cycle','autonomous_cycle','authority_execution_recovery'))
          ORDER BY started_at DESC
          LIMIT 20;
          "
          echo EXECUTION_EVENTS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT e.task_id,e.event_type,e.executor,e.status,e.detail,e.created_at
          FROM growth_execution_events e
          JOIN growth_execution_contract g ON g.task_id=e.task_id
          WHERE g.action IN ('verify_backlink_acquisition','execute_alternate_routes','publisher_contact_discovery',
                             'autonomous_route_qualification','scale_proven_surface','backlink_reference_outreach')
          ORDER BY e.created_at DESC
          LIMIT 30;
          "
