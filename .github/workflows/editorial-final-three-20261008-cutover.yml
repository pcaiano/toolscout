name: ToolScout final three editorial release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-final-three-20261008-cutover.yml'
permissions:
  contents: read
concurrency:
  group: toolscout-final-three-editorial-cutover
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official-source gate and prebuilt profiles
        run: |
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs
      - name: Dry run release
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/ts-final-three
      - name: Deploy Cloudflare production without D1 migrations
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify publicly served buying advice and monetized CTA
        run: |
          set -euo pipefail
          for slug in copy-ai integrately ubersuggest; do
            curl --retry 4 --retry-delay 2 --fail --silent --show-error -L "https://trytoolscout.org/tools/${slug}?editorial_release_final_three=20261008" -o "/tmp/toolscout-${slug}.html"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checks=[
            ['copy-ai','Copy.ai','Copy.ai documents a customizable workflow builder'],
            ['integrately','Integrately',"Integrately's own documentation distinguishes"],
            ['ubersuggest','Ubersuggest',"Ubersuggest's manufacturer guidance explains"]
          ];
          for(const [slug,name,opening] of checks){
            const h=fs.readFileSync('/tmp/toolscout-'+slug+'.html','utf8');
            const clean=h.replaceAll('&#39;',"'");
            if(!h.includes('<h1>'+name+'</h1>'))throw Error('Heading mismatch: '+slug);
            if(!clean.includes(opening))throw Error('Outdated editorial: '+slug);
            if(!h.includes('href="/go/'+slug+'"'))throw Error('Missing monetized CTA: '+slug);
            if(h.includes('Catalog-based; vendor claims and plan limits not independently verified'))throw Error('Provisional analysis: '+slug);
            const links=h.split('<a ').slice(1).map(s=>s.match(/href=["']([^"']+)["']/i)?.[1]).filter(Boolean);
            const leaked=links.filter(s=>s.includes('copy.ai/')||s.includes('integrately.com/')||s.includes('neilpatel.com/'));
            if(leaked.length)throw Error('Manufacturer documentation exposed: '+slug+' '+leaked.join(','));
          }
          console.log('PASS: Three current live profiles have reviewed analyses, brand H1 and monetized CTA; no public vendor links');
          NODE
