name: One Shot Canonical Catalog Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-canonical-catalog-deploy.yml"

permissions:
  contents: read

concurrency:
  group: one-shot-canonical-catalog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy canonical catalog inventory'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker syntax
        run: |
          node --check catalog-autonomy-worker.js
          node --check affiliate-coverage-cycle-worker.js
          node --check growth-command-center-v2-worker.js
          node --check dynamic-worker.js

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify canonical catalog
        run: |
          node - <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          await sleep(8000);
          const [toolsRes,invRes]=await Promise.all([
            fetch('https://trytoolscout.org/data/tools.json',{cache:'no-store'}),
            fetch('https://trytoolscout.org/data/catalog-inventory.json',{cache:'no-store'})
          ]);
          if(!toolsRes.ok)throw new Error('tools endpoint '+toolsRes.status);
          if(!invRes.ok)throw new Error('inventory endpoint '+invRes.status);
          const tools=await toolsRes.json(),inv=await invRes.json();
          if(!Array.isArray(tools))throw new Error('tools endpoint is not an array');
          const slugs=tools.map(x=>String(x?.slug||'')).filter(Boolean);
          if(new Set(slugs).size!==slugs.length)throw new Error('duplicate slugs in canonical catalog');
          if(Number(inv.total)!==tools.length)throw new Error('inventory total does not match canonical catalog');
          if(tools.length<102)throw new Error('catalog unexpectedly below static baseline');
          console.log(JSON.stringify({catalog_total:tools.length,static_unique:inv.static_unique,runtime_unique:inv.runtime_unique,affiliate:inv.affiliate}));
          NODE
