name: One-off Launch Llama Chairman Queue Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/distribution-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Launch Llama opportunity in remote D1
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE distribution_opportunities SET status='pending_review', action_url='https://tools.launchllama.co/products/toolscout', human_required=0, last_checked_at=datetime('now'), next_action='Submission completed and badge verified. Wait for Launch Llama manual review, then verify https://tools.launchllama.co/products/toolscout is publicly live before marking the opportunity live. Do not resubmit.', updated_at=datetime('now') WHERE surface_slug='launch-llama';"
      - name: Verify Launch Llama state and Chairman Queue exclusion
        run: |
          set -euo pipefail
          echo '=== LAUNCH LLAMA ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,surface_name,status,action_url,human_required,next_action,updated_at FROM distribution_opportunities WHERE surface_slug='launch-llama';"
          echo '=== CHAIRMAN QUEUE MATCH ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,human_required FROM distribution_opportunities WHERE surface_slug='launch-llama' AND action_url IS NOT NULL AND (human_required=1 OR status='approval_required') AND status NOT IN ('policy_blocked','rejected','skipped','submitted','pending_review','scheduled','live','verified','stale');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
