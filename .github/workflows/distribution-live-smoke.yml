name: One-off Stremit Badge Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/distribution-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy ToolScout
        run: npx wrangler deploy --config wrangler.toml --latest
