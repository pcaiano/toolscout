name: Distribution Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/distribution-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute scheduled Distribution Engine against remote D1
        run: |
          set -euo pipefail
          npx wrangler dev --remote --test-scheduled --port 8787 --config wrangler.toml > /tmp/wrangler-dev.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat /tmp/wrangler-dev.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8787/' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8787/__scheduled?cron=15%20*%20*%20*%20*'
          sleep 3
          echo '=== DISTRIBUTION SUBMISSION COUNTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,COUNT(*) AS count FROM distribution_submissions GROUP BY surface_slug,status ORDER BY surface_slug,status;"
          echo '=== INDEXNOW LATEST ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,asset_url,status,attempts,last_attempt_at,submitted_at,error FROM distribution_submissions WHERE surface_slug='indexnow' ORDER BY updated_at DESC LIMIT 10;"
          echo '=== SUBMISSION EVENTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT event_type,status,detail,created_at FROM distribution_events WHERE event_type IN ('submission_packaging_refresh','submission_execution_refresh','submission_verification_refresh','autonomous_submission_verification','autonomous_distribution_qualification') ORDER BY created_at DESC LIMIT 20;"
          echo '=== DISTRIBUTION EFFECTIVENESS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT 'submitted_surfaces' metric,COUNT(DISTINCT surface_slug) value FROM distribution_submissions WHERE status='submitted' AND surface_slug<>'indexnow' UNION ALL SELECT 'public_live_verified',COUNT(*) FROM distribution_opportunities WHERE status IN ('live','verified') AND surface_type<>'machine_discovery' UNION ALL SELECT 'pending_review',COUNT(*) FROM distribution_opportunities WHERE status='pending_review' UNION ALL SELECT 'automation_gaps',COUNT(*) FROM distribution_submissions ds WHERE ds.status='adapter_missing' AND NOT EXISTS (SELECT 1 FROM distribution_opportunities o WHERE o.surface_slug=ds.surface_slug AND o.human_required=1) UNION ALL SELECT 'research_required',COUNT(*) FROM distribution_opportunities WHERE status IN ('candidate','discovered','research_required') AND COALESCE(human_required,0)=0;"
          echo '=== CHAIRMAN DISTRIBUTION QUEUE ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT o.surface_slug,o.surface_name,o.status,o.action_url,o.next_action,o.human_required,ROUND(COALESCE(l.priority_weight,o.distribution_score,0),2) AS economic_priority,COALESCE(l.operating_decision,'explore') AS operating_decision,COALESCE(l.evidence_grade,'none') AS evidence_grade,l.paid_policy_decision,l.observed_cost,l.observed_cost_currency FROM distribution_opportunities o LEFT JOIN distribution_economic_learning l ON l.surface_slug=o.surface_slug WHERE o.action_url IS NOT NULL AND (o.human_required=1 OR o.status='approval_required') AND o.status NOT IN ('policy_blocked','rejected','skipped','submitted','pending_review','scheduled','live','verified','stale') AND (o.status='approval_required' OR COALESCE(l.operating_decision,'explore')<>'suspend') ORDER BY CASE WHEN o.status='approval_required' THEN 0 ELSE 1 END,CASE COALESCE(l.operating_decision,'explore') WHEN 'scale' THEN 0 WHEN 'measure' THEN 1 WHEN 'explore' THEN 2 ELSE 3 END,COALESCE(l.priority_weight,o.distribution_score,0) DESC,o.updated_at DESC LIMIT 20;"
          echo '=== RESEARCH BACKLOG ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,surface_name,status,ROUND(distribution_score,2) AS score,action_url,last_checked_at,next_action FROM distribution_opportunities WHERE status IN ('candidate','discovered','research_required') AND COALESCE(human_required,0)=0 ORDER BY distribution_score DESC,last_checked_at ASC LIMIT 20;"
          echo '=== AUTO ADAPTERS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,policy_state,confidence,verification_endpoint,public_url,auth_type,last_checked_at FROM distribution_auto_adapters ORDER BY updated_at DESC LIMIT 20;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
