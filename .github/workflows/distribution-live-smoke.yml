name: One-off PitchWall Chairman Queue Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/distribution-live-smoke.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy current distribution workflow state
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Update PitchWall opportunity in remote D1
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE distribution_opportunities SET status='pending_review', action_url='https://pitchwall.co/', human_required=0, last_checked_at=datetime('now'), next_action='Submission completed. Wait for the free editorial review. Do not buy quick review. Verify the public PitchWall listing after approval before marking live.', updated_at=datetime('now') WHERE surface_slug='pitchwall';"
      - name: Verify PitchWall state and Chairman Queue exclusion
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,surface_name,status,action_url,human_required,next_action,updated_at FROM distribution_opportunities WHERE surface_slug='pitchwall';"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT o.surface_slug,o.surface_name,o.status,o.action_url,o.next_action,o.human_required FROM distribution_opportunities o LEFT JOIN distribution_economic_learning l ON l.surface_slug=o.surface_slug WHERE o.surface_slug='pitchwall' AND o.action_url IS NOT NULL AND (o.human_required=1 OR o.status='approval_required') AND o.status NOT IN ('policy_blocked','rejected','skipped','submitted','pending_review','scheduled','live','verified','stale') AND (o.status='approval_required' OR COALESCE(l.operating_decision,'explore')<>'suspend');"
