name: D1 Traffic Forensics
# Diagnostic rerun trigger: 2026-09-12 post-cleanup

on:
  push:
    paths:
      - '.github/workflows/d1-traffic-forensics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect session provenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          function q(sql){const out=execFileSync('npx',['wrangler','d1','execute','toolscout','--remote','--config','wrangler.toml','--json','--command',sql],{encoding:'utf8'});const p=JSON.parse(out),b=Array.isArray(p)?p[0]:p;return b?.results||b?.result?.[0]?.results||[]}
          const queries={
            classificationTotals:`SELECT classification,COUNT(*) sessions FROM sessions GROUP BY classification ORDER BY sessions DESC`,
            legacyRedirectOnly:`SELECT date(s.first_seen_at,'+1 hour') day,COALESCE(NULLIF(s.source,''),'none') source,COUNT(*) sessions FROM sessions s WHERE s.classification='unknown/legacy' AND NOT EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=s.session_id AND f.event_type='session_started') AND date(s.first_seen_at,'+1 hour')>='2026-09-01' GROUP BY day,COALESCE(NULLIF(s.source,''),'none') ORDER BY day,sessions DESC`,
            legacyRedirectTotal:`SELECT COUNT(*) sessions FROM sessions s WHERE s.classification='unknown/legacy' AND NOT EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=s.session_id AND f.event_type='session_started') AND date(s.first_seen_at,'+1 hour')>='2026-09-01'`,
            confirmedDaily:`SELECT date(f.created_at,'+1 hour') day,COUNT(DISTINCT f.session_id) confirmed_sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification='likely-human' AND date(f.created_at,'+1 hour')>='2026-09-01' GROUP BY day ORDER BY day`,
            confirmedToday:`SELECT f.created_at,s.source,f.path FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification='likely-human' AND date(f.created_at,'+1 hour')=date('now','+1 hour') ORDER BY f.created_at DESC LIMIT 100`,
            daily:`SELECT date(s.first_seen_at,'+1 hour') day,COUNT(*) likely_human,SUM(CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=s.session_id AND f.event_type='session_started') THEN 1 ELSE 0 END) with_start,SUM(CASE WHEN NOT EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=s.session_id AND f.event_type='session_started') THEN 1 ELSE 0 END) without_start FROM sessions s WHERE s.classification='likely-human' AND date(s.first_seen_at,'+1 hour')>='2026-09-01' GROUP BY day ORDER BY day`,
            sessionSources:`SELECT date(first_seen_at,'+1 hour') day,COALESCE(NULLIF(source,''),'none') source,COUNT(*) sessions FROM sessions WHERE classification='likely-human' AND date(first_seen_at,'+1 hour')>='2026-09-01' GROUP BY day,COALESCE(NULLIF(source,''),'none') ORDER BY day,sessions DESC`,
            clickSources:`SELECT date(c.created_at,'+1 hour') day,COALESCE(NULLIF(c.source,''),'none') source,COUNT(*) clicks,COUNT(DISTINCT c.session_id) sessions FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE s.classification='likely-human' AND date(c.created_at,'+1 hour')>='2026-09-01' GROUP BY day,COALESCE(NULLIF(c.source,''),'none') ORDER BY day,clicks DESC`,
            clickIntents:`SELECT date(c.created_at,'+1 hour') day,COALESCE(NULLIF(c.intent_slug,''),'none') intent,COALESCE(NULLIF(c.source,''),'none') source,COUNT(*) clicks FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE s.classification='likely-human' AND date(c.created_at,'+1 hour')>='2026-09-01' GROUP BY day,COALESCE(NULLIF(c.intent_slug,''),'none'),COALESCE(NULLIF(c.source,''),'none') ORDER BY day,clicks DESC LIMIT 500`,
            clickTools:`SELECT date(c.created_at,'+1 hour') day,c.tool_slug,COALESCE(NULLIF(c.source,''),'none') source,COUNT(*) clicks FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE s.classification='likely-human' AND date(c.created_at,'+1 hour')>='2026-09-01' GROUP BY day,c.tool_slug,COALESCE(NULLIF(c.source,''),'none') ORDER BY day,clicks DESC LIMIT 500`,
            bursts:`SELECT substr(c.created_at,1,16) minute,COALESCE(NULLIF(c.source,''),'none') source,COUNT(*) clicks,COUNT(DISTINCT c.session_id) sessions FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE s.classification='likely-human' AND c.created_at>='2026-09-01' GROUP BY minute,COALESCE(NULLIF(c.source,''),'none') HAVING COUNT(*)>=3 ORDER BY clicks DESC,minute DESC LIMIT 200`,
            startSources:`SELECT date(f.created_at,'+1 hour') day,COALESCE(NULLIF(f.source,''),'direct') source,COALESCE(NULLIF(f.referrer_host,''),'none') referrer_host,COALESCE(NULLIF(f.path,''),'none') path,COUNT(DISTINCT f.session_id) sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE s.classification='likely-human' AND f.event_type='session_started' AND date(f.created_at,'+1 hour')>='2026-09-01' GROUP BY day,COALESCE(NULLIF(f.source,''),'direct'),COALESCE(NULLIF(f.referrer_host,''),'none'),COALESCE(NULLIF(f.path,''),'none') ORDER BY day,sessions DESC`,
            distributionStatus:`SELECT status,COUNT(*) surfaces FROM distribution_opportunities GROUP BY status ORDER BY surfaces DESC`,
            chairmanDistribution:`SELECT o.surface_slug,o.surface_name,o.status,o.action_url,o.next_action,o.human_required,ROUND(COALESCE(l.priority_weight,o.distribution_score,0),2) economic_priority,COALESCE(l.operating_decision,'explore') operating_decision,COALESCE(l.evidence_grade,'none') evidence_grade,COALESCE(l.paid_policy_decision,'free_default') paid_policy_decision,l.observed_cost,l.observed_cost_currency FROM distribution_opportunities o LEFT JOIN distribution_economic_learning l ON l.surface_slug=o.surface_slug WHERE o.action_url IS NOT NULL AND (o.human_required=1 OR o.status='approval_required') AND o.status NOT IN ('policy_blocked','rejected','skipped','submitted','pending_review','scheduled','live','verified','stale') AND (o.status='approval_required' OR COALESCE(l.operating_decision,'explore')<>'suspend') ORDER BY CASE WHEN o.status='approval_required' THEN 0 ELSE 1 END,CASE COALESCE(l.operating_decision,'explore') WHEN 'scale' THEN 0 WHEN 'measure' THEN 1 WHEN 'explore' THEN 2 ELSE 3 END,COALESCE(l.priority_weight,o.distribution_score,0) DESC,o.updated_at DESC LIMIT 20`,
            researchBacklog:`SELECT surface_slug,surface_name,status,ROUND(distribution_score,2) score,action_url,last_checked_at,next_action FROM distribution_opportunities WHERE status IN ('candidate','discovered','research_required') AND COALESCE(human_required,0)=0 ORDER BY distribution_score DESC,last_checked_at ASC LIMIT 20`
          };
          const snapshot={generated_at:new Date().toISOString()};
          for(const [name,sql] of Object.entries(queries)) {
            snapshot[name]=q(sql);
            console.log(`D1_${name.toUpperCase()}=`+JSON.stringify(snapshot[name]));
          }
          writeFileSync('/tmp/d1-traffic-forensics-latest.json',JSON.stringify(snapshot,null,2)+'\n');
          NODE
      - name: Persist diagnostic snapshot
        run: |
          mkdir -p data/diagnostics
          cp /tmp/d1-traffic-forensics-latest.json data/diagnostics/d1-traffic-forensics-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics/d1-traffic-forensics-latest.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
            exit 0
          fi
          git commit -m "Update D1 traffic forensics snapshot"
          git push
