name: Distribution Impact Check

on:
  pull_request:
    paths:
      - 'distribution-impact-worker.js'
      - 'distribution-impact-entry-worker.js'
      - 'affiliate-coverage-entry-worker.js'
      - 'human-action-entry-worker.js'
      - 'affiliate-human-action-entry-worker.js'
      - 'affiliate-human-action-state.js'
      - 'agent-protocol-worker.js'
      - 'command-center-affiliate-table-worker.js'
      - 'growth-command-center-v2-worker.js'
      - 'agent-protocol-core-worker.js'
      - 'wrangler.toml'
      - '.github/workflows/distribution-impact-check.yml'
  push:
    branches: [main]
    paths:
      - 'distribution-impact-worker.js'
      - 'distribution-impact-entry-worker.js'
      - 'affiliate-coverage-entry-worker.js'
      - 'human-action-entry-worker.js'
      - 'affiliate-human-action-entry-worker.js'
      - 'affiliate-human-action-state.js'
      - 'agent-protocol-worker.js'
      - 'command-center-affiliate-table-worker.js'
      - 'growth-command-center-v2-worker.js'
      - 'agent-protocol-core-worker.js'
      - 'wrangler.toml'
      - '.github/workflows/distribution-impact-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate JavaScript syntax
        run: |
          node --check distribution-impact-worker.js
          node --check distribution-impact-entry-worker.js
          node --check affiliate-coverage-entry-worker.js
          node --check human-action-entry-worker.js
          node --check affiliate-human-action-entry-worker.js
          node --check affiliate-human-action-state.js
          node --check agent-protocol-worker.js
          node --check command-center-affiliate-table-worker.js
          node --check growth-command-center-v2-worker.js
          node --check agent-protocol-core-worker.js
      - name: Validate attribution contract and entrypoint
        run: |
          grep -q 'main = "agent-protocol-worker.js"' wrangler.toml
          grep -Fq "import base from './command-center-affiliate-table-worker.js'" agent-protocol-worker.js
          grep -Fq "import base from './growth-command-center-v2-worker.js'" command-center-affiliate-table-worker.js
          grep -Fq "import base from './affiliate-human-action-entry-worker.js'" growth-command-center-v2-worker.js
          grep -Fq "import base from './human-action-entry-worker.js'" affiliate-human-action-entry-worker.js
          grep -Fq "import base from './affiliate-coverage-entry-worker.js'" human-action-entry-worker.js
          grep -Fq "import base from './distribution-impact-entry-worker.js'" affiliate-coverage-entry-worker.js
          grep -Fq "import base from './agent-protocol-core-worker.js'" distribution-impact-entry-worker.js
          grep -Fq "classification='likely-human'" distribution-impact-worker.js
          grep -Fq "affiliate_active_at_click" distribution-impact-worker.js
          grep -Fq "status IN ('confirmed','paid')" distribution-impact-worker.js
          grep -Fq "session_id IS NOT NULL" distribution-impact-worker.js
          grep -Fq "First-touch likely-human session" distribution-impact-worker.js
          grep -Fq "distributionImpact" distribution-impact-entry-worker.js
          grep -Fq "Distribution Engine impact" distribution-impact-entry-worker.js
