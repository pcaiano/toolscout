name: One Shot Phase 211 Authority Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-211-authority-now.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current authority truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT executor,status,COUNT(*) n
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface')
            AND status IN ('pending','claimed','attempted','deferred','stalled','verified')
          GROUP BY executor,status ORDER BY executor,status;
          SELECT task_id,executor,action,subject_key,status,last_result,claimed_at,attempted_at,verified_at,updated_at
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface')
            AND updated_at>=datetime('now','-3 hours')
          ORDER BY updated_at DESC LIMIT 30;
          SELECT engine,mission,status,trigger_name,started_at,completed_at,detail
          FROM engine_runs
          WHERE mission IN ('execution_contract','network_cycle','autonomous_cycle','authority_execution_recovery')
          ORDER BY started_at DESC LIMIT 15;
          SELECT event_type,status,detail,created_at
          FROM distribution_events
          WHERE created_at>=datetime('now','-3 hours')
            AND (event_type LIKE 'authority_%' OR event_type IN ('vendor_outreach_sent','publisher_network_outreach_sent','vendor_outreach_failed','publisher_network_outreach_failed'))
          ORDER BY created_at DESC LIMIT 30;
          SELECT COUNT(*) attempts24 FROM (
            SELECT submission_id AS id FROM distribution_submissions
            WHERE surface_slug<>'indexnow' AND attempts>0 AND COALESCE(last_attempt_at,created_at)>=datetime('now','-24 hours')
            UNION ALL
            SELECT event_id FROM distribution_events
            WHERE event_type IN ('vendor_outreach_sent','publisher_network_outreach_sent') AND created_at>=datetime('now','-24 hours')
          );
          "
