name: Hype Star Contract Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hypestar-contract-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Hype Star listing contract
        run: |
          set -euo pipefail
          curl -fsSL https://hypestar.org/openapi.json -o /tmp/openapi.json
          echo '=== SUBMISSION REQUEST ==='
          jq '.components.schemas.SubmissionRequest' /tmp/openapi.json
          echo '=== SUBMISSION ENVELOPE ==='
          jq '.components.schemas.SubmissionEnvelope' /tmp/openapi.json
          echo '=== LISTING PATH ==='
          jq '.paths["/listings"].post' /tmp/openapi.json
          echo '=== CATEGORIES ==='
          curl -fsSL https://hypestar.org/api/v1/categories | jq '.data.categories[] | {slug,name,description}'
