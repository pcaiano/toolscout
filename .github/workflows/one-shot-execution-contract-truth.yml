name: One Shot Execution Contract Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-execution-contract-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect latest execution runs and authority tasks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,substr(detail,1,500) AS detail,substr(evidence_json,1,1800) AS evidence_json
          FROM engine_runs
          WHERE (engine='growth' AND mission IN ('execution_contract','opportunity_coordination','self_audit'))
             OR (engine='distribution' AND mission IN ('autonomous_cycle','authority_execution_recovery','network_cycle'))
          ORDER BY started_at DESC LIMIT 18;
          "
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,subject_key,status,priority_score,last_result,claimed_at,attempted_at,updated_at
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface')
            AND status IN ('pending','claimed','attempted','stalled')
          ORDER BY priority_score DESC,updated_at DESC LIMIT 20;
          "
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT e.task_id,e.event_type,e.executor,e.status,substr(e.detail,1,500) AS detail,e.created_at
          FROM growth_execution_events e
          JOIN growth_execution_contract g ON g.task_id=e.task_id
          WHERE g.action IN ('verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','autonomous_route_qualification','scale_proven_surface')
          ORDER BY e.created_at DESC LIMIT 30;
          "
