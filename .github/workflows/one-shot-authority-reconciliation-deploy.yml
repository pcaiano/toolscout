name: One Shot Authority Reconciliation Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-authority-reconciliation-deploy.yml"

permissions:
  contents: read

concurrency:
  group: toolscout-authority-reconciliation-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate reconciled runtime modules
        run: |
          node --check growth-supervisor.js
          node --check operational-truth-reconciliation-worker.js
          node --check command-center-simplified-view.js
          node scripts/check-distribution-copy.mjs

      - name: Deploy reconciled ToolScout Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
