name: One Shot Runtime Peer Parity Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-runtime-peer-parity-deploy.yml"

permissions:
  contents: read

concurrency:
  group: one-shot-runtime-peer-parity-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy runtime peer parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Validate Worker syntax
        run: node --check catalog-autonomy-worker.js

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify canonical runtime peers
        run: |
          node - <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          await sleep(8000);
          const r=await fetch('https://trytoolscout.org/data/catalog-inventory.json',{cache:'no-store'});
          if(!r.ok)throw new Error('inventory endpoint '+r.status);
          const inv=await r.json();
          const target=new Set(['character-ai','google-ai-studio','kling-ai','otter-ai']);
          const runtime=(inv.tools||[]).filter(x=>x.origin==='runtime').map(x=>x.slug);
          const present=[...(inv.tools||[])].filter(x=>target.has(x.slug)).map(x=>({slug:x.slug,origin:x.origin,affiliate_status:x.affiliate_status}));
          console.log(JSON.stringify({total:inv.total,static_unique:inv.static_unique,runtime_unique:inv.runtime_unique,runtime,present,affiliate:inv.affiliate}));
          if(Number(inv.total)<103)throw new Error('catalog regressed below prior canonical total');
          NODE
