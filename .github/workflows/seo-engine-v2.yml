name: ToolScout SEO Engine v2
# ToolScout 2.0 editorial quality full rollout and site-wide SEO AEO GEO audit: 2026-10-06 dedup validation

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/seo-engine-v2.yml'

permissions:
  contents: write

concurrency:
  group: seo-engine-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce post-conservation compatibility interlock
        run: node scripts/validate-actions-resume-safety.mjs
      - name: Validate intent coverage
        run: node scripts/validate-intent-coverage.mjs
      - name: Sync Google Search Console performance signals
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: sc-domain:trytoolscout.org
          GSC_LOOKBACK_DAYS: '28'
        run: node scripts/sync-gsc-signals.mjs
      - name: Discover and publish material software news
        # Official first-party sources only; the engine applies a buyer-relevance gate before publication.
        run: |
          node --check scripts/discover-software-news.mjs
          node scripts/discover-software-news.mjs
      - name: Validate software news editorial contract
        run: node scripts/validate-software-news-ctas.mjs
      - name: Build ToolScout 2.0 editorial authority portfolio
        run: node scripts/build-editorial-authority-portfolio.mjs
      - name: Validate ToolScout 2.0 editorial authority model
        run: node --test tests/toolscout-v2-editorial-authority.test.mjs
      - name: Evaluate Google indexing gate
        run: node scripts/seo-indexing-gate.mjs
      - name: Audit observed GSC slugs
        run: node scripts/audit-gsc-slugs.mjs
      - name: Scan competitive coverage gaps
        run: node scripts/scan-competitive-gaps.mjs
      - name: Close competitive coverage gap loop
        run: node scripts/close-competitive-gap-loop.mjs
      - name: Promote verified gap profiles into catalog
        run: node scripts/promote-verified-gap-profiles-to-catalog.mjs
      - name: Run field-level catalog quality control
        run: node scripts/catalog-quality-control.mjs
      - name: Promote governed competitive content gaps
        run: node scripts/promote-competitive-content-gaps.mjs
      - name: Build growth priority
        run: node scripts/build-growth-priority.mjs
      - name: Build GSC commercial routing
        run: node scripts/build-search-commercial-routing.mjs
      - name: Build indexing-aware organic opportunities
        run: node scripts/build-organic-growth-opportunities-v6.mjs
      - name: Require linked search evidence freshness
        run: node scripts/check-search-evidence-freshness.mjs --require-fresh
      - name: Fetch shared autonomous growth directives
        run: node scripts/fetch-shared-growth-directives.mjs
      - name: Run indexing-aware closed loop controller
        run: node scripts/run-organic-growth-controller-v4.mjs
      - name: Build cross-channel content intelligence
        run: node scripts/build-content-intelligence.mjs
      - name: Generate pages
        run: node scripts/generate-seo-pages.mjs
      - name: Prune legacy and held SEO guides
        run: node scripts/prune-uncontrolled-seo-guides.mjs
      - name: Enrich guides with decision context
        run: node scripts/enrich-decision-context.mjs
      - name: Sync observed comparison demand
        run: node scripts/sync-comparison-demand.mjs
      - name: Generate commercial comparisons
        run: node scripts/generate-comparisons.mjs
      - name: Validate comparison editorial contract
        run: |
          node --test \
            tests/comparison-editorial-contract.test.mjs \
            tests/competitive-gap-catalog-parity.test.mjs \
            tests/seo-extensionless-tool-link.test.mjs \
            tests/editorial-trust-extensionless-link.test.mjs \
            tests/unbounce-partnerstack-tracking.test.mjs
      - name: Enrich comparisons with decision context
        run: node scripts/enrich-comparison-context.mjs
      - name: Generate indexable tool profiles
        run: node scripts/generate-tool-pages.mjs
      - name: Prune orphan tool profiles
        run: node scripts/prune-orphan-tool-profiles.mjs
      - name: Generate verified competitive gap profiles
        run: node scripts/generate-competitive-gap-profiles.mjs
      - name: Link directory to indexable tool profiles
        run: node scripts/link-static-tool-profiles.mjs
      - name: Link guides to relevant comparisons
        run: node scripts/enrich-guide-comparisons.mjs
      - name: Apply closed-loop organic growth actions
        run: node scripts/apply-organic-growth-actions.mjs
      - name: Generate Software Trends Index
        run: node scripts/generate-software-trends-index.mjs
      - name: Validate ToolScout copy guard
        run: node scripts/check-distribution-copy.mjs
      - name: Generate blog topics
        run: node scripts/build-blog-topics.mjs
      - name: Generate blog
        run: node scripts/generate-blog.mjs
      - name: Enrich comparison links with favicons
        run: node scripts/enrich-comparison-favicons.mjs --fix
      - name: Enrich software cards with favicons
        run: node scripts/enrich-software-card-favicons.mjs --fix
      - name: Enforce SEO hygiene and internal linking
        run: |
          node scripts/enforce-seo-hygiene.mjs --fix
          node scripts/enforce-seo-hygiene.mjs
      - name: Enforce outbound UX
        run: node scripts/enforce-outbound-ux.mjs --fix
      - name: Rebuild ToolScout 2.0 editorial authority portfolio after page mutations
        run: node scripts/build-editorial-authority-portfolio.mjs
      - name: Validate growth spend policy regression
        run: node --test tests/growth-spend-policy.test.mjs
      - name: Validate free first growth spend policy
        run: node scripts/validate-growth-spend-policy.mjs
      - name: Generate distribution assets
        run: node scripts/generate-distribution.mjs
      - name: Build clean guide index
        run: node scripts/build-distribution-index.mjs
      - name: Build distribution queue
        run: node scripts/build-distribution-queue.mjs
      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Audit controlled SEO surface
        run: node scripts/audit-controlled-seo-surface.mjs
      - name: Validate AEO GEO readiness
        run: node scripts/validate-aeo-geo-readiness.mjs
      - name: Validate machine readability
        run: node scripts/validate-machine-readability.mjs
      - name: Validate SEO pages
        run: node scripts/validate-seo-pages.mjs
      - name: Validate editorial trust
        run: node scripts/validate-editorial-trust.mjs
      - name: Validate generated public surface
        run: node scripts/validate-public-surface.mjs
      - name: Validate commercial indexability and links
        run: node scripts/validate-commercial-indexability.mjs
      - name: Audit generated diff on readmission branch
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          git diff --check
          echo "=== GENERATED STATUS ==="
          git status --short
          echo "=== GENERATED DIFF STAT ==="
          git diff --stat
          echo "=== GENERATED NAME STATUS ==="
          git diff --name-status
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const raw=execFileSync('git',['status','--porcelain=v1','--untracked-files=all'],{encoding:'utf8'});
          const paths=raw.split(/\r?\n/).filter(Boolean).map(line=>{
            let p=line.slice(3).trim();
            if(p.includes(' -> '))p=p.split(' -> ').at(-1);
            return p.replace(/^"(.*)"$/,'$1');
          });
          const exact=new Set([
            'data/tools.json','data/competitive-gap-profiles.json','data/seo-longtail.json',
            'data/catalog-quality-state.json','data/tool-assets.json','data/comparisons.json',
            'data/search-commercial-routing.json','data/gsc-search-reality.json','data/gsc-daily-trend.json','data/software-updates.json',
            'sitemap.xml','robots.txt','feed.xml','llms.txt','software-trends-index.json','software-trends-index.csv','software-trends-index-share.svg'
          ]);
          const allowed=p=>exact.has(p)||/^[^/]+\.html$/.test(p)||/^tools\/.*\.html$/.test(p)||/^news\/.*\.html$/.test(p)||/^blog\/.*\.html$/.test(p)||/^reports\/.*\.json$/.test(p);
          const forbidden=paths.filter(p=>!allowed(p));
          console.log(JSON.stringify({changed:paths.length,forbidden,paths},null,2));
          if(forbidden.length)process.exit(1);
          NODE
      - name: Commit generated SEO assets
        id: commit_assets
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- data/tools.json data/competitive-gap-profiles.json data/seo-longtail.json data/catalog-quality-state.json data/tool-assets.json data/comparisons.json data/search-commercial-routing.json data/gsc-search-reality.json data/gsc-daily-trend.json data/software-updates.json '*.html' 'tools/*.html' 'news/*.html' 'sitemap.xml' 'robots.txt' 'feed.xml' 'llms.txt' 'blog/*.html' 'reports/*.json' 'software-trends-index.json' 'software-trends-index.csv' 'software-trends-index-share.svg')" ]; then
            echo "No SEO/distribution asset changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "toolscout-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/tools.json data/competitive-gap-profiles.json data/seo-longtail.json data/catalog-quality-state.json data/tool-assets.json data/comparisons.json data/search-commercial-routing.json data/gsc-search-reality.json data/gsc-daily-trend.json data/software-updates.json '*.html' 'tools/*.html' 'news/*.html' sitemap.xml robots.txt feed.xml llms.txt blog reports software-trends-index.json software-trends-index.csv software-trends-index-share.svg
          git commit -m "Refresh SEO, catalog quality, comparisons, indexing, research, blog and distribution assets"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected generated changes remain unstaged after the canonical SEO asset commit."
            git status --short
            exit 1
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy generated editorial and SEO assets
        if: github.ref == 'refs/heads/main' && steps.commit_assets.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Verify generated editorial and SEO assets live
        if: github.ref == 'refs/heads/main' && steps.commit_assets.outputs.changed == 'true'
        run: node scripts/verify-v2-live-smoke.mjs
