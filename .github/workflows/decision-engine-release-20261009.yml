# One-shot production release. This file is removed after successful cutover.
name: ToolScout Decision Engine 2026-10-09 cutover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decision-engine-release-20261009.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production-recovery
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate link routing and decision quality
        run: |
          node --check dynamic-worker.js
          node --check affiliate-workflow-worker.js
          node --check agent-protocol-core-worker.js
          node --test tests/toolscout-v2-go-route-truth.test.mjs tests/toolscout-v2-decision-qualification.test.mjs tests/toolscout-v2-agent-protocol.test.mjs tests/toolscout-v2-affiliate-redirect.test.mjs
          node scripts/validate-v2-preservation.mjs
      - name: Deploy Cloudflare Worker with unchanged D1 schema
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Validate live MCP decision engine
        run: |
          node --input-type=module <<'NODE'
          const url='https://trytoolscout.org/mcp';
          const body={
            jsonrpc:'2.0',id:700,method:'tools/call',
            params:{
              name:'decide_software',
              arguments:{job:'CRM for a small consultancy',limit:3,existing_tools:['Microsoft Teams']},
              _meta:{'io.modelcontextprotocol/protocolVersion':'2026-07-28','io.modelcontextprotocol/clientInfo':{name:'one-shot-deploy-probe',version:'1.0'}}
            }
          };
          const response=await fetch(url,{method:'POST',headers:{
            'Content-Type':'application/json',
            'MCP-Protocol-Version':'2026-07-28',
            'Mcp-Method':'tools/call',
            'Mcp-Name':'decide_software'
          },body:JSON.stringify(body)});
          if(!response.ok)throw Error('MCP HTTP status '+response.status);
          const result=(await response.json()).result;
          const list=result?.structuredContent?.shortlist||[];
          if(result.isError||!list.length||list.some(x=>!Array.isArray(x.buyer_validation_plan)||!x.buyer_validation_plan.length))
            throw Error('Production did not expose the new decision validation contract');
          console.log('Live production qualified decision and buyer validation plan verified for '+list.length+' products');
          NODE
      - name: Probe existing production health
        run: |
          node scripts/verify-v2-live-smoke.mjs
