name: One Shot Phase 165 Strict Human Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-165-strict-human-sources.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read strict human acquisition sources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          WITH fv AS (
            SELECT session_id,source,referrer_host,created_at,
              ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY created_at ASC,id ASC) rn
            FROM confirmed_visitor_events
            WHERE created_at>=datetime('now','-7 days')
          )
          SELECT h.session_id,h.first_evidence_at,h.first_path,h.last_path,h.evidence_type,h.evidence_strength,h.interaction_count,h.country,
            COALESCE(NULLIF(h.source,''),v.source,'direct') AS source,
            COALESCE(NULLIF(h.referrer_host,''),v.referrer_host) AS referrer_host
          FROM traffic_human_evidence h
          LEFT JOIN fv v ON v.session_id=h.session_id AND v.rn=1
          WHERE h.first_evidence_at>=datetime('now','-7 days')
          ORDER BY h.first_evidence_at DESC;
          "
          echo SUMMARY
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          WITH fv AS (
            SELECT session_id,source,referrer_host,created_at,
              ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY created_at ASC,id ASC) rn
            FROM confirmed_visitor_events
            WHERE created_at>=datetime('now','-7 days')
          ), strict AS (
            SELECT h.session_id,h.first_evidence_at,h.first_path,
              COALESCE(NULLIF(h.source,''),v.source,'direct') AS source,
              COALESCE(NULLIF(h.referrer_host,''),v.referrer_host,'') AS referrer_host
            FROM traffic_human_evidence h
            LEFT JOIN fv v ON v.session_id=h.session_id AND v.rn=1
            WHERE h.first_evidence_at>=datetime('now','-7 days')
          )
          SELECT source,referrer_host,COUNT(*) AS strict_humans,
                 SUM(CASE WHEN first_evidence_at>=datetime('now','-24 hours') THEN 1 ELSE 0 END) AS strict_humans_24h,
                 GROUP_CONCAT(DISTINCT first_path) AS paths
          FROM strict
          GROUP BY source,referrer_host
          ORDER BY strict_humans DESC,source,referrer_host;
          "
