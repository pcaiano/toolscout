name: Production Smoke Test

on:
  workflow_run:
    workflows: ["Deploy ToolScout Worker"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_BASE: https://trytoolscout.org

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check production health
        run: |
          set -e
          curl --fail --silent --show-error "$PROD_BASE/api/health"
          echo
      - name: Check robots
        run: |
          set -e
          curl --fail --silent --show-error "$PROD_BASE/robots.txt" | grep -F "Sitemap: $PROD_BASE/sitemap.xml"
      - name: Check sitemap
        run: |
          set -e
          sitemap="$(curl --fail --silent --show-error "$PROD_BASE/sitemap.xml")"
          printf '%s\n' "$sitemap" | grep -F '<urlset'
          printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/best-seo-tools.html"
          printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/methodology.html"
          printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/privacy.html"
          for page in make-vs-zapier hubspot-vs-pipedrive beehiiv-vs-kit jotform-vs-typeform semrush-vs-ahrefs; do
            printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/$page.html"
          done
      - name: Check core pages
        run: |
          set -e
          for page in / /guides.html /blog/ /tools.html /compare.html /methodology.html /affiliate-disclosure.html /privacy.html /best-seo-tools.html /best-crm-for-small-business.html /tool.html?tool=systeme-io /reports/growth-priority.json; do
            echo "Checking $PROD_BASE$page"
            curl --fail --silent --show-error --location "$PROD_BASE$page" >/dev/null
          done
      - name: Check commercial comparison pages
        run: |
          set -e
          for page in make-vs-zapier hubspot-vs-pipedrive beehiiv-vs-kit jotform-vs-typeform semrush-vs-ahrefs; do
            echo "Checking comparison $PROD_BASE/$page.html"
            html="$(curl --fail --silent --show-error --location "$PROD_BASE/$page.html")"
            printf '%s\n' "$html" | grep -F "<link rel=\"canonical\" href=\"$PROD_BASE/$page.html\">"
            printf '%s\n' "$html" | grep -F 'Where the choice separates.'
            printf '%s\n' "$html" | grep -F 'No paid winner.'
            printf '%s\n' "$html" | grep -F 'Affiliate payout is not part of the scoring model.'
            profile_links="$(printf '%s\n' "$html" | grep -oE 'href="/tools/[a-z0-9-]+\.html"' | wc -l)"
            test "$profile_links" -ge 2
            outbound_links="$(printf '%s\n' "$html" | grep -oE 'href="/go/[a-z0-9-]+"' | wc -l)"
            test "$outbound_links" -ge 2
          done
      - name: Check public analytics surface is protected
        run: |
          set -e
          code="$(curl --silent --show-error --output /tmp/analytics.html --write-out '%{http_code}' --location "$PROD_BASE/analytics.html")"
          case "$code" in
            404) echo 'Public analytics surface correctly absent on public domain' ;;
            200) if grep -Fq 'ToolScout Command Center' /tmp/analytics.html; then echo 'ERROR: unauthenticated request exposed the Command Center'; exit 1; fi ;;
            *) echo "ERROR: unexpected analytics page status $code"; exit 1 ;;
          esac
      - name: Check dynamic SEO canonical
        run: |
          set -e
          html="$(curl --fail --silent --show-error --location "$PROD_BASE/best-ai-marketing-tools.html")"
          printf '%s\n' "$html" | grep -F '<link rel="canonical" href="https://trytoolscout.org/best-ai-marketing-tools.html">'
      - name: Check consolidated SEO redirects
        run: |
          set -e
          check_consolidation() {
            source="$1"
            target="$2"
            headers="$(curl --silent --show-error --head --max-redirs 0 "$PROD_BASE/$source.html" 2>/dev/null || true)"
            printf '%s\n' "$headers" | grep -Eq '^HTTP/[^ ]+ 301'
            printf '%s\n' "$headers" | tr -d '\r' | grep -Fi "location: $PROD_BASE/$target.html"
          }
          check_consolidation best-crm-for-independent-consultants best-crm-for-consultants
          check_consolidation best-seo-tools-for-small-business best-seo-tools
          check_consolidation best-marketing-automation-tools-for-small-business best-marketing-automation-tools
      - name: Check public-domain analytics auth
        run: |
          set -e
          response="$(curl --silent --show-error --location --write-out '\n__HTTP_STATUS__=%{http_code}' "$PROD_BASE/api/stats")"
          status="${response##*__HTTP_STATUS__=}"
          body="${response%__HTTP_STATUS__=*}"
          case "$status" in
            401|403) echo "Unauthenticated analytics request denied with HTTP $status" ;;
            200) if printf '%s' "$body" | grep -Eq '"(sessions|searches|clicks|events|revenue|analytics)"[[:space:]]*:'; then echo 'ERROR: unauthenticated analytics response exposed metric data'; exit 1; fi; echo 'Analytics endpoint returned HTTP 200 but exposed no metric data; likely Access-authenticated response.' ;;
            *) echo "ERROR: unexpected analytics auth status $status"; exit 1 ;;
          esac
      - name: Check tracked affiliate redirects
        run: |
          set -e
          check_redirect() {
            slug="$1"
            expected="$2"
            headers="$(mktemp)"
            curl --silent --show-error --dump-header "$headers" --output /dev/null --max-redirs 0 "$PROD_BASE/go/$slug" 2>/dev/null || true
            echo "Headers for /go/$slug:"
            cat "$headers"
            status="$(sed -n 's/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$headers" | tail -1)"
            location="$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' "$headers" | tr -d '\r' | tail -1)"
            rm -f "$headers"
            echo "Parsed status=$status location=$location"
            test "$status" = "302"
            printf '%s\n' "$location" | grep -Eq "$expected"
          }
          check_redirect systeme-io '^https://systeme\.io/\?[^[:space:]]*(sa=|[?&]sa=)'
          check_redirect beehiiv '^https://(www\.)?beehiiv\.com/\?[^[:space:]]*(via=|[?&]via=)'
          check_redirect jotform '^https://www\.jotform\.com/[^[:space:]]*[?&]partner=pcaiano'
          check_redirect pipedrive '^https://aff\.trypipedrive\.com/e5qvcwi1i22u/?$'
          check_redirect make '^https://www\.make\.com/en/register\?pc=toolscout$'
      - name: Check every catalog Explore redirect
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tools = JSON.parse(fs.readFileSync('data/tools.json', 'utf8'));
          const affiliate = JSON.parse(fs.readFileSync('data/affiliate.json', 'utf8'));
          const prod = process.env.PROD_BASE;
          const prodHost = new URL(prod).hostname;
          const redirectStatuses = new Set([301, 302, 303, 307, 308]);
          (async () => {
            const failures = [];
            for (const tool of tools) {
              const entry = affiliate[tool.slug] || {};
              const active = Boolean(entry.enabled && entry.url);
              const expected = active ? entry.url : (entry.publicUrl || tool.sourceUrl);
              if (!expected) {
                failures.push(`${tool.slug}: no expected external destination`);
                continue;
              }
              try {
                const response = await fetch(`${prod}/go/${encodeURIComponent(tool.slug)}`, {
                  redirect: 'manual',
                  headers: {'user-agent': 'ToolScout production smoke/1.0'}
                });
                const location = response.headers.get('location');
                if (!redirectStatuses.has(response.status) || !location) {
                  failures.push(`${tool.slug}: HTTP ${response.status}, missing external redirect`);
                  continue;
                }
                const destination = new URL(location, prod);
                const expectedHost = new URL(expected).hostname;
                if (destination.hostname === prodHost) {
                  failures.push(`${tool.slug}: redirected back to ToolScout (${destination.href})`);
                  continue;
                }
                if (destination.hostname !== expectedHost) {
                  failures.push(`${tool.slug}: expected host ${expectedHost}, got ${destination.hostname}`);
                  continue;
                }
                console.log(`OK ${tool.slug} -> ${destination.hostname}${active ? ' [affiliate]' : ' [public]'}`);
              } catch (error) {
                failures.push(`${tool.slug}: ${error.message}`);
              }
            }
            if (failures.length) {
              console.error(`Explore redirect failures (${failures.length}/${tools.length}):`);
              for (const failure of failures) console.error(`- ${failure}`);
              process.exit(1);
            }
            console.log(`All ${tools.length} catalog Explore routes redirect to their expected external host.`);
          })();
          NODE