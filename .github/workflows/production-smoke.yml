name: Production Smoke Test
permissions:
  contents: read
env:
  PROD_BASE: https://trytoolscout.org
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    - name: Check production health
      run: |
        set -e
        curl --fail --silent --show-error "$PROD_BASE/api/health"
        echo
      if: ${{ !cancelled() }}
    - name: Check robots
      run: |
        set -e
        curl --fail --silent --show-error "$PROD_BASE/robots.txt" | grep -F "Sitemap: $PROD_BASE/sitemap.xml"
      if: ${{ !cancelled() }}
    - name: Check sitemap
      run: |
        set -e
        sitemap="$(curl --fail --silent --show-error "$PROD_BASE/sitemap.xml")"
        printf '%s\n' "$sitemap" | grep -F '<urlset'
        printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/best-seo-tools.html"
        printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/methodology.html"
        printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/privacy.html"
        for page in make-vs-zapier hubspot-vs-pipedrive beehiiv-vs-kit jotform-vs-typeform semrush-vs-ahrefs; do
          printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/$page.html"
        done
      if: ${{ !cancelled() }}
    - name: Check IndexNow verification key
      run: |
        set -e
        key='81025561f83480545d2e18f4f6f1e4ed'
        body="$(curl --fail --silent --show-error "$PROD_BASE/$key.txt")"
        test "$body" = "$key"
        node -e "const c=require('./data/distribution-submission-adapters.json');const a=c.adapters.find(x=>x.surface_slug==='indexnow');if(!a||!a.enabled||!a.allow_automatic||a.payload_kind!=='indexnow'||a.key!=='$key')process.exit(1)"
      if: ${{ !cancelled() }}
    - name: Check core pages
      run: |
        set -e
        for page in / /guides.html /blog/ /tools.html /compare.html /methodology.html /affiliate-disclosure.html /privacy.html /best-seo-tools.html /best-crm-for-small-business.html /tool.html?tool=systeme-io /reports/growth-priority.json; do
          echo "Checking $PROD_BASE$page"
          curl --fail --silent --show-error --location "$PROD_BASE$page" >/dev/null
        done
      if: ${{ !cancelled() }}
    - name: Check commercial comparison pages
      run: |
        set -e
        for page in make-vs-zapier hubspot-vs-pipedrive beehiiv-vs-kit jotform-vs-typeform semrush-vs-ahrefs; do
          echo "Checking comparison $PROD_BASE/$page.html"
          html="$(curl --fail --silent --show-error --location "$PROD_BASE/$page.html")"
          printf '%s\n' "$html" | grep -F "<link rel=\"canonical\" href=\"$PROD_BASE/$page.html\">"
          printf '%s\n' "$html" | grep -F 'No paid ranking.'
          printf '%s\n' "$html" | grep -F 'Affiliate relationships do not influence scoring'
        done
      if: ${{ !cancelled() }}
    - name: Check public analytics surface is protected
      run: |
        set -e
        code="$(curl --silent --show-error --output /tmp/analytics.html --write-out '%{http_code}' --location "$PROD_BASE/analytics.html")"
        case "$code" in
          404) echo 'Public analytics surface correctly absent on public domain' ;;
          200) if grep -Fq 'ToolScout Command Center' /tmp/analytics.html; then echo 'ERROR: unauthenticated request exposed the Command Center'; exit 1; fi ;;
          *) echo "ERROR: unexpected analytics page status $code"; exit 1 ;;
        esac
      if: ${{ !cancelled() }}
    - name: Check dynamic SEO canonical
      run: |
        set -e
        html="$(curl --fail --silent --show-error --location "$PROD_BASE/best-ai-marketing-tools.html")"
        printf '%s\n' "$html" | grep -F '<link rel="canonical" href="https://trytoolscout.org/best-ai-marketing-tools.html">'
      if: ${{ !cancelled() }}
    - name: Check consolidated SEO redirects
      run: |
        set -e
        check_consolidation() {
          source="$1"
          target="$2"
          headers="$(curl --silent --show-error --head --max-redirs 0 "$PROD_BASE/$source.html" 2>/dev/null || true)"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[^ ]+ 301'
          printf '%s\n' "$headers" | tr -d '\r' | grep -Fi "location: $PROD_BASE/$target.html"
        }
        check_consolidation best-crm-for-independent-consultants best-crm-for-consultants
        check_consolidation best-seo-tools-for-small-business best-seo-tools
        check_consolidation best-marketing-automation-tools-for-small-business best-marketing-automation-tools
      if: ${{ !cancelled() }}
    - name: Check public-domain analytics auth
      run: |
        set -e
        response="$(curl --silent --show-error --location --write-out '\n__HTTP_STATUS__=%{http_code}' "$PROD_BASE/api/stats")"
        status="${response##*__HTTP_STATUS__=}"
        body="${response%__HTTP_STATUS__=*}"
        case "$status" in
          401|403) echo "Unauthenticated analytics request denied with HTTP $status" ;;
          200) if printf '%s' "$body" | grep -Eq '"(sessions|searches|clicks|events|revenue|analytics)"[[:space:]]*:'; then echo 'ERROR: unauthenticated analytics response exposed metric data'; exit 1; fi; echo 'Analytics endpoint returned HTTP 200 but exposed no metric data; likely Access-authenticated response.' ;;
          *) echo "ERROR: unexpected analytics auth status $status"; exit 1 ;;
        esac
      if: ${{ !cancelled() }}
    - name: Check tracked affiliate redirects
      run: |
        set -e
        check_redirect() {
          slug="$1"
          expected="$2"
          headers="$(mktemp)"
          curl --silent --show-error --dump-header "$headers" --output /dev/null --max-redirs 0 "$PROD_BASE/go/$slug" 2>/dev/null || true
          status="$(sed -n 's/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$headers" | tail -1)"
          location="$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' "$headers" | tr -d '\r' | tail -1)"
          rm -f "$headers"
          test "$status" = "302"
          printf '%s\n' "$location" | grep -Eq "$expected"
        }
        check_redirect systeme-io '^https://systeme\.io/\?[^[:space:]]*(sa=|[?&]sa=)'
        check_redirect beehiiv '^https://(www\.)?beehiiv\.com/\?[^[:space:]]*(via=|[?&]via=)'
        check_redirect jotform '^https://www\.jotform\.com/[^[:space:]]*[?&]partner=pcaiano'
        check_redirect pipedrive '^https://aff\.trypipedrive\.com/e5qvcwi1i22u/?$'
        check_redirect make '^https://www\.make\.com/en/register\?pc=toolscout$'
      if: ${{ !cancelled() }}
    - name: Check every catalog Explore redirect
      run: |-
        node <<'NODE'
        const fs = require('fs');
        const tools = JSON.parse(fs.readFileSync('data/tools.json', 'utf8'));
        const affiliate = JSON.parse(fs.readFileSync('data/affiliate.json', 'utf8'));
        const prod = process.env.PROD_BASE;
        const prodHost = new URL(prod).hostname;
        const redirectStatuses = new Set([301, 302, 303, 307, 308]);
        (async () => {
          const failures = [];
          for (const tool of tools) {
            const entry = affiliate[tool.slug] || {};
            const active = Boolean(entry.enabled && entry.url);
            const expected = active ? entry.url : (entry.publicUrl || tool.sourceUrl);
            if (!expected) { failures.push(`${tool.slug}: no expected external destination`); continue; }
            try {
              const response = await fetch(`${prod}/go/${encodeURIComponent(tool.slug)}`, {redirect:'manual',headers:{'user-agent':'ToolScout production smoke/1.0'}});
              const location = response.headers.get('location');
              if (!redirectStatuses.has(response.status) || !location) { failures.push(`${tool.slug}: HTTP ${response.status}, missing external redirect`); continue; }
              const destination = new URL(location, prod);
              const expectedHost = new URL(expected).hostname;
              if (destination.hostname === prodHost) { failures.push(`${tool.slug}: redirected back to ToolScout (${destination.href})`); continue; }
              if (destination.hostname !== expectedHost) { failures.push(`${tool.slug}: expected host ${expectedHost}, got ${destination.hostname}`); continue; }
              console.log(`OK ${tool.slug} -> ${destination.hostname}${active ? ' [affiliate]' : ' [public]'}`);
            } catch (error) { failures.push(`${tool.slug}: ${error.message}`); }
          }
          if (failures.length) { console.error(`Explore redirect failures (${failures.length}/${tools.length}):`); for (const failure of failures) console.error(`- ${failure}`); process.exit(1); }
          console.log(`All ${tools.length} catalog Explore routes redirect to their expected external host.`);
        })();
        NODE
      if: ${{ !cancelled() }}
    - name: Command Center Smoke / Verify private analytics bridge
      run: |
        set -euo pipefail
        headers="$(mktemp)"
        body="$(mktemp)"
        code="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' --max-redirs 0 "$PROD_BASE/analytics/api/stats" || true)"
        echo "HTTP $code"
        cat "$headers"
        if [ "$code" != "401" ]; then
          echo "ERROR: expected the private bridge to reject a request without its Command Center cookie with HTTP 401."
          echo "A redirect means Cloudflare Access is still intercepting the browser-to-data route; 200 means the route is exposed."
          cat "$body"
          exit 1
        fi
        grep -F 'application/json' "$headers"
        grep -F 'command_center_session_expired' "$body"
        echo 'Private analytics bridge is reachable directly and correctly protected by the Command Center session cookie.'
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() }}
    - name: Command Center Smoke / Verify live Audience data source
      run: |
        set -euo pipefail
        body="$(mktemp)"
        ok=0
        for attempt in 1 2 3 4 5 6; do
          code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' "$PROD_BASE/api/audience-health?t=$(date +%s)" || true)"
          if [ "$code" = "200" ] && jq -e '.ok == true and (.totals.total | type == "number") and (.totals.published | type == "number") and (.byPlatform | type == "array")' "$body" >/dev/null; then
            ok=1
            break
          fi
          sleep 5
        done
        if [ "$ok" != "1" ]; then
          echo 'ERROR: live Audience health feed is unavailable or malformed.'
          cat "$body"
          exit 1
        fi
        jq '{ok, totals, byPlatform, latest}' "$body"
        echo 'Audience data source is live and queryable by the Command Center.'
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() }}
    - name: Commercial Surface Smoke / Check every generated commercial comparison
      run: |
        set -e
        sitemap="$(curl --fail --silent --show-error "$PROD_BASE/sitemap.xml")"
        count=0
        for file in ./*-vs-*.html; do
          [ -e "$file" ] || continue
          page="$(basename "$file" .html)"
          count=$((count+1))
          echo "Checking $page"
          html="$(curl --fail --silent --show-error --location "$PROD_BASE/$page.html")"
          printf '%s\n' "$html" | grep -F "<link rel=\"canonical\" href=\"$PROD_BASE/$page.html\">"
          printf '%s\n' "$html" | grep -F 'No paid ranking.'
          printf '%s\n' "$html" | grep -F 'Affiliate relationships do not influence scoring'
          profile_links="$(printf '%s\n' "$html" | grep -oE 'href="/tools/[a-z0-9-]+\.html"' | wc -l)"
          test "$profile_links" -ge 2
          printf '%s\n' "$sitemap" | grep -F "$PROD_BASE/$page.html"
        done
        test "$count" -gt 0
        echo "Validated $count generated commercial comparison pages."
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() }}
    - name: Commercial Surface Smoke / Check tracked public outbound redirect
      run: |
        set -e
        node <<'NODE' >/tmp/public-route.txt
        const fs=require('fs');
        const tools=JSON.parse(fs.readFileSync('data/tools.json','utf8'));
        const affiliate=JSON.parse(fs.readFileSync('data/affiliate.json','utf8'));
        const tool=tools.find(t=>{
          const a=affiliate[t.slug]||{};
          return !(a.enabled&&a.url) && (a.publicUrl||t.sourceUrl);
        });
        if(!tool)process.exit(1);
        const a=affiliate[tool.slug]||{};
        console.log(tool.slug);
        console.log(a.publicUrl||tool.sourceUrl);
        NODE
        slug="$(sed -n '1p' /tmp/public-route.txt)"
        expected="$(sed -n '2p' /tmp/public-route.txt)"
        expected_host="$(node -e "console.log(new URL(process.argv[1]).hostname)" "$expected")"
        headers="$(mktemp)"
        curl --silent --show-error --dump-header "$headers" --output /dev/null --max-redirs 0 "$PROD_BASE/go/$slug" || true
        cat "$headers"
        status="$(sed -n 's/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$headers" | tail -1)"
        location="$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' "$headers" | tr -d '\r' | tail -1)"
        cookie="$(sed -n 's/^[Ss]et-[Cc]ookie:[[:space:]]*//p' "$headers" | tr -d '\r' | grep -F 'toolscout_session=' | tail -1 || true)"
        rm -f "$headers"
        test "$status" = "302"
        actual_host="$(node -e "console.log(new URL(process.argv[1]).hostname)" "$location")"
        test "$actual_host" = "$expected_host"
        test -n "$cookie"
        echo "Tracked public route OK: $slug -> $actual_host with ToolScout session cookie."
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() }}
    - name: Commercial Surface Smoke / Check tracked affiliate outbound redirect
      run: |
        set -e
        node <<'NODE' >/tmp/affiliate-route.txt
        const fs=require('fs');
        const affiliate=JSON.parse(fs.readFileSync('data/affiliate.json','utf8'));
        const entry=Object.entries(affiliate).find(([,v])=>v&&v.enabled&&v.url);
        if(!entry)process.exit(1);
        console.log(entry[0]);
        console.log(entry[1].url);
        NODE
        slug="$(sed -n '1p' /tmp/affiliate-route.txt)"
        expected="$(sed -n '2p' /tmp/affiliate-route.txt)"
        expected_host="$(node -e "console.log(new URL(process.argv[1]).hostname)" "$expected")"
        headers="$(mktemp)"
        curl --silent --show-error --dump-header "$headers" --output /dev/null --max-redirs 0 "$PROD_BASE/go/$slug" || true
        location="$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' "$headers" | tr -d '\r' | tail -1)"
        rm -f "$headers"
        actual_host="$(node -e "console.log(new URL(process.argv[1]).hostname)" "$location")"
        test "$actual_host" = "$expected_host"
        echo "Tracked affiliate route OK: $slug -> $actual_host."
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() }}
    - name: API Discovery Production Smoke / Validate APIs.json
      run: |
        set -euo pipefail
        curl -fsSL "$PROD_BASE/apis.json" -o /tmp/apis.json
        jq -e '.specificationVersion == "0.19" and .url == "https://trytoolscout.org/apis.json" and (.apis | length > 0) and (.apis[0].properties | any(.type == "RecommendationAPI"))' /tmp/apis.json >/dev/null
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: API Discovery Production Smoke / Validate OpenAPI
      run: |
        set -euo pipefail
        curl -fsSL "$PROD_BASE/openapi.json" -o /tmp/openapi.json
        jq -e '.openapi == "3.1.0" and .paths["/api/recommend"].get.operationId == "recommendTools" and .paths["/api/distribution/feed.json"].get and .paths["/.well-known/toolscout-distribution.json"].get' /tmp/openapi.json >/dev/null
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: API Discovery Production Smoke / Validate recommendation API
      run: |
        set -euo pipefail
        curl -fsSL -D /tmp/recommend-headers "$PROD_BASE/api/recommend?q=crm%20for%20a%20small%20sales%20team&budget=low&team=small&limit=3" -o /tmp/recommend.json
        tr -d '\r' </tmp/recommend-headers | grep -Fi 'access-control-allow-origin: *'
        jq -e '.query == "crm for a small sales team" and .count == 3 and (.recommendations | length == 3) and .recommendations[0].name and (.recommendations[0].match >= 40) and (.recommendations[0].tool_url | startswith("https://trytoolscout.org/go/")) and (.affiliate_disclosure | length > 20)' /tmp/recommend.json >/dev/null
        code=$(curl -sS -o /tmp/recommend-error.json -w '%{http_code}' "$PROD_BASE/api/recommend")
        test "$code" = "400"
        jq -e '.error == "query_required"' /tmp/recommend-error.json >/dev/null
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: API Discovery Production Smoke / Validate RFC 9727 catalog
      run: |
        set -euo pipefail
        curl -fsSL -D /tmp/catalog-headers "$PROD_BASE/.well-known/api-catalog" -o /tmp/catalog.json
        tr -d '\r' </tmp/catalog-headers | grep -Fi 'content-type: application/linkset+json'
        tr -d '\r' </tmp/catalog-headers | grep -Fi 'rel="api-catalog"'
        jq -e '.linkset[0].anchor == "https://trytoolscout.org/api/recommend" and .linkset[0]["service-desc"][0].href == "https://trytoolscout.org/openapi.json"' /tmp/catalog.json >/dev/null
        curl -fsSI "$PROD_BASE/.well-known/api-catalog" | tr -d '\r' | grep -Fi 'rel="api-catalog"'
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: API Discovery Production Smoke / Validate discovery manifest links
      run: |
        set -euo pipefail
        curl -fsSL "$PROD_BASE/.well-known/toolscout-distribution.json" -o /tmp/manifest.json
        jq -e '.machine_discovery.apis_json == "https://trytoolscout.org/apis.json" and .machine_discovery.openapi == "https://trytoolscout.org/openapi.json" and .machine_discovery.api_catalog == "https://trytoolscout.org/.well-known/api-catalog" and .machine_discovery.recommendation_api == "https://trytoolscout.org/api/recommend"' /tmp/manifest.json >/dev/null
      env:
        PROD_BASE: https://trytoolscout.org
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: MCP Production Smoke / Discover stateless MCP server
      run: |
        set -euo pipefail
        curl -fsSL "$MCP_URL" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json' \
          -H "MCP-Protocol-Version: $MCP_VERSION" \
          -H 'Mcp-Method: server/discover' \
          --data '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"toolscout-smoke","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
          -o /tmp/discover.json
        jq -e '.jsonrpc == "2.0" and .id == 1 and (.result.supportedVersions | index("2026-07-28")) != null and .result.capabilities.tools and .result.ttlMs == 3600000 and .result.cacheScope == "public" and .result._meta["io.modelcontextprotocol/serverInfo"].name == "ToolScout"' /tmp/discover.json >/dev/null
      env:
        MCP_URL: https://trytoolscout.org/mcp
        MCP_VERSION: &id001 2026-07-28
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: MCP Production Smoke / List ToolScout MCP tools
      run: |
        set -euo pipefail
        curl -fsSL "$MCP_URL" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json' \
          -H "MCP-Protocol-Version: $MCP_VERSION" \
          -H 'Mcp-Method: tools/list' \
          --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"toolscout-smoke","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
          -o /tmp/tools.json
        jq -e '.result.tools | length == 1' /tmp/tools.json >/dev/null
        jq -e '.result.tools[0].name == "recommend_tools" and .result.tools[0].annotations.readOnlyHint == true and (.result.tools[0].inputSchema.required | index("q")) != null' /tmp/tools.json >/dev/null
      env:
        MCP_URL: https://trytoolscout.org/mcp
        MCP_VERSION: *id001
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: MCP Production Smoke / Call recommendation tool
      run: |
        set -euo pipefail
        curl -fsSL "$MCP_URL" \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json' \
          -H "MCP-Protocol-Version: $MCP_VERSION" \
          -H 'Mcp-Method: tools/call' \
          -H 'Mcp-Name: recommend_tools' \
          --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"recommend_tools","arguments":{"q":"crm for a small sales team","budget":"low","team":"small","limit":3},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"toolscout-smoke","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
          -o /tmp/call.json
        jq -e '.result.isError == false and .result.structuredContent.count == 3 and (.result.structuredContent.recommendations | length == 3) and .result.structuredContent.recommendations[0].name and (.result.structuredContent.recommendations[0].tool_url | startswith("https://trytoolscout.org/go/"))' /tmp/call.json >/dev/null
      env:
        MCP_URL: https://trytoolscout.org/mcp
        MCP_VERSION: *id001
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: MCP Production Smoke / Reject mismatched MCP routing headers
      run: |
        set -euo pipefail
        code=$(curl -sS -o /tmp/mismatch.json -w '%{http_code}' "$MCP_URL" \
          -H 'Content-Type: application/json' \
          -H "MCP-Protocol-Version: $MCP_VERSION" \
          -H 'Mcp-Method: tools/list' \
          -H 'Mcp-Name: wrong_tool' \
          --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"recommend_tools","arguments":{"q":"seo tools"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}')
        test "$code" = "400"
        jq -e '.error.code == -32020 and .error.message == "HeaderMismatch"' /tmp/mismatch.json >/dev/null
      env:
        MCP_URL: https://trytoolscout.org/mcp
        MCP_VERSION: *id001
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: A2A Production Smoke / Validate public Agent Card
      run: |
        set -euo pipefail
        curl -fsSL "$BASE/.well-known/agent-card.json" -o /tmp/card.json
        jq -e '.name == "ToolScout Software Recommendation Agent" and .version == "1.0.0" and .capabilities.streaming == false and (.supportedInterfaces | length == 1) and .supportedInterfaces[0].url == "https://trytoolscout.org/a2a" and .supportedInterfaces[0].protocolBinding == "JSONRPC" and .supportedInterfaces[0].protocolVersion == "1.0" and (.skills | map(.id) | index("recommend_software")) != null' /tmp/card.json >/dev/null
      env:
        BASE: https://trytoolscout.org
        A2A_VERSION: '1.0'
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: A2A Production Smoke / Send A2A recommendation message
      run: |
        set -euo pipefail
        curl -fsSL "$BASE/a2a" \
          -H 'Content-Type: application/json' \
          -H "A2A-Version: $A2A_VERSION" \
          --data '{"jsonrpc":"2.0","id":"a2a-smoke-1","method":"SendMessage","params":{"message":{"messageId":"msg-smoke-1","role":"ROLE_USER","parts":[{"text":"CRM for a small sales team","mediaType":"text/plain"},{"data":{"budget":"low","team":"small","limit":3},"mediaType":"application/json"}]}}}' \
          -o /tmp/send.json
        jq -e '.jsonrpc == "2.0" and .id == "a2a-smoke-1" and .result.message.role == "ROLE_AGENT" and .result.message.contextId and (.result.message.parts | length == 2)' /tmp/send.json >/dev/null
        jq -e '.result.message.parts[1].data.count == 3 and (.result.message.parts[1].data.recommendations | length == 3) and .result.message.parts[1].data.recommendations[0].name and (.result.message.parts[1].data.recommendations[0].tool_url | startswith("https://trytoolscout.org/go/"))' /tmp/send.json >/dev/null
      env:
        BASE: https://trytoolscout.org
        A2A_VERSION: '1.0'
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: A2A Production Smoke / Reject unsupported A2A version
      run: |
        set -euo pipefail
        code=$(curl -sS -o /tmp/version.json -w '%{http_code}' "$BASE/a2a" \
          -H 'Content-Type: application/json' \
          -H 'A2A-Version: 0.3' \
          --data '{"jsonrpc":"2.0","id":2,"method":"SendMessage","params":{"message":{"messageId":"m2","role":"ROLE_USER","parts":[{"text":"seo tools"}]}}}')
        test "$code" = "400"
        jq -e '.error.code == -32009' /tmp/version.json >/dev/null
      env:
        BASE: https://trytoolscout.org
        A2A_VERSION: '1.0'
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    - name: A2A Production Smoke / Reject unsupported A2A operation
      run: |
        set -euo pipefail
        code=$(curl -sS -o /tmp/method.json -w '%{http_code}' "$BASE/a2a" \
          -H 'Content-Type: application/json' \
          -H "A2A-Version: $A2A_VERSION" \
          --data '{"jsonrpc":"2.0","id":3,"method":"GetTask","params":{"id":"none"}}')
        test "$code" = "400"
        jq -e '.error.code == -32601' /tmp/method.json >/dev/null
      env:
        BASE: https://trytoolscout.org
        A2A_VERSION: '1.0'
      if: ${{ !cancelled() && github.event_name != 'schedule' }}
    timeout-minutes: 10
'on':
  workflow_run:
    workflows:
    - Deploy ToolScout Worker
    types:
    - completed
    branches:
    - main
  schedule:
  - cron: 15 * * * *
  workflow_dispatch: null
