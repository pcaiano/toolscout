name: Diagnostic Authority 0920

on:
  push:
    branches:
      - diag-authority-0920-20261005
    paths:
      - '.github/workflows/diag-authority-0920.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read authority failure evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT run_id,status,trigger_name,started_at,completed_at,detail,evidence_json
          FROM engine_runs
          WHERE engine='distribution' AND mission='authority_execution_recovery'
          ORDER BY started_at DESC LIMIT 6;

          SELECT event_type,status,detail,created_at
          FROM distribution_events
          WHERE event_type IN (
            'authority_closed_loop_external_attempt',
            'authority_external_handoff_pending',
            'authority_external_handoff_timeout',
            'authority_queue_without_external_handoff',
            'authority_backlog_awaiting_qualification',
            'vendor_outreach_sent','publisher_network_outreach_sent',
            'vendor_outreach_failed','publisher_network_outreach_failed'
          )
            AND created_at>=datetime('2026-10-05 09:15:00')
            AND created_at<=datetime('2026-10-05 09:25:00')
          ORDER BY created_at;

          SELECT task_id,subject_type,subject_key,action,executor,status,claimed_at,attempted_at,last_result,updated_at
          FROM growth_execution_contract
          WHERE executor='make_sender'
          ORDER BY updated_at DESC LIMIT 30;
          "
