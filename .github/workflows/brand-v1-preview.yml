name: Deploy Brand v1 Preview

on:
  push:
    branches: [brand-v1-redesign]
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-brand-v1-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build isolated public preview surface
        run: |
          set -e
          mkdir -p preview
          rsync -a ./ preview/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'preview' \
            --exclude 'admin.html' \
            --exclude 'analytics.html' \
            --exclude 'affiliate-workflow.html' \
            --exclude 'distribution-workflow.html' \
            --exclude 'opportunity-matrix.html' \
            --exclude 'migrations' \
            --exclude 'wrangler.toml'
          cat > preview-worker.js <<'EOF'
          const PRIVATE_PATHS = new Set([
            '/admin.html','/admin','/analytics.html','/analytics',
            '/affiliate-workflow.html','/affiliate-workflow',
            '/distribution-workflow.html','/distribution-workflow',
            '/opportunity-matrix.html','/opportunity-matrix'
          ]);
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (PRIVATE_PATHS.has(url.pathname) || url.pathname.startsWith('/api/')) {
                return new Response('Not found', { status: 404, headers: { 'Cache-Control': 'no-store' } });
              }
              const response = await env.ASSETS.fetch(request);
              const headers = new Headers(response.headers);
              headers.set('X-Robots-Tag', 'noindex, nofollow');
              headers.set('Cache-Control', 'no-store');
              return new Response(response.body, { status: response.status, headers });
            }
          };
          EOF
          cat > preview-wrangler.toml <<'EOF'
          name = "toolscout-brand-v1-preview"
          main = "preview-worker.js"
          compatibility_date = "2026-09-03"
          workers_dev = true

          [assets]
          directory = "./preview"
          binding = "ASSETS"
          html_handling = "auto-trailing-slash"
          not_found_handling = "404-page"
          run_worker_first = true
          EOF

      - name: Deploy isolated redesign preview
        run: npx wrangler deploy --config preview-wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
