name: Deploy GSC Command Center Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gsc-command-center-hotfix-deploy.yml'
      - 'command-center-business-truth-runtime.js'
      - 'tests/toolscout-v2-command-center-final-truth.test.mjs'

permissions:
  contents: read

concurrency:
  group: gsc-command-center-hotfix-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Deploy GSC Command Center hotfix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate GSC Command Center hotfix
        run: |
          set -euo pipefail
          node --check command-center-business-truth-runtime.js
          node --test tests/toolscout-v2-command-center-final-truth.test.mjs
          grep -q 'const GSC_EVIDENCE_FRESHNESS_HOURS=30' command-center-business-truth-runtime.js
          grep -q "service_account_evidence_stale" command-center-business-truth-runtime.js

      - name: Deploy ToolScout Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify public site is live
        run: |
          set -euo pipefail
          node <<'NODE'
          const r=await fetch('https://trytoolscout.org/',{headers:{'user-agent':'ToolScout GSC hotfix verifier'}});
          if(!r.ok)throw new Error('public_site_'+r.status);
          console.log(JSON.stringify({ok:true,status:r.status}));
          NODE
