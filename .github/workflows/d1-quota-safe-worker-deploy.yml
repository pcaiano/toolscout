name: One Shot External Proof Union Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cross-check verified external proof
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT r.surface_slug,a.status,a.route_id,a.updated_at FROM distribution_contact_route_actions a JOIN distribution_contact_routes r ON r.route_id=a.route_id WHERE a.status IN ('verified_placement','verified_human_impact') ORDER BY a.updated_at DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,live_url,action_url,updated_at FROM distribution_opportunities WHERE status IN ('verified','live') ORDER BY updated_at DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH proof AS (
            SELECT surface_slug,'placement_ledger' source FROM distribution_placements WHERE placement_verified=1
            UNION
            SELECT r.surface_slug,'route_action' source FROM distribution_contact_route_actions a JOIN distribution_contact_routes r ON r.route_id=a.route_id WHERE a.status IN ('verified_placement','verified_human_impact')
            UNION
            SELECT surface_slug,'opportunity' source FROM distribution_opportunities WHERE status IN ('verified','live')
          )
          SELECT surface_slug,GROUP_CONCAT(source) sources FROM proof GROUP BY surface_slug ORDER BY surface_slug;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH proof AS (
            SELECT surface_slug FROM distribution_placements WHERE placement_verified=1
            UNION
            SELECT r.surface_slug FROM distribution_contact_route_actions a JOIN distribution_contact_routes r ON r.route_id=a.route_id WHERE a.status IN ('verified_placement','verified_human_impact')
            UNION
            SELECT surface_slug FROM distribution_opportunities WHERE status IN ('verified','live')
          ) SELECT COUNT(*) distinct_verified_surfaces FROM proof;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
