name: One Shot Growth Brain Self Supervisor Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  validate-deploy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Growth Brain supervisor contract
        run: |
          node --check growth-supervisor.js
          node --check distribution-orchestrator-worker.js
          node --check distribution-priority-worker.js
          node --check content-engine-intelligence-worker.js
          node --check growth-command-center-v2-worker.js
          node --check command-center-light-theme-worker.js
          node --check scripts/validate-autonomous-growth-brain.mjs
          node scripts/validate-autonomous-growth-brain.mjs

      - name: Deploy self supervising Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Bootstrap and inspect Growth Supervisor
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://trytoolscout.org/api/growth/supervisor/public > /tmp/supervisor.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/supervisor.json','utf8'));
          if(x.brain!=='shared-growth-v3') throw new Error('wrong_growth_brain');
          const growth=(x.directives||[]).find(d=>d.engine==='growth_brain');
          if(!growth) throw new Error('growth_supervisor_not_bootstrapped');
          console.log(JSON.stringify({
            northStar:x.northStar,
            growth,
            engines:(x.directives||[]).map(d=>({engine:d.engine,status:d.status,directive:d.directive})),
            topSearchTargets:(x.topSearchTargets||[]).map(t=>({path:t.path,priority:t.priority,audienceUrl:Boolean(t.audienceUrl)}))
          },null,2));
          NODE

      - name: Audit D1 supervisor truth
        run: |
          echo "=== GROWTH SUPERVISOR STATE ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT engine,role,status,north_star,strict_humans_24h,strict_humans_7d,attributed_humans_7d,external_executions_24h,external_executions_7d,directive,correction_count,last_correction_at,last_evaluated_at FROM growth_supervisor_state ORDER BY CASE engine WHEN 'growth_brain' THEN 0 ELSE 1 END,engine;"
          echo "=== SUPERVISOR EVENTS ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT engine,previous_status,new_status,directive,strict_humans_24h,strict_humans_7d,external_executions_24h,external_executions_7d,created_at FROM growth_supervisor_events ORDER BY created_at DESC LIMIT 20;"
          echo "=== STRICT HUMAN SOURCE TRUTH 7D ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH fv AS (SELECT session_id,source,referrer_host,created_at,ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY created_at ASC,id ASC) rn FROM confirmed_visitor_events WHERE created_at>=datetime('now','-7 days')) SELECT COALESCE(v.source,'unattributed') source,COALESCE(v.referrer_host,'') referrer_host,COUNT(DISTINCT h.session_id) strict_humans FROM traffic_human_evidence h LEFT JOIN fv v ON v.session_id=h.session_id AND v.rn=1 WHERE h.first_evidence_at>=datetime('now','-7 days') GROUP BY source,referrer_host ORDER BY strict_humans DESC;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
