name: One Shot Growth Catalog State Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-growth-catalog-state-reconciliation
  cancel-in-progress: false

jobs:
  reconcile-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deployed Growth Brain contract
        run: |
          node --check distribution-orchestrator-worker.js
          node --check growth-execution-contract.js
          node scripts/validate-autonomous-growth-brain.mjs

      - name: Retire obsolete catalog execution state
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE growth_opportunity_state SET status='dormant',updated_at=datetime('now') WHERE opportunity_key='catalog:quality-refresh'; UPDATE growth_execution_contract SET status='cancelled',last_result='legacy_catalog_action_retired',completed_at=COALESCE(completed_at,datetime('now')),updated_at=datetime('now') WHERE action IN ('run_catalog_freshness_verification','run_catalog_quality_control','regenerate_verified_profiles') AND status<>'cancelled';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Ask production Growth Brain to reconcile and resolve incidents
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://trytoolscout.org/api/growth/supervisor/public > /tmp/growth-supervisor.json
          cat /tmp/growth-supervisor.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Prove production execution state is clean
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            SUM(CASE WHEN status='executor_missing' THEN 1 ELSE 0 END) missing,
            SUM(CASE WHEN action IN ('run_catalog_freshness_verification','run_catalog_quality_control','regenerate_verified_profiles') AND status<>'cancelled' THEN 1 ELSE 0 END) legacy_active
            FROM growth_execution_contract;" > /tmp/catalog-contract.json
          cat /tmp/catalog-contract.json
          jq -e '.[0].results[0] | .missing==0 and .legacy_active==0' /tmp/catalog-contract.json

          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            SUM(CASE WHEN status='open' AND action IN ('run_catalog_freshness_verification','run_catalog_quality_control','regenerate_verified_profiles') THEN 1 ELSE 0 END) legacy_incidents_open
            FROM growth_architecture_incidents;" > /tmp/catalog-incidents.json
          cat /tmp/catalog-incidents.json
          jq -e '.[0].results[0] | .legacy_incidents_open==0' /tmp/catalog-incidents.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Inspect recent core Growth failures
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT engine,mission,status,detail,started_at,completed_at FROM engine_runs WHERE started_at>=datetime('now','-2 hours') AND engine='growth' ORDER BY started_at DESC LIMIT 25;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
