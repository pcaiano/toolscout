name: One Shot Growth Execution Contract Runtime Proof v8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production-execution-contract-v4
  cancel-in-progress: false

jobs:
  validate-deploy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Growth execution contract
        run: |
          node --check growth-execution-contract.js
          node --check growth-supervisor.js
          node --check distribution-orchestrator-worker.js
          node --check distribution-contact-worker.js
          node --check distribution-autonomous-worker.js
          node --check distribution-network-worker.js
          node --check content-engine-intelligence-worker.js
          node --check affiliate-coverage-cycle-worker.js
          node --check catalog-autonomy-worker.js
          node --check scripts/validate-autonomous-growth-brain.mjs
          node scripts/validate-autonomous-growth-brain.mjs

      - name: Deploy Growth execution contract
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Bootstrap contract state through live supervisor
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-delay 2 https://trytoolscout.org/api/growth/supervisor/public > /tmp/growth.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/growth.json','utf8'));
          if(x?.brain!=='shared-growth-v3') throw new Error('growth_brain_unavailable');
          if(!x.executionContract) throw new Error('execution_contract_not_exposed');
          console.log(JSON.stringify({northStar:x.northStar,executionContract:x.executionContract},null,2));
          NODE

      - name: Enforce end to end execution invariants
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM growth_opportunity_state g, json_each(g.action_json) j WHERE g.status='active') active_actions,
            (SELECT COUNT(*) FROM growth_execution_contract WHERE source_kind='opportunity' AND status<>'cancelled') contracted_actions,
            (SELECT COUNT(*) FROM growth_opportunity_state g, json_each(g.action_json) j LEFT JOIN growth_execution_contract c ON c.source_kind='opportunity' AND c.source_id=g.opportunity_key AND c.action=j.value AND c.status<>'cancelled' WHERE g.status='active' AND c.task_id IS NULL) uncontracted_actions,
            (SELECT COUNT(*) FROM growth_execution_contract WHERE status='executor_missing') missing_executors,
            (SELECT COUNT(*) FROM growth_execution_contract WHERE status='stalled') stalled,
            (SELECT COUNT(*) FROM growth_execution_contract WHERE source_kind='supervisor' AND status<>'cancelled') supervisor_contracts;" > /tmp/execution-invariants.json
          cat /tmp/execution-invariants.json
          jq -e '.[0].results[0] | .uncontracted_actions==0 and .missing_executors==0 and .stalled==0 and .active_actions==.contracted_actions' /tmp/execution-invariants.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Show execution contract by executor
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT executor,execution_mode,status,COUNT(*) n FROM growth_execution_contract WHERE status<>'cancelled' GROUP BY executor,execution_mode,status ORDER BY executor,status;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT source_kind,subject_type,action,executor,status,priority_score,claim_deadline,attempt_deadline,verify_deadline FROM growth_execution_contract WHERE status NOT IN ('cancelled','verified') ORDER BY priority_score DESC LIMIT 40;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Exercise one remote scheduled execution cycle
        run: |
          set -euo pipefail
          npx wrangler dev --remote --test-scheduled --config wrangler.toml --ip 127.0.0.1 --port 8787 --log-level error --show-interactive-dev-session=false > /tmp/wrangler-dev.log 2>&1 &
          DEV_PID=$!
          cleanup(){ kill $DEV_PID >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/api/autonomous-growth-health >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then cat /tmp/wrangler-dev.log; exit 1; fi
          if curl -fsS --max-time 90 "http://127.0.0.1:8787/__scheduled?cron=15+*+*+*+*" > /tmp/scheduled.txt; then
            :
          elif curl -fsS --max-time 90 "http://127.0.0.1:8787/cdn-cgi/handler/scheduled?cron=15+*+*+*+*" > /tmp/scheduled.txt; then
            :
          else
            cat /tmp/wrangler-dev.log
            exit 1
          fi
          cat /tmp/scheduled.txt
          sleep 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Prove execution state advanced
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            SUM(CASE WHEN status='pending' THEN 1 ELSE 0 END) pending,
            SUM(CASE WHEN status='claimed' THEN 1 ELSE 0 END) claimed,
            SUM(CASE WHEN status='attempted' THEN 1 ELSE 0 END) attempted,
            SUM(CASE WHEN status='verified' THEN 1 ELSE 0 END) verified,
            SUM(CASE WHEN status='executor_missing' THEN 1 ELSE 0 END) missing,
            SUM(CASE WHEN status='stalled' THEN 1 ELSE 0 END) stalled,
            SUM(CASE WHEN executor='make_sender' AND status IN ('claimed','attempted') THEN 1 ELSE 0 END) sender_inflight,
            SUM(CASE WHEN executor='seo_github' AND status IN ('claimed','attempted') THEN 1 ELSE 0 END) seo_inflight,
            SUM(CASE WHEN executor='audience_make' AND status IN ('claimed','attempted') THEN 1 ELSE 0 END) audience_inflight
            FROM growth_execution_contract WHERE status<>'cancelled';" > /tmp/execution-progress.json
          cat /tmp/execution-progress.json
          jq -e '.[0].results[0] | ((.claimed + .attempted + .verified) > 0) and .missing==0 and .stalled==0 and .sender_inflight<=3 and .seo_inflight<=12 and .audience_inflight<=1' /tmp/execution-progress.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
