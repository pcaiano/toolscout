name: Reconcile Best of AI Chairman Queue
on:
  push:
    branches: [main]
    paths: ['.github/workflows/d1-quota-safe-worker-deploy.yml']
permissions:
  contents: read
jobs:
  reconcile:
    if: github.event.head_commit.message == 'Correct Best of AI authentication task'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify remote ToolScout identity
        run: |
          npx wrangler d1 info toolscout --config wrangler.toml --json > /tmp/ts-d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const d=JSON.parse(fs.readFileSync('/tmp/ts-d1.json','utf8'));
          assert.equal(d.uuid ?? d.id,'cac6bc3c-d838-4edd-ba29-597030afb397');
          assert.equal(d.name,'toolscout');
          NODE
      - name: Reconcile only Best of AI production state
        run: |
          cat > /tmp/bestofai.sql <<'SQL'
          UPDATE distribution_opportunities SET status='auth_required',human_required=1,action_url='https://bestofai.com/',last_checked_at=datetime('now'),next_action='Open homepage > Sign In (or Join Free if no account) > Add Tool. Direct /tool/add returns 401 You must be logged in, with a 404 illustration. Form and free submission eligibility after login are not yet verified. Do not pay.',updated_at=datetime('now') WHERE surface_slug='best-of-ai' AND status NOT IN ('live','verified','submitted','pending_review');
          UPDATE distribution_submissions SET status='auth_required',human_required=1,action_url='https://bestofai.com/',error='authentication_required_free_submission_unverified',updated_at=datetime('now') WHERE surface_slug='best-of-ai' AND status NOT IN ('submitted','live','verified');
          UPDATE distribution_economic_learning SET chairman_required=1,operating_decision='explore',decision_reason='Official homepage has Sign In, Join Free and Add Tool. Direct add route returns 401 login required. Verify form and free eligibility after authentication; no paid action approved.',decided_at=datetime('now'),updated_at=datetime('now') WHERE surface_slug='best-of-ai';
          SQL
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --file /tmp/bestofai.sql
      - name: Verify Best of AI has the correct authentication task
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT surface_slug,status,human_required,next_action FROM distribution_opportunities WHERE surface_slug='best-of-ai'" > /tmp/ts-queue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const data=JSON.parse(fs.readFileSync('/tmp/ts-queue.json','utf8'));
          const rows=data.flatMap(x=>x.results||[]);
          assert.equal(rows.length,1);
          assert.ok(['auth_required','pending_review','submitted','live','verified'].includes(rows[0].status));
          if(rows[0].status==='auth_required') assert.equal(rows[0].human_required,1);
          console.log(JSON.stringify(rows));
          NODE
