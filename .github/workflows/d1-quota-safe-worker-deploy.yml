name: One Shot Autonomous Surface Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect due autonomous surfaces
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,surface_name,surface_type,status,action_url,live_url,distribution_score,automation_potential,acceptance_probability,human_required,next_action,last_checked_at FROM distribution_opportunities WHERE status IN ('ready_to_submit','candidate','research_required','auth_required') ORDER BY CASE status WHEN 'ready_to_submit' THEN 0 WHEN 'candidate' THEN 1 WHEN 'research_required' THEN 2 ELSE 3 END,distribution_score DESC LIMIT 80;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,error,COUNT(*) failures,MAX(last_attempt_at) last_attempt,SUM(attempts) attempts FROM distribution_submissions WHERE status='failed' GROUP BY surface_slug,error ORDER BY failures DESC,attempts DESC LIMIT 80;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,result,detail,source_url,created_at FROM distribution_qualification_events WHERE result IN ('research_required','external_verification_failed','auth_required') ORDER BY created_at DESC LIMIT 80;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
