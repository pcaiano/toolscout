name: One Shot Growth Stall Diagnosis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Group stalled contracts by executor and reason
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT executor,last_result,COUNT(*) n,MIN(created_at) oldest,MAX(created_at) newest,MIN(attempts) min_attempts,MAX(attempts) max_attempts FROM growth_execution_contract WHERE status='stalled' GROUP BY executor,last_result ORDER BY n DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT executor,action,subject_type,COUNT(*) n FROM growth_execution_contract WHERE status='stalled' GROUP BY executor,action,subject_type ORDER BY n DESC LIMIT 40;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
