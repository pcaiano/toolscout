name: One Shot Traffic Truth Scanner Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production-traffic-truth-fix
  cancel-in-progress: false

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate strict human traffic truth
        run: |
          node --check traffic-integrity-guard-worker.js
          node --check scripts/validate-strict-human-traffic-truth.mjs
          node scripts/validate-strict-human-traffic-truth.mjs

      - name: Deploy traffic truth fix
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify production health contract
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://trytoolscout.org/api/traffic-truth/health > /tmp/traffic-health.json || true
          cat /tmp/traffic-health.json
