name: Reconcile Hype Star Chairman Queue
on:
  push:
    branches: [main]
    paths: ['.github/workflows/d1-quota-safe-worker-deploy.yml']
permissions:
  contents: read
jobs:
  reconcile:
    if: github.event.head_commit.message == 'Reconcile authorized Hype Star Chairman Queue'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify remote ToolScout identity
        run: |
          npx wrangler d1 info toolscout --config wrangler.toml --json > /tmp/ts-d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const d=JSON.parse(fs.readFileSync('/tmp/ts-d1.json','utf8'));
          assert.equal(d.uuid ?? d.id,'cac6bc3c-d838-4edd-ba29-597030afb397');
          assert.equal(d.name,'toolscout');
          NODE
      - name: Reconcile only Hype Star production state
        run: |
          cat > /tmp/hypestar.sql <<'SQL'
          UPDATE distribution_opportunities SET status='pending_review',human_required=0,last_checked_at=datetime('now'),next_action='Submission accepted by Hype Star on 2026-09-17; badge verified at https://trytoolscout.org/methodology. Await editorial review and verify https://hypestar.org/project/toolscout before marking live. No owner action required. Do not resubmit.',updated_at=datetime('now') WHERE surface_slug='hypestar' AND status NOT IN ('live','verified');
          UPDATE distribution_submissions SET status='submitted',human_required=0,error=NULL,submitted_at=COALESCE(submitted_at,'2026-09-17 09:16:00'),updated_at=datetime('now') WHERE surface_slug='hypestar' AND status NOT IN ('live','verified');
          UPDATE distribution_economic_learning SET chairman_required=0,operating_decision='measure',decision_reason='Owner approved and free submission accepted; awaiting editorial review. No human action required.',decided_at=datetime('now'),updated_at=datetime('now') WHERE surface_slug='hypestar';
          SQL
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --file /tmp/hypestar.sql
      - name: Verify Hype Star no longer requires owner action
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT surface_slug,status,human_required,next_action FROM distribution_opportunities WHERE surface_slug='hypestar'" > /tmp/ts-queue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const data=JSON.parse(fs.readFileSync('/tmp/ts-queue.json','utf8'));
          const rows=data.flatMap(x=>x.results||[]);
          assert.equal(rows.length,1);
          assert.ok(['pending_review','live','verified'].includes(rows[0].status));
          assert.equal(rows[0].human_required,0);
          console.log(JSON.stringify(rows));
          NODE
