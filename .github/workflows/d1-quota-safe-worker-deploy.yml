name: One Shot Command Center Growth Card Diagnosis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare Command Center growth card sources
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,directive,strict_humans_24h,strict_humans_7d,attributed_humans_7d,external_executions_24h,external_executions_7d,correction_count,last_correction_at,last_evaluated_at FROM growth_supervisor_state WHERE engine='growth_brain';"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT (SELECT COUNT(*) FROM growth_action_events WHERE created_at>=datetime('now','-7 days') AND status IN ('sent','verified','completed','attributed')) + (SELECT COUNT(*) FROM distribution_submissions WHERE surface_slug<>'indexnow' AND attempts>0 AND COALESCE(last_attempt_at,created_at)>=datetime('now','-7 days')) AS external_executions_card;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) growth_actions_7d FROM growth_action_events WHERE created_at>=datetime('now','-7 days') AND status IN ('sent','verified','completed','attributed'); SELECT COUNT(*) distribution_submissions_7d FROM distribution_submissions WHERE surface_slug<>'indexnow' AND attempts>0 AND COALESCE(last_attempt_at,created_at)>=datetime('now','-7 days');"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) routes,COUNT(DISTINCT surface_slug) surfaces FROM distribution_contact_routes; SELECT COUNT(*) total,SUM(CASE WHEN status='stalled' THEN 1 ELSE 0 END) stalled FROM distribution_contact_route_actions;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) active,SUM(CASE WHEN subject_type='tool' THEN 1 ELSE 0 END) tools,SUM(CASE WHEN subject_type='surface' THEN 1 ELSE 0 END) surfaces,SUM(CASE WHEN subject_type='search' THEN 1 ELSE 0 END) search,SUM(CASE WHEN subject_type='affiliate' THEN 1 ELSE 0 END) affiliate,SUM(CASE WHEN subject_type LIKE 'catalog_%' THEN 1 ELSE 0 END) catalog,SUM(CASE WHEN subject_type='news_update' THEN 1 ELSE 0 END) news FROM growth_opportunity_state WHERE status='active';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
