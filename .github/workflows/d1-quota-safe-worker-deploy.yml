name: One Shot Growth Loop Final Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  validate-deploy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax checks
        run: |
          node --check distribution-network-worker.js
          node --check content-engine-intelligence-worker.js
          node --check distribution-orchestrator-worker.js
          node --check growth-command-center-v2-worker.js
          node --check scripts/validate-autonomous-growth-brain.mjs

      - name: Validate Growth Brain contract
        run: node scripts/validate-autonomous-growth-brain.mjs

      - name: Repair legacy active affiliate opportunities without actions
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE growth_opportunity_state SET action_json=CASE WHEN COALESCE(json_extract(signal_json,'$.affiliate_status'),'') IN ('no_program_found','watchlist') THEN '[\"recheck_affiliate_program_on_evidence_or_cadence\"]' ELSE '[\"reconcile_affiliate_state\"]' END,updated_at=datetime('now') WHERE status='active' AND subject_type='affiliate' AND (action_json IS NULL OR trim(action_json)='' OR trim(action_json)='[]');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Audit Growth Brain loop
        run: |
          echo "=== ACTIVE OPPORTUNITIES WITHOUT ACTION BY TYPE ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT subject_type,COUNT(*) n FROM growth_opportunity_state WHERE status='active' AND (action_json IS NULL OR trim(action_json)='' OR trim(action_json)='[]') GROUP BY subject_type ORDER BY n DESC;"
          echo "=== ALTERNATE ROUTE ACTION STATES ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,execution_mode,COUNT(*) n FROM distribution_contact_route_actions GROUP BY status,execution_mode ORDER BY status,execution_mode;"
          echo "=== ORPHAN ALTERNATE ROUTES ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) orphan_routes FROM distribution_contact_routes r LEFT JOIN distribution_contact_route_actions a ON a.route_id=r.route_id WHERE r.status IN ('discovered','in_loop') AND a.route_id IS NULL;"
          echo "=== STALE ROUTE ACTIONS ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) stale_route_actions FROM distribution_contact_route_actions WHERE (status IN ('queued','retry_due','researching','qualified_auto') AND updated_at<datetime('now','-24 hours')) OR (status='issued_to_content' AND COALESCE(last_attempt_at,updated_at)<datetime('now','-80 hours'));"
          echo "=== STALE GROWTH ACTIONS ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) stale_growth_actions FROM growth_action_events WHERE status IN ('prepared','issued','leased') AND updated_at<datetime('now','-72 hours');"
          echo "=== UNRESOLVED CORE FAILURES 24H ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT f.engine,f.mission,COUNT(*) n FROM engine_runs f WHERE f.started_at>=datetime('now','-24 hours') AND f.status='failed' AND ((f.engine='growth' AND f.mission IN ('opportunity_coordination','rnd_audit')) OR (f.engine='distribution' AND f.mission IN ('network_cycle','autonomous_cycle','economic_learning')) OR (f.engine='content' AND f.mission='social_intelligence')) AND NOT EXISTS (SELECT 1 FROM engine_runs c WHERE c.engine=f.engine AND c.mission=f.mission AND c.status='completed' AND c.started_at>f.started_at) GROUP BY f.engine,f.mission;"
          echo "=== LAST SUCCESSFUL CORE RUNS ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT engine,mission,MAX(completed_at) last_completed FROM engine_runs WHERE status='completed' AND ((engine='growth' AND mission IN ('opportunity_coordination','rnd_audit')) OR (engine='distribution' AND mission IN ('network_cycle','autonomous_cycle','economic_learning')) OR (engine='content' AND mission='social_intelligence')) GROUP BY engine,mission ORDER BY engine,mission;"
          echo "=== ACTIVE OPPORTUNITY COUNTS ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT subject_type,COUNT(*) n FROM growth_opportunity_state WHERE status='active' GROUP BY subject_type ORDER BY n DESC;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
