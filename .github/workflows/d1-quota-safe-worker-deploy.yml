name: One Shot Growth Closed Loop Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  validate-migrate-deploy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax checks
        run: |
          node --check distribution-network-worker.js
          node --check content-engine-intelligence-worker.js
          node --check distribution-orchestrator-worker.js
          node --check growth-command-center-v2-worker.js
          node --check scripts/validate-autonomous-growth-brain.mjs

      - name: Validate autonomous Growth Brain contract
        run: node scripts/validate-autonomous-growth-brain.mjs

      - name: Apply D1 closed-loop migration
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Audit alternate-route lifecycle
        run: |
          echo "=== ROUTE ACTION STATES ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,execution_mode,COUNT(*) n FROM distribution_contact_route_actions GROUP BY status,execution_mode ORDER BY status,execution_mode;"
          echo "=== ORPHAN ROUTES ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) orphan_routes FROM distribution_contact_routes r LEFT JOIN distribution_contact_route_actions a ON a.route_id=r.route_id WHERE r.status IN ('discovered','in_loop') AND a.route_id IS NULL;"
          echo "=== ROUTE OPPORTUNITIES ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,COUNT(*) n FROM distribution_opportunities WHERE surface_type='publisher_contact_route' GROUP BY status ORDER BY status;"
          echo "=== GROWTH LOOP CORE RUNS 24H ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT engine,mission,status,COUNT(*) n,MAX(completed_at) last_completed FROM engine_runs WHERE started_at>=datetime('now','-24 hours') AND ((engine='growth' AND mission IN ('opportunity_coordination','rnd_audit')) OR (engine='distribution' AND mission IN ('network_cycle','autonomous_cycle','economic_learning')) OR (engine='content' AND mission='social_intelligence')) GROUP BY engine,mission,status ORDER BY engine,mission,status;"
          echo "=== ACTIVE OPPORTUNITIES WITHOUT ACTION ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) n FROM growth_opportunity_state WHERE status='active' AND (action_json IS NULL OR trim(action_json)='' OR trim(action_json)='[]');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
