name: One Shot Autonomous Distribution Funnel Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit autonomous distribution funnel
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT policy_state,COUNT(*) n,MIN(confidence) min_conf,MAX(confidence) max_conf FROM distribution_auto_adapters GROUP BY policy_state ORDER BY n DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT a.surface_slug,a.policy_state,a.confidence,a.endpoint,a.method,a.auth_type,o.status opportunity_status,o.human_required,o.next_action FROM distribution_auto_adapters a LEFT JOIN distribution_opportunities o ON o.surface_slug=a.surface_slug ORDER BY a.updated_at DESC LIMIT 40;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT submission_type,status,COUNT(*) n,SUM(attempts) attempts FROM distribution_submissions GROUP BY submission_type,status ORDER BY n DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,submission_type,status,attempts,last_attempt_at,response_url,error,human_required FROM distribution_submissions WHERE submission_type='auto_discovered_json' ORDER BY updated_at DESC LIMIT 40;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,COUNT(*) n FROM distribution_opportunities GROUP BY status ORDER BY n DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT result,COUNT(*) n FROM distribution_qualification_events WHERE created_at>=datetime('now','-7 days') GROUP BY result ORDER BY n DESC;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
