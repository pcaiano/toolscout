name: One Shot Traffic Truth Scanner Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate strict human truth
        run: |
          node --check traffic-integrity-guard-worker.js
          node scripts/validate-strict-human-traffic-truth.mjs

      - name: Reclassify the three scanner false positives
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "INSERT INTO traffic_quarantine_sessions(session_id,reason,original_classification,first_confirmed_at,quarantined_at) SELECT s.session_id,'parallel_multi_page_zero_interaction_false_positive',s.classification,MIN(g.created_at),datetime('now') FROM sessions s LEFT JOIN traffic_guard_events g ON g.session_id=s.session_id WHERE s.session_id IN ('0e3a0dcb-3a89-4047-af9a-24aca479eb17','657dcc62-4712-45a0-80ba-475cdc1df877','6b3540e9-5cc8-4cb7-ba1e-6156e88b6a27') GROUP BY s.session_id,s.classification ON CONFLICT(session_id) DO UPDATE SET reason=excluded.reason,quarantined_at=datetime('now');"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE sessions SET classification='synthetic/test',last_seen_at=datetime('now') WHERE session_id IN ('0e3a0dcb-3a89-4047-af9a-24aca479eb17','657dcc62-4712-45a0-80ba-475cdc1df877','6b3540e9-5cc8-4cb7-ba1e-6156e88b6a27');"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE traffic_guard_events SET decision='blocked',reason='parallel_multi_page_zero_interaction' WHERE session_id IN ('0e3a0dcb-3a89-4047-af9a-24aca479eb17','657dcc62-4712-45a0-80ba-475cdc1df877','6b3540e9-5cc8-4cb7-ba1e-6156e88b6a27');"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "DELETE FROM traffic_human_evidence WHERE session_id IN ('0e3a0dcb-3a89-4047-af9a-24aca479eb17','657dcc62-4712-45a0-80ba-475cdc1df877','6b3540e9-5cc8-4cb7-ba1e-6156e88b6a27');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy hardened Traffic Truth
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Prove canonical human truth is clean
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            (SELECT COUNT(*) FROM traffic_human_evidence) strict_humans,
            (SELECT COUNT(*) FROM traffic_quarantine_sessions WHERE reason='parallel_multi_page_zero_interaction_false_positive') quarantined_false_positives,
            (SELECT COUNT(*) FROM traffic_guard_events WHERE reason='parallel_multi_page_zero_interaction' AND decision='blocked') blocked_scanner_events;" > /tmp/traffic-truth.json
          cat /tmp/traffic-truth.json
          jq -e '.[0].results[0] | .strict_humans==0 and .quarantined_false_positives>=3 and .blocked_scanner_events>0' /tmp/traffic-truth.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
