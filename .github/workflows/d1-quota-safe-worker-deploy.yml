name: One Shot Growth Queue SLA Fix

on:
  push:
    branches:
      - main
      - fix/growth-queue-sla
    paths:
      - 'growth-execution-contract.js'
      - 'scripts/validate-autonomous-growth-brain.mjs'
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-growth-queue-sla-fix
  cancel-in-progress: false

jobs:
  validate-deploy-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate execution contract
        run: |
          node --check growth-execution-contract.js
          node --check distribution-orchestrator-worker.js
          node scripts/validate-autonomous-growth-brain.mjs

      - name: Deploy corrected Worker
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Recover false queue stalls
        if: github.ref == 'refs/heads/main'
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE growth_execution_contract
            SET status='pending',last_result='queued_awaiting_executor_capacity',updated_at=datetime('now')
            WHERE status='stalled' AND last_result='claim_sla_missed' AND attempts=0;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync supervisor to live execution truth
        if: github.ref == 'refs/heads/main'
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE growth_supervisor_state
          SET status=CASE
                WHEN (SELECT COUNT(*) FROM growth_architecture_incidents WHERE status='open' AND approval_required=1)>0 THEN 'failing'
                WHEN (SELECT COUNT(*) FROM growth_execution_contract WHERE status IN ('executor_missing','stalled'))>0 THEN 'failing'
                WHEN strict_humans_7d=0 AND external_executions_7d>0 THEN 'failing'
                WHEN strict_humans_24h=0 AND external_executions_24h=0 THEN 'execution_gap'
                WHEN strict_humans_24h=0 THEN 'underperforming'
                WHEN strict_humans_7d>0 AND attributed_humans_7d=0 THEN 'working_unattributed'
                ELSE 'working' END,
              directive=CASE
                WHEN (SELECT COUNT(*) FROM growth_architecture_incidents WHERE status='open' AND approval_required=1)>0 THEN 'await_code_approval'
                WHEN (SELECT COUNT(*) FROM growth_execution_contract WHERE status IN ('executor_missing','stalled'))>0 THEN 'repair_execution_contract'
                WHEN strict_humans_7d=0 AND external_executions_7d>0 THEN 'correct_all_acquisition_engines'
                WHEN strict_humans_24h=0 AND external_executions_24h=0 THEN 'force_primary_engine_execution'
                WHEN strict_humans_24h=0 THEN 'rotate_after_maturity_and_expand_existing_demand'
                WHEN strict_humans_7d>0 AND attributed_humans_7d=0 THEN 'improve_acquisition_attribution_while_continuing_growth'
                ELSE 'keep_learning_from_verified_humans' END,
              directive_json=json_object(
                'mode',CASE
                  WHEN (SELECT COUNT(*) FROM growth_architecture_incidents WHERE status='open' AND approval_required=1)>0 THEN 'await_code_approval'
                  WHEN (SELECT COUNT(*) FROM growth_execution_contract WHERE status IN ('executor_missing','stalled'))>0 THEN 'repair_execution_contract'
                  WHEN strict_humans_7d=0 AND external_executions_7d>0 THEN 'correct_all_acquisition_engines'
                  WHEN strict_humans_24h=0 AND external_executions_24h=0 THEN 'force_primary_engine_execution'
                  WHEN strict_humans_24h=0 THEN 'rotate_after_maturity_and_expand_existing_demand'
                  WHEN strict_humans_7d>0 AND attributed_humans_7d=0 THEN 'improve_acquisition_attribution_while_continuing_growth'
                  ELSE 'keep_learning_from_verified_humans' END,
                'strict_humans_24h',strict_humans_24h,
                'strict_humans_7d',strict_humans_7d,
                'attributed_humans_24h',attributed_humans_24h,
                'attributed_humans_7d',attributed_humans_7d,
                'acquisition_executions_24h',external_executions_24h,
                'acquisition_executions_7d',external_executions_7d,
                'execution_contract',json_object(
                  'missing_executors',(SELECT COUNT(*) FROM growth_execution_contract WHERE status='executor_missing'),
                  'stalled',(SELECT COUNT(*) FROM growth_execution_contract WHERE status='stalled'),
                  'pending',(SELECT COUNT(*) FROM growth_execution_contract WHERE status='pending'),
                  'claimed',(SELECT COUNT(*) FROM growth_execution_contract WHERE status='claimed'),
                  'attempted',(SELECT COUNT(*) FROM growth_execution_contract WHERE status='attempted'),
                  'verified',(SELECT COUNT(*) FROM growth_execution_contract WHERE status='verified')
                ),
                'architecture_escalation',json_object(
                  'open_incidents',(SELECT COUNT(*) FROM growth_architecture_incidents WHERE status='open' AND approval_required=1),
                  'approval_required',CASE WHEN (SELECT COUNT(*) FROM growth_architecture_incidents WHERE status='open' AND approval_required=1)>0 THEN json('true') ELSE json('false') END
                )
              ),
              last_evaluated_at=datetime('now'),updated_at=datetime('now')
          WHERE engine='growth_brain';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Prove queue and supervisor are truthful
        if: github.ref == 'refs/heads/main'
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            SUM(CASE WHEN status='executor_missing' THEN 1 ELSE 0 END) missing,
            SUM(CASE WHEN status='stalled' THEN 1 ELSE 0 END) stalled,
            SUM(CASE WHEN status='stalled' AND last_result='claim_sla_missed' AND attempts=0 THEN 1 ELSE 0 END) false_queue_stalls
          FROM growth_execution_contract;" > /tmp/contract.json
          cat /tmp/contract.json
          jq -e '.[0].results[0] | .missing==0 and .stalled==0 and .false_queue_stalls==0' /tmp/contract.json

          curl -fsS --retry 5 --retry-delay 3 https://trytoolscout.org/api/growth/supervisor/public > /tmp/public.json
          cat /tmp/public.json
          jq -e '.executionContract.missingExecutors==0 and .executionContract.stalled==0 and (.directives[] | select(.engine=="growth_brain") | (.directive!="await_code_approval" and .directive!="repair_execution_contract"))' /tmp/public.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
