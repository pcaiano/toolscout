name: ToolScout authorized one-off Hype Star badge deploy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/d1-quota-safe-worker-deploy.yml']
permissions:
  contents: read
concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.head_commit.message == 'Authorize one-off Hype Star badge deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ToolScout target and prepared badge
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = fs.readFileSync('wrangler.toml','utf8');
          assert.match(config, /^name = "toolscout"$/m);
          assert.match(config, /database_name = "toolscout"/);
          assert.match(config, /database_id = "cac6bc3c-d838-4edd-ba29-597030afb397"/);
          assert.match(fs.readFileSync('methodology.html','utf8'), /class="hypestar-badge hypestar-badge--auto"/);
          NODE
      - name: Verify remote ToolScout database identity
        run: |
          npx wrangler d1 info toolscout --config wrangler.toml --json > /tmp/toolscout-d1-info.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const info=JSON.parse(fs.readFileSync('/tmp/toolscout-d1-info.json','utf8'));
          assert.equal(info.uuid ?? info.id, 'cac6bc3c-d838-4edd-ba29-597030afb397');
          assert.equal(info.name, 'toolscout');
          console.log('Verified remote ToolScout D1 identity.');
          NODE
      - name: Verify existing Worker deployment
        run: npx wrangler deployments list --config wrangler.toml
      - name: Apply existing canonical public navigation
        run: node scripts/unify-public-nav.mjs
      - name: Deploy approved badge without database migrations
        run: npx wrangler deploy --config wrangler.toml --latest
