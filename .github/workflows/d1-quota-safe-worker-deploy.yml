name: One Shot External Proof Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit external proof pipeline
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT placement_id,surface_slug,source_url,destination_url,placement_verified,backlink_verified,created_at,updated_at FROM distribution_placements WHERE placement_verified=1 ORDER BY updated_at DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,COUNT(*) n FROM distribution_opportunities GROUP BY status ORDER BY n DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT verification_state,COUNT(*) n FROM distribution_delivery_state GROUP BY verification_state ORDER BY n DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,COUNT(*) n FROM distribution_network_outreach GROUP BY status ORDER BY n DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,COUNT(*) n FROM distribution_contact_route_actions GROUP BY status ORDER BY n DESC;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT event_type,status,COUNT(*) n FROM distribution_events WHERE created_at>=datetime('now','-7 days') GROUP BY event_type,status ORDER BY n DESC LIMIT 80;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
