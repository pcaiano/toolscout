name: One Shot Command Center Growth Truth Fix

on:
  push:
    branches:
      - main
      - fix/command-center-growth-truth
    paths:
      - 'growth-command-center-v2-worker.js'
      - 'command-center-light-theme-worker.js'
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-command-center-growth-truth
  cancel-in-progress: false

jobs:
  validate-deploy-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Command Center growth truth
        run: |
          node --check growth-command-center-v2-worker.js
          node --check command-center-light-theme-worker.js
          grep -q "d1_consolidated_growth_truth_v2" growth-command-center-v2-worker.js
          grep -q "command-center-stats-v5" command-center-light-theme-worker.js
          ! grep -q "const \[growthState,growthRnd,contactRouteState,routeActionState,externalExecutions" growth-command-center-v2-worker.js

      - name: Deploy corrected Worker
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Prove canonical live growth values
        if: github.ref == 'refs/heads/main'
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            status,directive,external_executions_24h,external_executions_7d,
            strict_humans_24h,strict_humans_7d
          FROM growth_supervisor_state WHERE engine='growth_brain';" > /tmp/supervisor.json
          cat /tmp/supervisor.json
          jq -e '.[0].results[0] | .external_executions_7d>0 and .directive!="none"' /tmp/supervisor.json

          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            COUNT(*) routes,COUNT(DISTINCT surface_slug) surfaces
          FROM distribution_contact_routes;" > /tmp/routes.json
          cat /tmp/routes.json
          jq -e '.[0].results[0] | .routes>0 and .surfaces>0' /tmp/routes.json

          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT
            SUM(CASE WHEN status='executor_missing' THEN 1 ELSE 0 END) missing,
            SUM(CASE WHEN status='stalled' THEN 1 ELSE 0 END) stalled
          FROM growth_execution_contract;" > /tmp/contract.json
          cat /tmp/contract.json
          jq -e '.[0].results[0] | .missing==0 and .stalled==0' /tmp/contract.json

          curl -fsS --retry 5 --retry-delay 3 https://trytoolscout.org/api/autonomous-growth-health > /tmp/health.json
          cat /tmp/health.json
          jq -e '.ok==true and .buildContract=="2026-09-20.1"' /tmp/health.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
