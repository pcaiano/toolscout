name: One Shot IndexNow Live Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect IndexNow live state
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT verification_state,last_http_status,last_error,retry_after_at,last_network_attempt_at,updated_at,COUNT(*) n FROM distribution_delivery_state WHERE surface_slug='indexnow' GROUP BY verification_state,last_http_status,last_error,retry_after_at,last_network_attempt_at,updated_at ORDER BY updated_at DESC LIMIT 20;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT event_type,status,detail,created_at FROM distribution_events WHERE event_type='indexnow_adaptive_delivery' ORDER BY created_at DESC LIMIT 10;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) backlog,MIN(created_at) oldest,SUM(CASE WHEN status='submitted' THEN 1 ELSE 0 END) submitted,SUM(CASE WHEN status='failed' AND error LIKE 'retryable:%' THEN 1 ELSE 0 END) retryable,SUM(CASE WHEN status='failed' AND error LIKE 'terminal:%' THEN 1 ELSE 0 END) terminal FROM distribution_submissions WHERE surface_slug='indexnow';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
