name: One Shot Failed Distribution Deep Dive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deep dive failed external execution
        run: |
          echo "=== FAILED HTTP JSON BY SURFACE ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,error,COUNT(*) n,SUM(attempts) attempts,MIN(created_at) first_created,MAX(last_attempt_at) last_attempt,MIN(action_url) action_url FROM distribution_submissions WHERE submission_type='http_json' AND (created_at>=datetime('now','-25 hours') OR last_attempt_at>=datetime('now','-25 hours')) GROUP BY surface_slug,status,error ORDER BY n DESC;"
          echo "=== ALL SUBMISSION COUNTS BY SURFACE ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,submission_type,status,COUNT(*) n,SUM(attempts) attempts FROM distribution_submissions GROUP BY surface_slug,submission_type,status ORDER BY n DESC;"
          echo "=== ROUTE ACTION DETAIL ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT a.route_id,a.surface_slug,a.route_type,a.execution_mode,a.status,a.attempts,a.last_result,a.next_action,a.updated_at,r.route_url FROM distribution_contact_route_actions a JOIN distribution_contact_routes r ON r.route_id=a.route_id ORDER BY a.status,a.surface_slug;"
          echo "=== TABLE INFO EDITORIAL QUEUE ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "PRAGMA table_info(distribution_editorial_queue);"
          echo "=== TABLE INFO GROWTH ACTIONS ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "PRAGMA table_info(growth_action_events);"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
