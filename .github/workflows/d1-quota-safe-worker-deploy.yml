name: D1 Quota Safe Worker Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-quota-safe-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  deploy-read-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate changed worker modules
        run: |
          node --check human-action-entry-worker.js
          node --check affiliate-coverage-cycle-worker.js
          node --check agent-protocol-worker.js

      - name: Apply canonical public navigation
        run: node scripts/unify-public-nav.mjs

      - name: Deploy Worker without D1 migrations
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
