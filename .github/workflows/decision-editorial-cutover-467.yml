name: ToolScout Editorial Cohort 3 Cutover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decision-editorial-cutover-467.yml'
permissions:
  contents: read
concurrency:
  group: toolscout-worker-production-recovery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify editorial, protocol and SEO canonicals
        run: |
          set -euo pipefail
          node --check agent-protocol-core-worker.js
          node --test tests/toolscout-v2-editorial-evidence-generators.test.mjs tests/toolscout-v2-agent-protocol.test.mjs tests/toolscout-v2-canonical-contract.test.mjs
          python3 -m unittest discover -s tests -p 'test_decision_quality.py'
          node scripts/validate-v2-preservation.mjs
      - name: Build production Worker artifact
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/toolscout-decision-467
      - name: Publish production Worker without database changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config wrangler.toml --latest
      - name: Verify original decision-editorial prose on live canonical paths
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5; do
            if curl -fsSL "https://trytoolscout.org/tools/activecampaign?release=467" | grep -Fq 'ActiveCampaign is worth shortlisting' && \
               curl -fsSL "https://trytoolscout.org/tools/typeform?release=467" | grep -Fq 'Typeform prioritizes' && \
               curl -fsSL "https://trytoolscout.org/asana-vs-clickup?release=467" | grep -Fq 'Asana and ClickUp both manage tasks'; then
              echo "Editorial cohort 3 deployed"
              exit 0
            fi
            sleep 6
          done
          exit 1
