name: ToolScout 2.0 Redesign Live Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-2-live-acceptance.yml'
      - 'scripts/verify-redesign-2-live.mjs'
      - 'scripts/verify-v2-live-smoke.mjs'

permissions:
  contents: read

concurrency:
  group: toolscout-redesign-2-live-acceptance
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ToolScout 2.0 live runtime and preservation
        run: node scripts/verify-v2-live-smoke.mjs
      - name: Verify ToolScout 2.0 public redesign live
        run: node scripts/verify-redesign-2-live.mjs
