name: Browser Confirmation Once

on:
  push:
    paths:
      - '.github/workflows/browser-confirmation-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight D1 funnel schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='funnel_events';" --json > /tmp/funnel-schema.json
          grep -q 'page_confirmed' /tmp/funnel-schema.json

      - name: Add global browser session confirmation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='visitor-accuracy-worker.js';
          let text=fs.readFileSync(file,'utf8');
          if(text.includes("toolscout_page_confirmed_v1")){
            console.log('Browser confirmation already present.');
            process.exit(0);
          }
          const marker="fetch('/api/visitor',{method:'POST'";
          const hits=text.split(marker).length-1;
          if(hits!==1)throw new Error(`Expected one visitor fetch marker, found ${hits}`);
          const insertion="var sessionKey='toolscout_session_v2',sessionTtl=30*60*1000,sessionSaved=null;try{sessionSaved=JSON.parse(localStorage.getItem(sessionKey)||'null')}catch(e){}var sessionValid=sessionSaved&&typeof sessionSaved.id==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(sessionSaved.id)&&now-Number(sessionSaved.lastSeen||0)<sessionTtl;var sessionId=sessionValid?sessionSaved.id:crypto.randomUUID();try{localStorage.setItem(sessionKey,JSON.stringify({id:sessionId,lastSeen:now}))}catch(e){}try{document.cookie='toolscout_session='+encodeURIComponent(sessionId)+'; Max-Age=1800; Path=/; SameSite=Lax; Secure'}catch(e){}function postFunnel(type){return fetch('/api/events',{method:'POST',credentials:'same-origin',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({event_id:'evt_'+crypto.randomUUID(),session_id:sessionId,event_type:type,path:location.pathname.slice(0,200)||'/',source:source,referrer_host:refHost})})}function confirmBrowserSession(){var startedKey='toolscout_started_'+sessionId,started=false;try{started=sessionStorage.getItem(startedKey)==='1'}catch(e){}if(!started){try{sessionStorage.setItem(startedKey,'1')}catch(e){}postFunnel('session_started').catch(function(){})}var confirmedKey='toolscout_page_confirmed_v1',confirmed=false;try{confirmed=localStorage.getItem(confirmedKey)===sessionId}catch(e){}if(!confirmed){postFunnel('page_confirmed').then(function(r){if(r&&r.ok){try{localStorage.setItem(confirmedKey,sessionId)}catch(e){}}}).catch(function(){})}}function activateBrowserSession(){if(document.visibilityState==='visible'){requestAnimationFrame(function(){setTimeout(confirmBrowserSession,0)})}else{var onVisible=function(){if(document.visibilityState==='visible'){document.removeEventListener('visibilitychange',onVisible);requestAnimationFrame(confirmBrowserSession)}};document.addEventListener('visibilitychange',onVisible)}}if(document.prerendering){document.addEventListener('prerenderingchange',activateBrowserSession,{once:true})}else activateBrowserSession();";
          text=text.replace(marker,insertion+marker);
          fs.writeFileSync(file,text);
          NODE
          node --check visitor-accuracy-worker.js
          grep -q "toolscout_page_confirmed_v1" visitor-accuracy-worker.js
          grep -q "postFunnel('page_confirmed')" visitor-accuracy-worker.js

      - name: Guard Command Center freeze
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          test "$changed" = "visitor-accuracy-worker.js"
          if printf '%s\n' "$changed" | grep -E '(^|/)(command-center-|analytics)'; then
            echo "Command Center change detected. Refusing to continue."
            exit 1
          fi

      - name: Commit tracking repair
        run: |
          set -euo pipefail
          if ! git diff --quiet -- visitor-accuracy-worker.js; then
            git config user.name "toolscout-tracking-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add visitor-accuracy-worker.js
            git commit -m "Confirm browser sessions before outbound"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify public tracking injection
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'
          for url in \
            https://trytoolscout.org/ \
            https://trytoolscout.org/best-workflow-automation-tools \
            https://trytoolscout.org/make-vs-zapier \
            https://trytoolscout.org/tools/make; do
            body=$(curl -fsSL -A "$UA" "$url")
            printf '%s' "$body" | grep -q 'data-toolscout-visitor-tracker="1"'
            printf '%s' "$body" | grep -q 'page_confirmed'
            printf '%s' "$body" | grep -q 'toolscout_session_v2'
          done
