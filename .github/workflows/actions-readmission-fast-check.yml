name: ToolScout Actions Readmission Fast Check

on:
  push:
    branches:
      - actions-readmission-seo-20261004
    paths:
      - '.github/workflows/actions-readmission-fast-check.yml'
      - 'scripts/validate-seo-pages.mjs'
      - 'tests/seo-extensionless-tool-link.test.mjs'
      - 'scripts/validate-editorial-trust.mjs'
      - 'tests/editorial-trust-extensionless-link.test.mjs'
      - 'scripts/validate-public-surface.mjs'
      - 'tests/unbounce-partnerstack-tracking.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate readmission guards
        run: |
          node --check scripts/validate-actions-resume-safety.mjs
          node --check scripts/validate-growth-spend-policy.mjs
          node scripts/validate-actions-resume-safety.mjs
          node scripts/validate-growth-spend-policy.mjs
      - name: Validate updated generators
        run: |
          node --check scripts/generate-comparisons.mjs
          node --check scripts/generate-competitive-gap-profiles.mjs
          node scripts/generate-comparisons.mjs
      - name: Run focused regression tests
        run: |
          node --test \
            tests/comparison-editorial-contract.test.mjs \
            tests/competitive-gap-catalog-parity.test.mjs \
            tests/growth-spend-policy.test.mjs \
            tests/seo-extensionless-tool-link.test.mjs \
            tests/editorial-trust-extensionless-link.test.mjs \
            tests/unbounce-partnerstack-tracking.test.mjs
      - name: Validate generated SEO link contract
        run: |
          node scripts/generate-seo-pages.mjs
          node scripts/validate-seo-pages.mjs
      - name: Validate machine readability after comparison regeneration
        run: node scripts/validate-machine-readability.mjs
      - name: Validate editorial trust link contract
        run: |
          node scripts/generate-software-trends-index.mjs
          node scripts/validate-editorial-trust.mjs
      - name: Validate remaining public/commercial gates
        run: |
          node scripts/validate-public-surface.mjs
          node scripts/validate-commercial-indexability.mjs
