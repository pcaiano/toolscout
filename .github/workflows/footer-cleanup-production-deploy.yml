name: ToolScout Footer Cleanup Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/footer-cleanup-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-footer-cleanup-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Deploy footer cleanup production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate footer cleanup release
        run: |
          set -euo pipefail
          node --check social-profiles.js
          node --test tests/toolscout-v2-public-redesign.test.mjs tests/toolscout-v2-public-plane.test.mjs

      - name: Deploy current main to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify footer cleanup live
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 3 -H 'Cache-Control: no-cache' 'https://trytoolscout.org/?footer_cleanup=3abeca2f' -o /tmp/home.html
          curl -fsS --retry 6 --retry-delay 3 -H 'Cache-Control: no-cache' 'https://trytoolscout.org/tools.html?footer_cleanup=3abeca2f' -o /tmp/tools.html
          grep -q 'How recommendations work' /tmp/home.html
          grep -q 'Affiliate disclosure' /tmp/home.html
          if grep -q 'ToolScout elsewhere' /tmp/home.html; then echo 'Dead social footer still live on homepage'; exit 1; fi
          if grep -q 'data-toolscout-social-footer' /tmp/home.html; then echo 'Social footer marker still live on homepage'; exit 1; fi
          if grep -q 'ToolScout elsewhere' /tmp/tools.html; then echo 'Dead social footer still live on tools'; exit 1; fi
          if grep -q 'data-toolscout-social-footer' /tmp/tools.html; then echo 'Social footer marker still live on tools'; exit 1; fi
