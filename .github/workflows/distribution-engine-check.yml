name: Distribution Engine Check

on:
  push:
    branches: [main]
    paths:
      - 'distribution-*-worker.js'
      - 'data/distribution-radar-seeds.json'
      - 'data/distribution-discovery-sources.json'
      - 'data/distribution-submission-adapters.json'
      - 'data/distribution-publishing-profile.json'
      - 'embed/**'
      - 'migrations/0018_distribution_engine.sql'
      - 'migrations/0019_vendor_amplification.sql'
      - 'migrations/0020_vendor_contact_discovery.sql'
      - 'migrations/0021_public_vendor_dispatch.sql'
      - 'migrations/0022_distribution_learning.sql'
      - 'migrations/0023_distribution_submission.sql'
      - 'migrations/0024_distribution_orchestration.sql'
      - 'migrations/0024_normalize_distribution_submission_states.sql'
      - 'migrations/0025_normalize_manual_distribution_opportunities.sql'
      - 'migrations/0026_prioritize_distribution_research_surfaces.sql'
      - 'migrations/0027_distribution_embeds.sql'
      - 'migrations/0028_promote_listed_startups.sql'
      - 'migrations/0029_upsert_listed_startups.sql'
      - 'migrations/0030_upsert_authenticated_distribution_surfaces.sql'
      - 'migrations/0031_correct_distribution_setup_states.sql'
      - 'migrations/0032_block_indietool_paid_api.sql'
      - 'migrations/0033_normalize_distribution_research_rows.sql'
      - 'migrations/0034_normalize_distribution_setup_rows.sql'
      - 'migrations/0035_prune_distribution_discovery_false_positives.sql'
      - 'migrations/0036_classify_verified_distribution_routes.sql'
      - 'migrations/0037_sync_verified_human_distribution_routes.sql'
      - 'migrations/0038_close_distribution_research_backlog.sql'
      - 'migrations/0039_add_agenttool_distribution.sql'
      - 'wrangler.toml'
      - '.github/workflows/distribution-engine-check.yml'
  pull_request:
    paths:
      - 'distribution-*-worker.js'
      - 'data/distribution-radar-seeds.json'
      - 'data/distribution-discovery-sources.json'
      - 'data/distribution-submission-adapters.json'
      - 'data/distribution-publishing-profile.json'
      - 'embed/**'
      - 'migrations/0018_distribution_engine.sql'
      - 'migrations/0019_vendor_amplification.sql'
      - 'migrations/0020_vendor_contact_discovery.sql'
      - 'migrations/0021_public_vendor_dispatch.sql'
      - 'migrations/0022_distribution_learning.sql'
      - 'migrations/0023_distribution_submission.sql'
      - 'migrations/0024_distribution_orchestration.sql'
      - 'migrations/0024_normalize_distribution_submission_states.sql'
      - 'migrations/0025_normalize_manual_distribution_opportunities.sql'
      - 'migrations/0026_prioritize_distribution_research_surfaces.sql'
      - 'migrations/0027_distribution_embeds.sql'
      - 'migrations/0028_promote_listed_startups.sql'
      - 'migrations/0029_upsert_listed_startups.sql'
      - 'migrations/0030_upsert_authenticated_distribution_surfaces.sql'
      - 'migrations/0031_correct_distribution_setup_states.sql'
      - 'migrations/0032_block_indietool_paid_api.sql'
      - 'migrations/0033_normalize_distribution_research_rows.sql'
      - 'migrations/0034_normalize_distribution_setup_rows.sql'
      - 'migrations/0035_prune_distribution_discovery_false_positives.sql'
      - 'migrations/0036_classify_verified_distribution_routes.sql'
      - 'migrations/0037_sync_verified_human_distribution_routes.sql'
      - 'migrations/0038_close_distribution_research_backlog.sql'
      - 'migrations/0039_add_agenttool_distribution.sql'
      - 'wrangler.toml'
      - '.github/workflows/distribution-engine-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate JavaScript syntax
        run: |
          node --check distribution-engine-worker.js
          node --check distribution-radar-worker.js
          node --check distribution-vendor-worker.js
          node --check distribution-contact-worker.js
          node --check distribution-sender-worker.js
          node --check distribution-learning-worker.js
          node --check distribution-discovery-worker.js
          node --check distribution-submission-worker.js
          node --check distribution-orchestrator-worker.js
          node --check distribution-command-worker.js
          node --check distribution-embed-worker.js
          node --check embed/toolscout-pick.js
          node --check embed/toolscout-finder.js
          node --check embed/toolscout-compare.js
      - name: Validate worker entrypoint, migrations and publishing profile
        run: |
          grep -q 'main = "distribution-embed-worker.js"' wrangler.toml
          test -s migrations/0018_distribution_engine.sql
          test -s migrations/0019_vendor_amplification.sql
          test -s migrations/0020_vendor_contact_discovery.sql
          test -s migrations/0021_public_vendor_dispatch.sql
          test -s migrations/0022_distribution_learning.sql
          test -s migrations/0023_distribution_submission.sql
          test -s migrations/0024_distribution_orchestration.sql
          test -s migrations/0027_distribution_embeds.sql
          test -s migrations/0028_promote_listed_startups.sql
          test -s migrations/0029_upsert_listed_startups.sql
          test -s migrations/0030_upsert_authenticated_distribution_surfaces.sql
          test -s migrations/0031_correct_distribution_setup_states.sql
          test -s migrations/0032_block_indietool_paid_api.sql
          test -s migrations/0033_normalize_distribution_research_rows.sql
          test -s migrations/0034_normalize_distribution_setup_rows.sql
          test -s migrations/0035_prune_distribution_discovery_false_positives.sql
          test -s migrations/0036_classify_verified_distribution_routes.sql
          test -s migrations/0037_sync_verified_human_distribution_routes.sql
          test -s migrations/0038_close_distribution_research_backlog.sql
          test -s migrations/0039_add_agenttool_distribution.sql
          node -e "const d=require('./data/distribution-publishing-profile.json'); if(d.product?.website!=='https://trytoolscout.org/'||d.product?.name!=='ToolScout'||d.policy?.automatic_paid_distribution!==false||d.policy?.automatic_account_creation!==false||d.policy?.automatic_reciprocal_badges!==false) process.exit(1)"
          grep -q 'performance_score' migrations/0022_distribution_learning.sql
          grep -q 'CREATE TABLE IF NOT EXISTS distribution_submissions' migrations/0023_distribution_submission.sql
          grep -q 'CREATE TABLE IF NOT EXISTS distribution_editorial_queue' migrations/0024_distribution_orchestration.sql
          grep -q 'CREATE TABLE IF NOT EXISTS distribution_embed_clicks' migrations/0027_distribution_embeds.sql
          grep -q "surface_slug='listed-startups'" migrations/0028_promote_listed_startups.sql
          grep -Fq "ON CONFLICT(surface_slug) DO UPDATE SET" migrations/0029_upsert_listed_startups.sql
          grep -Fq "'tinylaunch','TinyLaunch'" migrations/0030_upsert_authenticated_distribution_surfaces.sql
          grep -Fq "'indietool','IndieTool'" migrations/0030_upsert_authenticated_distribution_surfaces.sql
          grep -Fq "status='needs_info'" migrations/0031_correct_distribution_setup_states.sql
          grep -Fq "surface_slug='tinylaunch'" migrations/0031_correct_distribution_setup_states.sql
          grep -Fq "surface_slug='indietool'" migrations/0031_correct_distribution_setup_states.sql
          grep -Fq "status='policy_blocked'" migrations/0032_block_indietool_paid_api.sql
          grep -Fq "zero_cost_policy" migrations/0032_block_indietool_paid_api.sql
          grep -Fq "status='research_required'" migrations/0033_normalize_distribution_research_rows.sql
          grep -Fq "status='setup_required'" migrations/0034_normalize_distribution_setup_rows.sql
          grep -Fq "o.status='needs_info'" migrations/0034_normalize_distribution_setup_rows.sql
          grep -Fq "discovery_false_positive_or_duplicate" migrations/0035_prune_distribution_discovery_false_positives.sql
          grep -Fq "reciprocal_badge_policy" migrations/0036_classify_verified_distribution_routes.sql
          grep -Fq "account_creation_required" migrations/0036_classify_verified_distribution_routes.sql
          grep -Fq "manual_or_editorial_route" migrations/0037_sync_verified_human_distribution_routes.sql
          grep -Fq "manual_submission_route" migrations/0038_close_distribution_research_backlog.sql
          grep -Fq "reciprocal_badge_policy" migrations/0038_close_distribution_research_backlog.sql
          grep -Fq "'agenttool-sh','agenttool.sh'" migrations/0039_add_agenttool_distribution.sql
      - name: Validate radar, discovery and syndication
        run: |
          node -e "const d=require('./data/distribution-radar-seeds.json'); if(!Array.isArray(d.sources)||d.sources.length<3) process.exit(1); const g=d.sources.find(x=>x.slug==='agenttool-sh'); if(!g||g.status!=='ready_to_submit'||g.human_required!==false) process.exit(1); const i=d.sources.find(x=>x.slug==='indietool'); if(!i||i.status!=='policy_blocked') process.exit(1); for(const s of ['the-rundown-ai-supertools','launch-llama','best-of-ai','nextool-ai','stremit']){const x=d.sources.find(v=>v.slug===s); if(!x||x.status!=='human_action_required'||x.human_required!==true) process.exit(1)}"
          node -e "const d=require('./data/distribution-discovery-sources.json'); if(!Array.isArray(d.sources)||d.sources.length<2) process.exit(1)"
          grep -Fq '/api/distribution/feed.json' distribution-radar-worker.js
          grep -Fq '/api/distribution/feed.xml' distribution-radar-worker.js
          grep -Fq '/api/distribution/discovery/refresh' distribution-discovery-worker.js
          grep -Fq 'external_discovery_refresh' distribution-discovery-worker.js
          grep -Fq 'canonical_hosts' distribution-discovery-worker.js
          grep -Fq 'exclude_source_hosts' distribution-discovery-worker.js
          grep -Fq 'host_status_overrides' distribution-discovery-worker.js
          node -e "const d=require('./data/distribution-discovery-sources.json'); if(d.guardrails?.exclude_source_hosts!==true||d.guardrails?.canonical_hosts?.['producthunt.com']!=='product-hunt'||d.guardrails?.canonical_hosts?.['tinylaun.ch']!=='tinylaunch'||d.guardrails?.canonical_hosts?.['peerpush.com']!=='peerpush-net'||!d.guardrails?.exclude_hosts?.includes('claude.ai')||d.guardrails?.host_status_overrides?.['dododirectory.com']?.status!=='policy_blocked'||d.guardrails?.host_status_overrides?.['startupfa.me']?.status!=='human_action_required'||d.guardrails?.host_status_overrides?.['peerpush.com']?.status!=='human_action_required'||d.guardrails?.host_status_overrides?.['turbo0.com']?.status!=='policy_blocked') process.exit(1)"
      - name: Validate submission guardrails
        run: |
          node -e "const d=require('./data/distribution-submission-adapters.json'); if(d.policy?.automatic_requires_allowlist!==true) process.exit(1); if(Number(d.policy?.max_automatic_per_run)>3) process.exit(1); const i=d.adapters.find(x=>x.surface_slug==='indietool'); if(!i||i.requires_payment!==true||i.setup_state!=='policy_blocked'||i.enabled!==false) process.exit(1)"
          grep -Fq '/api/distribution/submissions/package' distribution-submission-worker.js
          grep -Fq '/api/distribution/submissions/execute' distribution-submission-worker.js
          grep -Fq 'adapter_not_verified' distribution-submission-worker.js
          grep -Fq 'allow_automatic' distribution-submission-worker.js
          grep -Fq 'packageAutomaticProtocols' distribution-submission-worker.js
          grep -Fq 'indexNowCoolingDown' distribution-submission-worker.js
          grep -Fq 'cooldownSurfaces' distribution-submission-worker.js
          grep -Fq 'automatic protocol surface(s) deferred by rate-limit cooldown' distribution-submission-worker.js
          grep -Fq "if(automatic&&adapter?.payload_kind==='indexnow')continue" distribution-submission-worker.js
          grep -Fq "'http_json'" distribution-submission-worker.js
          grep -Fq 'listed_startups_listing' distribution-submission-worker.js
          grep -Fq "WHERE status='ready_to_submit'" distribution-submission-worker.js
          grep -Fq "'research_required'" distribution-submission-worker.js
          grep -Fq "'setup_required'" distribution-submission-worker.js
          grep -Fq "payload_kind==='agenttool_tool'" distribution-submission-worker.js
          grep -Fq "asset_scope==='product'" distribution-submission-worker.js
          grep -Fq 'indexCooling?max:max-indexRows.length' distribution-submission-worker.js
          node -e "const d=require('./data/distribution-submission-adapters.json'); const a=d.adapters.find(x=>x.surface_slug==='listed-startups'); if(!a||a.endpoint!=='https://listedstartups.com/api/listings'||a.validation_endpoint!=='https://listedstartups.com/api/listings/validate'||a.auth_env!=='LISTED_STARTUPS_TOKEN'||a.validated_category!=='Software'||a.enabled!==false||a.allow_automatic!==false) process.exit(1); const g=d.adapters.find(x=>x.surface_slug==='agenttool-sh'); if(!g||g.endpoint!=='https://agenttool.sh/api/tools/submit'||g.payload_kind!=='agenttool_tool'||g.asset_scope!=='product'||g.enabled!==true||g.allow_automatic!==true||g.requires_payment!==false) process.exit(1)"
      - name: Validate event-driven orchestration and community guardrails
        run: |
          grep -Fq '/api/distribution/orchestrate' distribution-orchestrator-worker.js
          grep -Fq '/api/distribution/orchestrate/scan' distribution-orchestrator-worker.js
          grep -Fq '/api/distribution/editorial-queue' distribution-orchestrator-worker.js
          grep -Fq 'human_required' distribution-orchestrator-worker.js
          grep -Fq 'Hacker News / Show HN' distribution-orchestrator-worker.js
          grep -Fq 'Indie Hackers' distribution-orchestrator-worker.js
          grep -Fq 'Relevant Reddit communities' distribution-orchestrator-worker.js
      - name: Validate embedded distribution
        run: |
          grep -Fq '/embed/toolscout.js' distribution-embed-worker.js
          grep -Fq '/embed/badge.svg' distribution-embed-worker.js
          grep -Fq '/api/distribution/feed.json' distribution-embed-worker.js
          grep -Fq '/distribution/feed.xml' distribution-embed-worker.js
          grep -Fq '/.well-known/toolscout-distribution.json' distribution-embed-worker.js
          grep -Fq 'embedded_distribution' distribution-embed-worker.js
          grep -Fq "utm_medium:'distribution'" embed/toolscout-pick.js
          grep -Fq "utm_medium:'distribution'" embed/toolscout-finder.js
          grep -Fq "utm_medium:'distribution'" embed/toolscout-compare.js
          grep -Fq 'navigator.sendBeacon' embed/toolscout-pick.js
          grep -Fq 'navigator.sendBeacon' embed/toolscout-finder.js
          grep -Fq 'navigator.sendBeacon' embed/toolscout-compare.js
      - name: Validate final command center observability
        run: |
          grep -Fq 'distributionOperations' distribution-command-worker.js
          grep -Fq 'Distribution Operations' distribution-command-worker.js
          grep -Fq 'distribution_submissions' distribution-command-worker.js
          grep -Fq 'distribution_editorial_queue' distribution-command-worker.js
          grep -Fq 'distribution_asset_state' distribution-command-worker.js
          grep -Fq 'performance_score' distribution-command-worker.js
          grep -Fq 'Research required' distribution-command-worker.js
          grep -Fq 'researchRequired' distribution-command-worker.js
      - name: Validate distribution attribution and learning
        run: |
          grep -Fq '/api/distribution/embed-event' distribution-learning-worker.js
          grep -Fq '/api/distribution/learning/refresh' distribution-learning-worker.js
          grep -Fq "classification='likely-human'" distribution-learning-worker.js
          grep -Fq 'revenue_ledger' distribution-learning-worker.js
      - name: Validate sender guardrails
        run: |
          grep -Fq '/api/distribution/vendor-amplification/public-candidates' distribution-sender-worker.js
          grep -Fq '/api/distribution/vendor-amplification/public-status' distribution-sender-worker.js
          grep -Fq 'public_role_email' distribution-contact-worker.js
          grep -Fq 'needs_contact_fallback' distribution-contact-worker.js
          grep -Fq '"/api/distribution/*"' wrangler.toml
