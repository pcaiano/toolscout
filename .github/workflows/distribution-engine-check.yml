name: Distribution Engine Check

on:
  pull_request:
    paths:
      - 'distribution-engine-worker.js'
      - 'distribution-radar-worker.js'
      - 'distribution-vendor-worker.js'
      - 'distribution-contact-worker.js'
      - 'distribution-sender-worker.js'
      - 'data/distribution-radar-seeds.json'
      - 'embed/**'
      - 'migrations/0018_distribution_engine.sql'
      - 'migrations/0019_vendor_amplification.sql'
      - 'migrations/0020_vendor_contact_discovery.sql'
      - 'wrangler.toml'
      - '.github/workflows/distribution-engine-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check distribution-engine-worker.js
          node --check distribution-radar-worker.js
          node --check distribution-vendor-worker.js
          node --check distribution-contact-worker.js
          node --check distribution-sender-worker.js
          node --check embed/toolscout-pick.js
          node --check embed/toolscout-finder.js
          node --check embed/toolscout-compare.js
      - name: Validate worker entrypoint and migrations
        run: |
          grep -q 'main = "distribution-sender-worker.js"' wrangler.toml
          test -s migrations/0018_distribution_engine.sql
          test -s migrations/0019_vendor_amplification.sql
          test -s migrations/0020_vendor_contact_discovery.sql
          grep -q 'CREATE TABLE IF NOT EXISTS distribution_events' migrations/0018_distribution_engine.sql
          grep -q 'CREATE TABLE IF NOT EXISTS distribution_vendor_amplification' migrations/0019_vendor_amplification.sql
          grep -q 'contact_source_url' migrations/0020_vendor_contact_discovery.sql
      - name: Validate radar seed data
        run: |
          node -e "const d=require('./data/distribution-radar-seeds.json'); if(!Array.isArray(d.sources)||d.sources.length<3) process.exit(1); for(const s of d.sources){if(!s.slug||!s.name||!s.type)process.exit(1)}"
      - name: Validate distribution attribution convention
        run: |
          grep -q "utm_medium:'distribution'" embed/toolscout-pick.js
          grep -q "utm_medium:'distribution'" embed/toolscout-finder.js
          grep -q "utm_medium:'distribution'" embed/toolscout-compare.js
      - name: Validate distribution routes and sender guardrails
        run: |
          grep -Fq '/api/distribution/feed.json' distribution-radar-worker.js
          grep -Fq '/api/distribution/feed.xml' distribution-radar-worker.js
          grep -Fq '/api/distribution/vendor-amplification' distribution-vendor-worker.js
          grep -Fq '/api/distribution/vendor-amplification/ready' distribution-sender-worker.js
          grep -Fq 'public_role_email' distribution-contact-worker.js
          grep -Fq 'needs_contact_fallback' distribution-contact-worker.js
          grep -Fq "status='sending'" distribution-sender-worker.js
          grep -Fq -- "-24 hours" distribution-sender-worker.js
          grep -Fq 'MAKE_TOKEN_SHA256' distribution-sender-worker.js
          grep -Fq '"/api/distribution/*"' wrangler.toml
