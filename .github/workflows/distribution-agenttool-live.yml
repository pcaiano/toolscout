name: Distribution AgentTool Live Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/distribution-agenttool-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply latest D1 migrations
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Assert IndexNow is still in cooldown
        run: |
          set -euo pipefail
          OUT="$(npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT CASE WHEN COUNT(*)>0 THEN 'SAFE_COOLDOWN' ELSE 'UNSAFE_NO_COOLDOWN' END AS state FROM distribution_submissions WHERE surface_slug='indexnow' AND error='retryable:HTTP 429' AND last_attempt_at>datetime('now','-6 hours');")"
          echo "$OUT"
          echo "$OUT" | grep -q 'SAFE_COOLDOWN'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Prove AgentTool opportunity exists
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,human_required,action_url FROM distribution_opportunities WHERE surface_slug='agenttool-sh';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Execute one guarded hourly Distribution run
        run: |
          set -euo pipefail
          npx wrangler dev --remote --test-scheduled --port 8787 --config wrangler.toml > /tmp/wrangler-agenttool.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat /tmp/wrangler-agenttool.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8787/' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8787/__scheduled?cron=15%20*%20*%20*%20*'
          sleep 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify AgentTool submitted and IndexNow untouched
        run: |
          echo '=== AGENTTOOL ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,asset_url,status,attempts,submitted_at,response_url,error FROM distribution_submissions WHERE surface_slug='agenttool-sh' ORDER BY updated_at DESC LIMIT 5;"
          echo '=== INDEXNOW COUNTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,COUNT(*) count,MAX(last_attempt_at) last_attempt_at FROM distribution_submissions WHERE surface_slug='indexnow' GROUP BY status ORDER BY status;"
          echo '=== LATEST EXECUTION EVENTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT event_type,status,detail,created_at FROM distribution_events WHERE event_type IN ('submission_packaging_refresh','submission_execution_refresh') ORDER BY created_at DESC LIMIT 4;"
          echo '=== AGENTTOOL PUBLIC SEARCH ==='
          curl -fsS 'https://agenttool.sh/api/search?q=ToolScout' || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
