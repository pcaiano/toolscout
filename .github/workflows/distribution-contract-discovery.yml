name: Distribution Contract Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/distribution-contract-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-listed-startups:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Listed Startups listing contract and dry-run ToolScout
        run: |
          set -euo pipefail
          curl -fsSL https://listedstartups.com/openapi.json -o /tmp/openapi.json
          echo '=== LISTING SUBMISSION SCHEMA ==='
          jq '.components.schemas.ListingSubmission' /tmp/openapi.json
          echo '=== RELATED SCHEMAS ==='
          jq '{ReviewAuthor:.components.schemas.ReviewAuthor,AgentAttribution:.components.schemas.AgentAttribution}' /tmp/openapi.json
          echo '=== CATEGORY/LISTING GET PATHS ==='
          jq -r '.paths | to_entries[] | select(.key|test("categor|listings";"i")) | .key as $p | .value | to_entries[] | [$p,.key,(.value.operationId // ""),(.value.summary // "")] | @tsv' /tmp/openapi.json
          echo '=== ENUMS REFERENCED BY LISTING ==='
          jq '.components.schemas | to_entries[] | select(.key|test("Categor|Listing|Stage|Pricing";"i")) | {key:.key,value:.value}' /tmp/openapi.json
          echo '=== TRY DOCUMENTED CATEGORY CANDIDATES ==='
          for cat in "Software" "SaaS" "Developer Tools" "Productivity" "AI" "Business Software"; do
            jq -n --arg cat "$cat" '{name:"ToolScout",slug:"toolscout",tagline:"Find the right software for the job — without the noise.",description:"ToolScout is an independent software discovery and recommendation platform that turns a buyer workflow, persona and constraints into a focused shortlist of relevant tools, with transparent comparisons and no pay-to-rank recommendations.",url:"https://trytoolscout.org/",categories:[$cat]}' >/tmp/payload.json
            code=$(curl -sS -o /tmp/validate.json -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/payload.json https://listedstartups.com/api/listings/validate)
            echo "CATEGORY=$cat HTTP=$code"
            cat /tmp/validate.json | jq -c .
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "$cat" >/tmp/valid-category
              cp /tmp/payload.json /tmp/valid-payload.json
              break
            fi
          done
          test -s /tmp/valid-category
          echo '=== VALID CATEGORY ==='
          cat /tmp/valid-category
          echo '=== VALID PAYLOAD ==='
          cat /tmp/valid-payload.json | jq .
