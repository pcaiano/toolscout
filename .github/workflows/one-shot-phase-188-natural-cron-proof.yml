name: One Shot Phase 188 Natural Cron Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-188-natural-cron-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align with next Cloudflare autonomous distribution cron
        run: |
          set -euo pipefail
          node - <<'NODE'
          const now=new Date();
          const slots=[4,19,34,49];
          let target=null;
          for(let hourOffset=0;hourOffset<2&&!target;hourOffset++){
            const base=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),now.getUTCHours()+hourOffset,0,0));
            for(const minute of slots){
              const t=new Date(base);t.setUTCMinutes(minute,0,0);
              if(t.getTime()>now.getTime()+15000){target=t;break}
            }
          }
          const seconds=Math.max(0,Math.ceil((target.getTime()-Date.now())/1000)+75);
          require('fs').writeFileSync('/tmp/sleep_seconds',String(seconds));
          console.log(JSON.stringify({now:now.toISOString(),target:target.toISOString(),proofAfterSeconds:seconds}));
          NODE
          sleep "$(cat /tmp/sleep_seconds)"

      - name: Inspect AgentTool after natural autonomous cycle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT 'ADAPTER' kind,surface_slug,endpoint,method,content_type,confidence,policy_state,verification_source,verification_endpoint,public_url,updated_at
          FROM distribution_auto_adapters WHERE surface_slug='agenttool-sh';
          SELECT 'OPPORTUNITY' kind,surface_slug,status,human_required,action_url,next_action,last_checked_at,updated_at
          FROM distribution_opportunities WHERE surface_slug='agenttool-sh';
          SELECT 'SUBMISSION' kind,submission_id,status,attempts,last_attempt_at,submitted_at,response_url,error,updated_at
          FROM distribution_submissions WHERE surface_slug='agenttool-sh' ORDER BY created_at DESC LIMIT 5;
          SELECT 'QUALIFICATION' kind,result,detail,created_at
          FROM distribution_qualification_events WHERE surface_slug='agenttool-sh' ORDER BY created_at DESC LIMIT 8;
          SELECT 'ENGINE_RUN' kind,engine,mission,status,started_at,completed_at,detail
          FROM engine_runs WHERE engine='distribution' AND mission='autonomous_cycle' ORDER BY started_at DESC LIMIT 3;
          "

      - name: Inspect authority and strict-human truth after cycle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT
            (SELECT COUNT(*) FROM distribution_submissions WHERE surface_slug<>'indexnow' AND attempts>0 AND COALESCE(last_attempt_at,created_at)>=datetime('now','-24 hours'))
            +(SELECT COUNT(*) FROM distribution_events WHERE event_type IN ('vendor_outreach_sent','publisher_network_outreach_sent') AND created_at>=datetime('now','-24 hours')) attempts24,
            (SELECT COUNT(*) FROM growth_execution_contract WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface') AND status IN ('pending','claimed','attempted','stalled')) runnable,
            (SELECT COUNT(*) FROM growth_execution_contract WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface') AND status='deferred') deferred,
            (SELECT COUNT(*) FROM traffic_human_evidence WHERE first_evidence_at>=datetime('now','-24 hours')) strict_humans_24h;
          "
