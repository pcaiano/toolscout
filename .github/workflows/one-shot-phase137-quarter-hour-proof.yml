name: One Shot Phase 152 Post Proof Cycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase137-quarter-hour-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cross next quarter-hour cycle
        run: sleep 180
      - name: Prove authority proof consumption
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo TARGET
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,subject_key,status,last_result,claimed_at,attempted_at,verified_at,updated_at
          FROM growth_execution_contract
          WHERE task_id='opportunity|surface:peerlist-launchpad|verify_backlink_acquisition';
          "
          echo EXECUTION
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,substr(evidence_json,1,6000) evidence_json
          FROM engine_runs
          WHERE engine='growth' AND mission='execution_contract'
            AND started_at>=datetime('now','-20 minutes')
          ORDER BY started_at DESC LIMIT 3;
          "
          echo PROOF_EVENTS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT event_type,status,detail,created_at
          FROM growth_execution_events
          WHERE task_id='opportunity|surface:peerlist-launchpad|verify_backlink_acquisition'
          ORDER BY created_at DESC LIMIT 10;
          "
