name: One Shot Phase 144 Authority Runnable Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase137-quarter-hour-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current runnable authority truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo RUNNABLE
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,subject_type,subject_key,priority_score,status,last_result,claimed_at,attempted_at,updated_at
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface')
            AND status IN ('pending','claimed','attempted','stalled')
          ORDER BY priority_score DESC,updated_at ASC LIMIT 30;
          "
          echo RECENT_EXECUTION
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,substr(evidence_json,1,4200) evidence_json
          FROM engine_runs
          WHERE ((engine='growth' AND mission='execution_contract') OR (engine='distribution' AND mission='authority_execution_recovery'))
          ORDER BY started_at DESC LIMIT 12;
          "
          echo STREMIT
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,status,last_result,updated_at
          FROM growth_execution_contract
          WHERE subject_key='stremit'
          ORDER BY updated_at DESC;
          "
