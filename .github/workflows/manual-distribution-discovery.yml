name: One Shot Phase 251 Discovery To Execution Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-distribution-discovery.yml'

permissions:
  contents: read
  id-token: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Get ToolScout execution OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=toolscout-execution")"
          token="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(1); process.stdout.write(x.value)" "$response")"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Materialize growth opportunities from replenished discovery supply
        env:
          TOOLSCOUT_EXECUTION_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(curl --max-time 180 -sS -o /tmp/phase251-coordinate.json -w '%{http_code}' \
            -X POST 'https://trytoolscout.org/api/growth/opportunities/refresh' \
            -H "Authorization: Bearer $TOOLSCOUT_EXECUTION_TOKEN" \
            -H 'Content-Type: application/json')"
          cat /tmp/phase251-coordinate.json
          test "$http_code" -ge 200
          test "$http_code" -lt 300

      - name: Prove adaptive autonomous execution has real supply
        env:
          TOOLSCOUT_EXECUTION_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            http_code="$(curl --max-time 360 -sS -o "/tmp/phase251-execution-${attempt}.json" -w '%{http_code}' \
              -X POST 'https://trytoolscout.org/api/growth/execution/dispatch' \
              -H "Authorization: Bearer $TOOLSCOUT_EXECUTION_TOKEN" \
              -H 'Content-Type: application/json')"
            cat "/tmp/phase251-execution-${attempt}.json"
            test "$http_code" -ge 200
            test "$http_code" -lt 300

            if ATTEMPT="$attempt" node - <<'NODE'
          const fs=require('fs');
          const attempt=process.env.ATTEMPT;
          const x=JSON.parse(fs.readFileSync('/tmp/phase251-execution-'+attempt+'.json','utf8'));
          if(x?.ok!==true)process.exit(1);
          if(x?.boundedExecution?.adaptiveAuthorityBatch!==true)process.exit(1);
          if(Number(x?.boundedExecution?.autonomousBatchLimit||0)!==4)process.exit(1);
          const a=x?.results?.distribution_autonomous;
          if(!a)process.exit(1);
          const claimed=Number(a.claimed||0);
          const processed=Number(a.processed??claimed);
          if(claimed<2||processed<2)process.exit(1);
          fs.writeFileSync('/tmp/phase251-pipeline-success.json',JSON.stringify({
            ok:true,
            attempt:Number(attempt),
            selectedInternalLane:x?.boundedExecution?.selectedInternalLane||null,
            senderExhausted:x?.senderCapacity?.exhausted===true,
            autonomousBatchLimit:Number(x?.boundedExecution?.autonomousBatchLimit||0),
            claimed,
            processed,
            verified:Number(a.verified||0),
            deferred:Number(a.deferred||0),
            failed:Number(a.failed||0),
            capacityReallocation:x?.capacityReallocation||null
          },null,2));
          NODE
            then
              success=1
              break
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "No multi-task autonomous authority batch was observed in three production dispatches."
            for f in /tmp/phase251-execution-*.json; do [ -f "$f" ] && cat "$f"; done
            exit 1
          fi
          cat /tmp/phase251-pipeline-success.json
