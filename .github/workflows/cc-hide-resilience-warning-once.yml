name: Command Center Resilience Notice Removal Once

on:
  push:
    paths:
      - '.github/workflows/cc-hide-resilience-warning-once.yml'

permissions:
  contents: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide resilience notice
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='command-center-human-truth-details-worker.js';
          let text=fs.readFileSync(file,'utf8');
          const marker="  if(data?.affiliateCoverageStatus?.status!=='observed')data.affiliateCoverageStatus=await affiliateCoverageStatusSnapshot(request,env);";
          if(!text.includes('resilientNoticeVisible:false')){
            if(!text.includes(marker))throw new Error('affiliate status marker not found');
            text=text.replace(marker,"  if(Array.isArray(data?.growthOps?.health?.issues))data.growthOps.health.issues=data.growthOps.health.issues.filter(issue=>!(issue?.engine==='command-center'&&issue?.title==='Resilient snapshot active'));\n"+marker);
            text=text.replace("version:4,canonicalMetric:'human visitors'","version:5,canonicalMetric:'human visitors'");
            text=text.replace("growthLedgerCard:false,detailsPosition:","growthLedgerCard:false,resilientNoticeVisible:false,detailsPosition:");
          }
          fs.writeFileSync(file,text);
          NODE
          node --check command-center-human-truth-details-worker.js
          grep -q 'resilientNoticeVisible:false' command-center-human-truth-details-worker.js
          grep -q "issue?.title==='Resilient snapshot active'" command-center-human-truth-details-worker.js

      - name: Guard scope
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          test "$changed" = "command-center-human-truth-details-worker.js"

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "toolscout-command-center-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add command-center-human-truth-details-worker.js
          git commit -m "Hide resilient snapshot notice"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify health
        run: |
          set -euo pipefail
          curl -fsSL https://trytoolscout.org/api/command-center-human-truth-details-health | grep -q '"resilientNoticeVisible":false'
