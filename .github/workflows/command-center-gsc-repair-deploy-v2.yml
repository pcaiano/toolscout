name: ToolScout Command Center GSC Repair Deploy V2

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Run GSC repair deploy v2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate changed runtime
        run: |
          set -euo pipefail
          node --check command-center-business-truth-runtime.js
          node --check command-center-simplified-view.js
          node scripts/audit-runtime-architecture.mjs
          node scripts/validate-v2-preservation.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Verify live
        run: node scripts/verify-v2-live-smoke.mjs
