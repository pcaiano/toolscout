name: One Shot ToolScout 2.0 Closure Live Funnel Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-toolscout-v2-closure-live-funnel-audit.yml'

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read live production health
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            "contact-supply|https://trytoolscout.org/api/contact-supply/health"
            "compute|https://trytoolscout.org/api/compute/health"
            "autonomous-growth|https://trytoolscout.org/api/autonomous-growth-health"
            "schedule|https://trytoolscout.org/api/runtime/schedule-contract"
          )
          for item in "${endpoints[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            echo "::group::$name"
            code="$(curl --max-time 45 -sS -o "/tmp/$name.json" -w '%{http_code}' "$url")"
            echo "http=$code"
            cat "/tmp/$name.json"
            echo
            test "$code" -ge 200
            test "$code" -lt 300
            echo "::endgroup::"
          done

      - name: Read outcome attribution truth from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== strict human sources 7d ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "
          WITH fv AS (
            SELECT session_id,source,referrer_host,created_at,
              ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY created_at ASC,id ASC) rn
            FROM confirmed_visitor_events
            WHERE created_at>=datetime('now','-7 days')
          )
          SELECT LOWER(COALESCE(NULLIF(h.referrer_host,''),NULLIF(v.referrer_host,''),NULLIF(h.source,''),NULLIF(v.source,''),'direct')) source_key,
                 COUNT(DISTINCT h.session_id) strict_sessions,
                 MAX(h.first_evidence_at) last_human_at
          FROM traffic_human_evidence h
          LEFT JOIN fv v ON v.session_id=h.session_id AND v.rn=1
          WHERE h.first_evidence_at>=datetime('now','-7 days')
          GROUP BY source_key
          ORDER BY strict_sessions DESC,last_human_at DESC
          LIMIT 30;
          "

          echo "=== proven distribution surfaces 30d ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "
          SELECT l.surface_slug,o.surface_name,o.surface_type,o.status opportunity_status,
                 COALESCE(n.status,'') network_status,
                 l.browser_confirmed_sessions_30d strict_sessions,
                 l.outbound_clicks_30d outbound_clicks,
                 l.monetized_outbound_30d monetized_outbound,
                 l.evidence_grade,
                 o.action_url,o.live_url
          FROM distribution_economic_learning l
          JOIN distribution_opportunities o ON o.surface_slug=l.surface_slug
          LEFT JOIN distribution_network_outreach n ON n.surface_slug=l.surface_slug
          WHERE COALESCE(l.browser_confirmed_sessions_30d,0)>0
             OR COALESCE(l.outbound_clicks_30d,0)>0
             OR COALESCE(l.monetized_outbound_30d,0)>0
          ORDER BY l.browser_confirmed_sessions_30d DESC,l.outbound_clicks_30d DESC
          LIMIT 40;
          "

          echo "=== execution deferrals by action ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "
          SELECT executor,action,status,COUNT(*) n,MIN(updated_at) oldest,MAX(updated_at) newest
          FROM growth_execution_contract
          WHERE status IN ('pending','claimed','attempted','deferred','stalled')
          GROUP BY executor,action,status
          ORDER BY n DESC,executor,action,status;
          "

          echo "=== scale proven task truth ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "
          SELECT c.task_id,c.subject_key,c.action,c.status,c.last_result,c.updated_at,
                 o.status opportunity_status,
                 COALESCE(n.status,'') network_status,
                 COALESCE(l.browser_confirmed_sessions_30d,0) strict_sessions,
                 COALESCE(l.outbound_clicks_30d,0) outbound_clicks
          FROM growth_execution_contract c
          LEFT JOIN distribution_opportunities o ON o.surface_slug=c.subject_key
          LEFT JOIN distribution_network_outreach n ON n.surface_slug=c.subject_key
          LEFT JOIN distribution_economic_learning l ON l.surface_slug=c.subject_key
          WHERE c.action='scale_proven_surface'
          ORDER BY c.updated_at DESC
          LIMIT 50;
          "

      - name: Summarize closure bottleneck
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const read=n=>JSON.parse(fs.readFileSync('/tmp/'+n+'.json','utf8'));
          const contact=read('contact-supply');
          const compute=read('compute');
          const growth=read('autonomous-growth');
          const schedule=read('schedule');
          const summary={
            ok:true,
            contactSupply:{
              readyEmail:Number(contact.readyEmail||0),
              readyRoute:Number(contact.readyRoute||0),
              researching:Number(contact.researching||0),
              unresolved:Number(contact.unresolved||0),
              diversifiedSources:Number(contact.diversifiedSources||0),
              diversifiedSourcesDue:Number(contact.diversifiedSourcesDue||0),
              diversifiedSourcesExhausted:Number(contact.diversifiedSourcesExhausted||0),
              vendorRoutesTotal:Number(contact.vendorRoutesTotal||0),
              vendorRoutesResearch:Number(contact.vendorRoutesResearch||0),
              vendorRoutesHumanRequired:Number(contact.vendorRoutesHumanRequired||0),
              vendorRoutesAuthorityLike:Number(contact.vendorRoutesAuthorityLike||0)
            },
            compute:{
              status:compute.status||null,
              queued:Number(compute.queued||compute.metrics?.queued||0),
              leased:Number(compute.leased||compute.metrics?.leased||0),
              activeBatches:Number(compute.activeBatches||compute.metrics?.activeBatches||compute.metrics?.active_batches||0),
              completedToday:Number(compute.completedToday||compute.metrics?.completedToday||compute.metrics?.completed_today||0),
              failedToday:Number(compute.failedToday||compute.metrics?.failedToday||compute.metrics?.failed_today||0),
              contactSupply:compute.contactSupply||null,
              funnel:compute.funnel||compute.distributionFunnel||null
            },
            autonomousGrowth:growth,
            scheduleVersion:schedule.version||null
          };
          console.log(JSON.stringify(summary,null,2));
          fs.writeFileSync('/tmp/toolscout-v2-closure-live-funnel-summary.json',JSON.stringify(summary,null,2));
          NODE
