name: AgentTool Verification Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agenttool-verification-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check AgentTool public endpoints
        run: |
          set -euo pipefail
          echo '=== API PROFILE ==='
          curl -sS -D /tmp/api-headers -o /tmp/api-body -w 'HTTP %{http_code}\n' https://agenttool.sh/api/tools/toolscout || true
          cat /tmp/api-headers || true
          head -c 4000 /tmp/api-body || true
          echo
          echo '=== PUBLIC PROFILE ==='
          curl -sS -D /tmp/page-headers -o /tmp/page-body -w 'HTTP %{http_code}\n' https://agenttool.sh/tools/toolscout || true
          cat /tmp/page-headers || true
          head -c 4000 /tmp/page-body || true
          echo
          echo '=== D1 AGENTTOOL STATE ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT ds.surface_slug,ds.status,ds.attempts,ds.submitted_at,ds.response_url,ds.error,o.status AS opportunity_status,o.next_action FROM distribution_submissions ds LEFT JOIN distribution_opportunities o ON o.surface_slug=ds.surface_slug WHERE ds.surface_slug='agenttool-sh' ORDER BY ds.created_at DESC LIMIT 3;"
          echo '=== VERIFICATION EVENTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT event_type,status,detail,created_at FROM distribution_events WHERE event_type='submission_verification_refresh' ORDER BY created_at DESC LIMIT 5;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
