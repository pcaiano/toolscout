name: One Shot Phase 190 Sender Readiness Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-190-sender-readiness-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect exact make sender readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT status,COALESCE(contact_method,'NULL') contact_method,COUNT(*) n
          FROM distribution_vendor_amplification
          WHERE status='contact_found'
          GROUP BY status,COALESCE(contact_method,'NULL')
          ORDER BY n DESC;

          SELECT
            COUNT(*) deferred_sender_tasks,
            SUM(CASE WHEN EXISTS (
              SELECT 1 FROM distribution_vendor_amplification v
              WHERE v.tool_slug=c.subject_key
                AND v.status='contact_found'
                AND v.contact_method='public_role_email'
                AND v.contact_email IS NOT NULL
                AND NOT EXISTS (
                  SELECT 1 FROM distribution_vendor_amplification prior
                  WHERE prior.status='sent'
                    AND prior.outreach_sent_at>=datetime('now','-30 days')
                    AND (prior.tool_slug=v.tool_slug OR lower(COALESCE(prior.contact_email,''))=lower(COALESCE(v.contact_email,'')))
                )
            ) THEN 1 ELSE 0 END) exact_ready
          FROM growth_execution_contract c
          WHERE c.executor='make_sender' AND c.status='deferred' AND c.subject_type='tool';

          SELECT c.task_id,c.action,c.subject_key,c.priority_score,c.status,c.last_result,
                 v.asset_url,v.status vendor_status,v.contact_method,v.contact_email,v.priority_score vendor_priority,
                 EXISTS (
                   SELECT 1 FROM distribution_vendor_amplification prior
                   WHERE prior.status='sent'
                     AND prior.outreach_sent_at>=datetime('now','-30 days')
                     AND (prior.tool_slug=v.tool_slug OR lower(COALESCE(prior.contact_email,''))=lower(COALESCE(v.contact_email,'')))
                 ) recent_sent_conflict
          FROM growth_execution_contract c
          LEFT JOIN distribution_vendor_amplification v
            ON v.tool_slug=c.subject_key AND v.status='contact_found'
          WHERE c.executor='make_sender' AND c.status='deferred' AND c.subject_type='tool'
          ORDER BY c.priority_score DESC,v.priority_score DESC
          LIMIT 80;
          "
