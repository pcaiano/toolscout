name: One Shot Phase 197 Ready Email Lineage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-197-ready-email-lineage.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect ready email lineage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT cs.domain,cs.source_type,cs.source_key,cs.source_name,cs.priority_score,cs.status,cs.contact_email,cs.contact_source_url,
                 o.surface_slug,o.surface_name,o.surface_type,o.status opportunity_status,o.human_required,
                 n.status network_status,n.contact_email network_email,n.outreach_sent_at network_sent_at,
                 v.tool_slug,v.status vendor_status,v.contact_email vendor_email,v.outreach_sent_at vendor_sent_at,
                 CASE WHEN EXISTS(
                   SELECT 1 FROM growth_execution_contract g
                   WHERE g.executor='make_sender'
                     AND g.status IN ('pending','claimed','attempted','deferred','stalled')
                     AND ((g.subject_type='surface' AND g.subject_key=COALESCE(n.surface_slug,o.surface_slug,cs.source_key))
                       OR (g.subject_type='tool' AND g.subject_key=COALESCE(v.tool_slug,cs.source_key)))
                 ) THEN 1 ELSE 0 END active_sender_contract
          FROM contact_supply_domain cs
          LEFT JOIN distribution_opportunities o
            ON o.surface_slug=cs.source_key OR lower(replace(replace(o.action_url,'https://',''),'http://','')) LIKE cs.domain||'/%'
          LEFT JOIN distribution_network_outreach n ON lower(n.domain)=cs.domain
          LEFT JOIN distribution_vendor_amplification v ON lower(v.vendor_domain)=cs.domain
          WHERE cs.status='ready_email'
          ORDER BY cs.priority_score DESC,cs.domain;

          SELECT COUNT(*) ready_email,
                 SUM(CASE WHEN source_type='publisher_network' THEN 1 ELSE 0 END) publisher,
                 SUM(CASE WHEN source_type='distribution_surface' THEN 1 ELSE 0 END) surface,
                 SUM(CASE WHEN source_type='vendor_amplification' THEN 1 ELSE 0 END) vendor,
                 SUM(CASE WHEN source_type='catalog_vendor' THEN 1 ELSE 0 END) catalog
          FROM contact_supply_domain WHERE status='ready_email';
          "
