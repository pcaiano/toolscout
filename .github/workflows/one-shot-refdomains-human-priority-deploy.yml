name: One Shot Refdomains Human Priority Deploy
# rerun after runtime authority reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-refdomains-human-priority-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-one-shot-refdomains-human-priority
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate reconciliation policy
        run: node tests/refdomains-human-priority-policy.test.mjs

      - name: Validate distribution copy guard
        run: node scripts/check-distribution-copy.mjs

      - name: Deploy current ToolScout Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
