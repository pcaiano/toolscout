name: One Shot Phase 248 Discovery Breadth Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-248-route-research-proof.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect recursive discovery source backlog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT status,source_type,COUNT(*) n,
                 SUM(CASE WHEN last_scanned_at IS NULL THEN 1 ELSE 0 END) never_scanned,
                 MIN(last_scanned_at) oldest_scan,
                 MAX(last_scanned_at) newest_scan
          FROM distribution_discovery_sources
          GROUP BY status,source_type
          ORDER BY status,source_type;

          SELECT source_slug,source_url,source_host,parent_surface_slug,confidence,status,last_scanned_at,links_seen,relevant_links_seen,updated_at
          FROM distribution_discovery_sources
          WHERE status='active'
          ORDER BY CASE WHEN last_scanned_at IS NULL THEN 0 ELSE 1 END,last_scanned_at ASC,confidence DESC
          LIMIT 80;

          SELECT event_type,status,detail,created_at
          FROM distribution_events
          WHERE event_type='external_discovery_refresh'
          ORDER BY created_at DESC LIMIT 12;

          SELECT
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active') active_dynamic_sources,
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active' AND last_scanned_at IS NULL) active_never_scanned,
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active' AND (last_scanned_at IS NULL OR last_scanned_at<=datetime('now','-6 hours'))) active_due_6h,
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active' AND (last_scanned_at IS NULL OR last_scanned_at<=datetime('now','-24 hours'))) active_due_24h;
          "
