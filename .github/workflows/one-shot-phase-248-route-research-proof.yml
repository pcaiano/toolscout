name: One Shot Phase 248 Discovery Breadth Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-248-route-research-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture discovery source baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active') active_sources,
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active' AND last_scanned_at IS NULL) never_scanned,
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active' AND (last_scanned_at IS NULL OR last_scanned_at<=datetime('now','-24 hours'))) due_24h,
            (SELECT COUNT(*) FROM distribution_opportunities) opportunities;
          " > /tmp/before.json
          cat /tmp/before.json

      - name: Run one Phase 248 discovery refresh against remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler dev --remote --port 8787 --show-interactive-dev-session=false --var ADMIN_TOKEN:phase248_ephemeral_proof >/tmp/phase248-wrangler.log 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:8787/api/runtime/route-owner?path=%2Fapi%2Fdistribution%2Fdiscovery%2Frefresh&method=POST' >/tmp/owner.json 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -150 /tmp/phase248-wrangler.log; exit 1; fi
          code="$(curl -sS -o /tmp/discovery.json -w '%{http_code}' -X POST \
            'http://127.0.0.1:8787/api/distribution/discovery/refresh' \
            -H 'Authorization: Bearer phase248_ephemeral_proof' \
            -H 'Content-Type: application/json')"
          cat /tmp/discovery.json
          test "$code" -ge 200
          test "$code" -lt 300
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/discovery.json','utf8'));
          if(Number(x.scanned||0)<10)throw new Error('Phase 248 did not expand discovery breadth: '+JSON.stringify(x));
          console.log(JSON.stringify({ok:true,scanned:x.scanned,found:x.found,inserted:x.inserted,recursiveSourceNoisePruned:x.recursive_source_noise_pruned,recursiveSourcesLearned:x.recursive_sources_learned},null,2));
          NODE

      - name: Prove discovery backlog contraction
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active') active_sources,
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active' AND last_scanned_at IS NULL) never_scanned,
            (SELECT COUNT(*) FROM distribution_discovery_sources WHERE status='active' AND (last_scanned_at IS NULL OR last_scanned_at<=datetime('now','-24 hours'))) due_24h,
            (SELECT COUNT(*) FROM distribution_opportunities) opportunities;

          SELECT event_type,status,detail,created_at
          FROM distribution_events
          WHERE event_type='external_discovery_refresh'
          ORDER BY created_at DESC LIMIT 3;
          " > /tmp/after.json
          cat /tmp/after.json
          node - <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/before.json','utf8'))[0]?.results?.[0]||{};
          const after=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'))[0]?.results?.[0]||{};
          if(Number(after.due_24h||0)>=Number(before.due_24h||0))throw new Error('recursive discovery backlog did not contract: '+JSON.stringify({before,after}));
          console.log(JSON.stringify({
            ok:true,
            before,
            after,
            due24hReducedBy:Number(before.due_24h||0)-Number(after.due_24h||0),
            neverScannedReducedBy:Number(before.never_scanned||0)-Number(after.never_scanned||0),
            newOpportunities:Number(after.opportunities||0)-Number(before.opportunities||0)
          },null,2));
          NODE
