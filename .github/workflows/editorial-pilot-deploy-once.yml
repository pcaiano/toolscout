name: ToolScout Editorial Pilot Verify Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-pilot-deploy-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Notion live editorial paragraph
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 "https://trytoolscout.org/news/notion-mail-shuts-down?editorial-inspect=${GITHUB_SHA}" -o /tmp/notion.html
          grep -Fq 'data-editorial-quality="pilot"' /tmp/notion.html
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/notion.html','utf8');
          const clean=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&#39;|&apos;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
          const changed=html.match(/<h2[^>]*>What changed<\/h2>\s*<p[^>]*>([\s\S]*?)<\/p>/i);
          const why=html.match(/<h2[^>]*>Why it matters for buyers<\/h2>\s*<p[^>]*>([\s\S]*?)<\/p>/i);
          const take=html.match(/<h2[^>]*>Buyer takeaway<\/h2>\s*<p[^>]*>([\s\S]*?)<\/p>/i);
          console.log('What changed: '+clean(changed?.[1]||'MISSING'));
          console.log('Why it matters for buyers: '+clean(why?.[1]||'MISSING'));
          console.log('Buyer takeaway: '+clean(take?.[1]||'MISSING'));
          NODE
