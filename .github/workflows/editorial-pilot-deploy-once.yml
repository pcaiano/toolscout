name: ToolScout Editorial Pilot Verify Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-pilot-deploy-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all 10 pilot pages and copy live
        run: |
          set -euo pipefail
          check () {
            rel="$1"
            phrase="$2"
            body="$(curl -fsS --retry 4 --retry-all-errors --retry-delay 2 "https://trytoolscout.org/${rel}?editorial-verify=${GITHUB_SHA}")"
            grep -Fq 'data-editorial-quality="pilot"' <<< "$body"
            grep -Fq "$phrase" <<< "$body"
            echo "LIVE: https://trytoolscout.org/${rel}"
          }
          check "news/chatgpt-building-advertising-for-the-way-people-use-ai" "OpenAI is doing more than inserting ads into ChatGPT."
          check "news/notion-mail-shuts-down" "The shutdown removes a product surface, not all of Notion's email ambitions."
          check "news/zapier-next-gen-zaps-mcp" "Zapier's Next Gen Zaps are becoming a deeper execution model"
          check "tools/hubspot" "HubSpot's case is breadth with relatively little stitching"
          check "tools/notion" "Notion is most convincing when the problem is fragmented team knowledge"
          check "tools/semrush" "Semrush is the broad-suite choice in this SEO shortlist."
          check "best-seo-tools-for-agencies" "For an agency, first place here is about breadth across repeatable client work"
          check "best-workflow-automation-tools" "Integrately leads this particular ranking because its 10 for ease of use"
          check "activecampaign-vs-mailchimp" "ActiveCampaign and Mailchimp overlap at email marketing"
          check "webflow-vs-framer" "Webflow and Framer are close on the basics"
