name: ToolScout Editorial Pilot Final Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-pilot-deploy-once.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-editorial-pilot-final-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lock pilot to exactly 10 pages
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('data/organic-growth-engine.json','utf8')).editorialQuality;
          if(cfg?.rollout!=='pilot') throw new Error('rollout not pilot');
          if(cfg.pilotPaths?.length!==10) throw new Error('pilot path count is not 10');
          for(const rel of cfg.pilotPaths){
            const html=fs.readFileSync(rel,'utf8');
            if(!html.includes('data-editorial-quality="pilot"')) throw new Error('marker missing '+rel);
          }
          if(fs.readFileSync('news/notion-mail-shuts-down.html','utf8').includes('data-editorial-quality="pilot"')) throw new Error('Notion Mail must be outside pilot');
          console.log('pilot scope locked at 10 pages');
          NODE
          node --check scripts/discover-software-news.mjs
          node --check scripts/generate-tool-pages.mjs
          node --check scripts/generate-seo-pages.mjs
          node --check scripts/generate-comparisons.mjs
          node --check scripts/validate-editorial-trust.mjs

      - name: Wrangler dry-run
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/toolscout-editorial-pilot-final

      - name: Deploy current main without migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify 10 pilot pages live
        run: |
          set -euo pipefail
          check () {
            rel="$1"
            phrase="$2"
            file="/tmp/page-$RANDOM.html"
            curl -fsS --retry 4 --retry-all-errors --retry-delay 2 "https://trytoolscout.org/${rel}?editorial-final=${GITHUB_SHA}" -o "$file"
            grep -Fq 'data-editorial-quality="pilot"' "$file"
            grep -Fq "$phrase" "$file"
            echo "LIVE: https://trytoolscout.org/${rel}"
          }
          check "news/chatgpt-building-advertising-for-the-way-people-use-ai" "OpenAI is doing more than inserting ads into ChatGPT."
          check "news/notion-3-7-agent-skills" "The important shift is not another AI writing feature."
          check "news/zapier-next-gen-zaps-mcp" "Zapier's Next Gen Zaps are becoming a deeper execution model"
          check "tools/hubspot" "HubSpot's case is breadth with relatively little stitching"
          check "tools/notion" "Notion is most convincing when the problem is fragmented team knowledge"
          check "tools/semrush" "Semrush is the broad-suite choice in this SEO shortlist."
          check "best-seo-tools-for-agencies" "For an agency, first place here is about breadth across repeatable client work"
          check "best-workflow-automation-tools" "Integrately leads this particular ranking because its 10 for ease of use"
          check "activecampaign-vs-mailchimp" "ActiveCampaign and Mailchimp overlap at email marketing"
          check "webflow-vs-framer" "Webflow and Framer are close on the basics"
