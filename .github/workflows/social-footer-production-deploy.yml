name: ToolScout Social Footer Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-footer-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-social-footer-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Deploy social footer production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate social footer release
        run: |
          set -euo pipefail
          node --check social-profiles.js
          node --check public-redesign-runtime.js
          node --test tests/toolscout-v2-public-redesign.test.mjs tests/toolscout-v2-public-plane.test.mjs

      - name: Deploy current main to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify social footer live
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 3 -H 'Cache-Control: no-cache' 'https://trytoolscout.org/?social_footer=dd4ba272' -o /tmp/home.html
          curl -fsS --retry 6 --retry-delay 3 -H 'Cache-Control: no-cache' 'https://trytoolscout.org/news/chatgpt-building-advertising-for-the-way-people-use-ai?social_footer=dd4ba272' -o /tmp/news.html
          grep -q 'ToolScout elsewhere' /tmp/home.html
          grep -q 'data-toolscout-social-footer="2"' /tmp/home.html
          grep -q 'href="https://x.com/trytoolscout"' /tmp/home.html
          grep -q 'data-toolscout-social-link="1"' /tmp/home.html
          grep -q 'ToolScout elsewhere' /tmp/news.html
          grep -q 'href="https://x.com/trytoolscout"' /tmp/news.html
          if grep -q 'href="https://openai.com' /tmp/news.html; then echo 'Non-social external source link escaped outbound policy'; exit 1; fi
