name: One Shot Command Center Final Deploy
# canonical GSC traffic-truth fix

on:
  push:
    paths:
      - ".github/workflows/one-shot-command-center-final-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate
        run: |
          node --check command-center-simplified-view.js
          node --check command-center-resilient-worker.js
          node --check operational-truth-reconciliation-worker.js
          node --check traffic-truth-extension.js
      - name: Deploy
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke live stats
        shell: bash
        run: |
          BASE="https://trytoolscout.org"
          JAR="/tmp/cc.txt"
          curl -fsSL --max-time 12 -c "$JAR" -b "$JAR" -o /tmp/analytics "$BASE/analytics"
          curl -fsS --max-time 12 -c "$JAR" -b "$JAR" -o /tmp/stats "$BASE/analytics/api/stats"
          jq -e '.acquisition.status=="connected" and .trafficTruth.googleSearchConsole.impressions==4419 and .trafficTruth.googleSearchConsole.clicks==4' /tmp/stats >/dev/null
