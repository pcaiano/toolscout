name: One Shot Command Center Final Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-command-center-final-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate
        run: |
          node --check command-center-simplified-view.js
          node --check command-center-resilient-worker.js
          node --check operational-truth-reconciliation-worker.js
      - name: Deploy
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
