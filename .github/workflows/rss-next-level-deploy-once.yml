name: RSS Next Level Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rss-next-level-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate RSS distribution code
        run: |
          node --check lemlist-profile-correction-worker.js
          node --check scripts/generate-distribution.mjs
          node scripts/check-distribution-copy.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify RSS discovery in production
        run: |
          set -euo pipefail
          FEED_URL='https://trytoolscout.org/feed.xml'
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -D /tmp/feed-headers -o /tmp/feed-body "$FEED_URL"; then break; fi
            sleep 5
          done
          grep -qi '^content-type: application/rss+xml' /tmp/feed-headers
          grep -qi 'rel="hub"' /tmp/feed-headers
          grep -q '<rss' /tmp/feed-body
          curl -fsSI "$FEED_URL" | grep -qi 'rel="hub"'
          curl -fsSL 'https://trytoolscout.org/' | grep -q 'application/rss+xml'

      - name: Bootstrap WebSub push and RSS state
        run: |
          set -euo pipefail
          FEED_URL='https://trytoolscout.org/feed.xml'
          HUB='https://pubsubhubbub.appspot.com/'
          DIGEST=$(curl -fsSL "$FEED_URL" | sha256sum | awk '{print $1}')
          HTTP=$(curl -sS -o /tmp/websub-body -w '%{http_code}' -X POST "$HUB" -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'hub.mode=publish' --data-urlencode "hub.url=$FEED_URL")
          echo "WebSub HTTP $HTTP"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            cat /tmp/websub-body
            exit 1
          fi
          EVENT_ID="rss_bootstrap_$(date +%s)"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE distribution_rss_state SET last_changed_at=CASE WHEN content_sha256 IS NULL OR content_sha256 <> '$DIGEST' THEN datetime('now') ELSE last_changed_at END,change_count=change_count+CASE WHEN content_sha256 IS NULL OR content_sha256 <> '$DIGEST' THEN 1 ELSE 0 END,content_sha256='$DIGEST',last_checked_at=datetime('now'),last_ping_at=datetime('now'),last_ping_status='completed',last_http_status=$HTTP,last_error=NULL,ping_count=ping_count+1,updated_at=datetime('now') WHERE feed_url='$FEED_URL'; INSERT INTO distribution_events(event_id,surface_slug,event_type,status,asset_type,asset_id,source_url,destination_url,detail,observed_at,created_at) VALUES('$EVENT_ID','rss','rss_websub_publish','completed','syndication','feed.xml','$FEED_URL','$HUB','WebSub hub accepted ToolScout RSS bootstrap publish notification. HTTP $HTTP.',datetime('now'),datetime('now'));"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify RSS state in D1
        run: npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT feed_url,last_checked_at,last_changed_at,last_ping_at,last_ping_status,last_http_status,ping_count,change_count FROM distribution_rss_state WHERE feed_url='https://trytoolscout.org/feed.xml'; SELECT event_type,status,destination_url,observed_at FROM distribution_events WHERE surface_slug='rss' ORDER BY created_at DESC LIMIT 3;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
