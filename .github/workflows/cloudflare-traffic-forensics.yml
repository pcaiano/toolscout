name: Cloudflare Traffic Forensics

on:
  push:
    paths:
      - '.github/workflows/cloudflare-traffic-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruct recent HTTP traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token) throw new Error('CLOUDFLARE_API_TOKEN missing');
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          const zones=await fetch('https://api.cloudflare.com/client/v4/zones?name=trytoolscout.org&status=active',{headers});
          const z=await zones.json();
          if(!zones.ok||!z.success||!z.result?.[0]?.id) throw new Error(`zone lookup failed ${zones.status} ${JSON.stringify(z.errors||z)}`);
          const zoneTag=z.result[0].id;
          const gql='https://api.cloudflare.com/client/v4/graphql';
          async function query(query,variables){
            const r=await fetch(gql,{method:'POST',headers,body:JSON.stringify({query,variables})});
            const j=await r.json();
            return {ok:r.ok&&!j.errors?.length,status:r.status,data:j.data||null,errors:j.errors||null};
          }
          const summaryQuery=`query($zoneTag:String!,$filter:ZoneHttpRequestsAdaptiveGroupsFilter_InputObject!){viewer{zones(filter:{zoneTag:$zoneTag}){g:httpRequestsAdaptiveGroups(limit:1,filter:$filter){count sum{visits}}}}}`;
          const uaQuery=`query($zoneTag:String!,$filter:ZoneHttpRequestsAdaptiveGroupsFilter_InputObject!){viewer{zones(filter:{zoneTag:$zoneTag}){g:httpRequestsAdaptiveGroups(limit:5000,orderBy:[count_DESC],filter:$filter){count sum{visits} dimensions{userAgent}}}}}`;
          const start=new Date('2026-09-03T00:00:00Z');
          const end=new Date('2026-09-11T00:00:00Z');
          const automation=/(bot|crawler|spider|slurp|headless|lighthouse|pagespeed|curl|wget|python|go-http-client|semrush|ahrefs|mj12|dotbot|gptbot|oai-searchbot|chatgpt-user|claude|anthropic|perplexity|bytespider|facebookexternalhit|linkedinbot|twitterbot|whatsapp|bingpreview|petalbot|yandex|duckduckbot|googleother|builtwith|externalagent|mcpbeat|sentineloracle|saashub|n8n|make\/production|mcpi|spanly|node)/i;
          const mainstream=/(Chrome\/|CriOS\/|Firefox\/|FxiOS\/|Safari\/|Edg\/|OPR\/)/i;
          const totals={days:0,totalVisits:0,automationVisits:0,browserCandidateVisits:0,strictBrowserVisits:0,thinBrowserVisits:0,observedD1Starts:60};
          for(let d=new Date(start);d<end;d.setUTCDate(d.getUTCDate()+1)){
            const next=new Date(d);next.setUTCDate(next.getUTCDate()+1);
            const filter={datetime_geq:d.toISOString(),datetime_lt:next.toISOString(),requestSource:'eyeball'};
            const [s,u]=await Promise.all([query(summaryQuery,{zoneTag,filter}),query(uaQuery,{zoneTag,filter})]);
            const uas=u.data?.viewer?.zones?.[0]?.g||[];
            const browserRows=uas.filter(x=>{const ua=String(x.dimensions?.userAgent||'');return /Mozilla\/5\.0/i.test(ua)&&mainstream.test(ua)&&!automation.test(ua)});
            const automationRows=uas.filter(x=>automation.test(String(x.dimensions?.userAgent||'')));
            const strictRows=browserRows.filter(x=>{const v=Number(x.sum?.visits||0),c=Number(x.count||0);return v>0&&c/v>=3});
            const thinRows=browserRows.filter(x=>{const v=Number(x.sum?.visits||0),c=Number(x.count||0);return v>0&&c/v<3});
            const totalVisits=Number(s.data?.viewer?.zones?.[0]?.g?.[0]?.sum?.visits||0);
            const browserCandidateVisits=browserRows.reduce((a,x)=>a+Number(x.sum?.visits||0),0);
            const automationVisits=automationRows.reduce((a,x)=>a+Number(x.sum?.visits||0),0);
            const strictBrowserVisits=strictRows.reduce((a,x)=>a+Number(x.sum?.visits||0),0);
            const thinBrowserVisits=thinRows.reduce((a,x)=>a+Number(x.sum?.visits||0),0);
            totals.days++; totals.totalVisits+=totalVisits; totals.automationVisits+=automationVisits; totals.browserCandidateVisits+=browserCandidateVisits; totals.strictBrowserVisits+=strictBrowserVisits; totals.thinBrowserVisits+=thinBrowserVisits;
            console.log('CF_HUMAN_BAND='+JSON.stringify({day:d.toISOString().slice(0,10),totalVisits,automationVisits,browserCandidateVisits,strictBrowserVisits,thinBrowserVisits,strictRows:strictRows.map(x=>({ua:String(x.dimensions?.userAgent||'').slice(0,160),requests:Number(x.count||0),visits:Number(x.sum?.visits||0),requestsPerVisit:+(Number(x.count||0)/Math.max(1,Number(x.sum?.visits||0))).toFixed(2)})).sort((a,b)=>b.visits-a.visits).slice(0,30)}));
          }
          totals.maxUntrackedBrowserCandidates=Math.max(0,totals.browserCandidateVisits-totals.observedD1Starts);
          totals.maxUntrackedStrictCandidates=Math.max(0,totals.strictBrowserVisits-totals.observedD1Starts);
          console.log('CF_HUMAN_TOTAL='+JSON.stringify(totals));
          NODE
