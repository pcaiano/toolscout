name: ToolScout Comparison Editorial Browser Verify Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/comparison-editorial-deploy-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify rendered comparison copy live
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const cases=[
            {
              url:'https://trytoolscout.org/activecampaign-vs-mailchimp?browser-check=20261006',
              required:'The key divide is how far each product extends beyond email marketing.'
            },
            {
              url:'https://trytoolscout.org/webflow-vs-framer?browser-check=20261006',
              required:'Webflow and Framer overlap heavily in visual site building'
            }
          ];
          for(const item of cases){
            const page=await browser.newPage();
            await page.goto(item.url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(required=>{
              const text=document.querySelector('#analysis')?.innerText||'';
              return text.includes(required);
            },item.required,{timeout:20000});
            const text=await page.locator('#analysis').innerText();
            if(text.includes('This is a genuine trade-off rather than a cosmetic tie.'))throw new Error('canned comparison lead still rendered');
            console.log('LIVE:',item.url.replace(/\?.*$/,''),'\n',text);
            await page.close();
          }
          await browser.close();
          NODE
