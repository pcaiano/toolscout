# One-time controlled publication of completed editorial and source-evidence changes.
# Remove this workflow after verification; no database migrations.
name: ToolScout Editorial 2026-10-08 Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-20261008-release.yml'
permissions:
  contents: read
concurrency:
  group: toolscout-worker-production-recovery
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify documentary gate, profile titles and source-link policy
        run: |
          set -euo pipefail
          node --check catalog-autonomy-worker.js
          node --check catalog-gap-runtime-worker.js
          node --check public-redesign-runtime.js
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs
      - name: Dry run Cloudflare compilation without database mutations
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/editorial-release-build
      - name: Deploy worker and site assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config wrangler.toml --latest
      - name: Verify public headings, evidence text and commercial routing
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --max-time 25 --retry 2 "https://trytoolscout.org/tools/hubspot?ts_editorial=20261008" -o /tmp/hubspot.html || true
            curl -fsSL --max-time 25 --retry 2 "https://trytoolscout.org/tools/posthog?ts_editorial=20261008" -o /tmp/posthog.html || true
            curl -fsSL --max-time 25 --retry 2 "https://trytoolscout.org/tools/zoho-crm?ts_editorial=20261008" -o /tmp/zoho.html || true
            if grep -Fq '<h1>HubSpot</h1>' /tmp/hubspot.html 2>/dev/null &&
               grep -Fq '<h1>PostHog</h1>' /tmp/posthog.html 2>/dev/null &&
               grep -Fq '<h1>Zoho CRM</h1>' /tmp/zoho.html 2>/dev/null &&
               grep -Fq 'href="/go/hubspot"' /tmp/hubspot.html 2>/dev/null &&
               grep -Fq 'href="/go/posthog"' /tmp/posthog.html 2>/dev/null &&
               grep -Fq 'href="/go/zoho-crm"' /tmp/zoho.html 2>/dev/null &&
               ! grep -Eiq '<h1>[^<]+ profile</h1>' /tmp/hubspot.html /tmp/posthog.html /tmp/zoho.html &&
               ! grep -Eiq '<a[^>]+href="https?://[^"]*(help[.]hubspot[.]com|posthog[.]com/pricing|help[.]zoho[.]com)' /tmp/hubspot.html /tmp/posthog.html /tmp/zoho.html &&
               ! grep -Fq 'AI integration evidence:' /tmp/hubspot.html; then
              echo 'RELEASE VERIFIED: clean tool headings, no public manufacturer documentation links, monetized CTA routes intact'
              exit 0
            fi
            sleep 10
          done
          echo 'Live ToolScout editorial verification did not pass' >&2
          exit 1
