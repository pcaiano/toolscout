name: One Shot Compute Probe

on:
  push:
    paths:
      - ".github/workflows/one-shot-compute-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deferred jobs and probe
        run: |
          set -euo pipefail
          sleep 15
          for i in 1 2 3 4; do
            echo "PROBE $i"
            curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?deferred_probe=$i"
            echo
            sleep 8
          done
