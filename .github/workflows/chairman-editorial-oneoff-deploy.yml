name: One off Chairman Queue editorial deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chairman-editorial-oneoff-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Chairman Queue integration
        run: node --check human-action-entry-worker.js

      - name: Apply canonical public navigation
        run: node scripts/unify-public-nav.mjs

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
