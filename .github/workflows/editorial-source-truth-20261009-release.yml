name: ToolScout editorial source truth 2026-10-09 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-source-truth-20261009-release.yml'
permissions:
  contents: read
concurrency:
  group: toolscout-editorial-source-truth-20261009
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check manufacturer evidence and editorial contracts
        run: |
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs
      - name: Validate Cloudflare build
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/toolscout-editorial-20261009
      - name: Deploy public editorial review update without migrations
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Confirm Perplexity and Cursor live content and /go routes
        run: |
          set -euo pipefail
          for slug in perplexity cursor; do
            curl --retry 4 --retry-delay 2 --fail --silent --show-error -L "https://trytoolscout.org/tools/${slug}?editorial_source_20261009=1" -o "/tmp/editorial-${slug}.html"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const [slug,name,required,obsolete,privateSource] of [
            ['perplexity','Perplexity','Perplexity now describes its former Spaces as Projects','describes Spaces as collaborative topic hubs','https://www.perplexity.ai/hub/products/projects'],
            ['cursor','Cursor','Project Rules stored in .cursor/rules','Cursor documents repository-scoped project rules','https://cursor.com/docs/rules']
          ]){
            const html=fs.readFileSync('/tmp/editorial-'+slug+'.html','utf8');
            if(!html.includes('<h1>'+name+'</h1>'))throw Error('Incorrect heading: '+slug);
            if(!html.includes(required))throw Error('Stale public editorial: '+slug);
            if(html.includes(obsolete))throw Error('Deprecated editorial remains: '+slug);
            if(!html.includes('href="/go/'+slug+'"'))throw Error('Missing monetized CTA: '+slug);
            if(html.includes(privateSource))throw Error('Manufacturer source URL disclosed: '+slug);
            const links=html.split('<a ').slice(1).map(s=>s.match(/href=["']([^"']+)["']/i)?.[1]).filter(Boolean);
            if(links.some(h=>/^(https?:\/\/)?(?:help\.|docs\.|support\.)/i.test(h)))throw Error('Direct documentation outbound disclosed: '+slug);
            console.log('LIVE VERIFIED:',slug,'updated review, correct H1, no private sources, monetized CTA');
          }
          NODE
