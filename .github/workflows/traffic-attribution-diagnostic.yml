name: ToolScout read-only traffic attribution diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-attribution-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify ToolScout D1 target
        shell: bash
        run: |
          grep -q 'database_name = "toolscout"' wrangler.toml
          grep -q 'database_id = "cac6bc3c-d838-4edd-ba29-597030afb397"' wrangler.toml
          echo 'Verified ToolScout D1 target: toolscout / cac6bc3c-d838-ba29-597030afb397'

      - name: Query canonical traffic attribution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== 2026-09-15 Lisbon canonical sessions by source/referrer ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT f.source, COALESCE(f.referrer_host,'') AS referrer_host, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at >= '2026-09-14 23:00:00' AND f.created_at < '2026-09-15 23:00:00' GROUP BY f.source, COALESCE(f.referrer_host,'') ORDER BY sessions DESC, f.source ASC;"

          echo '=== 2026-09-16 Lisbon canonical sessions by source/referrer ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT f.source, COALESCE(f.referrer_host,'') AS referrer_host, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at >= '2026-09-15 23:00:00' AND f.created_at < '2026-09-16 23:00:00' GROUP BY f.source, COALESCE(f.referrer_host,'') ORDER BY sessions DESC, f.source ASC;"

          echo '=== 2026-09-16 Lisbon canonical sessions by hour ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT strftime('%H:00', datetime(f.created_at,'+1 hour')) AS lisbon_hour, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at >= '2026-09-15 23:00:00' AND f.created_at < '2026-09-16 23:00:00' GROUP BY lisbon_hour ORDER BY lisbon_hour;"

          echo '=== 2026-09-16 Lisbon confirmed visitors by source/referrer ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT source, COALESCE(referrer_host,'') AS referrer_host, COUNT(DISTINCT visitor_id) AS visitors, COUNT(DISTINCT session_id) AS sessions FROM confirmed_visitor_events WHERE created_at >= '2026-09-15 23:00:00' AND created_at < '2026-09-16 23:00:00' GROUP BY source, COALESCE(referrer_host,'') ORDER BY visitors DESC, sessions DESC, source ASC;"

          echo '=== 2026-09-17 Lisbon canonical sessions so far ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT f.source, COALESCE(f.referrer_host,'') AS referrer_host, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at >= '2026-09-16 23:00:00' GROUP BY f.source, COALESCE(f.referrer_host,'') ORDER BY sessions DESC, f.source ASC;"

          echo '=== Quarantine totals ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT reason, COUNT(*) AS sessions, MIN(first_confirmed_at) AS first_at, MAX(first_confirmed_at) AS last_at FROM traffic_quarantine_sessions GROUP BY reason ORDER BY sessions DESC;"
