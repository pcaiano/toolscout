name: ToolScout read-only traffic attribution diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-attribution-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify ToolScout D1 target
        shell: bash
        run: |
          grep -q 'database_name = "toolscout"' wrangler.toml
          grep -q 'database_id = "cac6bc3c-d838-4edd-ba29-597030afb397"' wrangler.toml
          echo 'Verified ToolScout D1 target'

      - name: Query initial source of canonical sessions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Sep 15 canonical sessions by preserved sessions.source ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT s.source, COUNT(DISTINCT s.session_id) AS sessions FROM sessions s WHERE s.classification IN ('likely-human','human') AND EXISTS (SELECT 1 FROM funnel_events f WHERE f.session_id=s.session_id AND f.event_type='page_confirmed' AND f.created_at >= '2026-09-14 23:00:00' AND f.created_at < '2026-09-15 23:00:00') GROUP BY s.source ORDER BY sessions DESC, s.source ASC;"

          echo '=== Sep 16 canonical sessions by preserved sessions.source ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT s.source, COUNT(DISTINCT s.session_id) AS sessions FROM sessions s WHERE s.classification IN ('likely-human','human') AND EXISTS (SELECT 1 FROM funnel_events f WHERE f.session_id=s.session_id AND f.event_type='page_confirmed' AND f.created_at >= '2026-09-15 23:00:00' AND f.created_at < '2026-09-16 23:00:00') GROUP BY s.source ORDER BY sessions DESC, s.source ASC;"

          echo '=== Sep 16 canonical sessions by session_started source/referrer ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH canonical AS (SELECT DISTINCT f.session_id FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at >= '2026-09-15 23:00:00' AND f.created_at < '2026-09-16 23:00:00') SELECT e.source, COALESCE(e.referrer_host,'') AS referrer_host, COUNT(DISTINCT e.session_id) AS sessions FROM funnel_events e JOIN canonical c ON c.session_id=e.session_id WHERE e.event_type='session_started' GROUP BY e.source, COALESCE(e.referrer_host,'') ORDER BY sessions DESC, e.source ASC;"

          echo '=== Sep 16 canonical sessions by first path ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH canonical AS (SELECT DISTINCT f.session_id FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at >= '2026-09-15 23:00:00' AND f.created_at < '2026-09-16 23:00:00'), first_event AS (SELECT e.session_id, MIN(e.created_at) AS first_at FROM funnel_events e JOIN canonical c ON c.session_id=e.session_id GROUP BY e.session_id) SELECT e.path, e.source, COALESCE(e.referrer_host,'') AS referrer_host, COUNT(DISTINCT e.session_id) AS sessions FROM funnel_events e JOIN first_event x ON x.session_id=e.session_id AND x.first_at=e.created_at GROUP BY e.path,e.source,COALESCE(e.referrer_host,'') ORDER BY sessions DESC,e.path ASC;"

          echo '=== Confirmed visitor tracking activation ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT key,value FROM traffic_integrity_meta WHERE key IN ('confirmed_tracking_started_at','crawl_quarantine_2026_09_16_applied_at') ORDER BY key;"
