name: One off Stremit Distribution deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stremit-oneoff-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Stremit integration
        run: |
          node --check distribution-orchestrator-worker.js
          node -e "JSON.parse(require('fs').readFileSync('data/distribution-radar-seeds.json','utf8')); console.log('radar json ok')"

      - name: Apply canonical public navigation
        run: node scripts/unify-public-nav.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
