name: One Shot Strict Human Attribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-strict-human-attribution.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query recent strict-human attribution
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT evidence_type,evidence_strength,interaction_count,first_path,last_path,source,referrer_host,country,asn,first_evidence_at,last_evidence_at FROM traffic_human_evidence WHERE first_evidence_at>=datetime('now','-24 hours') ORDER BY first_evidence_at DESC LIMIT 10;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
