      - 'distribution-embed-worker.js'
      - 'authority-acquisition-worker.js'
      - 'distribution-orchestrator-worker.js'
      - 'growth-scheduler.js'
      - 'runtime-schedule-contract.js'
      - 'migrations/0088_mission_integrity_schema.sql'
      - 'migrations/0089_growth_planner_schema.sql'
      - 'migrations/0090_strict_human_analytics_schema.sql'
      - 'mission-integrity-v2-worker.js'
      - 'runtime-route-contract.js'
      - 'distribution-priority-worker.js'
      - 'scripts/editorial-authority-model.mjs'
      - 'scripts/build-editorial-authority-portfolio.mjs'
      - 'scripts/build-growth-priority.mjs'
      - 'scripts/audit-runtime-architecture.mjs'
      - 'scripts/audit-public-decision-parity.mjs'
      - 'scripts/verify-public-decision-shadow.mjs'
      - 'scripts/verify-public-navigation-shadow.mjs'
      - 'scripts/validate-v2-preservation.mjs'
      - 'scripts/generate-tool-pages.mjs'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/generate-comparisons.mjs'
      - 'scripts/generate-software-trends-index.mjs'
      - 'catalog-runtime-ranking.js'
      - 'catalog-autonomy-worker.js'
      - 'data/organic-growth-engine.json'
      - 'docs/OPERATING-CONTRACT.json'
      - 'migrations/0085_toolscout_v2_external_value.sql'
      - 'migrations/0086_compute_control_plane_schema.sql'
      - 'tests/toolscout-v2-*.test.mjs'
      - 'tests/growth-scheduler-ownership.mjs'
      - '.github/workflows/toolscout-v2-ci.yml'
      - '.github/workflows/deploy-worker.yml'
      - 'scripts/verify-v2-live-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check ToolScout 2.0 runtime
        run: |
          node --check acquisition-value-model.js
          node --check distribution-priority-worker.js
          node --check compute-router-worker.js
          node --check traffic-integrity-live-worker.js
          node --check affiliate-redirect-runtime.js
          node --check public-editorial-runtime.js
          node --check public-canonical-contract.js
          node --check public-decision-runtime.js
          node --check public-navigation-runtime.js
          node --check public-discovery-links.js
          node --check public-editorial-evidence.js
          node --check public-page-parity-contract.js
          node --check catalog-autonomy-worker.js
          node --check seo-cloudflare-runtime-worker.js
          node --check cloudflare-primary-runtime-worker.js
          node --check runtime-schedule-contract.js
          node --check runtime-route-contract.js
          node --check mission-integrity-v2-worker.js
          node --check growth-scheduler.js
          node --check distribution-orchestrator-worker.js
          node --check authority-acquisition-worker.js
          node --check growth-runtime-closed-loop-worker.js
          node --check authority-health-runtime.js
          node --check agent-protocol-core-worker.js
          node --check agent-protocol-worker.js
          node --check machine-discovery-catalog-runtime.js
          node --check analytics-chairman-runtime.js
          node --check affiliate-chairman-filter.js
          node --check distribution-embed-worker.js
          node --check growth-runtime-integrity-worker.js
          node --check command-center-light-theme-worker.js
          node --check command-center-resilient-worker.js
          node --check command-center-resilient-health-runtime.js
          node --check command-center-schema-control-runtime.js
          node --check traffic-integrity-health-runtime.js
          node --check admin-stats-runtime.js
          node --check dynamic-worker.js
          node --check worker.js
          node --check outbound-integrity-worker.js
          node --check engine-run-ledger.js
          node --check visitor-integrity-worker.js
          node --check traffic-integrity-worker.js
          node --check traffic-integrity-guard-worker.js
          node --check owner-exclusion-worker.js
          node --check command-center-integrity-worker.js
          node --check analytics-human-actions-runtime.js
          node --check auth-automation.js
          node --check human-gate-contract.js
          node --check human-action-entry-worker.js
          node --check human-action-entry-worker.js
          node --check command-center-direct-runtime.js
          node --check command-center-business-truth-runtime.js
          node --check ga4-owner-context.js
          node --check ga4-owner-exclusion-runtime.js
          node --check ga4-attribution-24h-worker.js
          node --check d1-read-budget-worker.js
          node --check command-center-ga4-worker.js
          node --check gsc-command-center-visible-worker.js
          node --check growth-runtime-authority-drain-worker.js
          node --check operational-truth-reconciliation-runtime.js
          node --check command-center-simplified-view.js
          node --check scripts/editorial-authority-model.mjs
          node --check scripts/build-editorial-authority-portfolio.mjs
          node --check scripts/build-growth-priority.mjs
          node --check scripts/audit-runtime-architecture.mjs
          node --check scripts/validate-v2-preservation.mjs
          node --check scripts/verify-v2-live-smoke.mjs
          node --check scripts/verify-public-decision-shadow.mjs
          node --check scripts/verify-public-navigation-shadow.mjs
          node --check scripts/generate-tool-pages.mjs
          node --check scripts/generate-seo-pages.mjs
          node --check scripts/generate-comparisons.mjs
          node --check scripts/generate-software-trends-index.mjs
          node --check catalog-runtime-ranking.js
          node --check catalog-autonomy-worker.js
      - name: Audit ToolScout 2.0 runtime architecture
        run: node scripts/audit-runtime-architecture.mjs
      - name: Audit full public decision parity
        run: node scripts/audit-public-decision-parity.mjs
      - name: Shadow verify priority public pages against live production
        run: node scripts/verify-public-decision-shadow.mjs
      - name: Shadow verify public navigation hubs against live production
        run: node scripts/verify-public-navigation-shadow.mjs

      - name: Enforce ToolScout 2.0 preservation invariants
        env:
          TOOLSCOUT_V2_BASE_REF: origin/main
        run: node scripts/validate-v2-preservation.mjs
      - name: Validate operating contract JSON
        run: node -e "JSON.parse(require('fs').readFileSync('docs/OPERATING-CONTRACT.json','utf8')); console.log('operating contract valid')"
      - name: Run ToolScout 2.0 policy tests
        run: |
          node --test tests/toolscout-v2-external-value.test.mjs tests/toolscout-v2-editorial-authority.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs tests/toolscout-v2-scheduler-ownership.test.mjs tests/toolscout-v2-route-ownership.test.mjs tests/toolscout-v2-command-center.test.mjs tests/toolscout-v2-command-center-resilient-health.test.mjs tests/toolscout-v2-command-center-schema-control.test.mjs tests/toolscout-v2-traffic-integrity-health.test.mjs tests/toolscout-v2-admin-stats.test.mjs tests/toolscout-v2-outbound-integrity-schema.test.mjs tests/toolscout-v2-engine-ledger-schema.test.mjs tests/toolscout-v2-visitor-integrity-schema.test.mjs tests/toolscout-v2-traffic-schema-migration.test.mjs tests/toolscout-v2-mission-integrity-schema.test.mjs tests/toolscout-v2-public-plane.test.mjs tests/toolscout-v2-software-trends.test.mjs tests/toolscout-v2-static-guide-sovereignty.test.mjs tests/toolscout-v2-authority-health.test.mjs tests/toolscout-v2-canonical-contract.test.mjs tests/toolscout-v2-agent-protocol.test.mjs tests/toolscout-v2-machine-discovery-catalog.test.mjs tests/toolscout-v2-analytics-chairman.test.mjs tests/toolscout-v2-analytics-stats.test.mjs tests/toolscout-v2-analytics-human-actions.test.mjs tests/toolscout-v2-human-actions-mutation.test.mjs tests/toolscout-v2-public-decision-parity.test.mjs tests/toolscout-v2-public-navigation-parity.test.mjs tests/toolscout-v2-affiliate-redirect.test.mjs tests/toolscout-v2-cloudflare-primary-schema.test.mjs tests/toolscout-v2-cloudflare-primary-owner.test.mjs tests/toolscout-v2-ga4-owner-context.test.mjs tests/toolscout-v2-ga4-owner-exclusion.test.mjs tests/toolscout-v2-ga4-attribution-24h.test.mjs tests/toolscout-v2-d1-read-budget.test.mjs tests/toolscout-v2-command-center-ga4.test.mjs tests/toolscout-v2-gsc-trend-surface.test.mjs tests/toolscout-v2-public-canonical-surface.test.mjs tests/toolscout-v2-visitor-integrity-owner.test.mjs tests/toolscout-v2-traffic-integrity-live-owner.test.mjs tests/toolscout-v2-traffic-integrity-guard-owner.test.mjs tests/toolscout-v2-owner-exclusion-schema.test.mjs tests/toolscout-v2-owner-exclusion-owner.test.mjs tests/toolscout-v2-traffic-integrity-core-owner.test.mjs tests/toolscout-v2-human-truth-chart-owner.test.mjs
          node tests/growth-scheduler-ownership.mjs
