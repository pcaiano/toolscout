name: Recursive Discovery Production Smoke

on:
  workflow_run:
    workflows: ['Deploy ToolScout Worker']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        run: |
          token=$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=toolscout-discovery" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Run authenticated discovery cycle
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 60 -X POST https://toolscout.luxurybuyerintelligence.workers.dev/api/distribution/discovery/refresh -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json')
          printf '%s\n' "$response"
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s); if(x.ok!==true||typeof x.scanned!=='number'||typeof x.recursive_sources_learned!=='number') process.exit(1); console.log('Recursive discovery:',x)})"
