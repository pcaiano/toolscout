name: ToolScout decision quality 2026-10-09 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decision-quality-20261009-release.yml'
permissions:
  contents: read
concurrency:
  group: toolscout-decision-quality-20261009
  cancel-in-progress: false
jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new catalog admission and decision regressions
        run: |
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-agent-protocol.test.mjs tests/finder-quality-contract.test.mjs tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-static-guide-sovereignty.test.mjs
      - name: Cloudflare dry-run
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/decision-quality-dry-run
      - name: Publish Worker without database migrations
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live Finder and MCP decision output
        run: |
          node --input-type=module <<'NODE'
          const origin='https://trytoolscout.org';
          const asset=await fetch(origin+'/app.js?decision_quality_release=20261009',{headers:{'cache-control':'no-cache'}});
          if(!asset.ok)throw Error('Finder asset unavailable '+asset.status);
          const script=await asset.text();
          if(!script.includes('if(goal&&!sameCategory&&!nameMatch)return -1'))throw Error('Old Finder category ranking still served');
          if(!script.includes('Fit score</span>'))throw Error('Finder fit label missing');
          if(script.includes('const raw=42+'))throw Error('Finder fabricated baseline remains');
          const body={jsonrpc:'2.0',id:100,method:'tools/call',params:{name:'decide_software',arguments:{job:'CRM',budget:'free',limit:3},_meta:{'io.modelcontextprotocol/protocolVersion':'2026-07-28','io.modelcontextprotocol/clientInfo':{name:'decision-release-smoke',version:'1.0'}}}};
          const reply=await fetch(origin+'/mcp',{method:'POST',headers:{'content-type':'application/json','MCP-Protocol-Version':'2026-07-28','Mcp-Method':'tools/call','Mcp-Name':'decide_software'},body:JSON.stringify(body)});
          if(!reply.ok)throw Error('MCP endpoint HTTP '+reply.status);
          const json=await reply.json(),result=json?.result?.structuredContent;
          if(!result||!Array.isArray(result.shortlist)||!result.shortlist.length)throw Error('MCP shortlist missing '+JSON.stringify(json).slice(0,420));
          for(const row of result.shortlist){
            if(row.category!=='crm')throw Error('MCP category leakage '+row.name);
            if(!row.free_plan_verified||!row.free_plan)throw Error('Unverified free plan recommended '+row.name);
            if(!row.decision_rationale)throw Error('MCP decision rationale missing '+row.name);
            if(row.editorial_review?.evidence_source)throw Error('Private manufacturer source exposed '+row.name);
            if(!row.tool_url?.includes('/go/'))throw Error('Monetized ToolScout route missing '+row.name);
          }
          console.log('RELEASE VERIFIED: category-relevant Finder, documented MCP free CRM recommendations, private source URLs, ToolScout go routes; '+result.shortlist.length+' qualified results');
          NODE
