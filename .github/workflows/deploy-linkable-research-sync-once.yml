name: Deploy Linkable Research Sync Once

on:
  push:
    branches:
      - wire-trends-linkable-distribution-20261006
    paths:
      - '.github/workflows/deploy-linkable-research-sync-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate linkable research scheduler
        run: |
          set -euo pipefail
          node --check compute-router-worker.js
          node --test tests/toolscout-v2-linkable-assets-wrapper-removal.test.mjs tests/toolscout-v2-scheduler-ownership.test.mjs tests/toolscout-v2-public-redesign.test.mjs
          grep -Fq "syncLinkableAssets(env)" compute-router-worker.js
          grep -Fq "assetType:'original_research'" scripts/generate-software-trends-index.mjs

      - name: Wrangler dry-run
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/toolscout-linkable-sync

      - name: Deploy current main without migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Sync current original research asset now
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_TOKEN"
          curl -fsS --retry 4 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            "https://trytoolscout.org/api/distribution/linkable-assets/sync" \
            -o /tmp/linkable-sync.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/linkable-sync.json','utf8'));
          if(!d.ok)throw new Error('linkable sync not ok');
          if(Number(d.assets||0)<1)throw new Error('no original research asset found');
          console.log(JSON.stringify({ok:d.ok,assets:d.assets,indexNowQueued:d.indexNowQueued,editorialEligible:d.editorialEligible,editorialQueued:d.editorialQueued,deduped:d.deduped},null,2));
          NODE
