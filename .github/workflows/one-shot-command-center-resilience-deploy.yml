name: One Shot Command Center Resilience Deploy
# root-cause queue fix

on:
  push:
    paths:
      - ".github/workflows/one-shot-command-center-resilience-deploy.yml"

permissions:
  contents: read

concurrency:
  group: toolscout-command-center-resilience
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Command Center runtime
        run: |
          node --check command-center-simplified-view.js
          node --check command-center-resilient-worker.js
          node --check operational-truth-reconciliation-worker.js
          node --check compute-router-worker.js
          node scripts/check-distribution-copy.mjs
      - name: Deploy ToolScout Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
