name: ToolScout manufacturer evidence wave 7 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-wave7-release.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-editorial-wave7-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard vendor evidence and buyer reviews
        run: |
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs
      - name: Compile Cloudflare worker
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/ts-editorial-wave7
      - name: Deploy no-schema-change content update
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live catalog profiles and CTA routes
        run: |
          set -euo pipefail
          for slug in adcreative-ai goenhance-ai kling-ai vmaker-ai wondershare-repairit; do
            curl --retry 3 --retry-delay 2 --fail --silent --show-error -L "https://trytoolscout.org/tools/${slug}?toolscout_wave7_20261008=1" -o "/tmp/toolscout-${slug}.html"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checks=[
            ['adcreative-ai','AdCreative.ai','AdCreative.ai documents a Creative Scoring workflow'],
            ['goenhance-ai','Goenhance AI','GoEnhance AI documents text-to-video'],
            ['kling-ai','Kling AI',"Kling AI's official VIDEO 3.0 guide"],
            ['vmaker-ai','Vmaker AI','Vmaker AI documents a workflow'],
            ['wondershare-repairit','Wondershare Repairit','Wondershare Repairit documents Quick Repair']
          ];
          for(const [slug,name,lead] of checks){
            const html=fs.readFileSync('/tmp/toolscout-'+slug+'.html','utf8');
            if(!html.includes(lead)&&!html.includes(lead.replaceAll("'",'&#39;')))throw Error('Stale profile '+slug);
            if(!html.includes('href="/go/'+slug+'"'))throw Error('Monetized CTA missing '+slug);
            if(html.includes('Catalog-based; vendor claims and plan limits not independently verified'))throw Error('Old catalog-only copy '+slug);
            if(html.includes('<h1>'+name+' profile</h1>'))throw Error('Old H1 suffix '+slug);
            const externalAnchors=html.split('<a ').slice(1).map(s=>s.match(/href=["']([^"']+)["']/i)?.[1]).filter(Boolean).filter(v=>v.startsWith('http://')||v.startsWith('https://'));
            if(externalAnchors.some(link=>!/^https:\/\/(www[.])?(linkedin[.]com|x[.]com|bsky[.]app|dev[.]to|pinterest[.]com|threads[.]com)\//i.test(link)))throw Error('Non-social external link '+slug+': '+externalAnchors.join(','));
            console.log('LIVE',slug,'documented profile and /go verified');
          }
          console.log('WAVE7 RELEASE VERIFIED: five live reviewed profiles, manufacturer URLs private, affiliate CTAs present');
          NODE
