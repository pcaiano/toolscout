name: One Shot Growth Outcome Efficiency Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-growth-outcome-efficiency-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove executable supply and zero-yield cooling
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT diversified_sources,diversified_sources_due,diversified_sources_exhausted,
                 ready_email,ready_route,cooldown,researching,email_discovered_unrouted,updated_at
          FROM contact_supply_metrics WHERE id='global';

          WITH raw_due AS (
            SELECT src.source_id,src.domain
            FROM contact_supply_source src
            WHERE src.status IN ('candidate','retry','route_found','exhausted','unreachable')
              AND src.next_research_at<=datetime('now')
          ),
          eligible_due AS (
            SELECT src.source_id,src.domain
            FROM contact_supply_source src
            JOIN contact_supply_domain cs ON cs.domain=src.domain
            WHERE cs.contact_email IS NULL
              AND cs.status IN ('queued','unresolved','provider_blocked','ready_route','researching')
              AND src.status IN ('candidate','retry','route_found','exhausted','unreachable')
              AND src.next_research_at<=datetime('now')
              AND src.source_id=(
                SELECT s2.source_id FROM contact_supply_source s2
                WHERE s2.domain=cs.domain
                  AND s2.status IN ('candidate','retry','route_found','exhausted','unreachable')
                  AND s2.next_research_at<=datetime('now')
                ORDER BY s2.priority_score DESC,s2.attempts ASC,s2.updated_at ASC
                LIMIT 1
              )
              AND (
                EXISTS(SELECT 1 FROM distribution_vendor_amplification v
                  WHERE lower(v.vendor_domain)=cs.domain
                    AND v.status NOT IN ('sent','reputation_quarantine','suppressed_asset_mismatch'))
                OR EXISTS(SELECT 1 FROM distribution_network_outreach n
                  WHERE lower(n.domain)=cs.domain
                    AND n.status NOT IN ('sent','adopted','reputation_quarantine','suppressed_competitor','suppressed_technical')
                    AND NOT EXISTS(
                      SELECT 1 FROM distribution_opportunities o
                      WHERE o.surface_slug=n.surface_slug AND o.status='policy_blocked'
                    ))
              )
          )
          SELECT (SELECT COUNT(*) FROM raw_due) raw_due_sources,
                 (SELECT COUNT(*) FROM eligible_due) eligible_due_sources,
                 (SELECT COUNT(DISTINCT domain) FROM raw_due) raw_due_domains,
                 (SELECT COUNT(DISTINCT domain) FROM eligible_due) eligible_due_domains;

          SELECT COUNT(DISTINCT o.surface_slug) cooling_zero_yield_surfaces
          FROM distribution_opportunities o
          WHERE o.human_required=0
            AND o.action_url IS NOT NULL
            AND o.status IN ('candidate','discovered','research_required')
            AND o.surface_slug<>'indexnow'
            AND EXISTS(
              SELECT 1 FROM compute_overflow_jobs noyield
              WHERE noyield.job_type='distribution_route_research'
                AND noyield.subject_key=o.surface_slug
                AND noyield.status='completed'
                AND noyield.completed_at>=datetime('now','-168 hours')
                AND CAST(COALESCE(json_extract(noyield.payload_json,'$.classifierVersion'),0) AS INTEGER)>=17
                AND COALESCE(json_extract(noyield.result_json,'$.routeSummary.submissionRoutes'),0)=0
                AND COALESCE(json_extract(noyield.result_json,'$.routeSummary.machineCandidates'),0)=0
            )
            AND NOT EXISTS(
              SELECT 1 FROM distribution_auto_adapters recovery
              WHERE recovery.surface_slug=o.surface_slug
                AND recovery.policy_state='revalidation_required'
            );

          SELECT engine,status,directive,directive_json,last_evaluated_at
          FROM growth_supervisor_state
          WHERE engine='distribution';

          WITH fv AS (
            SELECT session_id,source,referrer_host,created_at,
              ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY created_at ASC,id ASC) rn
            FROM confirmed_visitor_events
            WHERE created_at>=datetime('now','-7 days')
          )
          SELECT
            SUM(CASE WHEN lower(COALESCE(NULLIF(h.source,''),v.source,'')) LIKE '%vendor_outreach%' THEN 1 ELSE 0 END) vendor_outreach_humans_7d,
            SUM(CASE WHEN lower(COALESCE(NULLIF(h.source,''),v.source,'')) LIKE '%vendor_outreach%'
                       AND h.first_evidence_at>=datetime('now','-24 hours') THEN 1 ELSE 0 END) vendor_outreach_humans_24h
          FROM traffic_human_evidence h
          LEFT JOIN fv v ON v.session_id=h.session_id AND v.rn=1
          WHERE h.first_evidence_at>=datetime('now','-7 days');
          " | tee /tmp/proof.json

          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/proof.json','utf8'));
          const metrics=p[0]?.results?.[0]||{};
          const supply=p[1]?.results?.[0]||{};
          const cooling=p[2]?.results?.[0]||{};
          const supervisor=p[3]?.results?.[0]||{};
          const vendor=p[4]?.results?.[0]||{};
          let cfg={};try{cfg=JSON.parse(supervisor.directive_json||'{}')}catch{}
          const evaluated=Date.parse(String(supervisor.last_evaluated_at||'').replace(' ','T')+'Z');
          const deployAt=Date.parse('2026-10-04T07:49:59Z');
          const supervisorFresh=Number.isFinite(evaluated)&&evaluated>=deployAt;
          const summary={
            ok:true,
            contactSupplyMetrics:metrics,
            rawDueSources:Number(supply.raw_due_sources||0),
            eligibleDueSources:Number(supply.eligible_due_sources||0),
            rawDueDomains:Number(supply.raw_due_domains||0),
            eligibleDueDomains:Number(supply.eligible_due_domains||0),
            coolingZeroYieldSurfaces:Number(cooling.cooling_zero_yield_surfaces||0),
            vendorOutreachHumans7d:Number(vendor.vendor_outreach_humans_7d||0),
            vendorOutreachHumans24h:Number(vendor.vendor_outreach_humans_24h||0),
            supervisorFresh,
            supervisor:{
              status:supervisor.status||null,
              directive:supervisor.directive||null,
              lastEvaluatedAt:supervisor.last_evaluated_at||null,
              emailOutreachCapacity:cfg?.sender_capacity?.email_outreach_capacity??cfg?.email_outreach_capacity??null,
              mode:cfg?.mode||null
            }
          };
          if(Number(supply.eligible_due_sources||0)>Number(supply.raw_due_sources||0))throw new Error('eligible due cannot exceed raw due');
          if(Number(cooling.cooling_zero_yield_surfaces||0)<1)throw new Error('zero-yield cooldown has no production cohort to protect');
          if(supervisorFresh && Number(metrics.ready_email||0)===0 && Number(vendor.vendor_outreach_humans_7d||0)>0 &&
             supervisor.directive!=='reallocate_sender_capacity_to_self_service_authority_and_search'){
            throw new Error('fresh supervisor still treats exhausted vendor outreach as repeatable: '+JSON.stringify(summary));
          }
          console.log('=== GROWTH OUTCOME EFFICIENCY PROOF ===');
          console.log(JSON.stringify(summary,null,2));
          NODE
