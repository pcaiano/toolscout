name: One Shot Phase 189 Vendor Throughput Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-189-vendor-throughput-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect vendor and sender throughput truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT status,COUNT(*) n,MAX(updated_at) latest
          FROM distribution_vendor_amplification
          GROUP BY status ORDER BY n DESC;
          SELECT tool_slug,asset_url,priority_score,status,vendor_domain,contact_email,attempts,last_attempt_at,outreach_sent_at,outreach_error,updated_at
          FROM distribution_vendor_amplification
          WHERE status IN ('queued','contact_found','sent')
          ORDER BY CASE status WHEN 'contact_found' THEN 0 WHEN 'queued' THEN 1 ELSE 2 END,priority_score DESC
          LIMIT 30;
          SELECT executor,status,action,subject_type,COUNT(*) n
          FROM growth_execution_contract
          WHERE executor='make_sender' AND status IN ('pending','claimed','attempted','deferred','stalled')
          GROUP BY executor,status,action,subject_type
          ORDER BY status,action;
          SELECT event_type,status,detail,created_at
          FROM distribution_events
          WHERE event_type IN ('vendor_outreach_sent','vendor_outreach_failed','authority_closed_loop_handoff_ready','authority_external_handoff_pending')
          ORDER BY created_at DESC LIMIT 20;
          SELECT source,referrer_host,COUNT(*) strict_humans,
                 SUM(CASE WHEN first_evidence_at>=datetime('now','-24 hours') THEN 1 ELSE 0 END) strict_humans_24h
          FROM traffic_human_evidence
          WHERE first_evidence_at>=datetime('now','-7 days')
          GROUP BY source,referrer_host
          ORDER BY strict_humans DESC;
          "
