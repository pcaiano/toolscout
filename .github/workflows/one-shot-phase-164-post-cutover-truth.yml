name: One Shot Phase 164 Post Cutover Truth # rerun 15:30 live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-164-post-cutover-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read fresh supervisor and authority execution truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo SUPERVISOR
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,status,directive,strict_humans_24h,strict_humans_7d,external_executions_24h,external_executions_7d,last_evaluated_at
          FROM growth_supervisor_state
          ORDER BY engine;
          "
          echo EXECUTION_RUNS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,evidence_json
          FROM engine_runs
          WHERE (engine='growth' AND mission IN ('execution_contract','self_audit'))
             OR (engine='distribution' AND mission IN ('network_cycle','autonomous_cycle'))
          ORDER BY started_at DESC
          LIMIT 12;
          "
          echo AUTHORITY_TASKS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,subject_key,status,last_result,claimed_at,attempted_at,verified_at,updated_at
          FROM growth_execution_contract
          WHERE executor IN ('distribution_network','distribution_autonomous')
            AND action IN ('verify_backlink_acquisition','execute_alternate_routes','publisher_contact_discovery','autonomous_route_qualification','scale_proven_surface')
            AND status IN ('pending','claimed','attempted','verified','deferred')
          ORDER BY updated_at DESC
          LIMIT 20;
          "
