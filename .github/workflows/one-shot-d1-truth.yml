name: One Shot D1 Truth - SEO Queue Diagnosis

on:
  push:
    paths:
      - ".github/workflows/one-shot-d1-truth.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect canonical D1 state read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== core counts ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT 'jobs' AS metric, COUNT(*) AS value FROM compute_overflow_jobs UNION ALL SELECT 'queued_jobs', COUNT(*) FROM compute_overflow_jobs WHERE status='queued' UNION ALL SELECT 'opportunities', COUNT(*) FROM distribution_opportunities UNION ALL SELECT 'contact_domains', COUNT(*) FROM contact_supply_domain UNION ALL SELECT 'adapters', COUNT(*) FROM distribution_auto_adapters;"
          echo "=== metrics rows ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT * FROM compute_overflow_metrics WHERE id='global'; SELECT * FROM compute_overflow_funnel_metrics WHERE id='global'; SELECT * FROM contact_supply_metrics WHERE id='global'; SELECT * FROM compute_overflow_budget ORDER BY kind;"
          echo "=== latest jobs ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT job_type,status,COUNT(*) AS n,MIN(available_at) AS min_available,MAX(updated_at) AS max_updated FROM compute_overflow_jobs GROUP BY job_type,status ORDER BY job_type,status;"
          echo "=== authorized HTTP action failures ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT job_id,subject_key,status,attempts,completed_at,last_error,json_extract(payload_json,'$.endpoint') endpoint,json_extract(result_json,'$.httpStatus') http_status,json_extract(result_json,'$.error') result_error,json_extract(result_json,'$.finalUrl') final_url FROM compute_overflow_jobs WHERE job_type='authorized_http_action' AND created_at>=datetime('now','start of day') ORDER BY created_at DESC LIMIT 20;"
          echo "=== LaunchingNext recovery state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT o.surface_slug,o.status opportunity_status,o.human_required,o.action_url,o.next_action,a.policy_state,a.endpoint,a.confidence,a.last_checked_at FROM distribution_opportunities o LEFT JOIN distribution_auto_adapters a ON a.surface_slug=o.surface_slug WHERE o.surface_slug='launchingnext-com'; SELECT submission_id,status,attempts,error,action_url,last_attempt_at,updated_at FROM distribution_submissions WHERE surface_slug='launchingnext-com' ORDER BY updated_at DESC LIMIT 10;"
          echo "=== duplicate route consolidation state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) consolidated FROM distribution_opportunities WHERE next_action='Duplicate discovered route consolidated into the canonical same-URL opportunity.'; SELECT surface_slug,status,action_url,updated_at FROM distribution_opportunities WHERE next_action='Duplicate discovered route consolidated into the canonical same-URL opportunity.' ORDER BY updated_at DESC LIMIT 30;"
          echo "=== SEO execution contract state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,COUNT(*) AS n,MIN(created_at) AS oldest_created,MAX(updated_at) AS newest_update FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status<>'cancelled' GROUP BY status ORDER BY status; SELECT task_id,source_kind,source_id,subject_key,action,status,priority_score,created_at,claim_deadline,claimed_at,attempted_at,updated_at,last_result FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status IN ('pending','claimed','attempted','stalled','deferred') ORDER BY CASE status WHEN 'pending' THEN 0 WHEN 'claimed' THEN 1 WHEN 'attempted' THEN 2 WHEN 'stalled' THEN 3 ELSE 4 END,priority_score DESC,created_at ASC LIMIT 40;"
          echo "=== recent growth execution runs ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT run_id,engine,mission,trigger_name,status,started_at,completed_at,detail FROM engine_runs WHERE engine='growth' AND mission='execution_contract' ORDER BY started_at DESC LIMIT 20;"
          echo "=== SEO task events ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT e.task_id,e.event_type,e.executor,e.status,e.detail,e.created_at FROM growth_execution_events e JOIN growth_execution_contract c ON c.task_id=e.task_id WHERE c.executor='seo_cloudflare' ORDER BY e.created_at DESC LIMIT 80;"
          echo "=== SEO supervisor state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT engine,status,directive,last_evaluated_at,correction_count,last_correction_at FROM growth_supervisor_state WHERE engine IN ('growth_brain','seo_geo_aio') ORDER BY engine;"
