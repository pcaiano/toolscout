name: One Shot D1 Truth - SEO Queue Diagnosis

on:
  push:
    paths:
      - ".github/workflows/one-shot-d1-truth.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect canonical D1 state read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== core counts ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT 'jobs' AS metric, COUNT(*) AS value FROM compute_overflow_jobs UNION ALL SELECT 'queued_jobs', COUNT(*) FROM compute_overflow_jobs WHERE status='queued' UNION ALL SELECT 'opportunities', COUNT(*) FROM distribution_opportunities UNION ALL SELECT 'contact_domains', COUNT(*) FROM contact_supply_domain UNION ALL SELECT 'adapters', COUNT(*) FROM distribution_auto_adapters;"
          echo "=== metrics rows ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT * FROM compute_overflow_metrics WHERE id='global'; SELECT * FROM compute_overflow_funnel_metrics WHERE id='global'; SELECT * FROM contact_supply_metrics WHERE id='global'; SELECT * FROM compute_overflow_budget ORDER BY kind;"
          echo "=== latest jobs ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT job_type,status,COUNT(*) AS n,MIN(available_at) AS min_available,MAX(updated_at) AS max_updated FROM compute_overflow_jobs GROUP BY job_type,status ORDER BY job_type,status;"
          echo "=== route enqueue eligibility truth ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) enqueue_match FROM distribution_opportunities WHERE COALESCE(human_required,0)=0 AND action_url IS NOT NULL AND status IN ('candidate','discovered','research_required') AND NOT EXISTS (SELECT 1 FROM compute_overflow_jobs exhausted WHERE exhausted.subject_key=distribution_opportunities.surface_slug AND exhausted.job_type='distribution_route_research' AND exhausted.status='completed' AND json_extract(exhausted.result_json,'$.outcome')='external_source_unreachable_exhausted' AND ((json_extract(exhausted.result_json,'$.retryClass')='not_found' AND exhausted.completed_at>=datetime('now','-72 hours')) OR (json_extract(exhausted.result_json,'$.retryClass')='access_blocked' AND exhausted.completed_at>=datetime('now','-24 hours')) OR (json_extract(exhausted.result_json,'$.retryClass') IN ('transport_unreachable','edge_error') AND exhausted.completed_at>=datetime('now','-12 hours')) OR (json_extract(exhausted.result_json,'$.retryClass')='transient' AND exhausted.completed_at>=datetime('now','-6 hours')))) AND (EXISTS (SELECT 1 FROM distribution_auto_adapters recovery WHERE recovery.surface_slug=distribution_opportunities.surface_slug AND recovery.policy_state='revalidation_required') OR NOT EXISTS (SELECT 1 FROM compute_overflow_jobs j WHERE j.subject_key=distribution_opportunities.surface_slug AND j.job_type='distribution_route_research' AND j.created_at>=datetime('now','-6 hours') AND CAST(COALESCE(json_extract(j.payload_json,'$.classifierVersion'),0) AS INTEGER)>=16));"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT o.surface_slug,o.status,o.human_required,o.action_url,o.distribution_score,COALESCE((SELECT a.policy_state FROM distribution_auto_adapters a WHERE a.surface_slug=o.surface_slug LIMIT 1),'') adapter_policy_state,(SELECT COUNT(*) FROM compute_overflow_jobs j WHERE j.subject_key=o.surface_slug AND j.job_type='distribution_route_research' AND j.created_at>=datetime('now','-6 hours') AND CAST(COALESCE(json_extract(j.payload_json,'$.classifierVersion'),0) AS INTEGER)>=16) recent_v16,(SELECT COUNT(*) FROM compute_overflow_jobs exhausted WHERE exhausted.subject_key=o.surface_slug AND exhausted.job_type='distribution_route_research' AND exhausted.status='completed' AND json_extract(exhausted.result_json,'$.outcome')='external_source_unreachable_exhausted' AND ((json_extract(exhausted.result_json,'$.retryClass')='not_found' AND exhausted.completed_at>=datetime('now','-72 hours')) OR (json_extract(exhausted.result_json,'$.retryClass')='access_blocked' AND exhausted.completed_at>=datetime('now','-24 hours')) OR (json_extract(exhausted.result_json,'$.retryClass') IN ('transport_unreachable','edge_error') AND exhausted.completed_at>=datetime('now','-12 hours')) OR (json_extract(exhausted.result_json,'$.retryClass')='transient' AND exhausted.completed_at>=datetime('now','-6 hours')))) cooldown FROM distribution_opportunities o WHERE COALESCE(o.human_required,0)=0 AND o.action_url IS NOT NULL AND o.status IN ('candidate','discovered','research_required') ORDER BY cooldown ASC,recent_v16 ASC,o.distribution_score DESC LIMIT 60;"
          echo "=== current route candidate outcome truth ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH latest AS (SELECT j.subject_key,j.completed_at,j.result_json,ROW_NUMBER() OVER (PARTITION BY j.subject_key ORDER BY j.created_at DESC) rn FROM compute_overflow_jobs j WHERE j.job_type='distribution_route_research' AND CAST(COALESCE(json_extract(j.payload_json,'$.classifierVersion'),0) AS INTEGER)>=16) SELECT o.surface_slug,o.surface_name,o.surface_type,o.status,o.action_url,o.distribution_score,l.completed_at,json_extract(l.result_json,'$.classification') classification,COALESCE(json_extract(l.result_json,'$.routeSummary.submissionRoutes'),0) submission_routes,COALESCE(json_extract(l.result_json,'$.routeSummary.machineCandidates'),0) machine_candidates,COALESCE(json_extract(l.result_json,'$.routeSummary.humanGateCandidates'),0) human_gate_candidates,COALESCE(json_extract(l.result_json,'$.routeSummary.manualRoutes'),0) manual_routes,json_extract(l.result_json,'$.retryClass') retry_class,json_extract(l.result_json,'$.outcome') outcome FROM distribution_opportunities o LEFT JOIN latest l ON l.subject_key=o.surface_slug AND l.rn=1 WHERE COALESCE(o.human_required,0)=0 AND o.action_url IS NOT NULL AND o.status IN ('candidate','discovered','research_required') ORDER BY o.distribution_score DESC,o.updated_at ASC LIMIT 80;"
          echo "=== classifier v12 yield and unreachable truth ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COALESCE(json_extract(result_json,'$.classification'),'null') classification,COALESCE(json_extract(result_json,'$.httpStatus'),-1) http_status,COUNT(*) n,SUM(COALESCE(json_extract(result_json,'$.routeSummary.submissionRoutes'),0)) submission_routes,SUM(COALESCE(json_extract(result_json,'$.routeSummary.machineCandidates'),0)) machine_candidates,SUM(COALESCE(json_extract(result_json,'$.routeSummary.staticPostEndpointSignals'),0)) static_post_signals FROM compute_overflow_jobs WHERE job_type='distribution_route_research' AND CAST(COALESCE(json_extract(payload_json,'$.classifierVersion'),0) AS INTEGER)>=12 AND created_at>=datetime('now','-6 hours') GROUP BY classification,http_status ORDER BY n DESC;"
          echo "=== recent source unreachable evidence ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT subject_key,json_extract(payload_json,'$.url') source_url,json_extract(result_json,'$.httpStatus') http_status,json_extract(result_json,'$.finalUrl') final_url,json_extract(result_json,'$.error') result_error,json_extract(result_json,'$.evidence.attemptedUrls') attempted_urls,completed_at FROM compute_overflow_jobs WHERE job_type='distribution_route_research' AND CAST(COALESCE(json_extract(payload_json,'$.classifierVersion'),0) AS INTEGER)>=12 AND json_extract(result_json,'$.classification')='source_unreachable' ORDER BY completed_at DESC LIMIT 40;"
          echo "=== v12 promising route signals ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT subject_key,json_extract(payload_json,'$.url') source_url,json_extract(result_json,'$.routeSummary.submissionRoutes') submission_routes,json_extract(result_json,'$.routeSummary.humanGateCandidates') human_gate_candidates,json_extract(result_json,'$.routeSummary.manualRoutes') manual_routes,json_extract(result_json,'$.routeSummary.machineCandidates') machine_candidates,json_extract(result_json,'$.routeSummary.staticPostEndpointSignals') static_post_signals,completed_at FROM compute_overflow_jobs WHERE job_type='distribution_route_research' AND CAST(COALESCE(json_extract(payload_json,'$.classifierVersion'),0) AS INTEGER)>=12 AND (COALESCE(json_extract(result_json,'$.routeSummary.submissionRoutes'),0)>0 OR COALESCE(json_extract(result_json,'$.routeSummary.staticPostEndpointSignals'),0)>0) ORDER BY completed_at DESC LIMIT 40;"
          echo "=== v16 machine adapter and action truth ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,endpoint,method,content_type,policy_state,confidence,updated_at FROM distribution_auto_adapters WHERE surface_slug IN ('route-4d261070dd6eed62','aiheadshothub-com') OR endpoint LIKE '%aiheadshothub%' ORDER BY updated_at DESC LIMIT 20;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT job_id,subject_key,status,attempts,last_error,created_at,completed_at,json_extract(payload_json,'$.endpoint') endpoint,json_extract(result_json,'$.httpStatus') http_status,json_extract(result_json,'$.accepted') accepted,json_extract(result_json,'$.responseBody') response_body FROM compute_overflow_jobs WHERE job_type='authorized_http_action' ORDER BY created_at DESC LIMIT 30;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT event_type,status,destination_url,detail,observed_at FROM distribution_events WHERE surface_slug IN ('route-4d261070dd6eed62','aiheadshothub-com') ORDER BY observed_at DESC LIMIT 30;"
          echo "=== aiheadshothub submission retry state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT o.surface_slug,o.status opportunity_status,o.human_required,o.action_url,o.next_action,a.source_url,a.endpoint,a.content_type,a.policy_state,a.confidence,a.updated_at adapter_updated FROM distribution_opportunities o LEFT JOIN distribution_auto_adapters a ON a.surface_slug=o.surface_slug WHERE o.surface_slug='route-4d261070dd6eed62'; SELECT submission_id,status,attempts,error,action_url,last_attempt_at,updated_at FROM distribution_submissions WHERE surface_slug='route-4d261070dd6eed62' ORDER BY updated_at DESC LIMIT 10;"
          echo "=== open launch gate reconciliation truth ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT o.surface_slug,o.status,o.human_required,o.action_url,o.next_action,g.gate_key,g.gate_type,g.status gate_status,g.verification_detail,json_extract(g.payload_json,'$.research_classifier_version') gate_classifier FROM distribution_opportunities o LEFT JOIN human_gate_contract g ON g.engine='distribution' AND g.subject_type='surface' AND g.subject_key=o.surface_slug WHERE o.surface_slug='open-launch-com'; SELECT submission_id,status,action_url,response_url,error,updated_at FROM distribution_submissions WHERE surface_slug='open-launch-com' ORDER BY updated_at DESC LIMIT 10;"
          echo "=== authorized HTTP action failures ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT job_id,subject_key,status,attempts,completed_at,last_error,json_extract(payload_json,'$.endpoint') endpoint,json_extract(result_json,'$.httpStatus') http_status,json_extract(result_json,'$.error') result_error,json_extract(result_json,'$.finalUrl') final_url FROM compute_overflow_jobs WHERE job_type='authorized_http_action' AND created_at>=datetime('now','start of day') ORDER BY created_at DESC LIMIT 20;"
          echo "=== LaunchingNext recovery state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT o.surface_slug,o.status opportunity_status,o.human_required,o.action_url,o.next_action,a.policy_state,a.endpoint,a.confidence,a.last_checked_at FROM distribution_opportunities o LEFT JOIN distribution_auto_adapters a ON a.surface_slug=o.surface_slug WHERE o.surface_slug='launchingnext-com'; SELECT submission_id,status,attempts,error,action_url,last_attempt_at,updated_at FROM distribution_submissions WHERE surface_slug='launchingnext-com' ORDER BY updated_at DESC LIMIT 10;"
          echo "=== duplicate route consolidation state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) consolidated FROM distribution_opportunities WHERE next_action='Duplicate discovered route consolidated into the canonical same-URL opportunity.'; SELECT surface_slug,status,action_url,updated_at FROM distribution_opportunities WHERE next_action='Duplicate discovered route consolidated into the canonical same-URL opportunity.' ORDER BY updated_at DESC LIMIT 30;"
          echo "=== SEO execution contract state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT status,COUNT(*) AS n,MIN(created_at) AS oldest_created,MAX(updated_at) AS newest_update FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status<>'cancelled' GROUP BY status ORDER BY status; SELECT task_id,source_kind,source_id,subject_key,action,status,priority_score,created_at,claim_deadline,claimed_at,attempted_at,updated_at,last_result FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status IN ('pending','claimed','attempted','stalled','deferred') ORDER BY CASE status WHEN 'pending' THEN 0 WHEN 'claimed' THEN 1 WHEN 'attempted' THEN 2 WHEN 'stalled' THEN 3 ELSE 4 END,priority_score DESC,created_at ASC LIMIT 40;"
          echo "=== key human gate truth ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT gate_key,subject_key,gate_type,status,action_url,reason,created_at,updated_at,resolved_at,verification_detail FROM human_gate_contract WHERE engine='distribution' AND subject_key IN ('sourceforge','g2','g2-com','capterra','open-launch-com','route-ab432610eee0de3b') ORDER BY subject_key,updated_at DESC; SELECT subject_key,status,completed_at,json_extract(payload_json,'$.classifierVersion') classifier_version,json_extract(result_json,'$.classification') classification,json_extract(result_json,'$.routeSummary.humanGateCandidates') human_candidates FROM compute_overflow_jobs WHERE job_type='distribution_route_research' AND subject_key IN ('sourceforge','g2','g2-com','capterra','open-launch-com','route-ab432610eee0de3b') ORDER BY subject_key,COALESCE(completed_at,updated_at) DESC LIMIT 60;"
          echo "=== remaining route candidate latest outcomes ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH candidates AS (SELECT o.surface_slug,o.action_url,o.status,o.human_required,o.distribution_score FROM distribution_opportunities o WHERE COALESCE(o.human_required,0)=0 AND o.action_url IS NOT NULL AND COALESCE(o.surface_type,'')<>'publisher_contact_route' AND (o.action_url LIKE 'https://%' OR o.action_url LIKE 'http://%') AND o.status IN ('candidate','discovered','research_required')), latest AS (SELECT j.subject_key,j.status job_status,j.last_error,j.completed_at,j.result_json,ROW_NUMBER() OVER(PARTITION BY j.subject_key ORDER BY COALESCE(j.completed_at,j.updated_at,j.created_at) DESC) rn FROM compute_overflow_jobs j WHERE j.job_type='distribution_route_research') SELECT c.surface_slug,c.action_url,c.status,c.human_required,c.distribution_score,l.job_status,l.last_error,l.completed_at,json_extract(l.result_json,'$.classification') classification,json_extract(l.result_json,'$.httpStatus') http_status,json_extract(l.result_json,'$.routeSummary.submissionRoutes') submission_routes,json_extract(l.result_json,'$.routeSummary.machineCandidates') machine_candidates,json_extract(l.result_json,'$.routeSummary.humanGateCandidates') human_candidates,json_extract(l.result_json,'$.routeSummary.manualRoutes') manual_routes,(SELECT COUNT(*) FROM human_gate_contract g WHERE g.subject_key=c.surface_slug AND g.engine='distribution' AND g.status='open') open_gates FROM candidates c LEFT JOIN latest l ON l.subject_key=c.surface_slug AND l.rn=1 ORDER BY c.distribution_score DESC,c.surface_slug LIMIT 80;"
          echo "=== autonomous overflow scheduler heartbeat ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT event_type,status,detail,created_at FROM compute_overflow_events WHERE event_type='overflow_scheduler_heartbeat' ORDER BY created_at DESC LIMIT 12; SELECT metric_day,queued,leased,completed_today,failed_today,created_today,active_batches,completed_batches_today,last_dispatched_at,last_completed_at,updated_at FROM compute_overflow_metrics WHERE id='global' LIMIT 1;"
          echo "=== recent growth execution runs ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT run_id,engine,mission,trigger_name,status,started_at,completed_at,detail FROM engine_runs WHERE engine='growth' AND mission='execution_contract' ORDER BY started_at DESC LIMIT 20;"
          echo "=== SEO task events ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT e.task_id,e.event_type,e.executor,e.status,e.detail,e.created_at FROM growth_execution_events e JOIN growth_execution_contract c ON c.task_id=e.task_id WHERE c.executor='seo_cloudflare' ORDER BY e.created_at DESC LIMIT 80;"
          echo "=== SEO supervisor state ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT engine,status,directive,last_evaluated_at,correction_count,last_correction_at FROM growth_supervisor_state WHERE engine IN ('growth_brain','seo_geo_aio') ORDER BY engine;"
