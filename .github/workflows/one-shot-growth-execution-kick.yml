name: One Shot Growth Execution Kick

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-growth-execution-kick.yml'

permissions:
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical bounded growth execution
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN secret is not available to GitHub Actions."
            exit 2
          fi
          code="$(curl --silent --show-error --output /tmp/dispatch.json --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            https://trytoolscout.org/api/growth/execution/dispatch)"
          echo "HTTP $code"
          cat /tmp/dispatch.json
          test "$code" = "200"

      - name: Probe authority immediately after dispatch
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 'https://trytoolscout.org/api/distribution/authority/closed-loop-health?fresh=1'
          echo
          curl -fsS --connect-timeout 10 --max-time 30 'https://trytoolscout.org/api/growth/supervisor/public'
          echo
