name: ToolScout editorial wave 3 production release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/editorial-20261008-wave3-release.yml']

permissions:
  contents: read

concurrency:
  group: toolscout-editorial-wave3-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate evidence contracts and current reviews
        run: |
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs
      - name: Wrangler dry run
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/toolscout-editorial-wave3-build
      - name: Deploy Cloudflare production Worker without D1 migration
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check all thirty live product profiles
        run: |
          set -euo pipefail
          mkdir -p /tmp/toolscout-editorial-live
          for slug in chatgpt claude gemini jira gitlab amplitude attio buffer constant-contact framer crisp descript freshsales gorgias grammarly intercom jasper kit miro mailerlite paperform plausible klaviyo freshdesk netlify zendesk squarespace help-scout woocommerce vercel; do
            curl --retry 3 --retry-delay 2 --fail --silent --show-error -L "https://trytoolscout.org/tools/${slug}?ts_wave3_verified=20261008" -o "/tmp/toolscout-editorial-live/${slug}.html"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const slugs='chatgpt claude gemini jira gitlab amplitude attio buffer constant-contact framer crisp descript freshsales gorgias grammarly intercom jasper kit miro mailerlite paperform plausible klaviyo freshdesk netlify zendesk squarespace help-scout woocommerce vercel'.split(' ');
          const catalog=JSON.parse(fs.readFileSync('data/tools.json','utf8'));
          const esc=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll("'",'&#39;');
          const allowed=['linkedin.com','x.com','bsky.app','dev.to','pinterest.com','threads.com'];
          for(const slug of slugs){
            const tool=catalog.find(t=>t.slug===slug);
            if(!tool)throw Error('Missing catalog record: '+slug);
            const html=fs.readFileSync('/tmp/toolscout-editorial-live/'+slug+'.html','utf8');
            if(!html.includes('<h1>'+esc(tool.name)+'</h1>'))throw Error('Outdated H1: '+slug);
            if(!html.includes(esc(tool.editorialReview.summary).slice(0,95)))throw Error('Stale editorial analysis: '+slug);
            if(!html.includes(esc(tool.editorialReview.buyerCheck)))throw Error('Missing buyer checklist: '+slug);
            if(!html.includes('href="/go/'+slug+'"'))throw Error('Missing monetized CTA: '+slug);
            if(/Catalog-based; vendor claims and plan limits not independently verified|AI integration evidence:/i.test(html))throw Error('Unsourced or leaked editorial markup: '+slug);
            const urls=html.split('<a ').slice(1).map(s=>s.match(/href=["']([^"']+)["']/i)?.[1]).filter(Boolean);
            const external=urls.filter(u=>u.startsWith('https://')||u.startsWith('http://'));
            const unexpected=external.filter(u=>{
              const host=new URL(u).hostname.toLowerCase();
              return !allowed.some(d=>host===d||host.endsWith('.'+d));
            });
            if(unexpected.length)throw Error('Unexpected external link: '+slug+' '+unexpected.join(','));
          }
          console.log('WAVE 3 RELEASE VERIFIED: all 30 live pages have final buyer analyses, product-name H1, monetized /go, no manufacturer docs');
          NODE
