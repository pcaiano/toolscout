name: ToolScout 127 editorial coverage production cutover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-127-production-cutover.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-editorial-full-catalog-cutover
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all 127 source-backed reviews and links
        run: |
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs tests/toolscout-v2-agent-protocol.test.mjs
      - name: Build without deployment
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/full-editorial-dry-run
      - name: Deploy Cloudflare without DB migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Verify latest live pages, private docs and monetized routes
        run: |
          set -euo pipefail
          for slug in moz-pro resume-ai chatzy-ai cosupport-ai deep-swap-ai face-swap-ai lip-sync-ai lorka-ai teachquill talkpix-ai typli-ai anijam-ai davinci-ai paioclaw pine-ai pixmax-ai questie-ai vidflux-ai weryai; do
            curl --fail --silent --show-error -L --retry 4 --retry-delay 2 "https://trytoolscout.org/tools/${slug}?editorial_release_full127=20261008" -o "/tmp/toolscout-live-${slug}.html"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog=JSON.parse(fs.readFileSync('data/tools.json','utf8'));
          const backlog=JSON.parse(fs.readFileSync('data/vendor-evidence-backlog.json','utf8'));
          if(catalog.length!==127||backlog.pendingSlugs.length!==0)throw Error('Documentary coverage invariant changed');
          const list=["moz-pro","resume-ai","chatzy-ai","cosupport-ai","deep-swap-ai","face-swap-ai","lip-sync-ai","lorka-ai","teachquill","talkpix-ai","typli-ai","anijam-ai","davinci-ai","paioclaw","pine-ai","pixmax-ai","questie-ai","vidflux-ai","weryai"];
          const social=new Set(['www.linkedin.com','linkedin.com','x.com','bsky.app','dev.to','www.pinterest.com','pinterest.com','www.threads.com','threads.com']);
          for(const slug of list){
            const t=catalog.find(x=>x.slug===slug);
            const html=fs.readFileSync('/tmp/toolscout-live-'+slug+'.html','utf8');
            if(!t)throw Error('Missing catalog entry '+slug);
            if(!html.includes('<h1>'+t.name+'</h1>'))throw Error('Bad visible H1 '+slug);
            const lead=t.editorialReview.summary.slice(0,38).replaceAll('&','&amp;').replaceAll("'",'&#39;');
            if(!html.includes(lead))throw Error('Stale vendor-documented review '+slug);
            if(!html.includes('href="/go/'+slug+'"'))throw Error('Missing commercial route '+slug);
            if(html.includes('Catalog-based; vendor claims and plan limits not independently verified'))throw Error('Provisional vendor copy '+slug);
            const hrefs=html.split('<a ').slice(1).map(part=>part.match(/href=["']([^"']+)["']/i)?.[1]).filter(Boolean);
            const external=hrefs.filter(h=>h.startsWith('https://')||h.startsWith('http://'));
            const leak=external.filter(h=>{try{return !social.has(new URL(h).hostname.toLowerCase())}catch{return true}});
            if(leak.length)throw Error('Unexpected public vendor/documentation links '+slug+' '+leak.join(','));
          }
          console.log('VERIFIED IN PRODUCTION: 127 catalog entries sourced; 19 latest profiles current; manufacturer documentation private; /go commercial links intact.');
          NODE
