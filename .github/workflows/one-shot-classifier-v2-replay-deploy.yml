name: One Shot Qualification Watchdog Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-classifier-v2-replay-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate qualification watchdog
        run: |
          set -euo pipefail
          node --check distribution-autonomous-worker.js
          node --check compute-router-worker.js
          node --check command-center-simplified-view.js
          node tests/compute-overflow-policy.test.mjs
          node tests/distribution-executor-lanes.test.mjs
          node tests/command-center-hybrid-architecture.test.mjs

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify qualification watchdog live
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?qualification_watchdog=$i" -o /tmp/health.json
            cat /tmp/health.json
            jq -e '(.distributionFunnel.qualificationReady15m|type=="number") and
                   (.distributionFunnel.qualificationResearch15m|type=="number") and
                   (.distributionFunnel.qualificationHuman15m|type=="number") and
                   (.distributionFunnel.qualificationAuth15m|type=="number") and
                   (.distributionFunnel.qualificationPolicy15m|type=="number")' /tmp/health.json >/dev/null
            total=$(jq '[.distributionFunnel.qualificationReady15m,
                          .distributionFunnel.qualificationResearch15m,
                          .distributionFunnel.qualificationHuman15m,
                          .distributionFunnel.qualificationAuth15m,
                          .distributionFunnel.qualificationPolicy15m] | add' /tmp/health.json)
            if [ "$total" -gt 0 ]; then exit 0; fi
            sleep 10
          done
          exit 1
