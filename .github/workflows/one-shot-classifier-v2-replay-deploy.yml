name: One Shot Qualification Reasons Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-classifier-v2-replay-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate qualification diagnostics
        run: |
          set -euo pipefail
          node --check distribution-autonomous-worker.js
          node --check compute-router-worker.js
          node --check command-center-simplified-view.js
          node tests/compute-overflow-policy.test.mjs
          node tests/distribution-executor-lanes.test.mjs
          node tests/command-center-hybrid-architecture.test.mjs
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Probe canonical qualification reasons
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?qual_reasons=$i" -o /tmp/health.json
            cat /tmp/health.json
            if jq -e '(.distributionFunnel.qualificationSafeFormUnresolved15m|type=="number") and
                      (.distributionFunnel.qualificationNoProtocol15m|type=="number") and
                      (.distributionFunnel.qualificationUnreachable15m|type=="number")' /tmp/health.json >/dev/null; then
              sleep 10
              curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?qual_reasons=after" -o /tmp/after.json
              cat /tmp/after.json
              exit 0
            fi
            sleep 5
          done
          exit 1
