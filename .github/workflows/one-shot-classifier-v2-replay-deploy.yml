name: One Shot Classifier V2 Replay Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-classifier-v2-replay-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate classifier replay
        run: |
          set -euo pipefail
          node --check compute-router-worker.js
          node --check overflow-compute/research-core.mjs
          node --check command-center-simplified-view.js
          node tests/compute-overflow-policy.test.mjs
          node tests/distribution-executor-lanes.test.mjs
          node tests/command-center-hybrid-architecture.test.mjs
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify classifier version live
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?deploy_probe=$i" -o /tmp/compute.json
            cat /tmp/compute.json
            if jq -e '.distributionClassifierVersion==2 and .status=="configured"' /tmp/compute.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
