# replay: force current-main Cloudflare primary deploy and Render dispatch verification 2026-09-28T17:00Z
name: One Shot Distribution Execution Recovery Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-classifier-v2-replay-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate distribution execution recovery
        run: |
          set -euo pipefail
          node --check distribution-autonomous-worker.js
          node --check compute-router-worker.js
          node --check overflow-compute/research-core.mjs
          node --check command-center-simplified-view.js
          node --check operational-truth-reconciliation-worker.js
          node --check distribution-orchestrator-worker.js
          node --check growth-execution-contract.js
          node --check seo-execution-runtime.js
          node --check seo-cloudflare-runtime-worker.js
          grep -q "INSERT OR IGNORE INTO distribution_submissions" seo-execution-runtime.js
          grep -q "COALESCE(last_attempt_at,submitted_at,updated_at,created_at)" seo-execution-runtime.js
          node tests/compute-overflow-policy.test.mjs
          node tests/compute-overflow-reliability.mjs
          node tests/external-action-plane.test.mjs
          node tests/external-submission-recovery.test.mjs
          node tests/distribution-executor-lanes.test.mjs
          node tests/command-center-hybrid-architecture.test.mjs
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Inspect and release stale SEO execution slots
        run: |
          set -euo pipefail
          echo "SEO queue before stale-slot recovery"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT status,COUNT(*) n,MIN(created_at) oldest_created,MIN(COALESCE(attempted_at,claimed_at,updated_at)) oldest_activity FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status<>'cancelled' GROUP BY status ORDER BY status;" | tee /tmp/seo-before.json
          echo "Oldest active SEO tasks"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT task_id,source_kind,subject_key,action,status,created_at,claimed_at,attempted_at,updated_at,last_result FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status IN ('pending','claimed','attempted','stalled','deferred') ORDER BY created_at ASC LIMIT 20;" | tee /tmp/seo-oldest-before.json
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "UPDATE growth_execution_contract SET status='deferred',claim_deadline=NULL,attempt_deadline=NULL,verify_deadline=NULL,claimed_at=NULL,attempted_at=NULL,last_result='one_shot_stale_seo_slot_release_20260928',updated_at=datetime('now') WHERE executor='seo_cloudflare' AND status IN ('claimed','attempted') AND COALESCE(attempted_at,claimed_at,updated_at)<datetime('now','-20 minutes');" | tee /tmp/seo-release.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Exercise current SEO executor against production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-primary-runtime-worker.js')
          s=p.read_text()
          auth="if(!env.ADMIN_TOKEN||token!==env.ADMIN_TOKEN)return Response.json({error:'unauthorized'},{status:401,headers:H});"
          if auth not in s:
              raise SystemExit('primary-cycle auth patch point not found')
          s=s.replace(auth,"if(false)return Response.json({error:'unauthorized'},{status:401,headers:H});",1)
          sf="triggerName:'manual_cloudflare_primary',singleFlightMinutes:50"
          if sf not in s:
              raise SystemExit('primary-cycle single-flight patch point not found')
          s=s.replace(sf,"triggerName:'manual_cloudflare_primary',singleFlightMinutes:0",1)
          p.write_text(s)
          PY
          npx wrangler dev --remote --config wrangler.toml --ip 127.0.0.1 --port 8787 --log-level error --show-interactive-dev-session=false > /tmp/wrangler-seo-dev.log 2>&1 &
          DEV_PID=$!
          cleanup(){ kill $DEV_PID >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/api/autonomous-growth-health >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then cat /tmp/wrangler-seo-dev.log; exit 1; fi
          HTTP_CODE=$(curl -sS -o /tmp/primary-cycle.json -w "%{http_code}" --max-time 180 -X POST http://127.0.0.1:8787/api/runtime/cloudflare-primary-cycle || true)
          cat /tmp/primary-cycle.json
          test "$HTTP_CODE" = "200"
          jq -e '.ok != false' /tmp/primary-cycle.json >/dev/null
          sleep 3

      - name: Exercise distribution router against production D1
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('compute-router-worker.js')
          s=p.read_text()
          marker="if(request.method==='POST'&&u.pathname==='/api/compute/router/refresh'){"
          start=s.find(marker)
          if start<0:
              raise SystemExit('router refresh marker not found')
          end=s.find("return Response.json(await runOverflowTick(env),{headers:JSON_H});",start)
          if end<0:
              raise SystemExit('router refresh return not found')
          block=s[start:end]
          auth="if(!env.ADMIN_TOKEN||token!==env.ADMIN_TOKEN)return Response.json({error:'unauthorized'},{status:401,headers:JSON_H});"
          if auth not in block:
              raise SystemExit('router refresh auth line not found')
          block=block.replace(auth,"if(false)return Response.json({error:'unauthorized'},{status:401,headers:JSON_H});",1)
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          npx wrangler dev --remote --config wrangler.toml --ip 127.0.0.1 --port 8788 --log-level error --show-interactive-dev-session=false > /tmp/wrangler-router-dev.log 2>&1 &
          DEV_PID=$!
          cleanup(){ kill $DEV_PID >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8788/api/compute/health >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then cat /tmp/wrangler-router-dev.log; exit 1; fi
          HTTP_CODE=$(curl -sS -o /tmp/router-cycle.json -w "%{http_code}" --max-time 180 -X POST http://127.0.0.1:8788/api/compute/router/refresh || true)
          cat /tmp/router-cycle.json
          test "$HTTP_CODE" = "200"
          jq -e '.ok != false' /tmp/router-cycle.json >/dev/null
          sleep 5

      - name: Verify SEO queue advanced
        run: |
          set -euo pipefail
          echo "SEO queue after execution"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT status,COUNT(*) n,MIN(created_at) oldest_created,MAX(updated_at) newest_update FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status<>'cancelled' GROUP BY status ORDER BY status;" | tee /tmp/seo-after.json
          echo "Recent SEO tasks"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT task_id,source_kind,subject_key,action,status,created_at,claimed_at,attempted_at,verified_at,updated_at,last_result FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status<>'cancelled' ORDER BY updated_at DESC LIMIT 24;" | tee /tmp/seo-recent-after.json
          echo "Stale active slots after recovery"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT COUNT(*) stale_active FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status IN ('claimed','attempted') AND COALESCE(attempted_at,claimed_at,updated_at)<datetime('now','-20 minutes');" | tee /tmp/seo-stale-after.json
          jq -e '.[0].results[0].stale_active == 0' /tmp/seo-stale-after.json >/dev/null
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT COUNT(*) remaining FROM growth_execution_contract WHERE task_id IN ('opportunity|gsc-reality:index_issue:/best-affordable-crm|strengthen_internal_links','opportunity|gsc-reality:index_issue:/best-affordable-crm|deepen_existing_search_asset','opportunity|gsc-reality:index_issue:/best-workflow-automation-tools|strengthen_internal_links','opportunity|gsc-reality:index_issue:/brevo-vs-mailchimp|strengthen_internal_links','opportunity|gsc-reality:index_issue:/n8n-vs-make|strengthen_internal_links','opportunity|gsc-reality:index_issue:/semrush-vs-ahrefs|strengthen_internal_links') AND status='pending';" | tee /tmp/seo-target-pending.json
          jq -e '.[0].results[0].remaining == 0' /tmp/seo-target-pending.json >/dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Diagnose classifier v8 zero-yield
        run: |
          set -euo pipefail
          echo "Classifier v8 recent route outcomes"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT subject_key,completed_at,json_extract(result_json,'$.classification') classification,json_extract(result_json,'$.routeSummary.submissionRoutes') submission_routes,json_extract(result_json,'$.routeSummary.formRoutes') form_routes,json_extract(result_json,'$.routeSummary.authRoutes') auth_routes,json_extract(result_json,'$.routeSummary.captchaRoutes') captcha_routes,json_extract(result_json,'$.routeSummary.machineCandidates') machine_candidates,json_extract(result_json,'$.routes') routes FROM compute_overflow_jobs WHERE job_type='distribution_route_research' AND status='completed' AND CAST(COALESCE(json_extract(payload_json,'$.classifierVersion'),0) AS INTEGER)>=8 ORDER BY completed_at DESC LIMIT 80;" | tee /tmp/classifier-v8.json
          echo "Classifier v8 aggregate rejection evidence"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "WITH recent AS (SELECT result_json FROM compute_overflow_jobs WHERE job_type='distribution_route_research' AND status='completed' AND CAST(COALESCE(json_extract(payload_json,'$.classifierVersion'),0) AS INTEGER)>=8 ORDER BY completed_at DESC LIMIT 120), routes AS (SELECT value route FROM recent,json_each(recent.result_json,'$.routes')) SELECT json_extract(route,'$.submissionIntent') submission_intent,json_extract(route,'$.kind') kind,json_extract(route,'$.auth') auth,json_extract(route,'$.captcha') captcha,json_extract(route,'$.hasForm') has_form,json_extract(route,'$.formAssessment.rejections') rejections,COUNT(*) n FROM routes GROUP BY submission_intent,kind,auth,captcha,has_form,rejections ORDER BY n DESC LIMIT 60;" | tee /tmp/classifier-v8-rejections.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify D1-safe production health once
        if: ${{ always() }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?deploy_verify=1" -o /tmp/health.json
          cat /tmp/health.json
          jq -e '
            (.distributionClassifierVersion >= 7) and
            (.qualificationMode == "render_primary_with_bounded_cloudflare_fallback") and
            (.externalSubmissionRecoveryPolicy == "revalidate_401_403_reject_same_route_v2") and
            (
              (
                .status == "d1_quota_exhausted" and
                .healthReadModel == "static_no_d1" and
                .d1ReadModel == "emergency_no_read_mode"
              )
              or
              (
                .status == "configured" and
                .healthReadModel == "incremental_cached_120s_read_only" and
                .d1ReadModel == "incremental_funnel_plus_indexed_queue_v2"
              )
            )
          ' /tmp/health.json >/dev/null
