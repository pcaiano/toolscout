name: One Shot Backlog First Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-classifier-v2-replay-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate backlog-first dispatch
        run: |
          set -euo pipefail
          node --check compute-router-worker.js
          node tests/compute-overflow-policy.test.mjs
          node tests/distribution-executor-lanes.test.mjs
          node tests/command-center-hybrid-architecture.test.mjs
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify idle backlog immediately drains
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?backlog_first=before" -o /tmp/before.json
          cat /tmp/before.json
          before_q=$(jq -r '.queued // 0' /tmp/before.json)
          before_d=$(jq -r '.completedToday // 0' /tmp/before.json)
          before_last=$(jq -r '.lastDispatchedAt // ""' /tmp/before.json)
          for i in $(seq 1 12); do
            sleep 5
            curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?backlog_first=$i" -o /tmp/after.json
            cat /tmp/after.json
            q=$(jq -r '.queued // 0' /tmp/after.json)
            d=$(jq -r '.completedToday // 0' /tmp/after.json)
            a=$(jq -r '.activeBatches // 0' /tmp/after.json)
            last=$(jq -r '.lastDispatchedAt // ""' /tmp/after.json)
            if [ "$a" -gt 0 ] || [ "$q" -lt "$before_q" ] || [ "$d" -gt "$before_d" ] || [ "$last" != "$before_last" ]; then
              exit 0
            fi
          done
          exit 1
