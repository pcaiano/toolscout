name: One Shot Qualification Samples Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-classifier-v2-replay-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate qualification samples
        run: |
          set -euo pipefail
          node --check compute-router-worker.js
          node --check distribution-autonomous-worker.js
          node tests/compute-overflow-policy.test.mjs
          node tests/distribution-executor-lanes.test.mjs
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Print qualification samples
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            curl -fsS --max-time 20 "https://trytoolscout.org/api/compute/health?qual_samples=$i" -o /tmp/health.json
            cat /tmp/health.json
            if jq -e '(.qualificationSamples|type=="array")' /tmp/health.json >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
