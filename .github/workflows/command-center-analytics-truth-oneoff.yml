name: One off Command Center analytics truth refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/command-center-analytics-truth-oneoff.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate analytics truth JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/external-analytics-truth.json','utf8')); console.log('analytics truth json ok')"
      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
