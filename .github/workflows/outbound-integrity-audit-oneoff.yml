name: One off outbound integrity audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/outbound-integrity-audit-oneoff.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit outbound tracking
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo '=== META ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT key,value FROM outbound_integrity_meta;"
          echo '=== COUNTS SINCE TRACKING START ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH t AS (SELECT value AS started FROM outbound_integrity_meta WHERE key='tracking_started_at') SELECT (SELECT COUNT(*) FROM click_events,t WHERE click_events.created_at>=t.started) AS raw_clicks_since_tracking, (SELECT COUNT(*) FROM click_events c JOIN sessions s ON s.session_id=c.session_id,t WHERE c.created_at>=t.started AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci') AND s.classification IN ('likely-human','human')) AS classified_human_clicks_since_tracking, (SELECT COUNT(*) FROM click_events c JOIN traffic_guard_events g ON g.session_id=c.session_id AND g.decision='allowed',t WHERE c.created_at>=t.started AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci')) AS guard_linked_clicks_since_tracking, (SELECT COUNT(*) FROM verified_outbound_events,t WHERE verified_outbound_events.created_at>=t.started) AS verified_outbound_since_tracking;"
          echo '=== LAST 24H COUNTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT (SELECT COUNT(*) FROM click_events WHERE created_at>=datetime('now','-24 hours')) raw_clicks_24h, (SELECT COUNT(*) FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE c.created_at>=datetime('now','-24 hours') AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci') AND s.classification IN ('likely-human','human')) classified_human_clicks_24h, (SELECT COUNT(*) FROM click_events c JOIN traffic_guard_events g ON g.session_id=c.session_id AND g.decision='allowed' WHERE c.created_at>=datetime('now','-24 hours') AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci')) guard_linked_clicks_24h, (SELECT COUNT(*) FROM verified_outbound_events WHERE created_at>=datetime('now','-24 hours')) verified_outbound_24h;"
          echo '=== BY SOURCE 24H ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT source,COUNT(*) clicks,SUM(CASE WHEN affiliate_active_at_click=1 THEN 1 ELSE 0 END) monetized FROM click_events WHERE created_at>=datetime('now','-24 hours') GROUP BY source ORDER BY clicks DESC;"
          echo '=== HUMAN CLICK SESSION LIFECYCLE ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT c.id,c.tool_slug,c.source,c.created_at click_at,substr(c.session_id,1,8) click_sid,s.first_seen_at,s.last_seen_at,s.source session_source,s.classification,CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=c.session_id AND f.event_type='session_started') THEN 1 ELSE 0 END has_session_started,CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=c.session_id AND f.event_type='page_confirmed') THEN 1 ELSE 0 END has_page_confirmed,CASE WHEN EXISTS(SELECT 1 FROM confirmed_visitor_events v WHERE v.session_id=c.session_id) THEN 1 ELSE 0 END has_confirmed_visitor FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE c.created_at>=datetime('now','-24 hours') AND s.classification IN ('likely-human','human') AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci') ORDER BY c.id DESC LIMIT 40;"
          echo '=== GUARD SESSION OVERLAP ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT (SELECT COUNT(DISTINCT c.session_id) FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE c.created_at>=datetime('now','-24 hours') AND s.classification IN ('likely-human','human')) human_click_sessions, (SELECT COUNT(DISTINCT session_id) FROM traffic_guard_events WHERE decision='allowed' AND created_at>=datetime('now','-24 hours')) guard_sessions, (SELECT COUNT(DISTINCT c.session_id) FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE c.created_at>=datetime('now','-24 hours') AND s.classification IN ('likely-human','human') AND EXISTS(SELECT 1 FROM traffic_guard_events g WHERE g.session_id=c.session_id AND g.decision='allowed')) overlap_sessions, (SELECT COUNT(DISTINCT c.session_id) FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE c.created_at>=datetime('now','-24 hours') AND s.classification IN ('likely-human','human') AND EXISTS(SELECT 1 FROM confirmed_visitor_events v WHERE v.session_id=c.session_id)) visitor_overlap_sessions;"
          echo '=== HUMAN CLICK ORIGIN PROOF ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH hc AS (SELECT c.id,c.session_id,c.tool_slug,c.created_at FROM click_events c JOIN sessions s ON s.session_id=c.session_id WHERE c.created_at>=datetime('now','-24 hours') AND s.classification IN ('likely-human','human') AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci')) SELECT COUNT(*) human_clicks, SUM(CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=hc.session_id AND f.event_type='outbound_clicked' AND LOWER(COALESCE(f.referrer_host,'')) IN ('trytoolscout.org','www.trytoolscout.org')) THEN 1 ELSE 0 END) same_origin_referrer_clicks, SUM(CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=hc.session_id AND f.created_at<hc.created_at AND f.event_type NOT IN ('outbound_clicked','session_started')) THEN 1 ELSE 0 END) clicks_with_prior_site_event, SUM(CASE WHEN EXISTS(SELECT 1 FROM confirmed_visitor_events v WHERE v.session_id=hc.session_id) THEN 1 ELSE 0 END) clicks_with_confirmed_visitor FROM hc;"
          echo '=== SAMPLE HUMAN CLICK ORIGINS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT c.id,c.tool_slug,c.created_at,COALESCE(f.referrer_host,'NO_REFERRER') referrer_host,f.path,f.source funnel_source FROM click_events c JOIN sessions s ON s.session_id=c.session_id LEFT JOIN funnel_events f ON f.session_id=c.session_id AND f.event_type='outbound_clicked' WHERE c.created_at>=datetime('now','-24 hours') AND s.classification IN ('likely-human','human') AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci') ORDER BY c.id DESC LIMIT 30;"
          echo '=== RECENT CLICK CLASSIFICATION ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT c.id,c.tool_slug,c.source,c.affiliate_active_at_click,c.created_at,COALESCE(s.classification,'NO_SESSION') classification,CASE WHEN EXISTS(SELECT 1 FROM traffic_guard_events g WHERE g.session_id=c.session_id AND g.decision='allowed') THEN 1 ELSE 0 END guard_allowed,CASE WHEN EXISTS(SELECT 1 FROM verified_outbound_events v WHERE v.click_id=c.id) THEN 1 ELSE 0 END verified FROM click_events c LEFT JOIN sessions s ON s.session_id=c.session_id WHERE c.created_at>=datetime('now','-24 hours') ORDER BY c.id DESC LIMIT 50;"
