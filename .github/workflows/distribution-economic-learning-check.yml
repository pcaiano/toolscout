name: Distribution Economic Learning Check

on:
  pull_request:
    paths:
      - 'distribution-impact-worker.js'
      - 'distribution-orchestrator-worker.js'
      - 'migrations/0048_distribution_economic_learning.sql'
      - '.github/workflows/distribution-economic-learning-check.yml'
  push:
    branches: [main]
    paths:
      - 'distribution-impact-worker.js'
      - 'distribution-orchestrator-worker.js'
      - 'migrations/0048_distribution_economic_learning.sql'
      - '.github/workflows/distribution-economic-learning-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate syntax
        run: |
          node --check distribution-impact-worker.js
          node --check distribution-orchestrator-worker.js
      - name: Validate economic learning architecture
        run: |
          test -s migrations/0048_distribution_economic_learning.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS distribution_economic_learning' migrations/0048_distribution_economic_learning.sql
          grep -Fq 'export async function distributionSurfaceMetrics' distribution-impact-worker.js
          grep -Fq "import {distributionSurfaceMetrics}" distribution-orchestrator-worker.js
          grep -Fq 'function economicBoost' distribution-orchestrator-worker.js
          grep -Fq "distribution_economic_learning" distribution-orchestrator-worker.js
          grep -Fq "No surface is penalized for missing data" distribution-orchestrator-worker.js
          grep -Fq "/api/distribution/economic-learning" distribution-orchestrator-worker.js
