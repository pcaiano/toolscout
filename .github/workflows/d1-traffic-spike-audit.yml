name: D1 Traffic Spike Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-traffic-spike-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit canonical D1 traffic spike
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo '=== HOURLY_24H ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT strftime('%Y-%m-%d %H:00',f.created_at) AS hour_utc, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at>=datetime('now','-24 hours') GROUP BY 1 ORDER BY 1;"
          echo '=== TOP_PATH_SOURCE_REFERRER_8H ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COALESCE(f.path,'(none)') AS path, COALESCE(f.source,'(none)') AS source, COALESCE(f.referrer_host,'(none)') AS referrer, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at>=datetime('now','-8 hours') GROUP BY 1,2,3 ORDER BY sessions DESC LIMIT 30;"
          echo '=== BURST_MINUTES_8H ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT substr(f.created_at,1,16) AS minute_utc, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at>=datetime('now','-8 hours') GROUP BY 1 HAVING COUNT(DISTINCT f.session_id)>=2 ORDER BY minute_utc;"
          echo '=== SOURCE_8H ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COALESCE(f.source,'(none)') AS source, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at>=datetime('now','-8 hours') GROUP BY 1 ORDER BY sessions DESC;"
          echo '=== REFERRER_8H ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COALESCE(f.referrer_host,'(none)') AS referrer, COUNT(DISTINCT f.session_id) AS sessions FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at>=datetime('now','-8 hours') GROUP BY 1 ORDER BY sessions DESC LIMIT 20;"
          echo '=== EVENT_SANITY_8H ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) AS page_confirmed_events, COUNT(DISTINCT f.session_id) AS distinct_sessions, MIN(f.created_at) AS first_at, MAX(f.created_at) AS last_at FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='page_confirmed' AND s.classification IN ('likely-human','human') AND f.created_at>=datetime('now','-8 hours');"
# audit trigger