name: One Shot Durable Catalog Peer Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-complete-runtime-peer-parity.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-durable-catalog-peer-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy durable catalog peers'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical catalog inputs
        run: |
          node --check catalog-autonomy-worker.js
          node --check dynamic-worker.js
          node --check operational-truth-reconciliation-worker.js
          node - <<'NODE'
          const fs=require('fs');
          const tools=JSON.parse(fs.readFileSync('data/tools.json','utf8'));
          const assets=JSON.parse(fs.readFileSync('data/tool-assets.json','utf8')).assets||{};
          const expected=['character-ai','google-ai-studio','kling-ai','otter-ai'];
          const slugs=tools.map(x=>x.slug);
          if(tools.length!==106)throw new Error('expected 106 persistent tools, got '+tools.length);
          if(new Set(slugs).size!==slugs.length)throw new Error('duplicate catalog slugs');
          for(const slug of expected){
            const t=tools.find(x=>x.slug===slug);
            if(!t)throw new Error('missing '+slug);
            if(t.rankingEligible!==true||t.comparisonEligible!==true)throw new Error(slug+' parity flags missing');
            if(!assets[slug]?.url)throw new Error(slug+' asset missing');
          }
          console.log(JSON.stringify({tools:tools.length,peers:expected}));
          NODE

      - name: Generate static tool profiles and sitemap
        run: |
          node scripts/generate-tool-pages.mjs
          node scripts/generate-sitemap.mjs
          node - <<'NODE'
          const fs=require('fs');
          const expected=['character-ai','google-ai-studio','kling-ai','otter-ai'];
          for(const slug of expected){
            const p='tools/'+slug+'.html';
            if(!fs.existsSync(p))throw new Error('missing generated profile '+p);
          }
          NODE

      - name: Commit generated catalog artifacts
        run: |
          git config user.name "toolscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools sitemap.xml reports/tool-profile-holds.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate durable catalog peer profiles"
            git push origin HEAD:main
          fi

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test durable peer parity
        run: |
          node - <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          await sleep(10000);
          const invRes=await fetch('https://trytoolscout.org/data/catalog-inventory.json',{cache:'no-store'});
          if(!invRes.ok)throw new Error('inventory '+invRes.status);
          const inv=await invRes.json();
          const expected=['character-ai','google-ai-studio','kling-ai','otter-ai'];
          const map=new Map((inv.tools||[]).map(x=>[x.slug,x]));
          for(const slug of expected)if(!map.has(slug))throw new Error('missing canonical peer '+slug);
          if(Number(inv.total)!==106)throw new Error('expected 106 canonical tools, got '+inv.total);
          if(Number(inv.static_unique)!==106)throw new Error('expected 106 persistent peers, got '+inv.static_unique);
          const profiles={};
          for(const slug of expected){
            const r=await fetch('https://trytoolscout.org/tools/'+slug,{redirect:'manual',cache:'no-store'});
            profiles[slug]=r.status;
            if(r.status!==200)throw new Error(slug+' profile '+r.status);
          }
          const routes={};
          for(const slug of ['google-ai-studio','kling-ai','otter-ai']){
            const r=await fetch('https://trytoolscout.org/go/'+slug,{redirect:'manual',cache:'no-store'});
            routes[slug]={status:r.status,location:r.headers.get('location')};
            if(![301,302,303,307,308].includes(r.status))throw new Error(slug+' go route '+r.status);
          }
          console.log(JSON.stringify({total:inv.total,static_unique:inv.static_unique,runtime_unique:inv.runtime_unique,affiliate:inv.affiliate,profiles,routes}));
          NODE
