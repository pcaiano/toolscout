name: One Shot Complete Runtime Peer Parity Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-complete-runtime-peer-parity.yml"

permissions:
  contents: read

concurrency:
  group: one-shot-complete-runtime-peer-parity
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy complete runtime peer parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Validate Worker syntax
        run: |
          node --check catalog-autonomy-worker.js
          node --check dynamic-worker.js

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test runtime peer parity
        run: |
          node - <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          await sleep(8000);
          const invRes=await fetch('https://trytoolscout.org/data/catalog-inventory.json',{cache:'no-store'});
          if(!invRes.ok)throw new Error('inventory '+invRes.status);
          const inv=await invRes.json();
          const expected=['character-ai','google-ai-studio','kling-ai','otter-ai'];
          const map=new Map((inv.tools||[]).map(x=>[x.slug,x]));
          for(const slug of expected)if(!map.has(slug))throw new Error('missing canonical peer '+slug);
          if(Number(inv.total)!==106)throw new Error('expected 106 canonical tools, got '+inv.total);
          const profiles={};
          for(const slug of expected){
            const r=await fetch('https://trytoolscout.org/tools/'+slug,{redirect:'manual',cache:'no-store'});
            profiles[slug]=r.status;
            if(r.status!==200)throw new Error(slug+' profile '+r.status);
          }
          const routes={};
          for(const slug of ['google-ai-studio','kling-ai','otter-ai']){
            const r=await fetch('https://trytoolscout.org/go/'+slug,{redirect:'manual',cache:'no-store'});
            routes[slug]={status:r.status,location:r.headers.get('location')};
            if(![301,302,303,307,308].includes(r.status))throw new Error(slug+' go route '+r.status);
          }
          console.log(JSON.stringify({total:inv.total,runtime_unique:inv.runtime_unique,affiliate:inv.affiliate,profiles,routes}));
          NODE
