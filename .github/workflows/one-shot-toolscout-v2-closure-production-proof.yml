name: One Shot ToolScout 2.0 Closure Production Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-toolscout-v2-closure-production-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove closure governance against production truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS 'https://trytoolscout.org/api/runtime/schedule-contract' > /tmp/schedule.json

          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT o.surface_slug,o.surface_name,o.surface_type,o.status opportunity_status,
                 o.action_url,
                 COALESCE(n.status,'') network_status,
                 COALESCE(l.browser_confirmed_sessions_30d,0) strict_sessions,
                 COALESCE(l.outbound_clicks_30d,0) outbound_clicks,
                 COALESCE(l.monetized_outbound_30d,0) monetized_outbound,
                 EXISTS(SELECT 1 FROM distribution_contact_route_actions a
                        WHERE a.surface_slug=o.surface_slug AND a.status='verified_human_impact') route_human,
                 EXISTS(SELECT 1 FROM distribution_contact_route_actions a
                        WHERE a.surface_slug=o.surface_slug AND a.status='verified_placement') route_placement
          FROM distribution_opportunities o
          LEFT JOIN distribution_network_outreach n ON n.surface_slug=o.surface_slug
          LEFT JOIN distribution_economic_learning l ON l.surface_slug=o.surface_slug
          WHERE COALESCE(o.human_required,0)=0
            AND lower(COALESCE(o.action_url,'')) NOT LIKE 'https://trytoolscout.org/%'
            AND (
              o.status IN ('live','verified')
              OR COALESCE(l.browser_confirmed_sessions_30d,0)>0
              OR COALESCE(l.outbound_clicks_30d,0)>0
              OR COALESCE(l.monetized_outbound_30d,0)>0
            )
            AND (
              n.status='adopted'
              OR EXISTS(SELECT 1 FROM distribution_contact_route_actions a
                        WHERE a.surface_slug=o.surface_slug AND a.status IN ('verified_human_impact','verified_placement'))
              OR COALESCE(l.browser_confirmed_sessions_30d,0)>0
              OR COALESCE(l.outbound_clicks_30d,0)>0
              OR COALESCE(l.monetized_outbound_30d,0)>0
            )
          ORDER BY o.distribution_score DESC,o.updated_at DESC
          LIMIT 80;

          SELECT c.task_id,c.subject_key,c.status,c.last_result,
                 o.surface_name,o.surface_type,o.action_url
          FROM growth_execution_contract c
          LEFT JOIN distribution_opportunities o ON o.surface_slug=c.subject_key
          WHERE c.action='scale_proven_surface'
            AND c.status IN ('pending','claimed','attempted','deferred','stalled')
          ORDER BY c.updated_at DESC
          LIMIT 80;
          " | tee /tmp/proof-truth.json

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {competitiveOutreachExclusion} from './distribution-outreach-policy.js';

          const payload=JSON.parse(fs.readFileSync('/tmp/proof-truth.json','utf8'));
          const candidates=payload[0]?.results||[];
          const active=payload[1]?.results||[];
          const assess=row=>competitiveOutreachExclusion({
            surface_type:row.surface_type,
            surface_name:row.surface_name,
            action_url:row.action_url
          });

          const assessed=candidates.map(row=>({row,policy:assess(row)}));
          const eligible=assessed.filter(x=>!x.policy.excluded);
          const unsafeActive=active
            .map(row=>({row,policy:assess(row)}))
            .filter(x=>x.policy.excluded && ['pending','claimed','attempted','stalled'].includes(String(x.row.status)));

          const schedule=JSON.parse(fs.readFileSync('/tmp/schedule.json','utf8'));
          if(schedule?.crons?.hourly!=='20 * * * *')throw new Error('canonical hourly cron drift');
          if(schedule?.missions?.authority_sender_drain?.cron!=='20 * * * *')throw new Error('authority sender drain contract drift');
          if(unsafeActive.length)throw new Error('competitive scale task escaped fail-closed governance: '+JSON.stringify(unsafeActive));

          console.log(JSON.stringify({
            ok:true,
            mode:eligible.length?'eligible_surface_present':'armed_waiting_for_first_eligible_surface',
            eligibleCount:eligible.length,
            candidateCount:candidates.length,
            unsafeCompetitiveActive:unsafeActive.length,
            hourly:schedule.crons.hourly,
            authoritySenderDrain:schedule.missions.authority_sender_drain,
            candidates:assessed.map(x=>({
              slug:x.row.surface_slug,
              type:x.row.surface_type,
              strict:Number(x.row.strict_sessions||0),
              routeHuman:Number(x.row.route_human||0),
              routePlacement:Number(x.row.route_placement||0),
              excluded:x.policy.excluded,
              reason:x.policy.reason
            }))
          },null,2));
          NODE
