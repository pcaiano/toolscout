name: ToolScout read-only Google traffic quality diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-quality-diagnostic.yml'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ToolScout D1 target
        shell: bash
        run: |
          grep -q 'database_name = "toolscout"' wrangler.toml
          grep -q 'database_id = "cac6bc3c-d838-4edd-ba29-597030afb397"' wrangler.toml
      - name: Query settled-day Google referrer sessions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== 2026-09-14 Lisbon D1 GOOGLE REFERRER SUMMARY ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH cohort AS (SELECT DISTINCT s.session_id FROM sessions s JOIN funnel_events f ON f.session_id=s.session_id WHERE s.classification IN ('likely-human','human') AND s.source='ref:google.com' AND f.event_type='page_confirmed' AND f.created_at >= '2026-09-13 23:00:00' AND f.created_at < '2026-09-14 23:00:00'), per_session AS (SELECT c.session_id, COUNT(e.event_id) event_count, SUM(CASE WHEN e.event_type NOT IN ('session_started','page_confirmed') THEN 1 ELSE 0 END) meaningful_events, CAST((julianday(MAX(e.created_at))-julianday(MIN(e.created_at)))*86400 AS INTEGER) duration_seconds FROM cohort c JOIN funnel_events e ON e.session_id=c.session_id GROUP BY c.session_id) SELECT COUNT(*) sessions, SUM(CASE WHEN meaningful_events>0 THEN 1 ELSE 0 END) engaged_sessions, SUM(CASE WHEN event_count<=2 AND duration_seconds<=5 THEN 1 ELSE 0 END) minimal_fast_sessions, ROUND(AVG(duration_seconds),1) avg_duration_seconds FROM per_session;"
          echo '=== 2026-09-14 Lisbon D1 GOOGLE LANDINGS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH cohort AS (SELECT DISTINCT s.session_id FROM sessions s JOIN funnel_events f ON f.session_id=s.session_id WHERE s.classification IN ('likely-human','human') AND s.source='ref:google.com' AND f.event_type='page_confirmed' AND f.created_at >= '2026-09-13 23:00:00' AND f.created_at < '2026-09-14 23:00:00'), starts AS (SELECT e.session_id,MIN(e.created_at) first_at FROM funnel_events e JOIN cohort c ON c.session_id=e.session_id GROUP BY e.session_id) SELECT e.path,COUNT(DISTINCT e.session_id) sessions FROM funnel_events e JOIN starts x ON x.session_id=e.session_id AND x.first_at=e.created_at GROUP BY e.path ORDER BY sessions DESC,e.path;"
