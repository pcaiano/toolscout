name: ToolScout Editorial Authority 95 Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-authority-95-finalize.yml'

permissions:
  contents: write

concurrency:
  group: toolscout-editorial-authority-95-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Editorial Authority 95 sources
        run: |
          set -euo pipefail
          node --check scripts/editorial-authority-model.mjs
          node --check scripts/build-editorial-authority-portfolio.mjs
          node --check scripts/generate-tool-pages.mjs
          node --check scripts/generate-seo-pages.mjs
          node --check scripts/generate-comparisons.mjs
          node --check scripts/enforce-seo-hygiene.mjs
          node --check command-center-light-theme-worker.js
          node --test tests/toolscout-v2-editorial-authority.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs

      - name: Regenerate canonical decision surface
        run: |
          set -euo pipefail
          node scripts/generate-seo-pages.mjs
          node scripts/prune-uncontrolled-seo-guides.mjs
          node scripts/enrich-decision-context.mjs
          node scripts/generate-comparisons.mjs
          node scripts/enrich-comparison-context.mjs
          node scripts/generate-tool-pages.mjs
          node scripts/prune-orphan-tool-profiles.mjs
          node scripts/link-static-tool-profiles.mjs
          node scripts/enrich-guide-comparisons.mjs
          node scripts/enforce-seo-hygiene.mjs --fix
          node scripts/enforce-seo-hygiene.mjs
          node scripts/enforce-outbound-ux.mjs --fix
          node scripts/build-editorial-authority-portfolio.mjs
          node scripts/generate-sitemap.mjs

      - name: Require the full existing surface to meet 95
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('reports/editorial-authority-portfolio.json','utf8'));
          const s=r.summary||{};
          if(r.hardFloorScore!==90||r.targetScore!==95||r.excellenceScore!==98)throw new Error('editorial_policy_regressed');
          if(Number(s.belowHardFloor||0)!==0)throw new Error('pages_below_90:'+s.belowHardFloor);
          if(Number(s.belowTarget||0)!==0)throw new Error('pages_below_95:'+s.belowTarget);
          console.log(JSON.stringify({averageScore:s.averageScore,existing:s.existing,healthy95Plus:s.healthy95Plus,excellent98Plus:s.excellent98Plus,missingPublicSurface:s.missingPublicSurface},null,2));
          NODE

      - name: Validate regenerated surface
        run: |
          set -euo pipefail
          node scripts/validate-machine-readability.mjs
          node scripts/validate-seo-pages.mjs
          node scripts/validate-editorial-trust.mjs
          node scripts/validate-public-surface.mjs
          node scripts/validate-commercial-indexability.mjs

      - name: Commit regenerated Editorial Authority 95 assets
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- '*.html' 'tools/*.html' reports/editorial-authority-portfolio.json sitemap.xml)" ]; then
            echo "Editorial Authority 95 surface already current."
            exit 0
          fi
          git config user.name "toolscout-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'tools/*.html' reports/editorial-authority-portfolio.json sitemap.xml
          git commit -m "Bring indexable editorial surface to 95 quality target"
          git stash push --include-untracked -m "editorial-authority-95-transient-validation-artifacts" || true
          git pull --rebase origin main
          git push origin HEAD:main
