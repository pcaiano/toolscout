name: Check yesterday guard gap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-yesterday-guard-gap.yml'

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query yesterday guard gap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== YESTERDAY GUARD WINDOW LISBON ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT MIN(created_at) first_guard,MAX(created_at) last_guard,COUNT(*) guard_events,COUNT(DISTINCT session_id) guard_sessions FROM traffic_guard_events WHERE created_at>='2026-09-15 23:00:00' AND created_at<'2026-09-16 23:00:00';"
          echo '=== ALLOWED VS PAGE_CONFIRMED ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(DISTINCT g.session_id) allowed_sessions,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=g.session_id AND f.event_type='page_confirmed') THEN g.session_id END) with_page_confirmed,COUNT(DISTINCT CASE WHEN NOT EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=g.session_id AND f.event_type='page_confirmed') THEN g.session_id END) missing_page_confirmed FROM traffic_guard_events g WHERE g.decision='allowed' AND g.created_at>='2026-09-15 23:00:00' AND g.created_at<'2026-09-16 23:00:00';"
          echo '=== MISSING BY CLASSIFICATION ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COALESCE(s.classification,'missing') classification,COUNT(DISTINCT g.session_id) sessions FROM traffic_guard_events g LEFT JOIN sessions s ON s.session_id=g.session_id WHERE g.decision='allowed' AND g.created_at>='2026-09-15 23:00:00' AND g.created_at<'2026-09-16 23:00:00' AND NOT EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=g.session_id AND f.event_type='page_confirmed') GROUP BY COALESCE(s.classification,'missing') ORDER BY sessions DESC;"
          echo '=== MISSING BY HOUR ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT substr(g.created_at,1,13) hour_utc,COUNT(DISTINCT g.session_id) sessions FROM traffic_guard_events g WHERE g.decision='allowed' AND g.created_at>='2026-09-15 23:00:00' AND g.created_at<'2026-09-16 23:00:00' AND NOT EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=g.session_id AND f.event_type='page_confirmed') GROUP BY substr(g.created_at,1,13) ORDER BY hour_utc;"
