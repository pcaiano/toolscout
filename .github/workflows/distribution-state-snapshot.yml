name: Distribution State Snapshot

on:
  push:
    paths:
      - '.github/workflows/distribution-state-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export current distribution state with bounded D1 reads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          function q(sql){
            const out=execFileSync('npx',['wrangler','d1','execute','toolscout','--remote','--config','wrangler.toml','--json','--command',sql],{encoding:'utf8'});
            const parsed=JSON.parse(out);
            const block=Array.isArray(parsed)?parsed[0]:(Array.isArray(parsed?.result)?parsed.result[0]:parsed);
            return {rows:block?.results||[],meta:block?.meta||{}};
          }
          const opportunities=q(`SELECT surface_slug,surface_name,surface_type,status,live_url,action_url,human_required,last_checked_at,next_action FROM distribution_opportunities ORDER BY status,surface_slug LIMIT 250`);
          const submissions=q(`SELECT surface_slug,status,COUNT(*) AS count,MAX(submitted_at) AS last_submitted_at,MAX(updated_at) AS last_updated_at FROM distribution_submissions GROUP BY surface_slug,status ORDER BY surface_slug,status LIMIT 250`);
          const events=q(`SELECT surface_slug,event_type,status,destination_url,detail,created_at FROM distribution_events ORDER BY created_at DESC LIMIT 40`);
          const verified=opportunities.rows.filter(x=>['live','verified'].includes(String(x.status||'')));
          const publicVerified=verified.filter(x=>x.live_url||x.action_url);
          const automaticKnown=opportunities.rows.filter(x=>Number(x.human_required||0)===0&&['live','verified','submitted','ready_to_submit','scheduled'].includes(String(x.status||'')));
          const snapshot={generatedAt:new Date().toISOString(),counts:{opportunities:opportunities.rows.length,verifiedOrLive:verified.length,publicVerifiedWithUrl:publicVerified.length,automaticKnown:automaticKnown.length},verifiedOrLive:verified,automaticKnown,submissions:submissions.rows,recentEvents:events.rows,d1Usage:{rowsRead:[opportunities,submissions,events].reduce((n,x)=>n+Number(x.meta?.rows_read||0),0)}};
          fs.writeFileSync('data/distribution-state.json',JSON.stringify(snapshot,null,2)+'\n');
          console.log(JSON.stringify(snapshot.counts));
          NODE

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain -- data/distribution-state.json)" ]; then
            echo 'No distribution state change.'
            exit 0
          fi
          git config user.name 'toolscout-distribution-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/distribution-state.json
          git commit -m 'Refresh distribution state snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
