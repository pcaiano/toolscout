name: ToolScout Growth Sprint 1 Production Launch

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: toolscout-growth-sprint-1-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate sprint and preservation
        env:
          TOOLSCOUT_V2_BASE_REF: a4bfbd36f0f6d049e3bf13dd6272f48276ada07e
        run: |
          set -euo pipefail
          node --check distribution-orchestrator-worker.js
          node --check command-center-business-truth-runtime.js
          node --check command-center-simplified-view.js
          node --test tests/toolscout-growth-sprint-1.test.mjs tests/toolscout-v2-closed-loop-integrity.test.mjs tests/toolscout-v2-command-center-final-truth.test.mjs
          node scripts/audit-runtime-architecture.mjs
          node scripts/validate-v2-preservation.mjs
          node -e "JSON.parse(require('fs').readFileSync('data/authority-truth.json','utf8'));JSON.parse(require('fs').readFileSync('reports/growth-sprint-1.json','utf8'));console.log('growth sprint JSON valid')"
        shell: bash

      - name: Wrangler dry-run
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/toolscout-growth-sprint-1

      - name: Apply pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml

      - name: Deploy Growth Sprint runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify ToolScout 2.0 preservation
        run: node scripts/verify-v2-live-smoke.mjs

      - name: Request scoped GitHub OIDC token
        id: oidc
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=toolscout-execution")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.value)process.exit(1);process.stdout.write(j.value)})")
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Materialize Growth Sprint opportunities now
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 120             -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Accept: application/json"             https://trytoolscout.org/api/growth/opportunities/refresh | tee sprint-opportunities.json
          node -e "const x=require('./sprint-opportunities.json');if(x.status==='failed'||x.error||x.ok===false)process.exit(1);console.log(JSON.stringify({status:x.status||null,active:x.active||null,search:x.search||null}))"

      - name: Dispatch first bounded Growth Sprint execution cycle
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 120             -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Accept: application/json"             https://trytoolscout.org/api/growth/execution/dispatch | tee sprint-execution.json
          node -e "const x=require('./sprint-execution.json');if(x.status==='failed'||x.error)process.exit(1);console.log(JSON.stringify({status:x.status||null,ok:x.ok??null,mission:x.mission||null}))"

      - name: Prove sprint state in production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT COUNT(*) sprint_targets,
                 SUM(CASE WHEN json_extract(signal_json,'$.sprint_id')='growth-sprint-1-search-winners-2026-10-04' THEN 1 ELSE 0 END) correctly_tagged
          FROM growth_opportunity_state
          WHERE status='active' AND opportunity_key LIKE 'sprint-search:%';

          SELECT opportunity_key,subject_key,priority_score,action_json,
                 json_extract(signal_json,'$.impressions') impressions,
                 json_extract(signal_json,'$.position') position,
                 json_extract(signal_json,'$.sprint_id') sprint_id
          FROM growth_opportunity_state
          WHERE status='active' AND opportunity_key LIKE 'sprint-search:%'
          ORDER BY priority_score DESC LIMIT 20;

          SELECT COUNT(*) sprint_contracts,
                 SUM(CASE WHEN executor IS NULL OR status='executor_missing' THEN 1 ELSE 0 END) missing_executors,
                 SUM(CASE WHEN status='verified' THEN 1 ELSE 0 END) verified,
                 SUM(CASE WHEN status IN ('pending','claimed','attempted','deferred') THEN 1 ELSE 0 END) active_execution
          FROM growth_execution_contract
          WHERE source_kind='opportunity' AND source_id LIKE 'sprint-search:%';
          " | tee sprint-d1.json

          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('sprint-d1.json','utf8'));
          const first=payload?.[0]?.results?.[0]||{};
          const third=payload?.[2]?.results?.[0]||{};
          if(Number(first.sprint_targets||0)<10) throw new Error('growth_sprint_targets_not_materialized:'+JSON.stringify(first));
          if(Number(first.correctly_tagged||0)!==Number(first.sprint_targets||0)) throw new Error('growth_sprint_tag_mismatch:'+JSON.stringify(first));
          if(Number(third.missing_executors||0)!==0) throw new Error('growth_sprint_missing_executors:'+JSON.stringify(third));
          console.log(JSON.stringify({sprintTargets:first.sprint_targets,sprintContracts:third.sprint_contracts,verified:third.verified,activeExecution:third.active_execution}));
          NODE

      - name: Verify consolidated authority truth is public
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error https://trytoolscout.org/data/authority-truth.json -o authority-truth-live.json
          node - <<'NODE'
          const x=require('./authority-truth-live.json');
          if(Number(x?.reconciliation?.ahrefsDomainRating)!==2.3) throw new Error('ahrefs_direct_dr_missing');
          if(Number(x?.reconciliation?.ahrefsThirdPartySnapshot)!==31) throw new Error('tiny_startups_snapshot_missing');
          if(Number(x?.reconciliation?.seRankingBacklinks)!==95) throw new Error('se_ranking_truth_missing');
          console.log(JSON.stringify(x.reconciliation));
          NODE
