name: SEO Singleton Links Once

on:
  push:
    paths:
      - '.github/workflows/seo-singleton-links-once.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SEO hygiene
        run: |
          node --check scripts/enforce-seo-hygiene.mjs
          node scripts/enforce-seo-hygiene.mjs --fix
          node scripts/enforce-seo-hygiene.mjs
      - name: Reapply software card favicon rule
        run: |
          node scripts/enrich-software-card-favicons.mjs --fix
          node scripts/enrich-software-card-favicons.mjs
      - name: Validate SEO surface
        run: |
          node scripts/validate-seo-pages.mjs
          node scripts/validate-public-surface.mjs
          node scripts/validate-commercial-indexability.mjs
      - name: Confirm Command Center files are untouched
        run: |
          changed=$(git status --porcelain | awk '{print $2}')
          if printf '%s\n' "$changed" | grep -E '(^|/)(command-center-|analytics)'; then
            echo "Command Center file change detected. Refusing to continue."
            exit 1
          fi
      - name: Commit links
        run: |
          if [ -n "$(git status --porcelain -- '*.html' 'tools/*.html' 'blog/*.html')" ]; then
            git config user.name "toolscout-seo-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html' 'tools/*.html' 'blog/*.html'
            git commit -m "Strengthen singleton tool internal links"
            git restore -- reports || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest
