name: One Shot Phase 222 Contact Supply Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-222-contact-supply-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect vendor sender contact supply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT g.subject_key AS tool_slug,g.priority_score,g.updated_at AS task_updated_at,
                 v.vendor_domain,v.status AS vendor_status,v.contact_email AS vendor_email,v.contact_method,v.contact_source_url,
                 cs.status AS supply_status,cs.contact_email AS supply_email,cs.contact_source,cs.contact_source_url AS supply_source_url,
                 cs.public_attempts,cs.last_researched_at,cs.next_research_at,cs.priority_score AS supply_priority
          FROM growth_execution_contract g
          LEFT JOIN distribution_vendor_amplification v
            ON v.tool_slug=g.subject_key
          LEFT JOIN contact_supply_domain cs
            ON cs.domain=lower(v.vendor_domain)
          WHERE g.executor='make_sender'
            AND g.action='backlink_reference_outreach'
            AND g.status='deferred'
          ORDER BY g.priority_score DESC,v.priority_score DESC,g.subject_key;

          SELECT * FROM contact_supply_metrics WHERE id='global';

          SELECT status,COUNT(*) n
          FROM contact_supply_domain
          GROUP BY status ORDER BY n DESC;

          SELECT job_type,status,COUNT(*) n
          FROM compute_overflow_jobs
          WHERE job_type IN ('contact_supply_public_research','vendor_role_email_research')
            AND created_at>=datetime('now','-24 hours')
          GROUP BY job_type,status
          ORDER BY job_type,status;

          SELECT job_id,job_type,subject_key,status,attempts,error,created_at,leased_at,completed_at,result_json
          FROM compute_overflow_jobs
          WHERE job_type IN ('contact_supply_public_research','vendor_role_email_research')
            AND created_at>=datetime('now','-24 hours')
          ORDER BY created_at DESC
          LIMIT 40;
          "
