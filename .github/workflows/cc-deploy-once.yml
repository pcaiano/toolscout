name: Command Center Deploy Once

on:
  push:
    paths:
      - '.github/workflows/cc-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax check
        run: node --check command-center-human-truth-details-worker.js
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Verify health
        run: curl -fsSL https://trytoolscout.org/api/command-center-human-truth-details-health | grep -q 'affiliateCoverageStatus'
