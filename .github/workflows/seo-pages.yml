name: Generate SEO Pages

on:
  push:
    paths:
      - 'data/intents.json'
      - 'data/tools.json'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/validate-seo-pages.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'robots.txt'
      - '.github/workflows/seo-pages.yml'
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate pages
        run: node scripts/generate-seo-pages.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Validate SEO pages
        run: node scripts/validate-seo-pages.mjs

      - name: Commit generated SEO assets
        run: |
          if [ -z "$(git status --porcelain -- '*.html' 'sitemap.xml' 'robots.txt')" ]; then
            echo "No SEO asset changes to commit."
            exit 0
          fi
          git config user.name "toolscout-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml robots.txt
          git commit -m "Refresh SEO pages and sitemap"
          git push
