name: Generate SEO Pages

on:
  push:
    paths:
      - 'data/intents.json'
      - 'data/intent-profiles.json'
      - 'data/tools.json'
      - 'data/comparisons.json'
      - 'data/affiliate.json'
      - 'data/affiliate-pipeline.json'
      - 'data/seo-longtail.json'
      - 'data/seo-consolidations.json'
      - 'reports/gsc-signals.json'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/generate-comparisons.mjs'
      - 'scripts/generate-tool-pages.mjs'
      - 'scripts/link-static-tool-profiles.mjs'
      - 'scripts/enrich-guide-comparisons.mjs'
      - 'scripts/generate-blog.mjs'
      - 'scripts/generate-acquisition-content.mjs'
      - 'scripts/build-growth-priority.mjs'
      - 'scripts/import-gsc-signals.mjs'
      - 'scripts/sync-gsc-signals.mjs'
      - 'scripts/unify-public-nav.mjs'
      - 'scripts/validate-seo-pages.mjs'
      - 'scripts/validate-public-surface.mjs'
      - 'scripts/validate-commercial-indexability.mjs'
      - 'scripts/validate-intent-coverage.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'scripts/generate-distribution.mjs'
      - 'scripts/build-distribution-index.mjs'
      - 'scripts/build-distribution-queue.mjs'
      - 'robots.txt'
      - 'llms.txt'
      - '.github/workflows/seo-pages.yml'
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate intent coverage
        run: node scripts/validate-intent-coverage.mjs

      - name: Sync Google Search Console signals
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: sc-domain:trytoolscout.org
          GSC_LOOKBACK_DAYS: '28'
        run: node scripts/sync-gsc-signals.mjs

      - name: Build growth priority
        run: node scripts/build-growth-priority.mjs

      - name: Generate pages
        run: node scripts/generate-seo-pages.mjs

      - name: Generate commercial comparisons
        run: node scripts/generate-comparisons.mjs

      - name: Generate indexable tool profiles
        run: node scripts/generate-tool-pages.mjs

      - name: Link directory to indexable tool profiles
        run: node scripts/link-static-tool-profiles.mjs

      - name: Link guides to relevant comparisons
        run: node scripts/enrich-guide-comparisons.mjs

      - name: Generate blog
        run: node scripts/generate-blog.mjs

      - name: Generate acquisition content
        run: node scripts/generate-acquisition-content.mjs

      - name: Generate distribution assets
        run: node scripts/generate-distribution.mjs

      - name: Build clean guide index
        run: node scripts/build-distribution-index.mjs

      - name: Build distribution queue
        run: node scripts/build-distribution-queue.mjs

      - name: Apply deploy-time public navigation
        run: node scripts/unify-public-nav.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Validate SEO pages
        run: node scripts/validate-seo-pages.mjs

      - name: Validate generated public surface
        run: node scripts/validate-public-surface.mjs

      - name: Validate commercial indexability and links
        run: node scripts/validate-commercial-indexability.mjs

      - name: Commit generated SEO assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/brand-v1-redesign'
        run: |
          if [ -z "$(git status --porcelain -- '*.html' 'tools/*.html' 'sitemap.xml' 'robots.txt' 'feed.xml' 'llms.txt' 'blog/*.html' 'reports/*.json')" ]; then
            echo "No SEO/distribution asset changes to commit."
            exit 0
          fi
          git config user.name "toolscout-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'tools/*.html' sitemap.xml robots.txt feed.xml llms.txt blog reports
          git commit -m "Refresh SEO, blog and distribution assets"
          git push
