name: Generate SEO Pages

on:
  push:
    paths:
      - 'data/intents.json'
      - 'data/tools.json'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/generate-blog.mjs'
      - 'scripts/build-blog-topics.mjs'
      - 'scripts/validate-seo-pages.mjs'
      - 'scripts/validate-intent-coverage.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'scripts/generate-distribution.mjs'
      - 'scripts/build-distribution-index.mjs'
      - 'scripts/build-distribution-queue.mjs'
      - 'robots.txt'
      - 'llms.txt'
      - '.github/workflows/seo-pages.yml'
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate intent coverage
        run: node scripts/validate-intent-coverage.mjs

      - name: Generate pages
        run: node scripts/generate-seo-pages.mjs

      - name: Generate blog topics
        run: node scripts/build-blog-topics.mjs

      - name: Generate blog
        run: node scripts/generate-blog.mjs

      - name: Generate distribution assets
        run: node scripts/generate-distribution.mjs

      - name: Build clean guide index
        run: node scripts/build-distribution-index.mjs

      - name: Build distribution queue
        run: node scripts/build-distribution-queue.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Validate SEO pages
        run: node scripts/validate-seo-pages.mjs

      - name: Commit generated SEO assets
        run: |
          if [ -z "$(git status --porcelain -- '*.html' 'sitemap.xml' 'robots.txt' 'feed.xml' 'llms.txt' 'blog/*.html' 'reports/*.json')" ]; then
            echo "No SEO/distribution asset changes to commit."
            exit 0
          fi
          git config user.name "toolscout-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' sitemap.xml robots.txt feed.xml llms.txt blog reports
          git commit -m "Refresh SEO, blog and distribution assets"
          git push
