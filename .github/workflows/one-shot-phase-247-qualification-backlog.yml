name: One Shot Phase 247 Qualification Backlog Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-247-qualification-backlog.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read live authority health
        run: |
          set -euo pipefail
          curl -fsS 'https://trytoolscout.org/api/distribution/authority/closed-loop-health?fresh=1' -o authority-health.json
          cat authority-health.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('authority-health.json','utf8'));
          console.log(JSON.stringify({
            status:x.status,
            attempts24:x.attempts24,
            attemptMin24h:x.attemptMin24h,
            attemptTarget24h:x.attemptTarget24h,
            queue:x.queue,
            runnableQueue:x.runnableQueue,
            qualificationQueue:x.qualificationQueue,
            deferredQueue:x.deferredQueue,
            senderClaimed:x.senderClaimed,
            senderDispatchReady:x.senderDispatchReady
          },null,2));
          NODE

      - name: Inspect qualification backlog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT c.task_id,c.executor,c.action,c.subject_key,c.status,c.attempts,c.last_result,c.created_at,c.updated_at,
                 o.status opportunity_status,o.surface_type,o.human_required,o.action_url,o.last_checked_at,o.next_action,
                 a.status route_status,a.execution_mode,a.attempts route_attempts,a.last_attempt_at,a.last_result route_last_result,a.updated_at route_updated_at,
                 (
                   SELECT COUNT(*) FROM compute_overflow_jobs j
                   WHERE j.subject_key=c.subject_key
                     AND j.job_type='distribution_route_research'
                     AND j.status IN ('queued','leased')
                 ) active_research_jobs,
                 (
                   SELECT MAX(COALESCE(j.completed_at,j.updated_at,j.created_at)) FROM compute_overflow_jobs j
                   WHERE j.subject_key=c.subject_key
                     AND j.job_type='distribution_route_research'
                 ) last_research_at,
                 (
                   SELECT json_extract(j.result_json,'$.classification') FROM compute_overflow_jobs j
                   WHERE j.subject_key=c.subject_key
                     AND j.job_type='distribution_route_research'
                   ORDER BY COALESCE(j.completed_at,j.updated_at,j.created_at) DESC LIMIT 1
                 ) last_research_classification,
                 (
                   SELECT json_extract(j.result_json,'$.routeSummary.machineCandidates') FROM compute_overflow_jobs j
                   WHERE j.subject_key=c.subject_key
                     AND j.job_type='distribution_route_research'
                   ORDER BY COALESCE(j.completed_at,j.updated_at,j.created_at) DESC LIMIT 1
                 ) last_machine_candidates,
                 (
                   SELECT json_extract(j.result_json,'$.routeSummary.humanGateCandidates') FROM compute_overflow_jobs j
                   WHERE j.subject_key=c.subject_key
                     AND j.job_type='distribution_route_research'
                   ORDER BY COALESCE(j.completed_at,j.updated_at,j.created_at) DESC LIMIT 1
                 ) last_human_candidates
          FROM growth_execution_contract c
          LEFT JOIN distribution_opportunities o ON o.surface_slug=c.subject_key
          LEFT JOIN distribution_contact_route_actions a ON a.opportunity_slug=c.subject_key
          WHERE c.action IN ('verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','autonomous_route_qualification')
            AND c.status IN ('pending','claimed','attempted','deferred','stalled')
          ORDER BY c.status,c.executor,c.priority_score DESC,c.updated_at ASC;

          SELECT c.executor,c.action,c.status,c.last_result,COUNT(*) n
          FROM growth_execution_contract c
          WHERE c.action IN ('verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','autonomous_route_qualification')
            AND c.status IN ('pending','claimed','attempted','deferred','stalled')
          GROUP BY c.executor,c.action,c.status,c.last_result
          ORDER BY c.executor,c.action,c.status,c.last_result;

          SELECT status,surface_type,COUNT(*) n
          FROM distribution_opportunities
          WHERE COALESCE(action_url,'')<>'' AND lower(action_url) NOT LIKE 'https://trytoolscout.org/%'
          GROUP BY status,surface_type
          ORDER BY status,surface_type;

          SELECT subject_type,
                 SUM(CASE WHEN EXISTS(SELECT 1 FROM json_each(action_json) j WHERE j.value IN ('backlink_reference_outreach','publisher_outreach','publisher_contact_discovery','execute_alternate_routes','autonomous_route_qualification','verify_backlink_acquisition')) THEN 1 ELSE 0 END) authority_action_opportunities,
                 COUNT(*) active_total
          FROM growth_opportunity_state
          WHERE status='active'
          GROUP BY subject_type ORDER BY subject_type;

          SELECT
            (SELECT COUNT(*) FROM distribution_vendor_amplification WHERE status='contact_found' AND contact_email IS NOT NULL) vendor_contact_found,
            (SELECT COUNT(*) FROM distribution_network_outreach WHERE status='contact_found' AND contact_email IS NOT NULL) publisher_contact_found,
            (SELECT COUNT(*) FROM distribution_network_outreach WHERE status='contact_route_found') publisher_route_found,
            (SELECT COUNT(*) FROM distribution_auto_adapters WHERE policy_state='verified') verified_auto_adapters,
            (SELECT COUNT(*) FROM distribution_opportunities WHERE status='ready_to_submit') ready_to_submit,
            (SELECT COUNT(*) FROM distribution_opportunities WHERE status IN ('discovered','candidate','research_required','stale') AND COALESCE(human_required,0)=0) researchable_surfaces;

          WITH authority_actions AS (
            SELECT g.opportunity_key,g.subject_key,j.value action
            FROM growth_opportunity_state g,json_each(g.action_json) j
            WHERE g.status='active'
              AND g.subject_type='surface'
              AND j.value IN ('backlink_reference_outreach','publisher_outreach','publisher_contact_discovery','execute_alternate_routes','autonomous_route_qualification','verify_backlink_acquisition')
          )
          SELECT COALESCE(c.status,'missing_contract') contract_status,COUNT(*) n
          FROM authority_actions a
          LEFT JOIN growth_execution_contract c
            ON c.source_kind='opportunity'
           AND c.source_id=a.opportunity_key
           AND c.action=a.action
          GROUP BY COALESCE(c.status,'missing_contract')
          ORDER BY contract_status;

          WITH authority_actions AS (
            SELECT g.opportunity_key,g.subject_key,j.value action
            FROM growth_opportunity_state g,json_each(g.action_json) j
            WHERE g.status='active'
              AND g.subject_type='surface'
              AND j.value IN ('backlink_reference_outreach','publisher_outreach','publisher_contact_discovery','execute_alternate_routes','autonomous_route_qualification','verify_backlink_acquisition')
          )
          SELECT a.subject_key,a.action,
                 COALESCE(c.status,'missing_contract') contract_status,
                 c.last_result,c.updated_at,
                 o.status opportunity_status,o.surface_type,o.action_url,
                 n.status network_status,n.contact_email,n.contact_source_url
          FROM authority_actions a
          LEFT JOIN growth_execution_contract c
            ON c.source_kind='opportunity'
           AND c.source_id=a.opportunity_key
           AND c.action=a.action
          LEFT JOIN distribution_opportunities o ON o.surface_slug=a.subject_key
          LEFT JOIN distribution_network_outreach n ON n.surface_slug=a.subject_key
          WHERE c.task_id IS NULL OR c.status IN ('verified','blocked','human_required','cancelled')
          ORDER BY a.action,a.subject_key
          LIMIT 120;

          WITH active_authority_subjects AS (
            SELECT DISTINCT g.subject_key
            FROM growth_opportunity_state g,json_each(g.action_json) j
            WHERE g.status='active' AND g.subject_type='surface'
              AND j.value IN ('backlink_reference_outreach','publisher_outreach','publisher_contact_discovery','execute_alternate_routes','autonomous_route_qualification','verify_backlink_acquisition')
          )
          SELECT o.surface_slug,o.surface_name,o.surface_type,o.status,o.human_required,o.automation_potential,o.distribution_score,o.backlink_value,o.action_url,o.last_checked_at,o.next_action,
                 n.status network_status,n.contact_email,n.contact_source_url,n.discovery_attempts,
                 CASE WHEN a.subject_key IS NULL THEN 0 ELSE 1 END has_authority_action
          FROM distribution_opportunities o
          LEFT JOIN distribution_network_outreach n ON n.surface_slug=o.surface_slug
          LEFT JOIN active_authority_subjects a ON a.subject_key=o.surface_slug
          WHERE o.status IN ('discovered','candidate','research_required','stale')
            AND COALESCE(o.human_required,0)=0
            AND lower(COALESCE(o.action_url,'')) NOT LIKE 'https://trytoolscout.org/%'
            AND a.subject_key IS NULL
          ORDER BY o.distribution_score DESC,o.backlink_value DESC,o.last_checked_at ASC
          LIMIT 100;

          SELECT status,COUNT(*) n,MIN(created_at) oldest,MAX(updated_at) newest
          FROM compute_overflow_jobs
          WHERE job_type='distribution_route_research'
          GROUP BY status ORDER BY status;
          "
