name: ToolScout GA4 Cloudflare Binding Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'fix-ga4-cloudflare-secret-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GA4 service account secret in Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$GSC_SERVICE_ACCOUNT_JSON"
          printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" | npx wrangler secret put GA4_SERVICE_ACCOUNT_JSON --config wrangler.toml
      - name: Verify secret binding exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.toml | grep -q '"name": "GA4_SERVICE_ACCOUNT_JSON"'
      - name: Verify live GA4 endpoint
        run: |
          set -euo pipefail
          body="$(curl -sS --max-time 30 -H 'Cf-Access-Authenticated-User-Email: pcaiano@gmail.com' https://trytoolscout.org/analytics/api/google/acquisition)"
          printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let j={};try{j=JSON.parse(s)}catch{};console.log(JSON.stringify({status:j.status||null,reason:j.reason||null,authMode:j.authMode||null,connectedEmail:j.connectedEmail||null,propertyId:j.propertyId||null,sessions24h:j.sessions?.last24Hours??null,visitorsToday:j.users?.activeToday??j.users?.today??null,fetchedAt:j.fetchedAt||null},null,2));if(j.status!=='connected')process.exit(1)})"
