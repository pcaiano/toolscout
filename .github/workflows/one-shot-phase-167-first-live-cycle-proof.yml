name: One Shot Phase 167 First Live Cycle Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-167-first-live-cycle-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait through next primary growth boundary
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          next=$(( ((now / 900) + 1) * 900 + 105 ))
          delay=$(( next - now ))
          if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          echo "Proof read at $(date -u +%FT%TZ)"
      - name: Prove dual authority and fresh supervisor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo EXECUTION
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,evidence_json
          FROM engine_runs
          WHERE engine='growth' AND mission IN ('execution_contract','self_audit')
          ORDER BY started_at DESC LIMIT 4;
          "
          echo SUPERVISOR
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,status,directive,strict_humans_24h,strict_humans_7d,external_executions_24h,external_executions_7d,last_evaluated_at
          FROM growth_supervisor_state ORDER BY engine;
          "
          echo AUTHORITY
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,subject_key,status,last_result,claimed_at,attempted_at,verified_at,updated_at
          FROM growth_execution_contract
          WHERE executor IN ('distribution_network','distribution_autonomous')
            AND action IN ('verify_backlink_acquisition','execute_alternate_routes','publisher_contact_discovery','autonomous_route_qualification','scale_proven_surface')
          ORDER BY updated_at DESC LIMIT 16;
          "
