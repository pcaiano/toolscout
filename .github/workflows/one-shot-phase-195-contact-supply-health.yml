name: One Shot Phase 195 Contact Supply Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-195-contact-supply-health.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect canonical Contact Supply Engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT * FROM contact_supply_metrics WHERE id='global';

          SELECT status,COUNT(*) n,COUNT(DISTINCT domain) domains
          FROM contact_supply_domain
          GROUP BY status ORDER BY n DESC;

          SELECT source_type,status,COUNT(*) n
          FROM contact_supply_domain
          GROUP BY source_type,status
          ORDER BY source_type,status;

          SELECT domain,source_type,source_key,priority_score,status,contact_email,route_type,route_url,public_attempts,next_research_at,apollo_status,updated_at
          FROM contact_supply_domain
          WHERE status IN ('ready_email','ready_route','queued','unresolved','provider_blocked','researching')
          ORDER BY CASE status WHEN 'ready_email' THEN 0 WHEN 'ready_route' THEN 1 WHEN 'researching' THEN 2 ELSE 3 END,priority_score DESC
          LIMIT 100;
          "
