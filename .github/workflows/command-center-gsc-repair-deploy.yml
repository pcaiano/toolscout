name: ToolScout Command Center GSC Repair Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Deploy Command Center GSC repair')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: |
          set -euo pipefail
          node --check command-center-business-truth-runtime.js
          node --check command-center-simplified-view.js
          node --test tests/toolscout-v2-command-center-final-truth.test.mjs tests/toolscout-growth-truth-observability.test.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Verify preservation
        run: node scripts/verify-v2-live-smoke.mjs
