name: One Shot Growth Outcome Bottleneck Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-growth-outcome-bottleneck-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit contact supply eligibility and outcome flow
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT status,COUNT(*) n,
                 SUM(CASE WHEN next_research_at<=datetime('now') THEN 1 ELSE 0 END) due
          FROM contact_supply_domain
          GROUP BY status
          ORDER BY n DESC;

          WITH due AS (
            SELECT src.source_id,src.domain,src.source_type source_variant_type,src.status source_status,
                   src.attempts,src.next_research_at,
                   cs.source_type domain_source_type,cs.source_key,cs.status domain_status,cs.contact_email,
                   CASE WHEN cs.contact_email IS NULL
                     AND cs.status IN ('queued','unresolved','provider_blocked','ready_route','researching')
                     AND src.status IN ('candidate','retry','route_found','exhausted','unreachable')
                     AND src.next_research_at<=datetime('now')
                     AND (
                       EXISTS(SELECT 1 FROM distribution_vendor_amplification v
                         WHERE lower(v.vendor_domain)=cs.domain
                           AND v.status NOT IN ('sent','reputation_quarantine','suppressed_asset_mismatch'))
                       OR EXISTS(SELECT 1 FROM distribution_network_outreach n
                         WHERE lower(n.domain)=cs.domain
                           AND n.status NOT IN ('sent','adopted','reputation_quarantine','suppressed_competitor','suppressed_technical')
                           AND NOT EXISTS(
                             SELECT 1 FROM distribution_opportunities o
                             WHERE o.surface_slug=n.surface_slug AND o.status='policy_blocked'
                           ))
                     )
                   THEN 1 ELSE 0 END eligible
            FROM contact_supply_source src
            JOIN contact_supply_domain cs ON cs.domain=src.domain
            WHERE src.status IN ('candidate','retry','route_found','exhausted','unreachable')
              AND src.next_research_at<=datetime('now')
          )
          SELECT COUNT(*) total_due_sources,
                 SUM(eligible) eligible_due_sources,
                 COUNT(DISTINCT domain) due_domains,
                 COUNT(DISTINCT CASE WHEN eligible=1 THEN domain END) eligible_due_domains
          FROM due;

          WITH due AS (
            SELECT src.source_type source_variant_type,src.status source_status,cs.status domain_status,
                   CASE WHEN cs.contact_email IS NULL
                     AND cs.status IN ('queued','unresolved','provider_blocked','ready_route','researching')
                     AND src.status IN ('candidate','retry','route_found','exhausted','unreachable')
                     AND src.next_research_at<=datetime('now')
                     AND (
                       EXISTS(SELECT 1 FROM distribution_vendor_amplification v
                         WHERE lower(v.vendor_domain)=cs.domain
                           AND v.status NOT IN ('sent','reputation_quarantine','suppressed_asset_mismatch'))
                       OR EXISTS(SELECT 1 FROM distribution_network_outreach n
                         WHERE lower(n.domain)=cs.domain
                           AND n.status NOT IN ('sent','adopted','reputation_quarantine','suppressed_competitor','suppressed_technical')
                           AND NOT EXISTS(SELECT 1 FROM distribution_opportunities o
                             WHERE o.surface_slug=n.surface_slug AND o.status='policy_blocked'))
                     )
                   THEN 1 ELSE 0 END eligible
            FROM contact_supply_source src
            JOIN contact_supply_domain cs ON cs.domain=src.domain
            WHERE src.status IN ('candidate','retry','route_found','exhausted','unreachable')
              AND src.next_research_at<=datetime('now')
          )
          SELECT source_variant_type,source_status,domain_status,COUNT(*) n,SUM(eligible) eligible
          FROM due
          GROUP BY source_variant_type,source_status,domain_status
          ORDER BY n DESC
          LIMIT 60;

          SELECT job_type,status,COUNT(*) n,
                 SUM(CASE WHEN created_at>=datetime('now','-24 hours') THEN 1 ELSE 0 END) created_24h,
                 SUM(CASE WHEN completed_at>=datetime('now','-24 hours') THEN 1 ELSE 0 END) completed_24h,
                 MAX(created_at) last_created_at,MAX(completed_at) last_completed_at
          FROM compute_overflow_jobs
          WHERE job_type IN ('contact_supply_public_research','publisher_role_email_research','vendor_role_email_research','distribution_route_research')
          GROUP BY job_type,status
          ORDER BY job_type,status;

          SELECT job_type,last_error,COUNT(*) n,MAX(updated_at) last_seen
          FROM compute_overflow_jobs
          WHERE job_type IN ('contact_supply_public_research','publisher_role_email_research','vendor_role_email_research')
            AND last_error IS NOT NULL
          GROUP BY job_type,last_error
          ORDER BY n DESC
          LIMIT 40;

          SELECT source_type,route_type,status,COUNT(*) n
          FROM contact_supply_domain
          WHERE status IN ('ready_route','route_filtered')
          GROUP BY source_type,route_type,status
          ORDER BY n DESC
          LIMIT 50;

          SELECT status,COUNT(*) n
          FROM distribution_opportunities
          WHERE surface_type='vendor_contact_route'
          GROUP BY status
          ORDER BY n DESC;

          SELECT event_type,status,COUNT(*) n,MAX(created_at) last_seen
          FROM compute_overflow_events
          WHERE created_at>=datetime('now','-24 hours')
            AND (event_type LIKE '%contact_supply%' OR event_type LIKE '%overflow_batch%' OR event_type LIKE '%render%')
          GROUP BY event_type,status
          ORDER BY n DESC
          LIMIT 50;

          WITH fv AS (
            SELECT session_id,source,referrer_host,created_at,
                   ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY created_at ASC,id ASC) rn
            FROM confirmed_visitor_events
            WHERE created_at>=datetime('now','-7 days')
          )
          SELECT CASE WHEN h.first_evidence_at>=datetime('now','-24 hours') THEN '24h' ELSE '7d_older' END window,
                 LOWER(COALESCE(NULLIF(h.referrer_host,''),NULLIF(v.referrer_host,''),NULLIF(h.source,''),NULLIF(v.source,''),'direct')) source_key,
                 COUNT(DISTINCT h.session_id) strict_sessions,
                 MAX(h.first_evidence_at) last_human_at
          FROM traffic_human_evidence h
          LEFT JOIN fv v ON v.session_id=h.session_id AND v.rn=1
          WHERE h.first_evidence_at>=datetime('now','-7 days')
          GROUP BY window,source_key
          ORDER BY window,strict_sessions DESC,last_human_at DESC;
          " | tee /tmp/audit.json

          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const at=i=>p[i]?.results||[];
          const supply=at(1)[0]||{};
          const jobs=at(3);
          const strict=at(8);
          const summary={
            dueSources:Number(supply.total_due_sources||0),
            eligibleDueSources:Number(supply.eligible_due_sources||0),
            dueDomains:Number(supply.due_domains||0),
            eligibleDueDomains:Number(supply.eligible_due_domains||0),
            contactResearchJobs:jobs.filter(x=>x.job_type==='contact_supply_public_research'),
            strictHumans24h:strict.filter(x=>x.window==='24h'),
            strictHumansOlder7d:strict.filter(x=>x.window==='7d_older')
          };
          console.log('=== GROWTH BOTTLENECK SUMMARY ===');
          console.log(JSON.stringify(summary,null,2));
          NODE
