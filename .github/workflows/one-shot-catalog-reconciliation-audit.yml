name: One Shot Catalog Reconciliation Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-catalog-reconciliation-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit missing runtime catalog peers'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Query catalog runtime state
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT tool_slug,status,source_status,verified_at,updated_at,profile_json FROM catalog_runtime_candidates WHERE tool_slug IN ('google-ai-studio','kling-ai','otter-ai','character-ai') ORDER BY tool_slug;" --json
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT tool_slug,quality_status,source_status,source_url,logo_url,last_checked_at,updated_at FROM catalog_quality_audit WHERE tool_slug IN ('google-ai-studio','kling-ai','otter-ai','character-ai') ORDER BY tool_slug;" --json
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT tool_slug,event_type,status,detail,evidence_json,created_at FROM catalog_runtime_events WHERE tool_slug IN ('google-ai-studio','kling-ai','otter-ai','character-ai') ORDER BY created_at DESC LIMIT 60;" --json
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT tool_slug,signals,status,sources_json,examples_json,updated_at FROM catalog_market_gaps WHERE tool_slug IN ('google-ai-studio','kling-ai','otter-ai','character-ai') ORDER BY tool_slug;" --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
