name: One-shot ToolScout Editorial Guide Evidence Sync
on:
  push:
    branches: [feat/editorial-coverage-127-20261008]
    paths: ['.github/workflows/editorial-guide-sync-127.yml']
permissions:
  contents: write
concurrency:
  group: toolscout-editorial-guide-sync
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editorial-coverage-127-20261008
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update 36 published guide cards and all configured decision conclusions
        run: |
          set -euo pipefail
          node scripts/sync-all-editorial-guides.mjs
          node scripts/sync-all-editorial-guides.mjs --write
          test "$(git diff --name-only -- '*.html' | wc -l)" -eq 36
          ! git diff --name-only | grep -Ev '^[a-z0-9-]+\.html$'
      - name: Commit regenerated static decision assets
        run: |
          git config user.name 'toolscout-editorial-bot'
          git config user.email 'toolscout-editorial-bot@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Reconcile evidence labels across 36 published buying guides'
          git push origin HEAD:feat/editorial-coverage-127-20261008
