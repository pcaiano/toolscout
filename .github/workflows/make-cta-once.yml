name: ToolScout Make CTA Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-cta-once.yml'

permissions:
  contents: write

jobs:
  apply-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply outbound CTA policy
        run: |
          node scripts/enforce-outbound-ux.mjs --fix
          node scripts/enforce-outbound-ux.mjs
          grep -q 'Start with Make' tools/make.html
          grep -q "Start with Make" app.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js '*.html' tools blog news 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Apply Make CTA wording across public pages"
            git push
          fi

      - name: Deploy ToolScout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production
        run: |
          sleep 8
          curl -fsS --retry 4 --retry-delay 5 https://trytoolscout.org/tools/make.html | grep -q 'Start with Make'
