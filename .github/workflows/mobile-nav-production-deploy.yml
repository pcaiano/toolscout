name: Deploy Mobile Navigation Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-nav-production-deploy.yml'
      - 'docs/OPERATING-CONTRACT.json'

permissions:
  contents: read

concurrency:
  group: mobile-nav-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Deploy mobile navigation production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release
        run: |
          set -euo pipefail
          node --check public-redesign-runtime.js
          node --check distribution-embed-worker.js
          node --test tests/toolscout-v2-public-redesign.test.mjs
          grep -q 'justify-content:space-between!important;gap:0;overflow-x:visible' public-redesign-runtime.js
          grep -q 'font-size:clamp(10px,2.8vw,11px)' public-redesign-runtime.js
          grep -q 'justify-content:space-between;gap:0;overflow-x:visible' index.html
          grep -q 'justify-content:space-between;gap:0;overflow-x:visible' distribution-embed-worker.js

      - name: Deploy ToolScout Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify mobile nav CSS live
        run: |
          set -euo pipefail
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(url){
            let last;
            for(let i=0;i<12;i++){
              try{
                const r=await fetch(url,{headers:{'user-agent':'ToolScout mobile nav production verifier'}});
                const body=await r.text();
                if(r.ok)return body;
                last=new Error(url+' '+r.status);
              }catch(e){last=e}
              await sleep(5000);
            }
            throw last||new Error('fetch_failed');
          }
          const home=await get('https://trytoolscout.org/');
          const tools=await get('https://trytoolscout.org/tools');
          const kit=await get('https://trytoolscout.org/distribution/publisher-kit');
          const required=['Tools','Guides','Compare',"What's new",'Trends','Publisher Kit'];
          for(const [name,html] of [['home',home],['tools',tools],['publisherKit',kit]]){
            for(const label of required)if(!html.includes('>'+label+'</a>'))throw new Error(name+'_missing_'+label);
          }
          if(!home.includes('justify-content:space-between;gap:0;overflow-x:visible'))throw new Error('home_mobile_nav_fit_css_missing');
          if(!home.includes('font-size:clamp(10px,2.8vw,11px)'))throw new Error('home_mobile_nav_font_missing');
          if(!tools.includes('justify-content:space-between!important;gap:0;overflow-x:visible'))throw new Error('shared_mobile_nav_fit_css_missing');
          if(!tools.includes('font-size:clamp(10px,2.8vw,11px)'))throw new Error('shared_mobile_nav_font_missing');
          if(!kit.includes('justify-content:space-between;gap:0;overflow-x:visible'))throw new Error('publisher_mobile_nav_fit_css_missing');
          console.log(JSON.stringify({ok:true,home:true,shared:true,publisherKit:true,links:required},null,2));
          NODE
