name: Outbound Reconciliation Once

on:
  push:
    paths:
      - '.github/workflows/outbound-reconciliation-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Query D1 read-only outbound truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/outbound-main.sql <<'SQL'
          SELECT
            COUNT(*) AS raw_public_clicks_30d,
            SUM(CASE WHEN s.classification IN ('likely-human','human') THEN 1 ELSE 0 END) AS classified_human_clicks_30d,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND EXISTS (
              SELECT 1 FROM funnel_events f
              WHERE f.session_id=c.session_id AND f.event_type='session_started'
            ) THEN 1 ELSE 0 END) AS started_human_clicks_30d,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND EXISTS (
              SELECT 1 FROM funnel_events f
              WHERE f.session_id=c.session_id AND f.event_type='page_confirmed'
            ) THEN 1 ELSE 0 END) AS canonical_human_clicks_30d,
            SUM(CASE WHEN c.affiliate_active_at_click=1 THEN 1 ELSE 0 END) AS raw_monetized_clicks_30d,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND c.affiliate_active_at_click=1 THEN 1 ELSE 0 END) AS classified_human_monetized_clicks_30d,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND c.affiliate_active_at_click=1 AND EXISTS (
              SELECT 1 FROM funnel_events f
              WHERE f.session_id=c.session_id AND f.event_type='page_confirmed'
            ) THEN 1 ELSE 0 END) AS canonical_monetized_clicks_30d,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND NOT EXISTS (
              SELECT 1 FROM funnel_events f
              WHERE f.session_id=c.session_id AND f.event_type='page_confirmed'
            ) THEN 1 ELSE 0 END) AS human_clicks_missing_page_confirmed_30d,
            SUM(CASE WHEN s.session_id IS NULL THEN 1 ELSE 0 END) AS clicks_without_session_row_30d,
            SUM(CASE WHEN COALESCE(s.classification,'unknown/legacy')='unknown/legacy' THEN 1 ELSE 0 END) AS unknown_legacy_clicks_30d
          FROM click_events c
          LEFT JOIN sessions s ON s.session_id=c.session_id
          WHERE c.created_at>=datetime('now','-30 days')
            AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci');
          SQL

          cat > /tmp/outbound-source.sql <<'SQL'
          SELECT
            COALESCE(c.source,'(blank)') AS source,
            COUNT(*) AS raw_clicks,
            SUM(CASE WHEN s.classification IN ('likely-human','human') THEN 1 ELSE 0 END) AS classified_human_clicks,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND EXISTS (
              SELECT 1 FROM funnel_events f
              WHERE f.session_id=c.session_id AND f.event_type='page_confirmed'
            ) THEN 1 ELSE 0 END) AS canonical_human_clicks,
            SUM(CASE WHEN c.affiliate_active_at_click=1 THEN 1 ELSE 0 END) AS raw_monetized_clicks,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND c.affiliate_active_at_click=1 AND EXISTS (
              SELECT 1 FROM funnel_events f
              WHERE f.session_id=c.session_id AND f.event_type='page_confirmed'
            ) THEN 1 ELSE 0 END) AS canonical_monetized_clicks
          FROM click_events c
          LEFT JOIN sessions s ON s.session_id=c.session_id
          WHERE c.created_at>=datetime('now','-30 days')
            AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci')
          GROUP BY COALESCE(c.source,'(blank)')
          ORDER BY raw_clicks DESC;
          SQL

          cat > /tmp/outbound-daily.sql <<'SQL'
          SELECT
            date(c.created_at) AS day,
            COUNT(*) AS raw_clicks,
            SUM(CASE WHEN s.classification IN ('likely-human','human') THEN 1 ELSE 0 END) AS classified_human_clicks,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND EXISTS (
              SELECT 1 FROM funnel_events f
              WHERE f.session_id=c.session_id AND f.event_type='page_confirmed'
            ) THEN 1 ELSE 0 END) AS canonical_human_clicks,
            SUM(CASE WHEN c.affiliate_active_at_click=1 THEN 1 ELSE 0 END) AS raw_monetized_clicks,
            SUM(CASE WHEN s.classification IN ('likely-human','human') AND c.affiliate_active_at_click=1 AND EXISTS (
              SELECT 1 FROM funnel_events f
              WHERE f.session_id=c.session_id AND f.event_type='page_confirmed'
            ) THEN 1 ELSE 0 END) AS canonical_monetized_clicks
          FROM click_events c
          LEFT JOIN sessions s ON s.session_id=c.session_id
          WHERE c.created_at>=datetime('now','-14 days')
            AND COALESCE(c.source,'') NOT IN ('internal-test','synthetic','health-check','ci')
          GROUP BY date(c.created_at)
          ORDER BY day DESC;
          SQL

          npx wrangler d1 execute toolscout --remote --file=/tmp/outbound-main.sql --json > /tmp/outbound-main.json
          npx wrangler d1 execute toolscout --remote --file=/tmp/outbound-source.sql --json > /tmp/outbound-source.json
          npx wrangler d1 execute toolscout --remote --file=/tmp/outbound-daily.sql --json > /tmp/outbound-daily.json

      - name: Build reconciliation report
        run: |
          node <<'NODE'
          const fs=require('fs');
          function parseWrangler(file){
            const text=fs.readFileSync(file,'utf8').trim();
            for(let i=0;i<text.length;i++){
              const ch=text[i];
              if(ch!=='['&&ch!=='{') continue;
              try{return JSON.parse(text.slice(i).trim())}catch{}
            }
            throw new Error(`No JSON payload found in ${file}`);
          }
          function load(file){
            const raw=parseWrangler(file);
            const blocks=Array.isArray(raw)?raw:[raw];
            const rows=[]; const meta=[];
            for(const block of blocks){
              if(Array.isArray(block?.results)) rows.push(...block.results);
              else if(Array.isArray(block?.result?.results)) rows.push(...block.result.results);
              if(block?.meta) meta.push(block.meta);
              if(block?.result?.meta) meta.push(block.result.meta);
            }
            return {rows,meta};
          }
          const main=load('/tmp/outbound-main.json');
          const bySource=load('/tmp/outbound-source.json');
          const daily=load('/tmp/outbound-daily.json');
          const m=main.rows[0]||{};
          const report={
            generated_at:new Date().toISOString(),
            mode:'read-only D1 reconciliation',
            window_days:30,
            definitions:{
              raw_public:'click_events in the last 30 days excluding internal-test, synthetic, health-check and ci sources',
              classified_human:'raw public clicks whose sessions classification is likely-human or human',
              canonical_command_center:'classified human clicks whose session also has a page_confirmed funnel event',
              monetized:'affiliate_active_at_click = 1 at click time'
            },
            totals:m,
            diagnosis:{
              canonical_gap:Number(m.classified_human_clicks_30d||0)-Number(m.canonical_human_clicks_30d||0),
              canonical_monetization_gap:Number(m.classified_human_monetized_clicks_30d||0)-Number(m.canonical_monetized_clicks_30d||0)
            },
            by_source:bySource.rows,
            daily_last_14d:daily.rows,
            d1_meta:{main:main.meta,by_source:bySource.meta,daily:daily.meta}
          };
          fs.mkdirSync('data/diagnostics',{recursive:true});
          fs.writeFileSync('data/diagnostics/outbound-reconciliation-latest.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Commit report only
        run: |
          set -euo pipefail
          git config user.name "toolscout-diagnostics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics/outbound-reconciliation-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record outbound reconciliation diagnostic"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
