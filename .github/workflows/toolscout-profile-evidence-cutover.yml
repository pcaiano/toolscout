# Single-use, migration-free Cloudflare publication of ToolScout PR #469.
name: ToolScout Profile Evidence One-Time Cutover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolscout-profile-evidence-cutover.yml'
permissions:
  contents: read
concurrency:
  group: toolscout-worker-production-recovery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gate dated manufacturer documentation and public source-link policy
        run: |
          set -euo pipefail
          node --check public-redesign-runtime.js
          node --check catalog-gap-runtime-worker.js
          node --check scripts/generate-tool-pages.mjs
          node --check scripts/promote-verified-gap-profiles-to-catalog.mjs
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs
      - name: Compile without database mutation
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/profile-evidence-build
      - name: Deploy Cloudflare Worker and public assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config wrangler.toml --latest
      - name: Verify live clean headings and no vendor-documentation anchor links
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 2 "https://trytoolscout.org/tools/hubspot?cutover=469" -o /tmp/hubspot.html || true
            curl -fsSL --retry 2 "https://trytoolscout.org/tools/posthog?cutover=469" -o /tmp/posthog.html || true
            if grep -Fq '<h1>HubSpot</h1>' /tmp/hubspot.html 2>/dev/null &&
               grep -Fq '<h1>PostHog</h1>' /tmp/posthog.html 2>/dev/null &&
               grep -Fq '1,000,000' /tmp/posthog.html 2>/dev/null &&
               grep -Fq 'href="/go/hubspot"' /tmp/hubspot.html 2>/dev/null &&
               grep -Fq 'href="/go/posthog"' /tmp/posthog.html 2>/dev/null &&
               ! grep -Eiq '<a[^>]+href="https?://[^"]*(help\.hubspot\.com|posthog\.com/pricing)' /tmp/hubspot.html /tmp/posthog.html; then
              echo 'PASS: named tool headings, publisher-only evidence and commercial routing live'
              exit 0
            fi
            sleep 10
          done
          echo 'Failed live publication verification' >&2
          exit 1
