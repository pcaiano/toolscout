name: Catalog Freshness and Coverage Engine

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/catalog-engine.json'
      - 'data/tools.json'
      - 'data/intents.json'
      - 'data/affiliate-pipeline.json'
      - 'data/catalog-wave*-enrichment*.json'
      - 'scripts/catalog-freshness-coverage-engine.mjs'
      - 'scripts/run-catalog-freshness-coverage.mjs'
      - 'scripts/scan-competitive-gaps.mjs'
      - '.github/workflows/catalog-freshness-coverage.yml'

permissions:
  contents: write

concurrency:
  group: toolscout-catalog-freshness-coverage
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh market coverage signals
        continue-on-error: true
        run: node scripts/scan-competitive-gaps.mjs

      - name: Run autonomous catalog engine
        run: node scripts/run-catalog-freshness-coverage.mjs

      - name: Run catalog health gate
        run: node scripts/catalog-health.mjs

      - name: Publish engine summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r=require('./reports/catalog-freshness-coverage.json');
          console.log('## Catalog Freshness & Coverage Engine');
          console.log('');
          console.log(`Generated: ${r.generatedAt}`);
          console.log(`- Catalog tools: **${r.summary.tools}**`);
          console.log(`- Automatic changes: **${r.summary.changes}**`);
          console.log(`- Source healthy: **${r.summary.sourceHealthy}**`);
          console.log(`- Source warnings: **${r.summary.sourceWarnings}**`);
          console.log(`- Coverage gaps: **${r.summary.coverageGaps}**`);
          console.log(`- Discovered vendor candidates: **${r.summary.discovered}**`);
          console.log(`- Quarantined after repeated confirmed breakage: **${r.summary.quarantined}**`);
          console.log('');
          console.log('Affiliate economics are excluded from catalog admission and ranking.');
          NODE

      - name: Commit autonomous catalog maintenance
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- data/tools.json data/catalog-freshness-state.json data/catalog-quarantine.json reports/catalog-freshness-coverage.json reports/catalog-health.json reports/competitive-gap-signals.json)" ]; then
            echo 'No catalog changes to commit.'
            exit 0
          fi
          git config user.name 'toolscout-catalog-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tools.json data/catalog-freshness-state.json data/catalog-quarantine.json reports/catalog-freshness-coverage.json reports/catalog-health.json reports/competitive-gap-signals.json
          git commit -m 'Autonomously refresh ToolScout catalog'
          git pull --rebase origin main
          git push origin HEAD:main
