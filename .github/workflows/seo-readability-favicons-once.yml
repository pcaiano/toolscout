name: SEO Readability and Comparison Favicons Once

on:
  push:
    paths:
      - '.github/workflows/seo-readability-favicons-once.yml'

permissions:
  contents: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate favicon enrichment script
        run: node --check scripts/enrich-comparison-favicons.mjs

      - name: Apply comparison favicons everywhere
        run: |
          node scripts/enrich-comparison-favicons.mjs --fix
          node scripts/enrich-comparison-favicons.mjs

      - name: Audit controlled SEO surface
        run: node scripts/audit-controlled-seo-surface.mjs

      - name: Validate AEO GEO readiness
        run: node scripts/validate-aeo-geo-readiness.mjs

      - name: Validate machine readability
        run: node scripts/validate-machine-readability.mjs

      - name: Validate SEO pages
        run: node scripts/validate-seo-pages.mjs

      - name: Validate editorial trust
        run: node scripts/validate-editorial-trust.mjs

      - name: Validate generated public surface
        run: node scripts/validate-public-surface.mjs

      - name: Validate commercial indexability and links
        run: node scripts/validate-commercial-indexability.mjs

      - name: Confirm SEO entry points
        run: |
          grep -q '^User-agent: \*$' robots.txt
          grep -q '^Allow: /$' robots.txt
          grep -q 'Sitemap: https://trytoolscout.org/sitemap.xml' robots.txt
          grep -q '<urlset' sitemap.xml
          grep -q '<loc>https://trytoolscout.org/</loc>' sitemap.xml

      - name: Confirm Command Center files are untouched
        run: |
          changed=$(git status --porcelain | awk '{print $2}')
          if printf '%s\n' "$changed" | grep -E '(^|/)(command-center-|analytics)'; then
            echo "Command Center file change detected. Refusing to continue."
            exit 1
          fi

      - name: Commit favicon enrichment
        run: |
          if [ -z "$(git status --porcelain -- '*.html' 'tools/*.html' 'blog/*.html')" ]; then
            echo "No comparison favicon HTML changes to commit."
          else
            git config user.name "toolscout-release-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html' 'tools/*.html' 'blog/*.html'
            git commit -m "Show vendor favicons on comparison links"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify live SEO entry points
        run: |
          curl -fsS https://trytoolscout.org/robots.txt -o /tmp/robots.txt
          grep -q 'Allow: /' /tmp/robots.txt
          grep -q 'Sitemap: https://trytoolscout.org/sitemap.xml' /tmp/robots.txt
          curl -fsS https://trytoolscout.org/sitemap.xml -o /tmp/sitemap.xml
          grep -q '<loc>https://trytoolscout.org/</loc>' /tmp/sitemap.xml

      - name: Verify live comparison favicons
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://trytoolscout.org/ -o /tmp/home.html || true
            curl -fsS https://trytoolscout.org/best-workflow-automation-tools.html -o /tmp/guide.html || true
            if grep -q 'data-comparison-favicons="1"' /tmp/home.html && grep -q 'data-comparison-favicons="1"' /tmp/guide.html; then
              exit 0
            fi
            sleep 10
          done
          echo "Live comparison favicon verification failed"
          exit 1

      - name: Verification marker
        run: echo "SEO readability and favicon pass complete"
