name: One Shot Phase 253 Surface Governance Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-253-surface-governance-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read remote D1 surface governance truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT surface_slug,surface_type,status,human_required,action_url,next_action
          FROM distribution_opportunities
          WHERE surface_slug IN (
            'wordpress-org','app-thestacc-com','app-getfernand-com','office-angi-com',
            'crozdesk-com','capterra-com','getapp-com','softwareadvice-com','sourceforge-net',
            'solutions-trustradius-com','account-vioscale-ai'
          )
          ORDER BY surface_slug;

          SELECT subject_key,executor,status,action,last_result
          FROM growth_execution_contract
          WHERE subject_type='surface'
            AND subject_key IN (
              'wordpress-org','app-thestacc-com','app-getfernand-com','office-angi-com',
              'crozdesk-com','capterra-com','getapp-com','softwareadvice-com','sourceforge-net',
              'solutions-trustradius-com'
            )
            AND status IN ('pending','claimed','attempted','deferred','stalled')
          ORDER BY subject_key,executor;

          SELECT surface_slug,status,outreach_error
          FROM distribution_network_outreach
          WHERE surface_slug IN (
            'crozdesk-com','capterra-com','getapp-com','softwareadvice-com','sourceforge-net',
            'solutions-trustradius-com'
          )
          ORDER BY surface_slug;

          SELECT source_key,status,last_result
          FROM contact_supply_source
          WHERE source_key IN (
            'wordpress-org','app-thestacc-com','app-getfernand-com','office-angi-com',
            'crozdesk-com','capterra-com','getapp-com','softwareadvice-com','sourceforge-net',
            'solutions-trustradius-com'
          )
          ORDER BY source_key,status;
          " | tee /tmp/phase253-proof.json

      - name: Assert Phase 253 production invariants
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const db=JSON.parse(fs.readFileSync('/tmp/phase253-proof.json','utf8'));
          const opportunities=db[0]?.results||[];
          const activeContracts=db[1]?.results||[];
          const outreach=db[2]?.results||[];
          const supply=db[3]?.results||[];
          const bySlug=new Map(opportunities.map(x=>[x.surface_slug,x]));

          for(const slug of ['wordpress-org','app-thestacc-com','app-getfernand-com','office-angi-com']){
            const row=bySlug.get(slug);
            if(row && row.status!=='skipped')throw new Error(slug+' was not quarantined: '+JSON.stringify(row));
          }

          for(const slug of ['crozdesk-com','capterra-com','getapp-com','softwareadvice-com','sourceforge-net','solutions-trustradius-com']){
            const row=bySlug.get(slug);
            if(row && row.surface_type!=='directory')throw new Error(slug+' is not governed as directory: '+JSON.stringify(row));
          }

          const vioscale=bySlug.get('account-vioscale-ai');
          if(vioscale && vioscale.status==='skipped')throw new Error('exact Vioscale submission route was incorrectly quarantined');

          if(activeContracts.length)throw new Error('Phase 253 left active noise/competitor outreach contracts: '+JSON.stringify(activeContracts));

          const badOutreach=outreach.filter(x=>!['suppressed_competitor','sent','adopted'].includes(String(x.status||'')));
          if(badOutreach.length)throw new Error('competitor outreach remains dispatchable: '+JSON.stringify(badOutreach));

          const badSupply=supply.filter(x=>!['exhausted','verified'].includes(String(x.status||'')));
          if(badSupply.length)throw new Error('contact supply still researches suppressed/noise surfaces: '+JSON.stringify(badSupply));

          console.log(JSON.stringify({
            ok:true,
            opportunityRows:opportunities.length,
            activeContracts:activeContracts.length,
            outreachRows:outreach.length,
            contactSupplyRows:supply.length,
            quarantined:['wordpress-org','app-thestacc-com','app-getfernand-com','office-angi-com'].filter(x=>bySlug.get(x)?.status==='skipped'),
            selfServiceDirectories:['crozdesk-com','capterra-com','getapp-com','softwareadvice-com','sourceforge-net','solutions-trustradius-com'].filter(x=>bySlug.get(x)?.surface_type==='directory'),
            vioscaleStatus:vioscale?.status||null
          },null,2));
          NODE
