name: One Shot Phase 178 Execution Failure Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-178-execution-failure-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect failed growth execution run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,detail,evidence_json
          FROM engine_runs
          WHERE engine='growth' AND mission='execution_contract'
          ORDER BY started_at DESC LIMIT 4;
          "
          echo EXECUTION_STATES
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT executor,status,action,COUNT(*) n
          FROM growth_execution_contract
          WHERE executor IN ('distribution_network','distribution_autonomous')
            AND status IN ('pending','claimed','attempted','stalled','deferred')
          GROUP BY executor,status,action
          ORDER BY executor,status,action;
          "
