name: ToolScout Growth Brain SEO Executor v5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-brain-seo-executor
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate manual fallback against healthy Cloudflare runtime
        id: supervisor
        run: |
          set -euo pipefail
          RUN=true
          REASON=cloudflare_runtime_unavailable
          if curl -fsS --connect-timeout 5 --max-time 15 https://trytoolscout.org/api/runtime/executors > /tmp/runtime.json; then
            node - <<'NODE' > /tmp/runtime-gate.txt
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/runtime.json','utf8'));
          const age=Date.now()-Date.parse(x.generatedAt||0);
          const healthy=x?.status==='active' &&
            x?.architecture==='cloudflare-primary-v1' &&
            x?.primary?.scheduler==='cloudflare_cron' &&
            x?.primary?.runtime==='cloudflare_workers' &&
            x?.githubActions?.role==='fallback_only' &&
            Number.isFinite(age) && age < 15*60*1000;
          process.stdout.write(healthy?'healthy':'degraded');
          NODE
            if [ "$(cat /tmp/runtime-gate.txt)" = "healthy" ]; then
              RUN=false
              REASON=cloudflare_primary_healthy
            else
              REASON=cloudflare_primary_degraded
            fi
          fi

          if [ "$RUN" = "true" ]; then
            if curl -fsS --retry 2 --retry-delay 2 --connect-timeout 5 --max-time 20 https://trytoolscout.org/api/growth/supervisor/public > /tmp/growth-supervisor.json; then
              node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/growth-supervisor.json','utf8'));
          if(x?.brain!=='shared-growth-v3') throw new Error('growth_supervisor_unavailable');
          const seo=(x.directives||[]).find(d=>d.engine==='seo_geo_aio');
          console.log(JSON.stringify({northStar:x.northStar,seo:seo?.status,directive:seo?.directive,fallback:true}));
          NODE
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Fallback gate: run=$RUN reason=$REASON"

      - name: Refresh GSC evidence
        if: steps.supervisor.outputs.run == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: sc-domain:trytoolscout.org
          GSC_LOOKBACK_DAYS: '28'
        run: node scripts/sync-gsc-signals.mjs

      - name: Refresh indexing and organic opportunities
        if: steps.supervisor.outputs.run == 'true'
        run: |
          node scripts/seo-indexing-gate.mjs
          node scripts/build-organic-growth-opportunities-v6.mjs
          node scripts/fetch-shared-growth-directives.mjs
          node scripts/run-organic-growth-controller-v4.mjs

      - name: Apply targeted SEO corrections
        if: steps.supervisor.outputs.run == 'true'
        run: |
          node scripts/apply-organic-growth-actions.mjs
          node scripts/enforce-seo-hygiene.mjs --fix
          node scripts/generate-sitemap.mjs

      - name: Refresh dependent SEO evidence after correction
        if: steps.supervisor.outputs.run == 'true'
        run: node scripts/generate-software-trends-index.mjs

      - name: Validate corrected surface
        if: steps.supervisor.outputs.run == 'true'
        run: |
          node scripts/validate-seo-pages.mjs
          node scripts/validate-editorial-trust.mjs
          node scripts/validate-public-surface.mjs

      - name: Commit only material SEO corrections
        if: steps.supervisor.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- reports/gsc-signals.json reports/organic-growth-opportunities.json reports/organic-growth-state.json reports/organic-growth-actions.json reports/runtime-growth-directives.json software-trends-index.json '*.html' sitemap.xml)" ]; then
            echo "No material Growth Brain SEO correction."
            exit 0
          fi
          git config user.name "toolscout-growth-brain"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/gsc-signals.json reports/organic-growth-opportunities.json reports/organic-growth-state.json reports/organic-growth-actions.json reports/runtime-growth-directives.json software-trends-index.json '*.html' sitemap.xml
          git commit -m "Apply Growth Brain SEO correction"
          git stash push --include-untracked -m "growth-brain-transient-validation-artifacts" || true
          git pull --rebase origin main
          git push origin HEAD:main
