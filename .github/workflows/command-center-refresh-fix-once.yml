name: ToolScout Command Center Refresh Fix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/command-center-refresh-fix-once.yml'

permissions:
  contents: read

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: node --check command-center-human-truth-details-worker.js

      - name: Verify guard in source
        run: |
          grep -q "refreshNullGuard:true" command-center-human-truth-details-worker.js
          grep -q "if(!ledgerBody)return" command-center-human-truth-details-worker.js

      - name: Deploy ToolScout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production
        run: |
          sleep 8
          curl -fsS --retry 5 --retry-delay 5 https://trytoolscout.org/api/command-center-human-truth-details-health | grep -q '"refreshNullGuard":true'
          curl -fsS --retry 5 --retry-delay 5 https://trytoolscout.org/analytics | grep -q 'if(!ledgerBody)return'
          if curl -fsS --retry 3 --retry-delay 3 https://trytoolscout.org/analytics | grep -q 'data-widget="ledger"'; then
            echo "Growth Ledger card unexpectedly present"
            exit 1
          fi
