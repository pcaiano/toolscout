name: One Shot Phase 169 Agenttool Eligibility Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-169-agenttool-eligibility-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect agenttool execution eligibility
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo OPPORTUNITY
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT surface_slug,surface_name,surface_type,status,human_required,action_url,live_url,next_action,
                 automation_potential,acceptance_probability,last_checked_at,updated_at
          FROM distribution_opportunities
          WHERE surface_slug='agenttool-sh';
          "
          echo ROUTES
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT route_id,surface_slug,domain,route_type,route_url,source_url,status,last_seen_at,updated_at
          FROM distribution_contact_routes
          WHERE surface_slug='agenttool-sh'
          ORDER BY updated_at DESC;
          "
          echo NETWORK
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT surface_slug,surface_name,surface_type,domain,source_url,status,contact_email,contact_source_url,
                 discovery_attempts,contact_checked_at,updated_at
          FROM distribution_network_outreach
          WHERE surface_slug='agenttool-sh';
          "
          echo TASK
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,source_kind,source_id,subject_type,subject_key,action,executor,status,priority_score,last_result,updated_at
          FROM growth_execution_contract
          WHERE subject_key='agenttool-sh'
          ORDER BY updated_at DESC;
          "
