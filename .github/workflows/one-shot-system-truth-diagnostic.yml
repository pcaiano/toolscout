name: One Shot System Truth Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-system-truth-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect SEO executor queue
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT status,COUNT(*) n,MIN(created_at) oldest_created,MIN(updated_at) oldest_updated FROM growth_execution_contract WHERE executor='seo_cloudflare' GROUP BY status ORDER BY status;"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT task_id,subject_key,action,priority_score,status,attempts,last_result,created_at,updated_at,claim_deadline FROM growth_execution_contract WHERE executor='seo_cloudflare' AND status IN ('pending','stalled','deferred') ORDER BY CASE status WHEN 'stalled' THEN 0 WHEN 'pending' THEN 1 ELSE 2 END,priority_score DESC,created_at ASC LIMIT 30;"
      - name: Inspect human gates
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT gate_key,engine,subject_type,subject_key,gate_type,status,action_url,reason,opened_at,updated_at FROM human_gate_contract WHERE status='open' ORDER BY updated_at DESC LIMIT 30;"
