name: Repair Command Center canonical asset handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-command-center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full Command Center worker and fix canonical asset fetch
        shell: bash
        run: |
          set -euo pipefail
          git show 40cc0ce199fa0bf4a82831cb71a567ea438f9df3:growth-command-center-v2-worker.js > growth-command-center-v2-worker.js
          python - <<'PY'
          from pathlib import Path
          p=Path('growth-command-center-v2-worker.js')
          s=p.read_text()
          old="new URL('/analytics-v2.html',request.url)"
          new="new URL('/analytics-v2/',request.url)"
          if old not in s:
              raise SystemExit('canonical asset fetch target not found')
          p.write_text(s.replace(old,new,1))
          PY
          grep -F "new URL('/analytics-v2/',request.url)" growth-command-center-v2-worker.js

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth-command-center-v2-worker.js
          git commit -m "Restore Command Center and eliminate asset redirect loop"
          git push origin HEAD:main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy repaired Worker directly
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify public analytics route does not redirect
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body -D /tmp/headers --max-redirs 0 -w '%{http_code}' https://trytoolscout.org/analytics/ || true)
          echo "HTTP $code"
          cat /tmp/headers || true
          if [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
            echo 'Unexpected redirect remains on /analytics/' >&2
            exit 1
          fi
          if [ "$code" != "404" ] && [ "$code" != "200" ]; then
            echo "Unexpected analytics response: $code" >&2
            exit 1
          fi
