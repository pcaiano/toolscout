name: One Shot Phase 240 Execution Closure Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase240-execution-closure-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect distribution execution closure truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT status,COUNT(*) n,
                 MIN(created_at) oldest_created,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM distribution_opportunities
          GROUP BY status ORDER BY n DESC,status;

          SELECT status,submission_type,COUNT(*) n,
                 SUM(CASE WHEN updated_at<datetime('now','-24 hours') THEN 1 ELSE 0 END) stale_24h,
                 SUM(CASE WHEN updated_at<datetime('now','-72 hours') THEN 1 ELSE 0 END) stale_72h,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM distribution_submissions
          WHERE surface_slug<>'indexnow'
          GROUP BY status,submission_type
          ORDER BY n DESC,status,submission_type;

          SELECT status,execution_mode,COUNT(*) n,
                 SUM(CASE WHEN updated_at<datetime('now','-24 hours') THEN 1 ELSE 0 END) stale_24h,
                 SUM(CASE WHEN updated_at<datetime('now','-72 hours') THEN 1 ELSE 0 END) stale_72h,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM distribution_contact_route_actions
          GROUP BY status,execution_mode
          ORDER BY n DESC,status,execution_mode;

          SELECT status,gate_type,COUNT(*) n,
                 SUM(CASE WHEN updated_at<datetime('now','-24 hours') THEN 1 ELSE 0 END) stale_24h,
                 SUM(CASE WHEN updated_at<datetime('now','-72 hours') THEN 1 ELSE 0 END) stale_72h,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM human_gate_contract
          WHERE engine='distribution'
          GROUP BY status,gate_type
          ORDER BY n DESC,status,gate_type;

          SELECT g.gate_key,g.subject_key,g.gate_type,g.status,g.action_url,g.updated_at,
                 o.status opportunity_status,o.human_required,o.action_url opportunity_url
          FROM human_gate_contract g
          LEFT JOIN distribution_opportunities o ON o.surface_slug=g.subject_key
          WHERE g.engine='distribution'
            AND g.status IN ('open','verification_pending')
          ORDER BY g.updated_at ASC LIMIT 80;

          SELECT executor,status,action,COUNT(*) n,
                 SUM(CASE WHEN updated_at<datetime('now','-2 hours') THEN 1 ELSE 0 END) stale_2h,
                 SUM(CASE WHEN updated_at<datetime('now','-12 hours') THEN 1 ELSE 0 END) stale_12h,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM growth_execution_contract
          WHERE engine='distribution'
             OR executor IN ('distribution_network','distribution_autonomous','make_sender')
          GROUP BY executor,status,action
          ORDER BY n DESC,executor,status,action;

          SELECT task_id,executor,action,subject_type,subject_key,status,last_result,
                 claimed_at,attempted_at,claim_deadline,attempt_deadline,verify_deadline,updated_at
          FROM growth_execution_contract
          WHERE (engine='distribution'
             OR executor IN ('distribution_network','distribution_autonomous','make_sender'))
            AND status IN ('pending','claimed','attempted','stalled')
          ORDER BY updated_at ASC LIMIT 100;

          SELECT job_type,status,COUNT(*) n,
                 SUM(CASE WHEN available_at<=datetime('now') THEN 1 ELSE 0 END) due_now,
                 SUM(CASE WHEN updated_at<datetime('now','-2 hours') THEN 1 ELSE 0 END) stale_2h,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM compute_overflow_jobs
          WHERE job_type IN (
            'distribution_route_research',
            'contact_route_research',
            'publisher_role_email_research',
            'vendor_role_email_research',
            'contact_supply_public_research',
            'authorized_http_action',
            'authorized_verification'
          )
          GROUP BY job_type,status
          ORDER BY job_type,status;

          SELECT policy_state,auth_required,COUNT(*) n,
                 SUM(CASE WHEN updated_at<datetime('now','-24 hours') THEN 1 ELSE 0 END) stale_24h,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM distribution_auto_adapters
          GROUP BY policy_state,auth_required
          ORDER BY n DESC,policy_state,auth_required;

          SELECT status,COUNT(*) n,
                 SUM(CASE WHEN updated_at<datetime('now','-24 hours') THEN 1 ELSE 0 END) stale_24h,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM auth_handoff
          GROUP BY status
          ORDER BY n DESC,status;

          SELECT engine,mission,status,trigger_name,started_at,completed_at,detail
          FROM engine_runs
          WHERE started_at>=datetime('now','-2 hours')
            AND engine IN ('distribution','growth','seo_geo_aio')
          ORDER BY started_at DESC LIMIT 80;
          "
