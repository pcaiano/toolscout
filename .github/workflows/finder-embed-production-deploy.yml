name: Deploy Finder Embed Product Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finder-embed-production-deploy.yml'
      - 'docs/OPERATING-CONTRACT.json'

permissions:
  contents: read

concurrency:
  group: finder-embed-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Deploy Finder embed product production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify ToolScout resource identity
        run: |
          set -euo pipefail
          grep -q '^name = "toolscout"$' wrangler.toml
          grep -q 'database_name = "toolscout"' wrangler.toml
          grep -q 'database_id = "cac6bc3c-d838-4edd-ba29-597030afb397"' wrangler.toml
          grep -q '^main = "compute-router-worker.js"$' wrangler.toml

      - name: Validate Finder production contract
        run: |
          set -euo pipefail
          node --check distribution-embed-worker.js
          node --check distribution-learning-worker.js
          node --check distribution-network-worker.js
          node --check embed/toolscout-finder.js
          node --test tests/toolscout-v2-finder-embed-product.test.mjs tests/toolscout-v2-distribution-embed-wrapper-removal.test.mjs tests/toolscout-v2-distribution-learning-wrapper-removal.test.mjs

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml

      - name: Verify Finder telemetry schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name='distribution_embed_events';" > /tmp/finder-schema.txt
          cat /tmp/finder-schema.txt
          grep -q 'distribution_embed_events' /tmp/finder-schema.txt

      - name: Deploy ToolScout Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify Finder live
        run: |
          set -euo pipefail
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(url,expectStatus=200){
            let last;
            for(let i=0;i<12;i++){
              try{
                const r=await fetch(url,{headers:{'user-agent':'ToolScout Finder production verifier'}});
                const body=await r.text();
                if(r.status===expectStatus)return {r,body};
                last=new Error(`${url} returned ${r.status}: ${body.slice(0,200)}`);
              }catch(e){last=e}
              await sleep(5000);
            }
            throw last||new Error('request_failed');
          }
          const kit=await get('https://trytoolscout.org/distribution/publisher-kit');
          if(!kit.body.includes('Add software discovery to your site.')||!kit.body.includes('Finder Full')||!kit.body.includes('Finder Mini'))throw new Error('publisher_kit_contract_missing');

          const js=await get('https://trytoolscout.org/embed/toolscout-finder.js');
          if(!js.body.includes("attachShadow({mode:'open'})")||!js.body.includes('/api/recommend')||!js.body.includes("data-toolscout-embed','finder"))throw new Error('finder_script_contract_missing');

          const broad=await get('https://trytoolscout.org/api/recommend?q=SEO');
          const broadJson=JSON.parse(broad.body);
          if(broadJson.recommendation_type!=='category'||!Array.isArray(broadJson.recommendations)||!broadJson.recommendations.length||broadJson.recommendations[0].match!==null||broadJson.recommendations[0].match_type!=='category_fit')throw new Error('broad_search_quality_gate_failed');

          const noise=await get('https://trytoolscout.org/api/recommend?q=coiso',422);
          const noiseJson=JSON.parse(noise.body);
          if(noiseJson.error!=='recommendation_unresolved')throw new Error('noise_rejection_gate_failed');

          const manifest=await get('https://trytoolscout.org/.well-known/toolscout-distribution.json');
          const manifestJson=JSON.parse(manifest.body);
          if(manifestJson?.distribution?.finder_script!=='https://trytoolscout.org/embed/toolscout-finder.js')throw new Error('finder_manifest_missing');
          if(!Array.isArray(manifestJson?.distribution?.finder_modes)||!manifestJson.distribution.finder_modes.includes('full')||!manifestJson.distribution.finder_modes.includes('mini'))throw new Error('finder_modes_manifest_missing');

          console.log(JSON.stringify({
            ok:true,
            publisherKit:true,
            finderScript:true,
            broadCategoryGate:true,
            noiseGate:true,
            manifest:true
          },null,2));
          NODE
