name: Deploy Public Design Consolidation Production
# one-time production consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-design-consolidation-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-public-design-consolidation-production
  cancel-in-progress: true

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Deploy public design consolidation production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public design consolidation
        run: |
          set -euo pipefail
          node --check public-redesign-runtime.js
          node --check scripts/verify-redesign-2-live.mjs
          node --test tests/toolscout-v2-public-redesign.test.mjs
      - name: Deploy current main to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Inspect live navigation composition
        run: |
          node --input-type=module <<'NODE'
          for (const path of ['/guides','/compare','/best-project-management-tools','/tools/figma','/whats-new']) {
            const response=await fetch('https://trytoolscout.org'+path+'?design_diag=1',{headers:{'cache-control':'no-cache','user-agent':'ToolScout-Design-Diagnostic/2.0'}});
            const html=await response.text();
            const matches=[...html.matchAll(/class=["'][^"']*\\bts2-global-nav\\b[^"']*["']/g)];
            const legacy=/<nav\\b[^>]*>[\\s\\S]*?<a\\b[^>]*class=["']brand["'][^>]*>\\s*ToolScout\\s*<\\/a>[\\s\\S]*?<\\/nav>/i.test(html);
            const top=/<div\\b[^>]*class=["'][^"']*\\btop\\b[^"']*["'][^>]*>[\\s\\S]*?<a\\b[^>]*class=["']brand["'][^>]*>\\s*ToolScout\\s*<\\/a>/i.test(html);
            console.log(JSON.stringify({path,status:response.status,navCount:matches.length,legacy,top,surface:(html.match(/data-toolscout-surface=["']([^"']+)/)||[])[1]||null,redesign:(html.match(/data-toolscout-redesign=["']([^"']+)/)||[])[1]||null}));
            for (const m of matches) console.log(path+' NAV '+html.slice(Math.max(0,m.index-160),Math.min(html.length,m.index+520)).replace(/\\s+/g,' '));
          }
          NODE
      - name: Verify all public sitemap pages live
        run: node scripts/verify-redesign-2-live.mjs
