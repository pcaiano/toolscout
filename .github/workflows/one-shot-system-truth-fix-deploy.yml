name: One Shot System Truth Fix Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-system-truth-fix-deploy.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-one-shot-system-truth-fix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate System Truth semantics
        run: node tests/system-truth-semantics.test.mjs
      - name: Validate distribution copy
        run: node scripts/check-distribution-copy.mjs
      - name: Deploy current Worker
        run: npx wrangler deploy --config wrangler.toml --latest
      - name: Requeue SEO claim-starvation stalls
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "UPDATE growth_execution_contract SET status='deferred',claim_deadline=NULL,attempt_deadline=NULL,verify_deadline=NULL,claimed_at=NULL,attempted_at=NULL,last_result='requeued_after_stalled_priority_fix',updated_at=datetime('now') WHERE executor='seo_cloudflare' AND status='stalled' AND last_result='claim_sla_missed';"
      - name: Verify repaired state
        run: |
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT status,COUNT(*) n FROM growth_execution_contract WHERE executor='seo_cloudflare' GROUP BY status ORDER BY status;"
          curl -fsS "https://trytoolscout.org/api/command-center-business-truth?fresh=1"
          curl -fsS "https://trytoolscout.org/api/distribution/authority/closed-loop-health?fresh=1"
          if curl -fsS "https://trytoolscout.org/analytics" | grep -Fq "Search + Authority"; then echo "Search + Authority card still present"; exit 1; fi
