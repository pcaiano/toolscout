name: One Shot Phase 252 Discovery Quality Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-252-discovery-quality-proof.yml'

permissions:
  contents: read
  id-token: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture remote D1 proof marker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT datetime('now') started_at;" > /tmp/phase252-marker.json
          cat /tmp/phase252-marker.json
          STARTED_AT="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/phase252-marker.json','utf8'))[0].results[0].started_at")"
          echo "STARTED_AT=$STARTED_AT" >> "$GITHUB_ENV"

      - name: Prime bounded proof frontier
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          UPDATE distribution_discovery_sources
          SET last_scanned_at=NULL,updated_at=datetime('now')
          WHERE source_slug IN (
            SELECT source_slug
            FROM distribution_discovery_sources
            WHERE status='active' AND confidence>=60
            ORDER BY COALESCE(last_scanned_at,'1970-01-01') ASC
            LIMIT 4
          );
          SELECT COUNT(*) forced_due
          FROM distribution_discovery_sources
          WHERE status='active' AND confidence>=60 AND last_scanned_at IS NULL;
          " | tee /tmp/phase252-prime.json

      - name: Get ToolScout discovery OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=toolscout-discovery")"
          token="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(1); process.stdout.write(x.value)" "$response")"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Exercise live Phase 252 discovery quality gate
        env:
          TOOLSCOUT_DISCOVERY_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            http_code="$(curl -sS -o "/tmp/phase252-discovery-${attempt}.json" -w '%{http_code}' \
              -X POST 'https://trytoolscout.org/api/distribution/discovery/refresh' \
              -H "Authorization: Bearer $TOOLSCOUT_DISCOVERY_TOKEN" \
              -H 'Content-Type: application/json')"
            cat "/tmp/phase252-discovery-${attempt}.json"
            test "$http_code" -ge 200
            test "$http_code" -lt 300
            due="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/phase252-discovery-${attempt}.json','utf8')).due_sources_after||0")"
            if [ "$due" -le 0 ]; then break; fi
          done

          node - <<'NODE'
          const fs=require('fs');
          const files=fs.readdirSync('/tmp').filter(x=>/^phase252-discovery-\d+\.json$/.test(x)).sort();
          const rows=files.map(f=>JSON.parse(fs.readFileSync('/tmp/'+f,'utf8')));
          const sum=k=>rows.reduce((n,x)=>n+Number(x?.[k]||0),0);
          const proof={
            cycles:rows.length,
            scanned:sum('scanned'),
            found:sum('found'),
            inserted:sum('inserted'),
            knownDuplicates:sum('known_duplicates'),
            recursiveSourcesLearned:sum('recursive_sources_learned'),
            firstDue:Number(rows[0]?.due_sources_before||0),
            lastDue:Number(rows.at(-1)?.due_sources_after||0)
          };
          console.log(JSON.stringify(proof,null,2));
          if(rows.some(x=>x?.ok!==true))throw new Error('Phase 252 discovery refresh failed');
          if(rows.some(x=>Number(x?.source_rescan_hours)!==6))throw new Error('Phase 252 freshness contract missing');
          if(proof.firstDue<1)throw new Error('Phase 252 bounded proof frontier was not primed');
          if(proof.scanned<=0)throw new Error('Phase 252 proof scanned no primed discovery source');
          NODE

      - name: Prove newly admitted opportunities are distribution-like
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT surface_slug,surface_type,action_url,status,created_at
          FROM distribution_opportunities
          WHERE created_at>='$STARTED_AT'
          ORDER BY created_at ASC,surface_slug ASC;
          " > /tmp/phase252-new-opportunities.json
          cat /tmp/phase252-new-opportunities.json

          node - <<'NODE'
          const fs=require('fs');
          const db=JSON.parse(fs.readFileSync('/tmp/phase252-new-opportunities.json','utf8'));
          const rows=db[0]?.results||[];
          const config=JSON.parse(fs.readFileSync('data/distribution-discovery-sources.json','utf8'));
          const canonical=config?.guardrails?.canonical_hosts||{};
          const overrides=config?.guardrails?.host_status_overrides||{};
          const surface=/(?:^|[\s./_-])(directory|directories|registry|registries|submit|submission|listing|listings|launch|startup|resource|resources|newsletter|community|partner|publisher|media|press|roundup|comparison|review|curated|catalog|marketplace|showcase|discover|tool|tools)(?:$|[\s./_?&=-])/i;
          const knownFalsePositiveHosts=new Set(['adplug.app','digitalinterview.ai','markitdown.ai','panzoe.ai']);
          const bad=[];
          for(const row of rows){
            let u=null;try{u=new URL(String(row.action_url||''))}catch{}
            if(!u){bad.push({...row,reason:'invalid_action_url'});continue}
            const host=u.hostname.toLowerCase().replace(/^www\./,'');
            const text=(host+' '+u.pathname).toLowerCase();
            const curated=Boolean(canonical[host]||overrides[host]);
            if(knownFalsePositiveHosts.has(host))bad.push({...row,reason:'known_product_false_positive'});
            else if(!curated&&!surface.test(text))bad.push({...row,reason:'not_distribution_like'});
          }
          const proof={ok:bad.length===0,newOpportunities:rows.length,bad};
          console.log(JSON.stringify(proof,null,2));
          if(bad.length)throw new Error('Phase 252 admitted non-distribution candidates: '+JSON.stringify(bad));
          NODE
