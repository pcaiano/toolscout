name: One Shot Machine Safe Funnel Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-machine-safe-funnel-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate machine-safe conversion changes
        run: |
          set -euo pipefail
          node --check overflow-compute/research-core.mjs
          node --check distribution-autonomous-worker.js
          node --check compute-router-worker.js
          node --check operational-truth-reconciliation-worker.js
          node --check command-center-simplified-view.js
          node tests/compute-overflow-policy.test.mjs
          node tests/distribution-executor-lanes.test.mjs
          node tests/distribution-high-throughput-policy.test.mjs
          node tests/command-center-hybrid-architecture.test.mjs
          node tests/overflow-failure-containment.test.mjs
          node tests/autonomous-architecture-incident-recovery.test.mjs
          node tests/execution-contract-stall-isolation.test.mjs

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify live health surface
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://trytoolscout.org"
          curl -fsS --max-time 20 "$BASE/api/compute/health" -o /tmp/compute.json
          jq -e '.status=="configured" and .executionDailyJobBudget==800 and (.distributionFunnel.machineCandidatesFoundToday|type=="number")' /tmp/compute.json >/dev/null
          curl -fsSL --max-time 20 "$BASE/analytics" -o /tmp/analytics.html
          grep -q "Machine-safe form candidates" /tmp/analytics.html
          grep -q "Open architecture incident detail" /tmp/analytics.html
