name: One Shot Bluesky Reply Guard v2 Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-bluesky-reply-guard-v2-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Bluesky reply guard
        run: |
          node --check audience-worker.js
          node tests/bluesky-reply-length-guard.test.mjs
      - name: Deploy ToolScout worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
