name: One Shot Phase 158 Agenttool Handoff Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase153-supervisor-freshness.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect agenttool authority handoff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo NETWORK
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT * FROM distribution_network_outreach WHERE surface_slug='agenttool-sh' ORDER BY updated_at DESC LIMIT 5;
          "
          echo OPPORTUNITY
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT opportunity_key,subject_type,subject_key,priority_score,action_json,status,last_evaluated_at
          FROM growth_opportunity_state
          WHERE subject_type='surface' AND subject_key='agenttool-sh'
          ORDER BY last_evaluated_at DESC LIMIT 5;
          "
          echo CONTRACTS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,action,executor,status,last_result,updated_at
          FROM growth_execution_contract
          WHERE subject_key='agenttool-sh'
          ORDER BY updated_at DESC;
          "
