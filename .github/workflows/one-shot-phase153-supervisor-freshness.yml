name: One Shot Phase 153 Supervisor Freshness Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase153-supervisor-freshness.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect supervisor freshness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo SUPERVISOR
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,status,directive,strict_humans_24h,strict_humans_7d,external_executions_24h,external_executions_7d,last_evaluated_at
          FROM growth_supervisor_state
          ORDER BY engine;
          "
          echo SELF_AUDIT
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,detail
          FROM engine_runs
          WHERE engine='growth' AND mission='self_audit'
          ORDER BY started_at DESC LIMIT 12;
          "
          echo OPPORTUNITY_COORDINATION
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT engine,mission,status,trigger_name,started_at,completed_at,detail
          FROM engine_runs
          WHERE engine='growth' AND mission='opportunity_coordination'
          ORDER BY started_at DESC LIMIT 8;
          "
