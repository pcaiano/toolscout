name: One Shot Phase 157 Authority Execution Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase153-supervisor-freshness.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect current authority execution truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo READY
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,subject_type,subject_key,priority_score,status,last_result,updated_at
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface')
            AND status IN ('pending','claimed','attempted','stalled')
          ORDER BY priority_score DESC,
            CASE action
              WHEN 'verify_backlink_acquisition' THEN 0
              WHEN 'execute_alternate_routes' THEN 1
              WHEN 'publisher_contact_discovery' THEN 2
              WHEN 'autonomous_route_qualification' THEN 3
              WHEN 'scale_proven_surface' THEN 5
              ELSE 4
            END,
            updated_at ASC LIMIT 30;
          "
          echo EXTERNAL_ATTEMPTS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT
            (SELECT COUNT(*) FROM distribution_submissions WHERE surface_slug<>'indexnow' AND attempts>0 AND COALESCE(last_attempt_at,created_at)>=datetime('now','-24 hours')) submissions24,
            (SELECT COUNT(*) FROM distribution_events WHERE event_type IN ('vendor_outreach_sent','publisher_network_outreach_sent') AND created_at>=datetime('now','-24 hours')) outreach24,
            (SELECT COUNT(*) FROM distribution_submissions WHERE surface_slug<>'indexnow' AND attempts>0 AND COALESCE(last_attempt_at,created_at)>=datetime('now','-7 days')) submissions7d,
            (SELECT COUNT(*) FROM distribution_events WHERE event_type IN ('vendor_outreach_sent','publisher_network_outreach_sent') AND created_at>=datetime('now','-7 days')) outreach7d;
          "
          echo ROUTES
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT o.surface_slug,o.status,o.human_required,o.action_url,o.live_url,
                 a.method,a.endpoint,a.public_url,
                 n.status network_status,n.contact_email,n.contact_source_url
          FROM distribution_opportunities o
          LEFT JOIN distribution_auto_adapters a ON a.surface_slug=o.surface_slug
          LEFT JOIN distribution_network_outreach n ON n.surface_slug=o.surface_slug
          WHERE o.status IN ('ready_to_submit','research_required','candidate','discovered','live','verified','pending_review')
            AND COALESCE(o.human_required,0)=0
          ORDER BY CASE WHEN a.endpoint IS NOT NULL THEN 0 WHEN n.contact_email IS NOT NULL THEN 1 ELSE 2 END,o.updated_at DESC
          LIMIT 40;
          "
