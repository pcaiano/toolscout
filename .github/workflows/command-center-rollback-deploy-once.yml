name: Command Center Rollback Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/command-center-rollback-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate stable Command Center worker
        run: node --check command-center-autoload-worker.js

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify stable Command Center deployment
        run: |
          set -euo pipefail
          URL='https://trytoolscout.org/api/command-center-autoload-health'
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$URL" -o /tmp/health; then break; fi
            sleep 5
          done
          cat /tmp/health
          grep -q '"version":3' /tmp/health
          grep -q '"trafficTrend":true' /tmp/health
