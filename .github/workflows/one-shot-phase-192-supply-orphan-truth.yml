name: One Shot Phase 192 Supply Orphan Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-192-supply-orphan-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect SaaSBison and competitor policy state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT 'OPPORTUNITY' kind,surface_slug,surface_name,surface_type,status,human_required,action_url,distribution_score,updated_at
          FROM distribution_opportunities WHERE surface_slug='saasbison-com';

          SELECT 'NETWORK' kind,surface_slug,domain,status,priority_score,contact_email,contact_source_url,updated_at
          FROM distribution_network_outreach WHERE surface_slug='saasbison-com';

          SELECT 'GROWTH' kind,opportunity_key,subject_type,subject_key,priority_score,action_json,status,last_evaluated_at,updated_at
          FROM growth_opportunity_state WHERE subject_type='surface' AND subject_key='saasbison-com';

          SELECT 'CONTRACT' kind,task_id,action,executor,status,priority_score,last_result,updated_at
          FROM growth_execution_contract
          WHERE subject_type='surface' AND subject_key='saasbison-com'
          ORDER BY updated_at DESC;

          SELECT 'COMPETITOR' kind,n.surface_slug,n.domain,n.status,
                 c.task_id,c.action,c.status contract_status,c.last_result
          FROM distribution_network_outreach n
          LEFT JOIN growth_execution_contract c ON c.subject_type='surface' AND c.subject_key=n.surface_slug
          WHERE n.domain IN ('bestofai.com','bestofai.io','dynamite-ai.com')
             OR n.surface_slug IN ('best-of-ai','dynamite-ai-com')
          ORDER BY n.surface_slug,c.updated_at DESC;
          "
