name: Export Business Intelligence Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/business-intelligence-export.yml'
      - 'scripts/export-business-intelligence.mjs'

permissions:
  contents: write

concurrency:
  group: business-intelligence-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export business intelligence snapshot
        run: node scripts/export-business-intelligence.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Commit snapshot when changed
        run: |
          if [ -z "$(git status --porcelain -- data/business-intelligence.json data/business-intelligence-history.json)" ]; then
            echo "No business intelligence changes"
            exit 0
          fi
          git config user.name "toolscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/business-intelligence.json data/business-intelligence-history.json
          git commit -m "Update business intelligence snapshot"
          git pull --rebase origin main
          git push
