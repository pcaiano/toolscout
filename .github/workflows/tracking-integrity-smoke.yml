name: Tracking Integrity Smoke

on:
  push:
    paths:
      - 'private-assets.js'
      - 'session-classification.js'
      - 'funnel-worker.js'
      - 'wrangler.toml'
      - '.github/workflows/tracking-integrity-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployment and verify browser-confirmed tracking
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE="tracking_smoke_${GITHUB_RUN_ID}"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'

          READY=0
          for ATTEMPT in $(seq 1 30); do
            PROBE_SESSION=$(node -e "console.log(require('crypto').randomUUID())")
            PROBE_CODE=$(curl -sS -o /tmp/probe-confirm.json -w '%{http_code}' \
              -A "$UA" \
              -H 'Origin: https://trytoolscout.org' \
              -H 'Sec-Fetch-Site: same-origin' \
              -H 'Content-Type: application/json' \
              -H "Cookie: toolscout_session=${PROBE_SESSION}" \
              --data "{\"event_id\":\"confirm_${PROBE_SESSION}\",\"session_id\":\"${PROBE_SESSION}\",\"event_type\":\"page_confirmed\",\"path\":\"/best-cold-email-tools\",\"source\":\"browser-confirm\"}" \
              https://trytoolscout.org/api/events || true)

            EFFECTIVE_URL=$(curl -LsS -o /dev/null -w '%{url_effective}' \
              -A "$UA" \
              -H 'Cookie: toolscout_owner=1' \
              'https://trytoolscout.org/best-cold-email-tools.html')
            TARGET_BASE="${EFFECTIVE_URL%%\?*}"
            curl -fsSL -A "$UA" -H 'Cookie: toolscout_owner=1' \
              "${TARGET_BASE}?source=${SOURCE}" >/tmp/readiness-page.html || true

            if [ "$PROBE_CODE" = '403' ] && grep -q 'toolscout_session_v2' /tmp/readiness-page.html; then
              READY=1
              break
            fi
            sleep 4
          done
          if [ "$READY" != '1' ]; then
            echo "Tracking route never became ready. Last confirmation probe HTTP: ${PROBE_CODE}; bootstrap present: $(grep -q 'toolscout_session_v2' /tmp/readiness-page.html && echo yes || echo no)"
            exit 1
          fi

          FAKE_SESSION=$(node -e "console.log(require('crypto').randomUUID())")
          FAKE_CODE=$(curl -sS -o /tmp/fake-confirm.json -w '%{http_code}' \
            -A "$UA" \
            -H 'Origin: https://trytoolscout.org' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'Content-Type: application/json' \
            -H "Cookie: toolscout_session=${FAKE_SESSION}" \
            --data "{\"event_id\":\"confirm_${FAKE_SESSION}\",\"session_id\":\"${FAKE_SESSION}\",\"event_type\":\"page_confirmed\",\"path\":\"/best-cold-email-tools\",\"source\":\"browser-confirm\"}" \
            https://trytoolscout.org/api/events)
          if [ "$FAKE_CODE" != '403' ]; then
            echo "Forged confirmation was not rejected. HTTP: ${FAKE_CODE}"
            exit 1
          fi

          EFFECTIVE_URL=$(curl -LsS -o /dev/null -w '%{url_effective}' \
            -A "$UA" \
            -H 'Cookie: toolscout_owner=1' \
            'https://trytoolscout.org/best-cold-email-tools.html')
          TARGET_BASE="${EFFECTIVE_URL%%\?*}"
          PAGE_PATH=$(node -e "console.log(new URL(process.argv[1]).pathname)" "$TARGET_BASE")
          echo "Testing canonical public path: ${PAGE_PATH}"

          curl -fsSL --retry 5 --retry-delay 5 \
            -A "$UA" \
            -H 'Cookie: toolscout_owner=1' \
            -D /tmp/page-headers.txt \
            "${TARGET_BASE}?source=${SOURCE}" >/tmp/page.html
          grep -q 'toolscout_session_v2' /tmp/page.html || { echo 'Tracking bootstrap missing from canonical HTML response'; exit 1; }
          SESSION=$(grep -i '^set-cookie: toolscout_session=' /tmp/page-headers.txt | tail -1 | sed -E 's/^[^=]+=([^;]+).*/\1/' | tr -d '\r')
          if [ -z "$SESSION" ]; then
            echo 'Tracking session cookie missing from canonical HTML response'
            exit 1
          fi

          CONFIRM_CODE=$(curl -sS -o /tmp/valid-confirm.json -w '%{http_code}' \
            -A "$UA" \
            -H 'Origin: https://trytoolscout.org' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'Content-Type: application/json' \
            -H "Cookie: toolscout_owner=1; toolscout_session=${SESSION}" \
            --data "{\"event_id\":\"confirm_${SESSION}\",\"session_id\":\"${SESSION}\",\"event_type\":\"page_confirmed\",\"path\":\"${PAGE_PATH}\",\"source\":\"browser-confirm\"}" \
            https://trytoolscout.org/api/events)
          if [ "$CONFIRM_CODE" != '202' ]; then
            echo "Valid browser confirmation rejected. HTTP: ${CONFIRM_CODE}"
            cat /tmp/valid-confirm.json || true
            exit 1
          fi

          D1_OK=0
          for READ_ATTEMPT in $(seq 1 8); do
            START_RESULT=$(npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT COUNT(*) count FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='session_started' AND f.source='${SOURCE}' AND f.path='${PAGE_PATH}' AND s.classification='owner';")
            CONFIRM_RESULT=$(npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT COUNT(*) count FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.session_id='${SESSION}' AND f.event_type='page_confirmed' AND s.classification='owner';")
            START_COUNT=$(node -e "const p=JSON.parse(process.argv[1]);const b=Array.isArray(p)?p[0]:p;const rows=b?.results||b?.result?.[0]?.results||[];process.stdout.write(String(Number(rows[0]?.count||0)))" "$START_RESULT")
            CONFIRM_COUNT=$(node -e "const p=JSON.parse(process.argv[1]);const b=Array.isArray(p)?p[0]:p;const rows=b?.results||b?.result?.[0]?.results||[];process.stdout.write(String(Number(rows[0]?.count||0)))" "$CONFIRM_RESULT")
            echo "D1 verification attempt ${READ_ATTEMPT}: page entry=${START_COUNT}, browser confirmation=${CONFIRM_COUNT}"
            if [ "$START_COUNT" -ge 1 ] && [ "$CONFIRM_COUNT" -eq 1 ]; then
              D1_OK=1
              break
            fi
            sleep 5
          done

          if [ "$D1_OK" != '1' ]; then
            echo 'D1 verification did not converge. Session diagnostics follow.'
            npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT f.event_id,f.session_id,f.event_type,f.source,f.path,f.created_at,s.classification,s.first_seen_at,s.last_seen_at FROM funnel_events f LEFT JOIN sessions s ON s.session_id=f.session_id WHERE f.session_id='${SESSION}' ORDER BY f.created_at;" || true
            npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT session_id,source,referrer_host,classification,first_seen_at,last_seen_at FROM sessions WHERE session_id='${SESSION}';" || true
            echo "Last page-entry result: ${START_RESULT}"
            echo "Last browser-confirmation result: ${CONFIRM_RESULT}"
            exit 1
          fi

          FAKE_RESULT=$(npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT COUNT(*) count FROM funnel_events WHERE session_id='${FAKE_SESSION}' AND event_type='page_confirmed';")
          node -e "const p=JSON.parse(process.argv[1]);const b=Array.isArray(p)?p[0]:p;const rows=b?.results||b?.result?.[0]?.results||[];if(Number(rows[0]?.count||0)!==0){console.error('forged browser confirmation was recorded');process.exit(1)}" "$FAKE_RESULT"

          POLLUTION_RESULT=$(npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT COUNT(*) count FROM sessions s WHERE s.classification='likely-human' AND NOT EXISTS (SELECT 1 FROM funnel_events f WHERE f.session_id=s.session_id AND f.event_type='session_started') AND s.source LIKE 'tracking_smoke_%';")
          node -e "const p=JSON.parse(process.argv[1]);const b=Array.isArray(p)?p[0]:p;const rows=b?.results||b?.result?.[0]?.results||[];if(Number(rows[0]?.count||0)!==0){console.error('smoke polluted likely-human traffic');process.exit(1)}" "$POLLUTION_RESULT"

          echo "Page entry, browser confirmation binding, forgery rejection and owner exclusion verified."
