name: Tracking Integrity Smoke

on:
  push:
    paths:
      - 'private-assets.js'
      - 'session-classification.js'
      - '.github/workflows/tracking-integrity-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployment and verify page entry tracking
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sleep 20
          RUN_ID="tracking-smoke-${GITHUB_RUN_ID}"
          SOURCE="tracking_smoke_${GITHUB_RUN_ID}"
          curl -fsS --retry 5 --retry-delay 5 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36' \
            -H 'Cookie: toolscout_owner=1' \
            "https://trytoolscout.org/best-cold-email-tools.html?source=${SOURCE}" >/tmp/page.html
          grep -q 'toolscout_session_v2' /tmp/page.html
          sleep 3
          RESULT=$(npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT COUNT(*) count FROM funnel_events f JOIN sessions s ON s.session_id=f.session_id WHERE f.event_type='session_started' AND f.source='${SOURCE}' AND f.path='/best-cold-email-tools.html' AND s.classification='owner';")
          node -e "const p=JSON.parse(process.argv[1]);const b=Array.isArray(p)?p[0]:p;const rows=b?.results||b?.result?.[0]?.results||[];if(Number(rows[0]?.count||0)<1){console.error('page-entry event missing');process.exit(1)}" "$RESULT"
          RESULT2=$(npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "SELECT COUNT(*) count FROM sessions s WHERE s.classification='likely-human' AND NOT EXISTS (SELECT 1 FROM funnel_events f WHERE f.session_id=s.session_id AND f.event_type='session_started') AND s.source LIKE 'tracking_smoke_%';")
          node -e "const p=JSON.parse(process.argv[1]);const b=Array.isArray(p)?p[0]:p;const rows=b?.results||b?.result?.[0]?.results||[];if(Number(rows[0]?.count||0)!==0){console.error('smoke polluted likely-human traffic');process.exit(1)}" "$RESULT2"
          echo "Page-entry tracking and owner exclusion verified."
