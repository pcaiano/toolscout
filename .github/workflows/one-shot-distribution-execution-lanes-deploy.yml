name: One Shot Distribution Execution Lanes Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-distribution-execution-lanes-deploy.yml"

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate distribution execution lanes
        run: |
          node --check auth-automation.js
          node --check distribution-autonomous-worker.js
          node --check distribution-throughput-worker.js
          node --check distribution-submission-worker.js
          node --check compute-router-worker.js
          node --check distribution-engine-worker.js
          node tests/distribution-executor-lanes.test.mjs
          node tests/distribution-high-throughput-policy.test.mjs
          node tests/human-gate-nonblocking.test.mjs
          node tests/compute-overflow-policy.test.mjs

      - name: Validate ToolScout copy guard
        run: node scripts/check-distribution-copy.mjs

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
