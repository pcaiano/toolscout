name: One Shot Bluesky Credential Presence

on:
  push:
    paths:
      - ".github/workflows/one-shot-bluesky-credential-presence.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
      BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
    steps:
      - name: Report credential presence without values
        shell: bash
        run: |
          set -euo pipefail
          for name in BLUESKY_IDENTIFIER BLUESKY_HANDLE BLUESKY_APP_PASSWORD BLUESKY_PASSWORD BSKY_IDENTIFIER BSKY_APP_PASSWORD MAKE_API_TOKEN; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=absent"
            fi
          done
