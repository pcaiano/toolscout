name: Deploy ToolScout Social Image Worker

on:
  push:
    branches: [main]
    paths:
      - "social-image-worker.js"
      - "wrangler.social-image.toml"
      - ".github/workflows/deploy-social-image-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-social-image-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy social image Worker
        run: npx wrangler deploy --config wrangler.social-image.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
