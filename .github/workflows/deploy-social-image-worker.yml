name: Deploy ToolScout Social Image Worker

on:
  push:
    branches: [main]
    paths:
      - "social-image-worker.js"
      - "wrangler.social-image.toml"
      - ".github/workflows/deploy-social-image-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-social-image-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy social image Worker
        run: npx wrangler deploy --config wrangler.social-image.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test brand composer without AI quota
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          URL='https://toolscout-social-image.luxurybuyerintelligence.workers.dev/compose-smoke?variant=discovery'
          curl --fail --retry 3 --retry-delay 3 -D /tmp/toolscout-headers.txt -o /tmp/toolscout-smoke.jpg "$URL"
          grep -qi '^x-toolscout-renderer: flux2-brand-composer-v9' /tmp/toolscout-headers.txt
          grep -qi '^x-toolscout-brand-composer: cloudflare-images' /tmp/toolscout-headers.txt
          grep -qi '^x-toolscout-image-model: brand-smoke' /tmp/toolscout-headers.txt
          test "$(head -c 2 /tmp/toolscout-smoke.jpg | xxd -p)" = 'ffd8'
          BYTES=$(wc -c < /tmp/toolscout-smoke.jpg)
          test "$BYTES" -gt 5000
          echo "Brand composer JPEG smoke test passed without Workers AI: ${BYTES} bytes"
