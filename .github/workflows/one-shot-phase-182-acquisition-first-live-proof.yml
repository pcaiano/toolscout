name: One Shot Phase 182 Acquisition First Live Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-182-acquisition-first-live-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait through next primary growth cycle
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          next=$(( ((now / 900) + 1) * 900 + 120 ))
          delay=$(( next - now ))
          if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          echo "Proof read at $(date -u +%FT%TZ)"
      - name: Prove corrected execution contract and authority target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo LATEST_EXECUTION
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT started_at,completed_at,status,detail,
                 json_extract(evidence_json,'$.results.distribution_autonomous.task.action') autonomous_action,
                 json_extract(evidence_json,'$.results.distribution_autonomous.task.subject_key') autonomous_target,
                 json_extract(evidence_json,'$.results.distribution_autonomous.result.taskProof.externalAttempt') autonomous_external_attempt,
                 json_extract(evidence_json,'$.results.distribution_network.task.action') network_action,
                 json_extract(evidence_json,'$.results.distribution_network.task.subject_key') network_target
          FROM engine_runs
          WHERE engine='growth' AND mission='execution_contract'
          ORDER BY started_at DESC LIMIT 3;
          "
          echo AGENTTOOL
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT g.opportunity_key,g.action_json,g.last_evaluated_at,
                 c.task_id,c.action,c.executor,c.status,c.last_result,c.updated_at
          FROM growth_opportunity_state g
          LEFT JOIN growth_execution_contract c
            ON c.source_id=g.opportunity_key AND c.status<>'cancelled'
          WHERE g.opportunity_key='surface:agenttool-sh'
          ORDER BY c.updated_at DESC;
          "
          echo AUTHORITY
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT
            (SELECT COUNT(*) FROM distribution_submissions
             WHERE surface_slug<>'indexnow' AND attempts>0
               AND COALESCE(last_attempt_at,created_at)>=datetime('now','-24 hours'))
            +(SELECT COUNT(*) FROM distribution_events
              WHERE event_type IN ('vendor_outreach_sent','publisher_network_outreach_sent')
                AND created_at>=datetime('now','-24 hours')) attempts24,
            (SELECT COUNT(*) FROM growth_execution_contract
             WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery',
                              'execute_alternate_routes','publisher_outreach','autonomous_route_qualification')
               AND status IN ('pending','claimed','attempted','stalled')) runnable,
            (SELECT COUNT(*) FROM growth_execution_contract
             WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery',
                              'execute_alternate_routes','publisher_outreach','autonomous_route_qualification')
               AND status='deferred') deferred;
          "
