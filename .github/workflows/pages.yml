name: Deploy ToolScout to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SEO pages
        run: node scripts/generate-seo-pages.mjs

      - name: Generate acquisition content
        run: node scripts/generate-acquisition-content.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Guard public hostname
        run: node scripts/check-public-host.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
