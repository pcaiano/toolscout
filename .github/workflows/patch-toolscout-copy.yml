name: Patch ToolScout Copy

on:
  push:
    branches:
      - software-trends-index
    paths:
      - '.github/workflows/patch-toolscout-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: software-trends-index
          fetch-depth: 0

      - name: Patch copy and guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('distribution-autonomous-worker.js')
          text = worker.read_text()
          text = text.replace('Find the right software for the job \u2014 without the noise.', 'Find the right software for the job without the noise.')
          worker.write_text(text)

          guard = '''import { readFileSync } from 'node:fs';

          const targets = [
            'data/distribution-publishing-profile.json',
            'distribution-submission-worker.js',
            'distribution-autonomous-worker.js',
            'distribution-linkable-assets-worker.js',
            'scripts/generate-software-trends-index.mjs'
          ].map(path => [path, readFileSync(path, 'utf8')]);

          const forbidden = /[\\u2010\\u2011\\u2012\\u2013\\u2014\\u2015\\u2212]/u;

          for (const [path, text] of targets) {
            if (forbidden.test(text)) {
              throw new Error(`${path} contains a forbidden Unicode dash in ToolScout-facing copy.`);
            }
          }

          console.log('ToolScout distribution and research copy contains no forbidden Unicode dashes.');
          '''
          Path('scripts/check-distribution-copy.mjs').write_text(guard)
          PY
          node scripts/check-distribution-copy.mjs

      - name: Commit patch
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- distribution-autonomous-worker.js scripts/check-distribution-copy.mjs)" ]; then
            echo 'Nothing to patch.'
            exit 0
          fi
          git config user.name 'toolscout-copy-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add distribution-autonomous-worker.js scripts/check-distribution-copy.mjs
          git commit -m 'Enforce ToolScout copy guard'
          git push origin HEAD:software-trends-index
