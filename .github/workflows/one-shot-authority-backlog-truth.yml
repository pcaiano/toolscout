name: One Shot Authority Backlog Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-authority-backlog-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect bounded authority backlog truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT executor,action,status,source_kind,subject_type,COUNT(*) AS n
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface')
            AND status IN ('pending','claimed','attempted','deferred','stalled')
          GROUP BY executor,action,status,source_kind,subject_type
          ORDER BY executor,status,action;
          "
      - name: Inspect top deferred authority candidates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,executor,action,source_kind,subject_type,subject_key,priority_score,status,last_result,updated_at
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','verify_backlink_acquisition','publisher_contact_discovery','execute_alternate_routes','publisher_outreach','autonomous_route_qualification','repair_stalled_route_execution','scale_proven_surface')
            AND status='deferred'
          ORDER BY priority_score DESC,created_at ASC
          LIMIT 25;
          "
