name: Visual Audit Once
# secondary surface audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit-once.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture live desktop screenshots
        run: |
          set -euo pipefail
          mkdir -p shots
          urls=(
            "guide-detail|https://trytoolscout.org/best-project-management-tools"
            "compare-detail|https://trytoolscout.org/make-vs-zapier"
            "news-detail|https://trytoolscout.org/news/chatgpt-building-advertising-for-the-way-people-use-ai"
            "methodology|https://trytoolscout.org/methodology"
            "trends|https://trytoolscout.org/software-trends-index"
            "categories|https://trytoolscout.org/categories"
          )
          for item in "${urls[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1440,1200 --screenshot="shots/${name}.png" "${url}?visual_audit=1"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: toolscout-live-shots
          path: shots/*.png
          retention-days: 1
