name: Visual Audit Once
# last surface family audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit-once.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture live desktop screenshots
        run: |
          set -euo pipefail
          mkdir -p shots
          urls=(
            "crm-tools|https://trytoolscout.org/crm-tools"
            "seo-tools|https://trytoolscout.org/seo-tools"
            "affiliate-disclosure|https://trytoolscout.org/affiliate-disclosure"
            "privacy|https://trytoolscout.org/privacy"
          )
          for item in "${urls[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1440,1200 --screenshot="shots/${name}.png" "${url}?visual_audit=1"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: toolscout-live-shots
          path: shots/*.png
          retention-days: 1
