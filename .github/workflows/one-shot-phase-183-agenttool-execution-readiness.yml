name: One Shot Phase 183 Agenttool Execution Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase-183-agenttool-execution-readiness.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect agenttool execution readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo ADAPTER
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT surface_slug,endpoint,method,content_type,payload_template_json,verification_endpoint,public_url,updated_at
          FROM distribution_auto_adapters
          WHERE surface_slug='agenttool-sh';
          "
          echo SUBMISSIONS
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT submission_id,status,attempts,last_attempt_at,submitted_at,response_url,error,updated_at
          FROM distribution_submissions
          WHERE surface_slug='agenttool-sh'
          ORDER BY updated_at DESC LIMIT 10;
          "
          echo QUALIFICATION
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT result,detail,created_at
          FROM distribution_qualification_events
          WHERE surface_slug='agenttool-sh'
          ORDER BY created_at DESC LIMIT 10;
          "

      - name: Inspect autonomous acquisition candidates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT task_id,subject_key,action,status,priority_score,last_result,created_at,updated_at
          FROM growth_execution_contract
          WHERE executor='distribution_autonomous'
            AND action='autonomous_route_qualification'
            AND status IN ('pending','deferred','stalled')
          ORDER BY priority_score DESC,created_at ASC;
          "
