name: ToolScout editorial wave 2 production cutover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-wave2-production-cutover.yml'

permissions:
  contents: read

concurrency:
  group: toolscout-editorial-20261008-cutover
  cancel-in-progress: false

jobs:
  editorial-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manufacturer sourcing and public pages
        run: |
          node scripts/check-vendor-evidence.mjs
          node --test tests/toolscout-v2-manufacturer-docs.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs
      - name: Verify build
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/editorial-wave2-dry-run
      - name: Publish Cloudflare Worker without D1 migrations
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify updated public editorial and monetized CTAs
        run: |
          set -euo pipefail
          for slug in apollo calendly shopify perplexity canva; do
            curl --retry 4 --retry-delay 2 --fail --silent --show-error -L "https://trytoolscout.org/tools/${slug}?toolscout_editorial_20261008_wave2=1" -o "/tmp/ts-${slug}.html"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cases=[
            ['apollo','Apollo','Apollo documents both granular prospect filters'],
            ['calendly','Calendly',"Calendly's Routing Forms can qualify"],
            ['shopify','Shopify',"Shopify's documentation covers capture"],
            ['perplexity','Perplexity',"Perplexity's documentation describes Spaces"],
            ['canva','Canva',"Canva documents Brand Kits"]
          ];
          for(const [slug,name,lead] of cases){
            const html=fs.readFileSync('/tmp/ts-'+slug+'.html','utf8');
            if(!html.includes('<h1>'+name+'</h1>'))throw Error('H1 regression: '+slug);
            if(!html.includes(lead)&&!html.includes(lead.replaceAll("'",'&#39;')))throw Error('Stale editorial response: '+slug);
            if(!html.includes('href="/go/'+slug+'"'))throw Error('Affiliate CTA regression: '+slug);
            if(/Catalog-based; vendor claims and plan limits not independently verified|AI integration evidence:/i.test(html))throw Error('Provisional or vendor source leakage: '+slug);
            const links=html.split('<a ').slice(1).map(s=>s.match(/href=["']([^"']+)["']/i)?.[1]).filter(Boolean);
            if(links.some(h=>h.startsWith('http://')||h.startsWith('https://')))throw Error('External source link exposed: '+slug);
          }
          console.log('EDITORIAL WAVE 2 VERIFIED: brand H1, final analyses, private vendor sources, commercial /go links');
          NODE
