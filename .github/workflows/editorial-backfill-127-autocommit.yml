name: One-shot ToolScout Editorial Backfill
on:
  push:
    branches: [feat/editorial-coverage-127-20261008]
    paths: ['.github/workflows/editorial-backfill-127-autocommit.yml']
permissions:
  contents: write
concurrency:
  group: toolscout-editorial-127-backfill
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editorial-coverage-127-20261008
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite only provisional profiles, preserving SEO and affiliate routes
        run: |
          set -euo pipefail
          node scripts/sync-provisional-editorial-pages.mjs
          node scripts/sync-provisional-editorial-pages.mjs --write
          node --check agent-protocol-core-worker.js
          node --check scripts/generate-tool-pages.mjs
          git diff --numstat -- tools/ | tee /tmp/editorial-files.txt
          test "$(git diff --name-only -- tools/ | wc -l)" -eq 107
          ! git diff --name-only | grep -Ev '^tools/[^/]+\.html$'
      - name: Commit updated static profiles to this feature branch only
        run: |
          git config user.name 'toolscout-editorial-bot'
          git config user.email 'toolscout-editorial-bot@users.noreply.github.com'
          git add -- tools/*.html
          git commit -m 'Materialize source-transparent editorial assessments for 107 profiles'
          git push origin HEAD:feat/editorial-coverage-127-20261008
