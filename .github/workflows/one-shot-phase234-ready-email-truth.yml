name: One Shot Phase 234 Ready Email Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase234-ready-email-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect sender admissible contact supply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT status,
                 COUNT(*) n,
                 SUM(CASE WHEN contact_email IS NOT NULL THEN 1 ELSE 0 END) with_email
          FROM contact_supply_domain
          GROUP BY status
          ORDER BY n DESC,status;

          SELECT
            COUNT(*) raw_ready_email,
            SUM(CASE WHEN EXISTS(
              SELECT 1 FROM distribution_vendor_amplification v
              WHERE lower(v.vendor_domain)=cs.domain
                AND v.status='contact_found' AND v.contact_email IS NOT NULL
            ) THEN 1 ELSE 0 END) vendor_lane_admissible,
            SUM(CASE WHEN EXISTS(
              SELECT 1 FROM distribution_network_outreach n
              WHERE lower(n.domain)=cs.domain
                AND n.status='contact_found' AND n.contact_email IS NOT NULL
            ) THEN 1 ELSE 0 END) network_lane_admissible,
            SUM(CASE WHEN NOT EXISTS(
              SELECT 1 FROM distribution_vendor_amplification v
              WHERE lower(v.vendor_domain)=cs.domain
                AND v.status='contact_found' AND v.contact_email IS NOT NULL
            ) AND NOT EXISTS(
              SELECT 1 FROM distribution_network_outreach n
              WHERE lower(n.domain)=cs.domain
                AND n.status='contact_found' AND n.contact_email IS NOT NULL
            ) THEN 1 ELSE 0 END) no_admissible_lane,
            SUM(CASE WHEN EXISTS(
              SELECT 1 FROM distribution_opportunities o
              WHERE o.surface_slug=cs.source_key AND o.status='policy_blocked'
            ) THEN 1 ELSE 0 END) policy_blocked_source
          FROM contact_supply_domain cs
          WHERE cs.status='ready_email' AND cs.contact_email IS NOT NULL;

          SELECT cs.domain,cs.source_type,cs.source_key,cs.status,cs.contact_email,cs.contact_source,
                 cs.contact_source_url,cs.last_researched_at,cs.updated_at,
                 GROUP_CONCAT(DISTINCT v.status) vendor_statuses,
                 MAX(CASE WHEN v.status='contact_found' AND v.contact_email IS NOT NULL THEN 1 ELSE 0 END) vendor_admissible,
                 MAX(v.outreach_sent_at) vendor_last_sent,
                 GROUP_CONCAT(DISTINCT n.status) network_statuses,
                 MAX(CASE WHEN n.status='contact_found' AND n.contact_email IS NOT NULL THEN 1 ELSE 0 END) network_admissible,
                 MAX(n.outreach_sent_at) network_last_sent,
                 MAX(CASE WHEN o.status='policy_blocked' THEN 1 ELSE 0 END) source_policy_blocked
          FROM contact_supply_domain cs
          LEFT JOIN distribution_vendor_amplification v ON lower(v.vendor_domain)=cs.domain
          LEFT JOIN distribution_network_outreach n ON lower(n.domain)=cs.domain
          LEFT JOIN distribution_opportunities o ON o.surface_slug=cs.source_key
          WHERE cs.contact_email IS NOT NULL
          GROUP BY cs.domain,cs.source_type,cs.source_key,cs.status,cs.contact_email,cs.contact_source,
                   cs.contact_source_url,cs.last_researched_at,cs.updated_at
          ORDER BY CASE cs.status WHEN 'ready_email' THEN 0 WHEN 'cooldown' THEN 1 ELSE 2 END,
                   cs.priority_score DESC,cs.domain
          LIMIT 120;

          SELECT status,COUNT(*) n,
                 SUM(CASE WHEN contact_email IS NOT NULL THEN 1 ELSE 0 END) with_email
          FROM distribution_vendor_amplification
          GROUP BY status ORDER BY n DESC,status;

          SELECT status,COUNT(*) n,
                 SUM(CASE WHEN contact_email IS NOT NULL THEN 1 ELSE 0 END) with_email
          FROM distribution_network_outreach
          GROUP BY status ORDER BY n DESC,status;

          SELECT target_ready,min_ready,ready_email,ready_route,cooldown,researching,unresolved,
                 route_filtered,vendor_routes_total,vendor_routes_research,vendor_routes_policy_blocked,
                 vendor_routes_skipped,vendor_routes_human_required,vendor_routes_authority_like,updated_at
          FROM contact_supply_metrics WHERE id='global';
          "
