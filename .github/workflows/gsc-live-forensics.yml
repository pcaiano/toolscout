name: GSC Live Forensics

on:
  push:
    paths:
      - '.github/workflows/gsc-live-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Search Console launch-period evidence
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const raw=process.env.GSC_SERVICE_ACCOUNT_JSON;
          if(!raw) throw new Error('GSC_SERVICE_ACCOUNT_JSON missing');
          const c=JSON.parse(raw), b64=v=>Buffer.from(v).toString('base64url');
          async function token(){const now=Math.floor(Date.now()/1000),h=b64(JSON.stringify({alg:'RS256',typ:'JWT'})),p=b64(JSON.stringify({iss:c.client_email,scope:'https://www.googleapis.com/auth/webmasters.readonly',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3600})),u=`${h}.${p}`;const s=crypto.createSign('RSA-SHA256');s.update(u);s.end();const assertion=`${u}.${s.sign(c.private_key,'base64url')}`;const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});if(!r.ok)throw new Error(`oauth ${r.status} ${await r.text()}`);return (await r.json()).access_token}
          const access=await token(),property='sc-domain:trytoolscout.org',endpoint=`https://searchconsole.googleapis.com/webmasters/v3/sites/${encodeURIComponent(property)}/searchAnalytics/query`;
          async function q(body){const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${access}`,'content-type':'application/json'},body:JSON.stringify({...body,type:'web',rowLimit:25000})});if(!r.ok)throw new Error(`search ${r.status} ${await r.text()}`);return r.json()}
          const startDate='2026-08-29',endDate='2026-09-10';
          const byDate=await q({startDate,endDate,dataState:'all',dimensions:['date']});
          const byPage=await q({startDate,endDate,dataState:'all',dimensions:['page']});
          const byQuery=await q({startDate,endDate,dataState:'all',dimensions:['query']});
          const byQueryPage=await q({startDate,endDate,dataState:'all',dimensions:['query','page']});
          const rows=x=>(x.rows||[]).map(r=>({keys:r.keys,clicks:r.clicks||0,impressions:r.impressions||0,ctr:r.ctr||0,position:r.position||0}));
          const dateRows=rows(byDate),pageRows=rows(byPage),queryRows=rows(byQuery),qpRows=rows(byQueryPage);

          // 2026 small-site GSC benchmark: positions 1-10 exact buckets, 11-20 and 21+ residual buckets.
          const small={1:.0596,2:.0022,3:.0158,4:.0861,5:.0296,6:.0159,7:.0102,8:.0027,9:.0075,10:.0053};
          // General page-one benchmark (First Page Sage 2026). Beyond page one we retain the conservative small-site residual rates.
          const general={1:.398,2:.187,3:.102,4:.072,5:.051,6:.044,7:.030,8:.021,9:.019,10:.016};
          function rate(pos,curve){const p=Math.max(1,Math.round(pos||100));if(p<=10)return curve[p]||0;if(p<=20)return .0025;return .0004}
          function expected(curve){return qpRows.reduce((s,r)=>s+r.impressions*rate(r.position,curve),0)}
          function bucket(pos){if(pos<=3)return '1-3';if(pos<=10)return '4-10';if(pos<=20)return '11-20';if(pos<=50)return '21-50';return '51+'}
          const buckets={};
          for(const r of qpRows){const b=bucket(r.position);buckets[b]??={impressions:0,clicks:0,weightedPositionNumerator:0,smallExpected:0,generalExpected:0};const x=buckets[b];x.impressions+=r.impressions;x.clicks+=r.clicks;x.weightedPositionNumerator+=r.position*r.impressions;x.smallExpected+=r.impressions*rate(r.position,small);x.generalExpected+=r.impressions*rate(r.position,general)}
          for(const x of Object.values(buckets)){x.avgPosition=x.impressions?x.weightedPositionNumerator/x.impressions:0;delete x.weightedPositionNumerator;x.smallExpected=+x.smallExpected.toFixed(3);x.generalExpected=+x.generalExpected.toFixed(3);x.avgPosition=+x.avgPosition.toFixed(2)}
          const topExpected=qpRows.map(r=>({query:r.keys?.[0]||'',page:r.keys?.[1]||'',impressions:r.impressions,clicks:r.clicks,position:+r.position.toFixed(2),smallExpected:+(r.impressions*rate(r.position,small)).toFixed(3),generalExpected:+(r.impressions*rate(r.position,general)).toFixed(3)})).sort((a,b)=>b.generalExpected-a.generalExpected).slice(0,30);
          const totals={clicks:dateRows.reduce((s,x)=>s+x.clicks,0),impressions:dateRows.reduce((s,x)=>s+x.impressions,0),queryPageImpressions:qpRows.reduce((s,x)=>s+x.impressions,0),queryPageRows:qpRows.length,smallSiteExpected:+expected(small).toFixed(3),generalExpected:+expected(general).toFixed(3)};
          totals.actualCtr=totals.impressions?+(totals.clicks/totals.impressions*100).toFixed(4):0;
          totals.smallExpectedCtr=totals.queryPageImpressions?+(totals.smallSiteExpected/totals.queryPageImpressions*100).toFixed(4):0;
          totals.generalExpectedCtr=totals.queryPageImpressions?+(totals.generalExpected/totals.queryPageImpressions*100).toFixed(4):0;
          console.log('GSC_LAUNCH_BY_DATE='+JSON.stringify({metadata:byDate.metadata||null,rows:dateRows}));
          console.log('GSC_POSITION_BUCKETS='+JSON.stringify(buckets));
          console.log('GSC_EXPECTED_CLICKS='+JSON.stringify(totals));
          console.log('GSC_TOP_EXPECTED_ROWS='+JSON.stringify(topExpected));
          console.log('GSC_CLICK_PAGES='+JSON.stringify(pageRows.filter(x=>x.clicks>0).sort((a,b)=>b.clicks-a.clicks||b.impressions-a.impressions)));
          console.log('GSC_CLICK_QUERIES='+JSON.stringify(queryRows.filter(x=>x.clicks>0).sort((a,b)=>b.clicks-a.clicks||b.impressions-a.impressions).slice(0,200)));
          NODE
