name: GSC Live Forensics

on:
  push:
    paths:
      - '.github/workflows/gsc-live-forensics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query Search Console launch-period evidence
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const raw=process.env.GSC_SERVICE_ACCOUNT_JSON;
          if(!raw) throw new Error('GSC_SERVICE_ACCOUNT_JSON missing');
          const c=JSON.parse(raw), b64=v=>Buffer.from(v).toString('base64url');
          async function token(){const now=Math.floor(Date.now()/1000),h=b64(JSON.stringify({alg:'RS256',typ:'JWT'})),p=b64(JSON.stringify({iss:c.client_email,scope:'https://www.googleapis.com/auth/webmasters.readonly',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3600})),u=`${h}.${p}`;const s=crypto.createSign('RSA-SHA256');s.update(u);s.end();const assertion=`${u}.${s.sign(c.private_key,'base64url')}`;const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});if(!r.ok)throw new Error(`oauth ${r.status} ${await r.text()}`);return (await r.json()).access_token}
          const access=await token(),property='sc-domain:trytoolscout.org',endpoint=`https://searchconsole.googleapis.com/webmasters/v3/sites/${encodeURIComponent(property)}/searchAnalytics/query`;
          async function q(body){const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${access}`,'content-type':'application/json'},body:JSON.stringify({...body,type:'web',rowLimit:25000})});if(!r.ok)throw new Error(`search ${r.status} ${await r.text()}`);return r.json()}
          const startDate='2026-08-29',endDate='2026-09-10';
          const byDate=await q({startDate,endDate,dataState:'all',dimensions:['date']});
          const byPage=await q({startDate,endDate,dataState:'all',dimensions:['page']});
          const byQuery=await q({startDate,endDate,dataState:'all',dimensions:['query']});
          const rows=x=>(x.rows||[]).map(r=>({keys:r.keys,clicks:r.clicks||0,impressions:r.impressions||0,ctr:r.ctr||0,position:r.position||0}));
          const dateRows=rows(byDate),pageRows=rows(byPage),queryRows=rows(byQuery);
          console.log('GSC_LAUNCH_BY_DATE='+JSON.stringify({metadata:byDate.metadata||null,rows:dateRows}));
          console.log('GSC_CLICK_PAGES='+JSON.stringify(pageRows.filter(x=>x.clicks>0).sort((a,b)=>b.clicks-a.clicks||b.impressions-a.impressions)));
          console.log('GSC_CLICK_QUERIES='+JSON.stringify(queryRows.filter(x=>x.clicks>0).sort((a,b)=>b.clicks-a.clicks||b.impressions-a.impressions).slice(0,200)));
          console.log('GSC_TOTALS='+JSON.stringify({clicks:dateRows.reduce((s,x)=>s+x.clicks,0),impressions:dateRows.reduce((s,x)=>s+x.impressions,0)}));
          NODE
