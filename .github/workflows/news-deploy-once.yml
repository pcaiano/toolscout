name: ToolScout software news deploy once

on:
  push:
    branches: [main]
    paths:
      - '.deploy-news-trigger'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy ToolScout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify public pages
        run: |
          curl -fsS --retry 4 --retry-delay 5 https://trytoolscout.org/whats-new.html | grep -q "What's new in software"
          curl -fsS --retry 4 --retry-delay 5 https://trytoolscout.org/news/notion-3-7-agent-skills.html | grep -q "reusable Agent skills"
          curl -fsS --retry 4 --retry-delay 5 https://trytoolscout.org/news/hubspot-mcp-server-updates.html | grep -q "MCP server"
          curl -fsS --retry 4 --retry-delay 5 https://trytoolscout.org/data/software-updates.json | grep -q "/news/notion-3-7-agent-skills.html"
