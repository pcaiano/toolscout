name: One Shot Affiliate Click Audit

on:
  push:
    paths:
      - ".github/workflows/one-shot-affiliate-click-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read-only affiliate click forensics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== schema ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "PRAGMA table_info(click_events); PRAGMA table_info(sessions); PRAGMA table_info(traffic_guard_events); PRAGMA table_info(verified_outbound_events);"
          echo "=== clicks by programme ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT tool_slug,COUNT(*) click_events,COUNT(DISTINCT session_id) distinct_sessions,MIN(created_at) first_click,MAX(created_at) last_click FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY tool_slug ORDER BY click_events DESC;"
          echo "=== session classification by programme ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT c.tool_slug,COALESCE(s.classification,'missing-session') classification,COUNT(*) click_events,COUNT(DISTINCT c.session_id) sessions FROM click_events c LEFT JOIN sessions s ON s.session_id=c.session_id WHERE c.created_at>='2026-09-01' AND c.tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY c.tool_slug,COALESCE(s.classification,'missing-session') ORDER BY c.tool_slug,click_events DESC;"
          echo "=== click source and referrer-derived intent ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT tool_slug,source,intent_slug,COUNT(*) click_events,COUNT(DISTINCT session_id) sessions FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY tool_slug,source,intent_slug ORDER BY click_events DESC LIMIT 100;"
          echo "=== browser confirmation and verified outbound ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT c.tool_slug,COUNT(*) click_events,COUNT(DISTINCT c.session_id) sessions,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=c.session_id AND f.event_type='page_confirmed') THEN c.session_id END) page_confirmed_sessions,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM confirmed_visitor_events v WHERE v.session_id=c.session_id) THEN c.session_id END) confirmed_visitor_sessions,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM verified_outbound_events v WHERE v.session_id=c.session_id AND v.tool_slug=c.tool_slug) THEN c.session_id END) verified_outbound_sessions FROM click_events c WHERE c.created_at>='2026-09-01' AND c.tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY c.tool_slug ORDER BY click_events DESC;"
          echo "=== guard decisions ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH cs AS (SELECT DISTINCT tool_slug,session_id FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist')) SELECT cs.tool_slug,COALESCE(g.decision,'no-guard-event') decision,COALESCE(g.reason,'') reason,COUNT(DISTINCT cs.session_id) sessions FROM cs LEFT JOIN traffic_guard_events g ON g.session_id=cs.session_id GROUP BY cs.tool_slug,COALESCE(g.decision,'no-guard-event'),COALESCE(g.reason,'') ORDER BY sessions DESC LIMIT 150;"
          echo "=== guard concentration ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH cs AS (SELECT DISTINCT tool_slug,session_id FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist')) SELECT cs.tool_slug,COUNT(DISTINCT g.session_id) guarded_sessions,COUNT(DISTINCT g.fingerprint) fingerprints,COUNT(DISTINCT g.ua_hash) ua_hashes,COUNT(DISTINCT g.country) countries,COUNT(DISTINCT g.asn) asns FROM cs JOIN traffic_guard_events g ON g.session_id=cs.session_id GROUP BY cs.tool_slug ORDER BY guarded_sessions DESC;"
          echo "=== repeated sessions ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH per AS (SELECT tool_slug,session_id,COUNT(*) n,MIN(created_at) first_at,MAX(created_at) last_at FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY tool_slug,session_id) SELECT tool_slug,COUNT(*) sessions_with_2plus,SUM(n) clicks_from_repeat_sessions,MAX(n) max_clicks_one_session FROM per WHERE n>=2 GROUP BY tool_slug ORDER BY clicks_from_repeat_sessions DESC;"
          echo "=== minute bursts ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT tool_slug,substr(created_at,1,16) minute_utc,COUNT(*) clicks,COUNT(DISTINCT session_id) sessions FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY tool_slug,substr(created_at,1,16) HAVING COUNT(*)>=2 ORDER BY clicks DESC,minute_utc DESC LIMIT 100;"
          echo "=== cross-programme same-session fanout ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH p AS (SELECT session_id,COUNT(DISTINCT tool_slug) programmes,COUNT(*) clicks,MIN(created_at) first_at,MAX(created_at) last_at FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY session_id) SELECT programmes,COUNT(*) sessions,SUM(clicks) clicks,MAX(clicks) max_clicks_one_session FROM p WHERE programmes>=2 GROUP BY programmes ORDER BY programmes DESC;"
          echo "=== chronology ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT substr(created_at,1,10) day_utc,tool_slug,COUNT(*) clicks,COUNT(DISTINCT session_id) sessions FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY day_utc,tool_slug ORDER BY day_utc,tool_slug;"
          echo "=== active-window classification ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH active(tool_slug,start_at,network_clicks) AS (VALUES ('apollo','2026-09-16 15:40:31',19),('kit','2026-09-04 18:10:56',23),('instantly','2026-09-11 01:15:11',12),('lemlist','2026-09-10 09:13:23',27),('unbounce','2026-09-21 22:31:02',6)), scoped AS (SELECT c.*,a.network_clicks FROM click_events c JOIN active a ON a.tool_slug=c.tool_slug AND c.created_at>=a.start_at) SELECT tool_slug,network_clicks,COUNT(*) toolscout_clicks,COUNT(DISTINCT session_id) sessions,SUM(CASE WHEN COALESCE((SELECT classification FROM sessions s WHERE s.session_id=scoped.session_id),'missing-session')='likely-human' THEN 1 ELSE 0 END) likely_human,SUM(CASE WHEN COALESCE((SELECT classification FROM sessions s WHERE s.session_id=scoped.session_id),'missing-session')='known-bot/crawler' THEN 1 ELSE 0 END) known_bot,SUM(CASE WHEN COALESCE((SELECT classification FROM sessions s WHERE s.session_id=scoped.session_id),'missing-session')='owner' THEN 1 ELSE 0 END) owner,SUM(CASE WHEN COALESCE((SELECT classification FROM sessions s WHERE s.session_id=scoped.session_id),'missing-session') IN ('unknown/legacy','missing-session') THEN 1 ELSE 0 END) unknown_or_missing,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=scoped.session_id AND f.event_type='page_confirmed') THEN session_id END) page_confirmed,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM verified_outbound_events v WHERE v.session_id=scoped.session_id AND v.tool_slug=scoped.tool_slug) THEN session_id END) verified_outbound FROM scoped GROUP BY tool_slug,network_clicks ORDER BY tool_slug;"
          echo "=== affiliate snapshot fields ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT tool_slug,COALESCE(CAST(affiliate_active_at_click AS TEXT),'NULL') affiliate_active_at_click,COUNT(*) clicks,COUNT(DISTINCT session_id) sessions,MIN(created_at) first_at,MAX(created_at) last_at FROM click_events WHERE created_at>='2026-09-01' AND tool_slug IN ('unbounce','apollo','gorgias','brevo','kit','instantly','lemlist') GROUP BY tool_slug,COALESCE(CAST(affiliate_active_at_click AS TEXT),'NULL') ORDER BY tool_slug,affiliate_active_at_click;"
          echo "=== active-window daily alignment ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH active(tool_slug,start_at) AS (VALUES ('apollo','2026-09-16 15:40:31'),('kit','2026-09-04 18:10:56'),('instantly','2026-09-11 01:15:11'),('lemlist','2026-09-10 09:13:23'),('unbounce','2026-09-21 22:31:02')) SELECT substr(c.created_at,1,10) day_utc,c.tool_slug,COUNT(*) clicks,SUM(CASE WHEN s.classification='likely-human' THEN 1 ELSE 0 END) likely_human,SUM(CASE WHEN s.classification='known-bot/crawler' THEN 1 ELSE 0 END) known_bot,SUM(CASE WHEN s.classification='owner' THEN 1 ELSE 0 END) owner,SUM(CASE WHEN s.classification='unknown/legacy' OR s.session_id IS NULL THEN 1 ELSE 0 END) unknown_or_missing FROM click_events c JOIN active a ON a.tool_slug=c.tool_slug AND c.created_at>=a.start_at LEFT JOIN sessions s ON s.session_id=c.session_id GROUP BY day_utc,c.tool_slug ORDER BY day_utc,c.tool_slug;"
