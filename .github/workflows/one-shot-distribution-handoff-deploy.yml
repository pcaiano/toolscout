name: One Shot Distribution Handoff Deploy

on:
  push:
    paths:
      - ".github/workflows/one-shot-distribution-handoff-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate closed-loop distribution changes
        run: |
          set -euo pipefail
          node --check distribution-autonomous-worker.js
          node --check compute-router-worker.js
          node --check command-center-simplified-view.js
          node tests/compute-overflow-policy.test.mjs
          node tests/distribution-executor-lanes.test.mjs
          node tests/distribution-high-throughput-policy.test.mjs
          node tests/command-center-hybrid-architecture.test.mjs
          node tests/overflow-failure-containment.test.mjs

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify live compute funnel
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://trytoolscout.org"
          curl -fsS --max-time 20 "$BASE/api/compute/health" -o /tmp/compute.json
          jq -e '.status=="configured" and .executionDailyJobBudget==800 and (.distributionFunnel|type=="object")' /tmp/compute.json >/dev/null
          curl -fsSL --max-time 20 "$BASE/analytics" -o /tmp/analytics.html
          grep -q "Distribution execution funnel" /tmp/analytics.html
