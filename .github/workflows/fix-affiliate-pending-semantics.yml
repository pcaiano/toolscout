name: Fix affiliate pending semantics

on:
  push:
    paths:
      - '.github/workflows/fix-affiliate-pending-semantics.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct pending definition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('growth-command-center-v2-worker.js')
          s = p.read_text()
          old = "const PENDING_AFFILIATE_STATES=new Set(['submitted','pending_review','approved_needs_link','link_acquired','human_action_required']);"
          new = "const PENDING_AFFILIATE_STATES=new Set(['submitted','pending_review']);"
          if old not in s:
              raise SystemExit('Expected pending-state definition not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify Chairman Queue owns pre-submission human actions
        run: |
          grep -F "if(status==='ready_to_apply')actionable=!s?.submitted_at;" human-action-entry-worker.js
          grep -F "if(status==='human_action_required')actionable=!s?.submitted_at||POST_SUBMIT_HUMAN_WORDS.test(text);" human-action-entry-worker.js
          grep -F "let actionable=status==='approved_needs_link';" human-action-entry-worker.js
          grep -F "const PENDING_AFFILIATE_STATES=new Set(['submitted','pending_review']);" growth-command-center-v2-worker.js
      - name: Commit correction
        run: |
          git config user.name "ToolScout Automation"
          git config user.email "actions@users.noreply.github.com"
          git add growth-command-center-v2-worker.js
          git commit -m "Define affiliate pending as submitted awaiting response"
          git push
