name: Infrastructure Authority Diagnostic

on:
  push:
    branches:
      - infra-authority-diagnostic-20261005
    paths:
      - '.github/workflows/infra-authority-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read authority recovery ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT run_id,engine,mission,trigger_name,status,started_at,completed_at,detail,evidence_json
          FROM engine_runs
          WHERE engine='distribution' AND mission='authority_execution_recovery'
          ORDER BY started_at DESC LIMIT 8;

          SELECT event_type,status,detail,created_at
          FROM distribution_events
          WHERE event_type LIKE 'authority_%'
          ORDER BY created_at DESC LIMIT 20;
          "
