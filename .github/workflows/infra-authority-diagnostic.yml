name: Infrastructure Authority Diagnostic

on:
  push:
    branches:
      - infra-authority-diagnostic-20261005
    paths:
      - '.github/workflows/infra-authority-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read authority recovery ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT run_id,engine,mission,trigger_name,status,started_at,completed_at,detail,evidence_json
          FROM engine_runs
          WHERE engine='distribution' AND mission='authority_execution_recovery'
          ORDER BY started_at DESC LIMIT 8;

          SELECT event_type,status,detail,created_at
          FROM distribution_events
          WHERE event_type LIKE 'authority_%'
          ORDER BY created_at DESC LIMIT 20;

          SELECT task_id,subject_type,subject_key,action,executor,status,priority_score,claimed_at,attempted_at,last_result,updated_at
          FROM growth_execution_contract
          WHERE action IN ('backlink_reference_outreach','publisher_outreach')
            AND status IN ('pending','claimed','attempted')
          ORDER BY priority_score DESC,updated_at ASC;

          SELECT tool_slug,asset_url,status,contact_method,contact_email,vendor_domain,priority_score,public_dispatch_leased_at,outreach_error,updated_at
          FROM distribution_vendor_amplification
          WHERE tool_slug IN (
            SELECT subject_key FROM growth_execution_contract
            WHERE subject_type='tool'
              AND action IN ('backlink_reference_outreach','publisher_outreach')
              AND status IN ('pending','claimed','attempted')
          )
          ORDER BY priority_score DESC;

          SELECT surface_slug,status,contact_email,domain,priority_score,public_dispatch_leased_at,outreach_error,updated_at
          FROM distribution_network_outreach
          WHERE surface_slug IN (
            SELECT subject_key FROM growth_execution_contract
            WHERE subject_type='surface'
              AND action IN ('backlink_reference_outreach','publisher_outreach')
              AND status IN ('pending','claimed','attempted')
          )
          ORDER BY priority_score DESC;
          "
