name: Command Center Human Actions Check
on:
  pull_request:
    paths:
      - 'human-action-entry-worker.js'
      - 'affiliate-operations.js'
      - 'agent-protocol-worker.js'
      - '.github/workflows/human-actions-check.yml'
  push:
    branches: [main]
    paths:
      - 'human-action-entry-worker.js'
      - 'affiliate-operations.js'
      - 'agent-protocol-worker.js'
      - '.github/workflows/human-actions-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actionable queue
        run: |
          set -euo pipefail
          node --check human-action-entry-worker.js
          grep -Fq "'/analytics/api/human-actions'" human-action-entry-worker.js
          ! grep -Fq "u.pathname==='/api/human-actions'" human-action-entry-worker.js
          grep -Fq "SESSION_COOKIE='toolscout_cc'" human-action-entry-worker.js
          grep -Fq "command_center_session_expired" human-action-entry-worker.js
          grep -Fq "credentials:'same-origin'" human-action-entry-worker.js
          grep -Fq "Open action" human-action-entry-worker.js
          grep -Fq "Copy ChatGPT task" human-action-entry-worker.js
          grep -Fq "CAPTCHA" human-action-entry-worker.js
          grep -Fq "material legal terms" human-action-entry-worker.js
          grep -Fq "unmonetized human outbound" human-action-entry-worker.js
          grep -Fq "distribution score" human-action-entry-worker.js
          grep -Fq "/data/affiliate-pipeline.json" human-action-entry-worker.js
          grep -Fq "/data/affiliate.json" human-action-entry-worker.js
          grep -Fq "normalizeAffiliateState" human-action-entry-worker.js
          grep -Fq "effectiveStatus" human-action-entry-worker.js
          grep -Fq "source_of_truth:'canonical_affiliate_state'" human-action-entry-worker.js
          grep -Fq "affiliate_source_of_truth" human-action-entry-worker.js
          grep -Fq "status==='ready_to_apply'" human-action-entry-worker.js
          grep -Fq "status==='human_action_required'" human-action-entry-worker.js
          grep -Fq "status==='approved_needs_link'" human-action-entry-worker.js
          grep -Fq "POST_SUBMIT_HUMAN_WORDS" human-action-entry-worker.js
          grep -Fq "STALE_WORDS" human-action-entry-worker.js
          ! grep -Fq "function affiliateSql()" human-action-entry-worker.js
          grep -Fq "import base from './human-action-entry-worker.js'" agent-protocol-worker.js
