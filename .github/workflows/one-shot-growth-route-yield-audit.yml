name: One Shot Growth Route Yield Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-growth-route-yield-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure external route research yield
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT
            COALESCE(json_extract(payload_json,'$.surfaceType'),'unknown') surface_type,
            COUNT(*) completed,
            SUM(CAST(COALESCE(json_extract(result_json,'$.routeSummary.submissionRoutes'),0) AS INTEGER)) submission_routes,
            SUM(CAST(COALESCE(json_extract(result_json,'$.routeSummary.machineCandidates'),0) AS INTEGER)) machine_candidates,
            SUM(CAST(COALESCE(json_extract(result_json,'$.routeSummary.formRoutes'),0) AS INTEGER)) form_routes,
            SUM(CAST(COALESCE(json_extract(result_json,'$.routeSummary.authRoutes'),0) AS INTEGER)) auth_routes,
            SUM(CAST(COALESCE(json_extract(result_json,'$.routeSummary.captchaRoutes'),0) AS INTEGER)) captcha_routes,
            SUM(CASE WHEN COALESCE(json_extract(result_json,'$.routeSummary.submissionRoutes'),0)=0
                      AND COALESCE(json_extract(result_json,'$.routeSummary.machineCandidates'),0)=0
                     THEN 1 ELSE 0 END) zero_yield_jobs
          FROM compute_overflow_jobs
          WHERE job_type='distribution_route_research'
            AND status='completed'
            AND completed_at>=datetime('now','-24 hours')
          GROUP BY surface_type
          ORDER BY completed DESC;

          SELECT
            COALESCE(json_extract(result_json,'$.outcome'),'none') outcome,
            COUNT(*) n
          FROM compute_overflow_jobs
          WHERE job_type='distribution_route_research'
            AND status='completed'
            AND completed_at>=datetime('now','-24 hours')
          GROUP BY outcome
          ORDER BY n DESC;

          SELECT
            j.subject_key,
            COALESCE(json_extract(j.payload_json,'$.surfaceType'),'unknown') surface_type,
            COALESCE(json_extract(j.payload_json,'$.surfaceName'),j.subject_key) surface_name,
            o.distribution_score,
            o.external_value_score,
            o.status opportunity_status,
            CAST(COALESCE(json_extract(j.result_json,'$.routeSummary.submissionRoutes'),0) AS INTEGER) submission_routes,
            CAST(COALESCE(json_extract(j.result_json,'$.routeSummary.machineCandidates'),0) AS INTEGER) machine_candidates,
            CAST(COALESCE(json_extract(j.result_json,'$.routeSummary.formRoutes'),0) AS INTEGER) form_routes,
            CAST(COALESCE(json_extract(j.result_json,'$.routeSummary.authRoutes'),0) AS INTEGER) auth_routes,
            CAST(COALESCE(json_extract(j.result_json,'$.routeSummary.captchaRoutes'),0) AS INTEGER) captcha_routes,
            j.completed_at
          FROM compute_overflow_jobs j
          LEFT JOIN distribution_opportunities o ON o.surface_slug=j.subject_key
          WHERE j.job_type='distribution_route_research'
            AND j.status='completed'
            AND j.completed_at>=datetime('now','-24 hours')
          ORDER BY submission_routes DESC,machine_candidates DESC,o.external_value_score DESC,o.distribution_score DESC,j.completed_at DESC
          LIMIT 80;

          SELECT surface_type,status,COUNT(*) n,
                 AVG(COALESCE(external_value_score,0)) avg_external_value,
                 AVG(COALESCE(distribution_score,0)) avg_distribution_score
          FROM distribution_opportunities
          WHERE status IN ('candidate','discovered','research_required')
          GROUP BY surface_type,status
          ORDER BY n DESC
          LIMIT 60;
          " | tee /tmp/yield.json

          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/yield.json','utf8'));
          const rows=p[0]?.results||[];
          const total=rows.reduce((s,x)=>s+Number(x.completed||0),0);
          const submission=rows.reduce((s,x)=>s+Number(x.submission_routes||0),0);
          const machine=rows.reduce((s,x)=>s+Number(x.machine_candidates||0),0);
          const zero=rows.reduce((s,x)=>s+Number(x.zero_yield_jobs||0),0);
          console.log('=== ROUTE YIELD SUMMARY ===');
          console.log(JSON.stringify({
            completed24h:total,
            submissionRoutes24h:submission,
            machineCandidates24h:machine,
            zeroYieldJobs24h:zero,
            zeroYieldRate:total?Number((zero/total).toFixed(3)):0,
            bySurfaceType:rows
          },null,2));
          NODE
