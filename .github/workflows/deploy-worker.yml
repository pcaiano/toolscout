name: ToolScout Owner Audit Read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  audit-read:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Read retrospective owner audit from D1
        run: >-
          npx wrangler d1 execute toolscout --remote --config wrangler.toml
          --command "SELECT audit_key, window_start, window_end, total_confirmed_sessions, owner_visitor_events, high_confidence_matches, medium_confidence_matches, ambiguous_matches, definite_owner_sessions, unmatched_sessions, audited_at FROM owner_retrospective_audits WHERE audit_key='original_36_current_browser';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
