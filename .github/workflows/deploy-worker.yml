name: ToolScout GitHub Actions Conservation Mode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conservation-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Conservation mode notice
        run: echo 'GitHub Actions conservation mode is active until 2026-10-01. Restore the original workflows from branch pre-conservation-2026-09-13 only after confirming the monthly Actions quota has reset.'