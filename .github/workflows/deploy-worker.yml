name: Deploy ToolScout Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical public navigation
        run: node scripts/unify-public-nav.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify distribution submission state
        run: |
          echo '=== DISTRIBUTION ASSETS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT COUNT(*) AS assets FROM distribution_asset_state WHERE asset_url IS NOT NULL;"
          echo '=== PRIORITY SETUP SURFACES ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,human_required,action_url,next_action FROM distribution_opportunities WHERE surface_slug IN ('listed-startups','tinylaunch','indietool','agenttool-sh','ora-ai','hypestar') ORDER BY surface_slug;"
          echo '=== APPROVAL-GATED SURFACES ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,human_required,action_url,next_action FROM distribution_opportunities WHERE status='approval_required' ORDER BY distribution_score DESC;"
          echo '=== STALE ADAPTER-MISSING TAXONOMY ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT ds.surface_slug,ds.status AS submission_status,COALESCE(o.status,'missing_opportunity') AS opportunity_status,COALESCE(o.human_required,-1) AS human_required,o.surface_type,o.next_action FROM distribution_submissions ds LEFT JOIN distribution_opportunities o ON o.surface_slug=ds.surface_slug WHERE ds.status='adapter_missing' ORDER BY ds.surface_slug;"
          echo '=== DISTRIBUTION SUBMISSION COUNTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,COUNT(*) AS count FROM distribution_submissions GROUP BY surface_slug,status ORDER BY surface_slug,status;"
          echo '=== AUTOMATIC SURFACE STATE ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT o.surface_slug,o.status AS opportunity_status,ds.status AS submission_status,ds.attempts,ds.submitted_at,ds.response_url,ds.error FROM distribution_opportunities o LEFT JOIN distribution_submissions ds ON ds.surface_slug=o.surface_slug WHERE o.surface_slug IN ('agenttool-sh','ora-ai','indexnow') ORDER BY o.surface_slug,ds.updated_at DESC;"
          echo '=== INDEXNOW LATEST ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,asset_url,status,attempts,last_attempt_at,submitted_at,error FROM distribution_submissions WHERE surface_slug='indexnow' ORDER BY updated_at DESC LIMIT 10;"
          echo '=== DISTRIBUTION ENGINE EVENTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT event_type,status,detail,created_at FROM distribution_events WHERE event_type IN ('submission_packaging_refresh','submission_execution_refresh','submission_verification_refresh') ORDER BY created_at DESC LIMIT 12;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
