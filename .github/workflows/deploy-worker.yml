# Manual recovery fallback for the Cloudflare-first ToolScout runtime.
name: ToolScout Worker Recovery Fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production-recovery
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate ToolScout copy guard
        run: node scripts/check-distribution-copy.mjs

      - name: Validate ToolScout 2.0 runtime
        env:
          TOOLSCOUT_V2_BASE_REF: a4bfbd36f0f6d049e3bf13dd6272f48276ada07e
        run: |
          node --check affiliate-redirect-runtime.js
          node --check command-center-business-truth-runtime.js
          node --check ga4-owner-context.js
          node --check ga4-owner-exclusion-runtime.js
          node --check ga4-attribution-24h-worker.js
          node --check d1-read-budget-worker.js
          node --check command-center-ga4-worker.js
          node --check gsc-command-center-visible-worker.js
          node --check growth-runtime-authority-drain-worker.js
          node --check growth-runtime-closed-loop-worker.js
          node --check growth-runtime-integrity-worker.js
          node --check command-center-light-theme-worker.js
          node --check operational-truth-reconciliation-runtime.js
          node --check seo-cloudflare-runtime-worker.js
          node --check cloudflare-primary-runtime-worker.js
          node scripts/audit-runtime-architecture.mjs
          node scripts/validate-v2-preservation.mjs
          node --test tests/toolscout-v2-external-value.test.mjs tests/toolscout-v2-editorial-authority.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs tests/toolscout-v2-scheduler-ownership.test.mjs tests/toolscout-v2-route-ownership.test.mjs tests/toolscout-v2-command-center.test.mjs tests/toolscout-v2-command-center-resilient-health.test.mjs tests/toolscout-v2-command-center-schema-control.test.mjs tests/toolscout-v2-traffic-integrity-health.test.mjs tests/toolscout-v2-admin-stats.test.mjs tests/toolscout-v2-outbound-integrity-schema.test.mjs tests/toolscout-v2-engine-ledger-schema.test.mjs tests/toolscout-v2-visitor-integrity-schema.test.mjs tests/toolscout-v2-traffic-schema-migration.test.mjs tests/toolscout-v2-mission-integrity-schema.test.mjs tests/toolscout-v2-public-plane.test.mjs tests/toolscout-v2-software-trends.test.mjs tests/toolscout-v2-static-guide-sovereignty.test.mjs tests/toolscout-v2-authority-health.test.mjs tests/toolscout-v2-canonical-contract.test.mjs tests/toolscout-v2-agent-protocol.test.mjs tests/toolscout-v2-machine-discovery-catalog.test.mjs tests/toolscout-v2-analytics-chairman.test.mjs tests/toolscout-v2-analytics-stats.test.mjs tests/toolscout-v2-analytics-human-actions.test.mjs tests/toolscout-v2-human-actions-mutation.test.mjs tests/toolscout-v2-public-decision-parity.test.mjs tests/toolscout-v2-public-navigation-parity.test.mjs tests/toolscout-v2-affiliate-redirect.test.mjs tests/toolscout-v2-cloudflare-primary-schema.test.mjs tests/toolscout-v2-cloudflare-primary-owner.test.mjs tests/toolscout-v2-ga4-owner-context.test.mjs tests/toolscout-v2-ga4-owner-exclusion.test.mjs tests/toolscout-v2-ga4-attribution-24h.test.mjs tests/toolscout-v2-d1-read-budget.test.mjs tests/toolscout-v2-command-center-ga4.test.mjs tests/toolscout-v2-gsc-trend-surface.test.mjs tests/toolscout-v2-public-canonical-surface.test.mjs tests/toolscout-v2-visitor-integrity-owner.test.mjs tests/toolscout-v2-traffic-integrity-live-owner.test.mjs tests/toolscout-v2-traffic-integrity-guard-owner.test.mjs tests/toolscout-v2-owner-exclusion-schema.test.mjs tests/toolscout-v2-owner-exclusion-owner.test.mjs tests/toolscout-v2-traffic-integrity-core-owner.test.mjs tests/toolscout-v2-human-truth-chart-owner.test.mjs tests/toolscout-v2-human-truth-details-owner.test.mjs tests/toolscout-v2-human-truth-final-owner.test.mjs
          node tests/growth-scheduler-ownership.mjs
          node scripts/verify-public-navigation-shadow.mjs

      - name: Wrangler dry-run build
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/toolscout-wrangler-dry-run

      - name: Final preservation gate before production mutation
        env:
          TOOLSCOUT_V2_BASE_REF: a4bfbd36f0f6d049e3bf13dd6272f48276ada07e
        run: node scripts/validate-v2-preservation.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker recovery
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify ToolScout 2.0 live preservation
        run: node scripts/verify-v2-live-smoke.mjs
