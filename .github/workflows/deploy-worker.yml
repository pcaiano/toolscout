# Manual recovery fallback for the Cloudflare-first ToolScout runtime.
name: ToolScout Worker Recovery Fallback

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/toolscout-v2-rollout.marker'

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production-recovery
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate ToolScout copy guard
        run: node scripts/check-distribution-copy.mjs

      - name: Validate ToolScout 2.0 runtime
        env:
          TOOLSCOUT_V2_BASE_REF: c6844695f338598a61c3092d4e84fa6495517ca0
        run: |
          node scripts/audit-runtime-architecture.mjs
          node scripts/validate-v2-preservation.mjs
          node --test tests/toolscout-v2-external-value.test.mjs tests/toolscout-v2-editorial-authority.test.mjs tests/toolscout-v2-editorial-evidence-generators.test.mjs tests/toolscout-v2-scheduler-ownership.test.mjs tests/toolscout-v2-route-ownership.test.mjs tests/toolscout-v2-command-center.test.mjs tests/toolscout-v2-command-center-resilient-health.test.mjs tests/toolscout-v2-traffic-schema-migration.test.mjs tests/toolscout-v2-public-plane.test.mjs tests/toolscout-v2-software-trends.test.mjs tests/toolscout-v2-static-guide-sovereignty.test.mjs tests/toolscout-v2-authority-health.test.mjs tests/toolscout-v2-canonical-contract.test.mjs tests/toolscout-v2-agent-protocol.test.mjs tests/toolscout-v2-machine-discovery-catalog.test.mjs tests/toolscout-v2-analytics-chairman.test.mjs tests/toolscout-v2-analytics-stats.test.mjs tests/toolscout-v2-analytics-human-actions.test.mjs tests/toolscout-v2-public-decision-parity.test.mjs tests/toolscout-v2-public-navigation-parity.test.mjs
          node tests/growth-scheduler-ownership.mjs
          node scripts/verify-public-navigation-shadow.mjs

      - name: Final preservation gate before production mutation
        env:
          TOOLSCOUT_V2_BASE_REF: c6844695f338598a61c3092d4e84fa6495517ca0
        run: node scripts/validate-v2-preservation.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker recovery
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify ToolScout 2.0 live preservation
        run: node scripts/verify-v2-live-smoke.mjs
