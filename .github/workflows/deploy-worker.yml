name: Deploy ToolScout Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical public navigation
        run: node scripts/unify-public-nav.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify distribution submission state
        run: |
          echo '=== DISTRIBUTION SUBMISSION COUNTS ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,COUNT(*) AS count FROM distribution_submissions GROUP BY surface_slug,status ORDER BY surface_slug,status;"
          echo '=== INDEXNOW LATEST ==='
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT surface_slug,status,attempts,last_attempt_at,submitted_at,error FROM distribution_submissions WHERE surface_slug='indexnow' ORDER BY updated_at DESC LIMIT 10;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
