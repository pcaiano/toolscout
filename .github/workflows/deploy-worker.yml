# Emergency Worker-only deploy while D1 daily read quota is exhausted.
name: Deploy ToolScout Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolscout-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate ToolScout copy guard
        run: node scripts/check-distribution-copy.mjs

      - name: Apply canonical public navigation
        run: node scripts/unify-public-nav.mjs

      - name: Deploy Worker without D1 migrations
        run: npx wrangler deploy --config wrangler.toml --latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
