name: ToolScout Search Evidence Watchdog

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: seo-engine-v2
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'ToolScout Search Freshness - production recovery deploy'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check search evidence freshness
        id: freshness
        run: node scripts/check-search-evidence-freshness.mjs --github-output

      - name: Sync Google Search Console performance signals
        if: steps.freshness.outputs.refresh == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: sc-domain:trytoolscout.org
          GSC_LOOKBACK_DAYS: '28'
        run: node scripts/sync-gsc-signals.mjs

      - name: Sync finalized Google Search Console daily trend
        if: steps.freshness.outputs.refresh == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: sc-domain:trytoolscout.org
          GSC_LOOKBACK_DAYS: '28'
        run: node scripts/sync-gsc-daily-trend.mjs

      - name: Rebuild growth priority from fresh search evidence
        if: steps.freshness.outputs.refresh == 'true'
        run: node scripts/build-growth-priority.mjs

      - name: Rebuild indexing-aware organic opportunities
        if: steps.freshness.outputs.refresh == 'true'
        run: node scripts/build-organic-growth-opportunities-v6.mjs

      - name: Require linked search evidence to be fresh
        if: steps.freshness.outputs.refresh == 'true'
        run: node scripts/check-search-evidence-freshness.mjs --require-fresh

      - name: Commit refreshed search evidence
        if: steps.freshness.outputs.refresh == 'true'
        run: |
          SEARCH_EVIDENCE_FILES="reports/gsc-signals.json reports/gsc-search-reality.json data/gsc-search-reality.json reports/gsc-daily-trend.json data/gsc-daily-trend.json reports/growth-priority.json reports/organic-growth-opportunities.json"
          if [ -z "$(git status --porcelain -- $SEARCH_EVIDENCE_FILES)" ]; then
            echo "No search evidence changes to commit."
            exit 0
          fi
          git config user.name "toolscout-search-watchdog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $SEARCH_EVIDENCE_FILES
          if [ -n "$(git status --porcelain --untracked-files=no | grep -vE '^(M |A |D |R |C ) (reports/gsc-signals.json|reports/gsc-search-reality.json|data/gsc-search-reality.json|reports/gsc-daily-trend.json|data/gsc-daily-trend.json|reports/growth-priority.json|reports/organic-growth-opportunities.json)
          git commit -m "Refresh search evidence watchdog"
          git pull --rebase origin main
          git push origin HEAD:main
 || true)" ]; then
            echo "Unexpected unstaged tracked changes remain after staging search evidence."
            git status --short
            exit 1
          fi
          git commit -m "Refresh search evidence watchdog"
          git pull --rebase origin main
          git push origin HEAD:main
