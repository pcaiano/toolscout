name: ToolScout 2.0 Editorial Portfolio Materialize

on:
  push:
    branches:
      - architecture/toolscout-2.0-phase-2
    paths:
      - '.github/workflows/toolscout-v2-editorial-materialize.yml'

permissions:
  contents: write

concurrency:
  group: toolscout-v2-editorial-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: architecture/toolscout-2.0-phase-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate editorial generator contracts
        run: |
          node --check scripts/generate-seo-pages.mjs
          node --check scripts/generate-tool-pages.mjs
          node --test tests/toolscout-v2-editorial-evidence-generators.test.mjs tests/toolscout-v2-editorial-authority.test.mjs

      - name: Regenerate decision pages locally
        run: |
          node scripts/generate-seo-pages.mjs
          node scripts/generate-tool-pages.mjs

      - name: Select observed-demand editorial portfolio only
        run: |
          node <<'NODE' > /tmp/toolscout-v2-pages.txt
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('reports/editorial-authority-portfolio.json','utf8'));
          const paths=[];
          for(const row of report.portfolio||[]){
            if(!['guide','tool_profile','comparison'].includes(row.pageType))continue;
            let p=String(row.page||'').replace(/^\//,'');
            if(!p)continue;
            paths.push(p+'.html');
          }
          console.log([...new Set(paths)].join('\n'));
          NODE
          echo "Selected portfolio:"
          cat /tmp/toolscout-v2-pages.txt
          while IFS= read -r page; do
            [ -z "$page" ] && continue
            test -f "$page"
            git add -- "$page"
          done < /tmp/toolscout-v2-pages.txt

      - name: Enforce preservation before commit
        env:
          TOOLSCOUT_V2_BASE_REF: origin/main
        run: node scripts/validate-v2-preservation.mjs

      - name: Commit priority editorial pages
        run: |
          if git diff --cached --quiet; then
            echo "Priority portfolio already matches the 2.0 generators."
            exit 0
          fi
          git config user.name "toolscout-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize ToolScout 2.0 editorial authority portfolio"
          git push origin HEAD:architecture/toolscout-2.0-phase-2
