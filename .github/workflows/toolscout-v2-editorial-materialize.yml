name: ToolScout 2.0 Editorial Portfolio Materialize

on:
  push:
    branches:
      - architecture/toolscout-2.0-phase-2
    paths:
      - '.github/workflows/toolscout-v2-editorial-materialize.yml'

permissions:
  contents: write

concurrency:
  group: toolscout-v2-editorial-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: architecture/toolscout-2.0-phase-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate editorial generator contracts
        run: |
          node --check scripts/generate-seo-pages.mjs
          node --check scripts/generate-tool-pages.mjs
          node --test tests/toolscout-v2-editorial-evidence-generators.test.mjs tests/toolscout-v2-editorial-authority.test.mjs tests/toolscout-v2-software-trends.test.mjs

      - name: Regenerate decision pages locally
        run: |
          node scripts/generate-seo-pages.mjs
          node scripts/generate-tool-pages.mjs
          node scripts/generate-software-trends-index.mjs

      - name: Select observed-demand editorial portfolio only
        run: |
          node <<'NODE' > /tmp/toolscout-v2-pages.txt
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('reports/editorial-authority-portfolio.json','utf8'));
          const paths=[];
          for(const row of report.portfolio||[]){
            if(!['guide','tool_profile','comparison'].includes(row.pageType))continue;
            let p=String(row.page||'').replace(/^\//,'');
            if(!p)continue;
            paths.push(p+'.html');
          }
          console.log([...new Set(paths)].join('\n'));
          NODE
          echo "Selected portfolio:"
          cat /tmp/toolscout-v2-pages.txt

          rm -rf /tmp/toolscout-v2-selected
          mkdir -p /tmp/toolscout-v2-selected
          while IFS= read -r page; do
            [ -z "$page" ] && continue
            test -f "$page"
            mkdir -p "/tmp/toolscout-v2-selected/$(dirname "$page")"
            cp "$page" "/tmp/toolscout-v2-selected/$page"
          done < /tmp/toolscout-v2-pages.txt
          for artifact in software-trends-index.html software-trends-index.json reports/software-trends-index.json reports/linkable-assets.json; do
            test -f "$artifact"
            mkdir -p "/tmp/toolscout-v2-selected/$(dirname "$artifact")"
            cp "$artifact" "/tmp/toolscout-v2-selected/$artifact"
          done

          # Generators may refresh unrelated pages. Discard every non-selected
          # working-tree mutation before reapplying the bounded portfolio.
          git reset --hard HEAD
          while IFS= read -r page; do
            [ -z "$page" ] && continue
            cp "/tmp/toolscout-v2-selected/$page" "$page"
          done < /tmp/toolscout-v2-pages.txt
          for artifact in software-trends-index.html software-trends-index.json reports/software-trends-index.json reports/linkable-assets.json; do
            cp "/tmp/toolscout-v2-selected/$artifact" "$artifact"
          done

          # Preservation is authoritative: keep each page's existing canonical
          # exactly as it is on main, even when the current generator prefers a
          # different URL normalization.
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const pages=fs.readFileSync('/tmp/toolscout-v2-pages.txt','utf8').split(/\r?\n/).filter(Boolean);
          const canonical=html=>{
            const a=html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i);
            const b=html.match(/<link[^>]+href=["']([^"']+)["'][^>]+rel=["']canonical["']/i);
            return (a||b)?.[1]||null;
          };
          for(const page of pages){
            const before=cp.execFileSync('git',['show',`origin/main:${page}`],{encoding:'utf8'});
            let after=fs.readFileSync(page,'utf8');
            const keep=canonical(before),next=canonical(after);
            if(keep&&next&&keep!==next)after=after.replace(next,keep);
            fs.writeFileSync(page,after);
          }
          NODE

          while IFS= read -r page; do
            [ -z "$page" ] && continue
            git add -- "$page"
          done < /tmp/toolscout-v2-pages.txt
          git add -- software-trends-index.html software-trends-index.json reports/software-trends-index.json reports/linkable-assets.json

      - name: Enforce preservation before commit
        env:
          TOOLSCOUT_V2_BASE_REF: origin/main
        run: node scripts/validate-v2-preservation.mjs

      - name: Commit priority editorial pages
        run: |
          if git diff --cached --quiet; then
            echo "Priority portfolio already matches the 2.0 generators."
            exit 0
          fi
          git config user.name "toolscout-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize ToolScout 2.0 editorial authority portfolio"
          git push origin HEAD:architecture/toolscout-2.0-phase-2
