name: One Shot Affiliate Active Classification

on:
  push:
    paths:
      - ".github/workflows/one-shot-affiliate-active-classification.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read exact active affiliate classification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT c.tool_slug,COUNT(*) clicks,SUM(CASE WHEN s.classification='likely-human' THEN 1 ELSE 0 END) likely_human,SUM(CASE WHEN s.classification='known-bot/crawler' THEN 1 ELSE 0 END) known_bot,SUM(CASE WHEN s.classification='owner' THEN 1 ELSE 0 END) owner,SUM(CASE WHEN s.classification='synthetic/test' THEN 1 ELSE 0 END) synthetic,SUM(CASE WHEN s.classification='unknown/legacy' OR s.session_id IS NULL THEN 1 ELSE 0 END) unknown_or_missing,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=c.session_id AND f.event_type='page_confirmed') THEN c.session_id END) page_confirmed,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM verified_outbound_events v WHERE v.session_id=c.session_id AND v.tool_slug=c.tool_slug) THEN c.session_id END) verified_outbound FROM click_events c LEFT JOIN sessions s ON s.session_id=c.session_id WHERE c.affiliate_active_at_click=1 AND c.tool_slug IN ('unbounce','apollo','gorgias','kit','instantly','lemlist') GROUP BY c.tool_slug ORDER BY c.tool_slug; SELECT COUNT(*) clicks,SUM(CASE WHEN s.classification='likely-human' THEN 1 ELSE 0 END) likely_human,SUM(CASE WHEN s.classification='known-bot/crawler' THEN 1 ELSE 0 END) known_bot,SUM(CASE WHEN s.classification='owner' THEN 1 ELSE 0 END) owner,SUM(CASE WHEN s.classification='synthetic/test' THEN 1 ELSE 0 END) synthetic,SUM(CASE WHEN s.classification='unknown/legacy' OR s.session_id IS NULL THEN 1 ELSE 0 END) unknown_or_missing,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=c.session_id AND f.event_type='page_confirmed') THEN c.session_id END) page_confirmed,COUNT(DISTINCT CASE WHEN EXISTS(SELECT 1 FROM verified_outbound_events v WHERE v.session_id=c.session_id AND v.tool_slug=c.tool_slug) THEN c.session_id END) verified_outbound FROM click_events c LEFT JOIN sessions s ON s.session_id=c.session_id WHERE c.affiliate_active_at_click=1 AND c.tool_slug IN ('unbounce','apollo','gorgias','kit','instantly','lemlist');"
