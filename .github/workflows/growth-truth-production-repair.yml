name: ToolScout Growth Truth Production Repair

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: toolscout-growth-truth-production-repair
  cancel-in-progress: false

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Command Center Truth Repair - production deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate observability repair
        env:
          TOOLSCOUT_V2_BASE_REF: a4bfbd36f0f6d049e3bf13dd6272f48276ada07e
        run: |
          set -euo pipefail
          node --check command-center-ga4-worker.js
          node --check scripts/probe-growth-truth-live.mjs
          node scripts/audit-runtime-architecture.mjs
          node scripts/validate-v2-preservation.mjs
          node --test tests/toolscout-v2-command-center-ga4.test.mjs tests/toolscout-v2-command-center-final-truth.test.mjs tests/toolscout-v2-search-evidence-watchdog.test.mjs tests/toolscout-growth-truth-observability.test.mjs

      - name: Wrangler dry-run
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/toolscout-growth-truth-dry-run

      - name: Apply pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply toolscout --remote --config wrangler.toml

      - name: Deploy observability repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml --latest

      - name: Verify ToolScout 2.0 preservation
        run: node scripts/verify-v2-live-smoke.mjs

      - name: Verify fresh growth truth live
        run: node scripts/probe-growth-truth-live.mjs
