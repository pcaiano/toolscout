name: One Shot Command Center Truth Diagnosis
on:
  push:
    paths:
      - ".github/workflows/one-shot-command-center-truth-diagnosis.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Diagnose truth endpoint dependencies
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== live endpoint ==="
          curl -i -sS --max-time 20 "https://trytoolscout.org/api/command-center-business-truth?fresh=1" || true
          echo
          echo "=== schemas ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "PRAGMA table_info(verified_outbound_events); PRAGMA table_info(outbound_integrity_meta); PRAGMA table_info(click_events); PRAGMA table_info(sessions); PRAGMA table_info(traffic_human_evidence); PRAGMA table_info(affiliate_network_click_evidence); PRAGMA table_info(affiliate_network_accounts); PRAGMA table_info(affiliate_network_program_evidence);"
          echo "=== outbound layered query ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "WITH classified AS (SELECT v.*,CASE WHEN v.proof_type='user_activation_navigation' OR EXISTS(SELECT 1 FROM funnel_events f WHERE f.session_id=v.session_id AND f.event_type='page_confirmed' AND COALESCE(f.source,'')<>'outbound-proof' AND f.created_at<=v.created_at) OR EXISTS(SELECT 1 FROM traffic_human_evidence h WHERE h.session_id=v.session_id AND h.evidence_type<>'verified_outbound_navigation' AND h.first_evidence_at<=v.created_at) THEN 1 ELSE 0 END strict_proof FROM verified_outbound_events v) SELECT SUM(CASE WHEN created_at>=datetime('now','-24 hours') THEN 1 ELSE 0 END) browser24h,SUM(CASE WHEN strict_proof=1 AND created_at>=datetime('now','-24 hours') THEN 1 ELSE 0 END) strict24h FROM classified;"
          echo "=== redirect truth query ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT SUM(CASE WHEN c.affiliate_active_at_click=1 AND c.created_at>=datetime('now','-24 hours') THEN 1 ELSE 0 END) clicks24h,SUM(CASE WHEN c.affiliate_active_at_click=1 AND c.created_at>=datetime('now','-30 days') AND s.classification='likely-human' THEN 1 ELSE 0 END) likelyHuman30d FROM click_events c LEFT JOIN sessions s ON s.session_id=c.session_id;"
          echo "=== tracking meta ==="
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --command "SELECT value FROM outbound_integrity_meta WHERE key='tracking_started_at' LIMIT 1;"
