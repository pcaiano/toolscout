name: One Shot Phase 237 Sender Supply Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase237-sender-supply-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect sender-admissible replenishment supply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          SELECT COUNT(*) eligible_contact_research
          FROM contact_supply_domain cs
          WHERE cs.contact_email IS NULL
            AND cs.status IN ('queued','unresolved','provider_blocked','ready_route')
            AND cs.next_research_at<=datetime('now')
            AND (
              EXISTS(
                SELECT 1 FROM distribution_vendor_amplification v
                WHERE lower(v.vendor_domain)=cs.domain
                  AND v.status NOT IN ('sent','reputation_quarantine','suppressed_asset_mismatch')
              )
              OR EXISTS(
                SELECT 1 FROM distribution_network_outreach n
                WHERE lower(n.domain)=cs.domain
                  AND n.status NOT IN ('sent','adopted','reputation_quarantine','suppressed_competitor','suppressed_technical')
                  AND NOT EXISTS(
                    SELECT 1 FROM distribution_opportunities o
                    WHERE o.surface_slug=n.surface_slug AND o.status='policy_blocked'
                  )
              )
            );

          SELECT cs.status,cs.source_type,COUNT(*) n
          FROM contact_supply_domain cs
          WHERE cs.contact_email IS NULL
            AND cs.status IN ('queued','unresolved','provider_blocked','ready_route')
            AND cs.next_research_at<=datetime('now')
            AND (
              EXISTS(
                SELECT 1 FROM distribution_vendor_amplification v
                WHERE lower(v.vendor_domain)=cs.domain
                  AND v.status NOT IN ('sent','reputation_quarantine','suppressed_asset_mismatch')
              )
              OR EXISTS(
                SELECT 1 FROM distribution_network_outreach n
                WHERE lower(n.domain)=cs.domain
                  AND n.status NOT IN ('sent','adopted','reputation_quarantine','suppressed_competitor','suppressed_technical')
                  AND NOT EXISTS(
                    SELECT 1 FROM distribution_opportunities o
                    WHERE o.surface_slug=n.surface_slug AND o.status='policy_blocked'
                  )
              )
            )
          GROUP BY cs.status,cs.source_type
          ORDER BY n DESC,cs.status,cs.source_type;

          SELECT status,COUNT(*) n,
                 MIN(created_at) oldest,
                 MAX(created_at) newest
          FROM compute_overflow_jobs
          WHERE job_type='contact_supply_public_research'
          GROUP BY status ORDER BY n DESC,status;

          SELECT COUNT(*) vendor_fallback_exhausted,
                 COUNT(DISTINCT lower(vendor_domain)) vendor_domains
          FROM distribution_vendor_amplification
          WHERE status='fallback_exhausted'
            AND contact_email IS NULL
            AND vendor_domain IS NOT NULL;

          SELECT COUNT(*) network_researchable
          FROM distribution_network_outreach n
          WHERE n.contact_email IS NULL
            AND n.status NOT IN ('sent','adopted','reputation_quarantine','suppressed_competitor','suppressed_technical')
            AND NOT EXISTS(
              SELECT 1 FROM distribution_opportunities o
              WHERE o.surface_slug=n.surface_slug AND o.status='policy_blocked'
            );

          SELECT target_ready,min_ready,ready_email,email_discovered_unrouted,ready_route,
                 cooldown,researching,unresolved,route_filtered,updated_at
          FROM contact_supply_metrics WHERE id='global';

          SELECT engine,mission,status,trigger_name,started_at,completed_at,detail
          FROM engine_runs
          WHERE started_at>=datetime('now','-45 minutes')
            AND (trigger_name='compute_router_overflow_cron' OR trigger_name='*/15 * * * *')
          ORDER BY started_at DESC LIMIT 30;
          "
