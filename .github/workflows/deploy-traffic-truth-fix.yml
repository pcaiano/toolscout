name: ToolScout deploy traffic truth fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-traffic-truth-fix.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate changed workers
        run: |
          node --check funnel-model.js
          node --check traffic-integrity-live-worker.js
          grep -q 'main = "traffic-integrity-live-worker.js"' wrangler.toml
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml
