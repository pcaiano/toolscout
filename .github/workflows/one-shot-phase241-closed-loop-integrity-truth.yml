name: One Shot Phase 241 Closed Loop Integrity Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-phase241-closed-loop-integrity-truth.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect closed-loop integrity truth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute toolscout --remote --config wrangler.toml --json --command "
          WITH active_actions AS (
            SELECT g.opportunity_key,g.subject_type,g.subject_key,j.value action
            FROM growth_opportunity_state g,json_each(g.action_json) j
            WHERE g.status='active'
              AND j.value NOT IN ('distribution_measurement','search_measurement')
          )
          SELECT COUNT(*) active_actions,
                 SUM(CASE WHEN c.task_id IS NULL THEN 1 ELSE 0 END) missing_contracts,
                 SUM(CASE WHEN c.executor IS NULL OR c.status='executor_missing' THEN 1 ELSE 0 END) missing_executors,
                 SUM(CASE WHEN c.status IN ('pending','claimed','attempted','stalled') THEN 1 ELSE 0 END) live_contracts,
                 SUM(CASE WHEN c.status='deferred' THEN 1 ELSE 0 END) deferred_contracts,
                 SUM(CASE WHEN c.status='human_required' THEN 1 ELSE 0 END) human_contracts
          FROM active_actions a
          LEFT JOIN growth_execution_contract c
            ON c.source_kind='opportunity'
           AND c.source_id=a.opportunity_key
           AND c.action=a.action;

          WITH active_actions AS (
            SELECT g.opportunity_key,g.subject_type,g.subject_key,j.value action
            FROM growth_opportunity_state g,json_each(g.action_json) j
            WHERE g.status='active'
              AND j.value NOT IN ('distribution_measurement','search_measurement')
          )
          SELECT a.opportunity_key,a.subject_type,a.subject_key,a.action,
                 c.task_id,c.executor,c.status,c.last_result,c.updated_at
          FROM active_actions a
          LEFT JOIN growth_execution_contract c
            ON c.source_kind='opportunity'
           AND c.source_id=a.opportunity_key
           AND c.action=a.action
          WHERE c.task_id IS NULL OR c.executor IS NULL OR c.status='executor_missing'
          ORDER BY a.subject_type,a.opportunity_key,a.action
          LIMIT 100;

          WITH active_actions AS (
            SELECT g.opportunity_key,j.value action
            FROM growth_opportunity_state g,json_each(g.action_json) j
            WHERE g.status='active'
              AND j.value NOT IN ('distribution_measurement','search_measurement')
          )
          SELECT c.executor,c.status,c.action,COUNT(*) n,
                 SUM(CASE WHEN c.updated_at<datetime('now','-2 hours') THEN 1 ELSE 0 END) stale_2h,
                 MIN(c.updated_at) oldest_updated,
                 MAX(c.updated_at) newest_updated
          FROM growth_execution_contract c
          WHERE c.source_kind='opportunity'
            AND c.status NOT IN ('verified','blocked','cancelled','human_required')
            AND EXISTS(SELECT 1 FROM active_actions a
              WHERE a.opportunity_key=c.source_id AND a.action=c.action)
          GROUP BY c.executor,c.status,c.action
          ORDER BY n DESC,c.executor,c.status,c.action;

          SELECT COUNT(*) orphan_nonterminal_contracts
          FROM growth_execution_contract c
          WHERE c.source_kind='opportunity'
            AND c.status NOT IN ('verified','blocked','cancelled','human_required')
            AND NOT EXISTS(
              SELECT 1 FROM growth_opportunity_state g,json_each(g.action_json) j
              WHERE g.status='active'
                AND g.opportunity_key=c.source_id
                AND j.value=c.action
                AND j.value NOT IN ('distribution_measurement','search_measurement')
            );

          SELECT status,COUNT(*) n,
                 SUM(CASE WHEN updated_at<datetime('now','-2 hours') THEN 1 ELSE 0 END) stale_2h,
                 SUM(CASE WHEN updated_at<datetime('now','-12 hours') THEN 1 ELSE 0 END) stale_12h,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM growth_execution_contract
          WHERE status IN ('pending','claimed','attempted','stalled','executor_missing')
          GROUP BY status ORDER BY status;

          SELECT subject_type,status,COUNT(*) n,
                 MIN(last_evaluated_at) oldest_evaluated,
                 MAX(last_evaluated_at) newest_evaluated
          FROM growth_opportunity_state
          GROUP BY subject_type,status
          ORDER BY subject_type,status;

          SELECT engine,mission,status,trigger_name,started_at,completed_at,
                 CAST((julianday('now')-julianday(COALESCE(completed_at,started_at)))*24*60 AS INTEGER) age_minutes,
                 detail
          FROM engine_runs r
          WHERE r.run_id IN (
            SELECT run_id FROM engine_runs x
            WHERE x.engine=r.engine AND x.mission=r.mission
            ORDER BY started_at DESC LIMIT 1
          )
            AND (
              (engine='growth' AND mission IN ('execution_contract','opportunity_coordination','self_audit'))
              OR (engine='distribution' AND mission IN ('autonomous_cycle','economic_learning','network_cycle','authority_execution_recovery'))
              OR (engine='seo_geo_aio' AND mission='execution_batch_v2')
              OR (engine='affiliate' AND mission IN ('coverage_cycle','affiliate_coverage'))
              OR (engine='catalog' AND mission IN ('runtime_quality','runtime_coverage'))
            )
          ORDER BY engine,mission;

          SELECT job_type,status,COUNT(*) n,
                 SUM(CASE WHEN status IN ('queued','leased') AND available_at<=datetime('now') THEN 1 ELSE 0 END) due_live,
                 SUM(CASE WHEN status='leased' AND updated_at<datetime('now','-30 minutes') THEN 1 ELSE 0 END) stale_leases,
                 MIN(updated_at) oldest_updated,
                 MAX(updated_at) newest_updated
          FROM compute_overflow_jobs
          GROUP BY job_type,status
          HAVING status IN ('queued','leased','failed')
          ORDER BY due_live DESC,stale_leases DESC,n DESC
          LIMIT 100;

          SELECT engine,status,COUNT(*) n,
                 SUM(CASE WHEN status='open' AND updated_at<datetime('now','-72 hours') THEN 1 ELSE 0 END) stale_open_72h,
                 SUM(CASE WHEN status='verification_pending' AND updated_at<datetime('now','-24 hours') THEN 1 ELSE 0 END) stale_verification_24h
          FROM human_gate_contract
          GROUP BY engine,status
          ORDER BY engine,status;

          SELECT COUNT(*) architecture_incidents_open,
                 SUM(CASE WHEN severity='P1' THEN 1 ELSE 0 END) p1,
                 SUM(CASE WHEN severity='P2' THEN 1 ELSE 0 END) p2
          FROM growth_architecture_incidents
          WHERE status='open';

          SELECT key,value,updated_at
          FROM external_runtime_config
          WHERE key IN ('make_sender_webhook_url')
          ORDER BY key;
          "
