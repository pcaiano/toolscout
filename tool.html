<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool | ToolScout</title><meta name="description" content="Independent ToolScout profile and fit analysis."><style>body{font-family:system-ui;margin:0;background:#f7f7f5;color:#111827}.wrap{max-width:850px;margin:auto;padding:30px 20px 70px}.nav{display:flex;justify-content:space-between;margin-bottom:70px}.nav a{color:#4b5563;text-decoration:none}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:28px}.cat{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#6b7280}h1{font-size:clamp(42px,7vw,68px);letter-spacing:-.06em;margin:12px 0}.muted{color:#66707c;line-height:1.6}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.chip{background:#eef0f2;padding:7px 10px;border-radius:99px;font-size:13px}.btn{display:inline-block;background:#111827;color:#fff;text-decoration:none;padding:12px 16px;border-radius:11px;font-weight:700}.small{font-size:12px;color:#8a919c;margin-top:22px}</style></head><body><div class="wrap"><nav class="nav"><a href="/">ToolScout</a><a href="/tools.html">All tools</a></nav><main id="app"></main></div><script>const slug=new URLSearchParams(location.search).get('tool');fetch('/data/tools.json').then(r=>r.json()).then(tools=>{const t=tools.find(x=>x.slug===slug);if(!t){document.getElementById('app').innerHTML='<div class="card"><h1>Tool not found</h1><a class="btn" href="/tools.html">Browse tools</a></div>';return}document.title=`${t.name} — ToolScout`;document.querySelector('meta[name=description]').content=`${t.name}: features, use cases, pricing and independent ToolScout fit information.`;document.getElementById('app').innerHTML=`<article class="card"><div class="cat">${t.category}</div><h1>${t.name}</h1><p class="muted">${t.description}</p><h2>What it does</h2><div class="chips">${t.features.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h2>Best for</h2><p class="muted">${t.bestFor.join(' · ')}</p><h2>Pricing</h2><p class="muted">${t.pricing}</p><a class="btn" href="${t.affiliateUrl||t.sourceUrl}" target="_blank" rel="nofollow sponsored noopener">Explore ${t.name}</a><p class="small">Information last verified ${t.lastVerified}. Affiliate relationship: ${t.affiliateProgram||'not yet configured'}.</p></article>`})</script></body></html>
