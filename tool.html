<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool review & fit — ToolScout</title><meta name="description" content="Independent ToolScout profile covering software features, pricing, best-fit use cases and comparisons.">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f5f7fb;line-height:1.5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,rgba(109,94,252,.10),transparent 30%),radial-gradient(circle at 90% 10%,rgba(42,174,255,.08),transparent 24%),#f5f7fb}.wrap{max-width:1040px;margin:auto;padding:24px 22px 80px}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px}.brand{font-weight:850;font-size:23px;letter-spacing:-.045em;color:#101828;text-decoration:none}.links{display:flex;gap:10px}.links a{font-size:13px;color:#667085;text-decoration:none;padding:9px 12px;border-radius:10px}.links a:hover{background:#fff}.hero{background:#fff;border:1px solid #e2e7ed;border-radius:28px;padding:32px;box-shadow:0 20px 60px rgba(16,24,40,.08)}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.identity{display:flex;align-items:center;gap:17px}.logo{width:72px;height:72px;border-radius:19px;background:#f2f4f7;border:1px solid #e4e8ee;display:grid;place-items:center;overflow:hidden;position:relative}.logo img{width:52px;height:52px;object-fit:contain;position:relative;z-index:2}.logo-fallback{position:absolute;inset:0;display:grid;place-items:center;font-weight:850;font-size:18px;color:#344054;z-index:1}.cat{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:#667085}h1{font-size:clamp(44px,7vw,72px);line-height:.95;letter-spacing:-.07em;margin:7px 0 10px}.score{min-width:125px;border:1px solid #e2e7ed;border-radius:16px;padding:12px 15px;text-align:center}.score span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#98a2b3}.score strong{font-size:27px}.lede{font-size:19px;line-height:1.6;color:#667085;max-width:760px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:22px}.panel{background:#f8fafc;border:1px solid #e8edf3;border-radius:20px;padding:22px}.panel h2{font-size:20px;letter-spacing:-.03em;margin:0 0 12px}.panel p,.panel li{color:#667085}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{font-size:12px;background:#fff;border:1px solid #e4e8ee;border-radius:999px;padding:7px 9px;color:#475467}.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid #edf0f4}.btn{display:inline-flex;align-items:center;justify-content:center;background:#101828;color:#fff!important;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:750;box-shadow:0 8px 24px rgba(16,24,40,.14)}.secondary{background:#eef2f6;color:#101828!important;box-shadow:none}.small{font-size:12px;color:#98a2b3;margin-top:22px}@media(max-width:760px){.top,.actions{flex-direction:column;align-items:flex-start}.score{width:100%;text-align:left}.grid{grid-template-columns:1fr}.btn{width:100%}}
</style></head><body><div class="wrap"><nav><a class="brand" href="./">ToolScout</a><div class="links"><a href="./guides.html">Guides</a><a href="./tools.html">Tools</a></div></nav><main id="app"></main></div>
<script>
const slug=new URLSearchParams(location.search).get('tool');
const LEGACY_WORKER='https://trytoolscout.org';
const GO_BASE=location.hostname==='trytoolscout.org'?'':LEGACY_WORKER;
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function initials(n){return String(n||'T').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function logoUrl(t){try{return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(t.sourceUrl).hostname)}&sz=128`}catch{return''}}
fetch('./data/tools.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(tools=>{const t=tools.find(x=>x.slug===slug);const app=document.getElementById('app');if(!t){app.innerHTML='<section class="hero"><h1>Tool not found</h1><p class="lede">Browse the ToolScout directory to find another software profile.</p><a class="btn" href="./tools.html">Browse tools →</a></section>';return}
const logo=logoUrl(t);
const goUrl=`${GO_BASE}/go/${encodeURIComponent(t.slug)}`;
document.title=`${t.name} Review, Features & Best For — ToolScout`;document.querySelector('meta[name="description"]').content=`${t.name}: independent ToolScout profile covering features, pricing, best-fit use cases and software comparisons.`;
let canonical=document.querySelector('link[rel="canonical"]');if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}canonical.href=`https://trytoolscout.org/tool.html?tool=${encodeURIComponent(t.slug)}`;
app.innerHTML=`<section class="hero"><div class="top"><div class="identity"><div class="logo"><span class="logo-fallback">${initials(t.name)}</span>${logo?`<img src="${logo}" alt="${esc(t.name)} logo" width="52" height="52" onerror="this.remove()">`:''}</div><div><div class="cat">${esc(t.category)}</div><h1>${esc(t.name)}</h1></div></div><div class="score"><span>ToolScout fit</span><strong>—</strong></div></div><p class="lede">${esc(t.description)}</p><div class="grid"><section class="panel"><h2>Best for</h2><ul>${(t.bestFor||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2 style="margin-top:22px">Key capabilities</h2><div class="chips">${(t.features||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></section><section class="panel"><h2>At a glance</h2><p><strong>Pricing:</strong> ${esc(t.pricing)}</p><p><strong>Free plan:</strong> ${t.freePlan?'Yes':'No'}</p><p><strong>Category:</strong> ${esc(t.category)}</p><p><strong>Affiliate status:</strong> ${esc(t.affiliateProgram||'Not connected')}</p></section></div><div class="actions"><a class="btn secondary" href="./compare.html?tool=${encodeURIComponent(t.slug)}">Compare ${esc(t.name)} →</a><a class="btn" href="${goUrl}" target="_blank" rel="nofollow sponsored noopener">Explore ${esc(t.name)} →</a></div><p class="small">Information last verified ${esc(t.lastVerified||'recently')}. Pricing and features can change; verify with the provider before purchasing.</p><p class="small">ToolScout may earn affiliate compensation from some links. Recommendations are based on fit and user needs, not affiliate payout.</p></section>`;}).catch(()=>document.getElementById('app').innerHTML='<section class="hero"><h1>Unable to load this tool.</h1><p class="lede">Please try again shortly.</p></section>');
</script></body></html>
