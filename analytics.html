<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ToolScout Analytics</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f7f7f5;color:#111827;margin:0}.wrap{max-width:1100px;margin:auto;padding:30px 20px 70px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:30px}.muted{color:#6b7280}.panel{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:18px}input,button{font:inherit;padding:11px 13px;border-radius:10px;border:1px solid #d1d5db}button{background:#111827;color:white;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.metric b{display:block;font-size:28px;margin-top:5px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:11px 0}.error{color:#b91c1c}@media(max-width:750px){.grid,.cols{grid-template-columns:1fr 1fr}header{display:block}.cols{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><div><div class="muted">TOOLSCOUT</div><h1>Analytics</h1><p class="muted">Search intent, clicks and SEO opportunities.</p></div><div><input id="token" type="password" placeholder="Admin token"><button id="load">Load data</button></div></header><div id="status" class="muted"></div><section class="grid" id="metrics"></section><section class="cols"><div class="panel"><h2>Clicks by tool</h2><div id="tools"></div></div><div class="panel"><h2>Clicks by intent</h2><div id="intents"></div></div></section><section class="panel"><h2>Searches by intent</h2><div id="searches"></div></section><section class="panel"><h2>SEO opportunities</h2><div id="opps"></div></section></div><script>const API=(location.hostname==='trytoolscout.org'?'https://trytoolscout.org':'https://toolscout.luxurybuyerintelligence.workers.dev')+'/api/stats';const token=document.getElementById('token');const status=document.getElementById('status');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function rows(items,label){return items.length?items.map(x=>`<div class="row"><span>${esc(x[label]||x.intent_slug||x.tool_slug)}</span><b>${esc(x.clicks??x.searches??x.opportunity_score)}</b></div>`).join(''):'<div class="muted">No data yet.</div>'}async function load(){status.textContent='Loading…';try{const r=await fetch(API,{headers:{Authorization:'Bearer '+token.value}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();document.getElementById('metrics').innerHTML=`<div class="metric">Clicks<b>${d.total?.clicks||0}</b></div><div class="metric">Sessions<b>${d.total?.sessions||0}</b></div><div class="metric">Intent signals<b>${d.searches?.length||0}</b></div><div class="metric">SEO candidates<b>${d.opportunities?.length||0}</b></div>`;document.getElementById('tools').innerHTML=rows(d.byTool||[],'tool_slug');document.getElementById('intents').innerHTML=rows(d.byIntent||[],'intent_slug');document.getElementById('searches').innerHTML=rows(d.searches||[],'intent_slug');document.getElementById('opps').innerHTML=(d.opportunities||[]).map(x=>`<div class="row"><span>${esc(x.intent_slug)} <small class="muted">${esc(x.status)}</small></span><b>${esc(x.opportunity_score)}</b></div>`).join('')||'<div class="muted">No candidates yet.</div>';status.textContent='Updated '+new Date().toLocaleString()}catch(e){status.innerHTML='<span class="error">Could not load analytics. Check the admin token and deployment.</span>'}}document.getElementById('load').addEventListener('click',load);token.addEventListener('keydown',e=>{if(e.key==='Enter')load()});</script></body></html>
