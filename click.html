<!doctype html><meta charset="utf-8"><title>Redirecting…</title><script>
const p=new URLSearchParams(location.search), url=p.get('url'), tool=p.get('tool');
if(url){try{const key='toolscout_clicks';const rows=JSON.parse(localStorage.getItem(key)||'[]');rows.push({tool,url,at:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(rows.slice(-500)));}catch(e){} location.replace(url)}else{location.replace('/')}
</script>
