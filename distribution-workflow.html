<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ToolScout Distribution Workflow</title><link rel="stylesheet" href="./brand-system.css?v=20260903-1"><style>.wrap{max-width:1400px;margin:auto;padding:34px 28px 84px}.top{padding-bottom:28px;border-bottom:1px solid rgba(243,245,241,.11)}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#B7FF3C;font-weight:800}h1{font-size:48px;line-height:1;letter-spacing:-.055em;margin:8px 0}.muted{color:#90978F}.opsnav{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0 30px;font-size:12px}.opsnav a{text-decoration:none;color:#AEB4AE}.opsnav a:hover{color:#fff}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:34px 0}.stat{padding:15px 2px;border-top:1px solid rgba(243,245,241,.12)}.stat strong{font-size:30px;letter-spacing:-.045em;display:block;margin-top:4px}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.07em}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 14px;padding-top:20px;border-top:1px solid rgba(243,245,241,.11)}.bar input,.bar select,select,textarea{min-height:44px;border:1px solid rgba(243,245,241,.14);border-radius:7px;padding:9px 11px;background:#0F1210;color:#F3F5F1;font:inherit}.bar input{min-width:280px}.grid{display:grid;gap:8px}.card{display:grid;grid-template-columns:200px 145px minmax(320px,1fr) 220px;gap:16px;align-items:start;padding:20px 0;border-top:1px solid rgba(243,245,241,.11);background:transparent}.card.priority-high{border-top:2px solid #B7FF3C}.name{font-weight:800;font-size:18px;letter-spacing:-.02em}.pill,.priority{display:inline-block;padding:3px 7px;border:1px solid rgba(243,245,241,.13);border-radius:999px;font-size:10px}.priority{margin-top:8px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.priority.high{border-color:#B7FF3C;color:#B7FF3C}.priority.medium,.priority.low{color:#90978F}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;border-radius:7px;background:#B7FF3C;color:#0B0D0C!important;text-decoration:none;border:0;cursor:pointer;font:inherit;font-size:11px;font-weight:800}.btn.alt{background:transparent;color:#C4CAC4!important;border:1px solid rgba(243,245,241,.14)}.details{font-size:12px;color:#9BA29B;line-height:1.55}.pack{margin:28px 0 6px;border-top:1px solid rgba(243,245,241,.12);padding-top:20px}.pack pre{white-space:pre-wrap;background:#0F1210;border:1px solid rgba(243,245,241,.09);padding:14px;border-radius:8px;font-size:11px;color:#AEB4AE;max-height:220px;overflow:auto}.save{font-size:10px;color:#777E77;margin-top:6px}textarea{width:100%;margin:8px 0;resize:vertical}.private{max-width:720px;margin:90px auto;padding:0 28px}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.card{grid-template-columns:1fr 1fr}.card>div:nth-child(3),.card>div:nth-child(4){grid-column:1/-1}}@media(max-width:680px){.wrap{padding:26px 20px 70px}.stats{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:1fr}.card>div{grid-column:1!important}.bar input{min-width:100%}h1{font-size:38px}}</style></head><body class="brand-ops"><div class="wrap"><header class="top"><div class="eyebrow">ToolScout / Operations</div><h1>Distribution</h1><div class="muted">Launch platforms, directories and submission actions. Priority now, then evidence.</div></header><nav class="opsnav" aria-label="Operational dashboards"><a href="./analytics.html">Command Center</a><a href="./affiliate-workflow.html">Affiliate Operations</a><a href="./distribution-workflow.html">Distribution</a><a href="./opportunity-matrix.html">Opportunity Matrix</a><a href="./">Public site ↗</a></nav><div class="stats" id="stats"></div><div class="pack"><b>Reusable submission pack</b><pre id="pack">Loading…</pre></div><div class="bar"><input id="q" placeholder="Search platforms"><select id="filter"><option value="">All statuses</option><option>live</option><option>scheduled</option><option>submitted</option><option>needs_info</option><option>ready_to_submit</option><option>research_required</option><option>rejected</option><option>not_applicable</option></select><select id="priority"><option value="">All priorities</option><option value="high">High priority</option><option value="medium">Medium priority</option><option value="low">Low priority</option></select></div><div class="grid" id="list"></div></div><script>let data={items:[],submissionPack:{}};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const labels={live:'Live',scheduled:'Scheduled',submitted:'Submitted',needs_info:'Needs info',ready_to_submit:'Ready to submit',research_required:'Research required',rejected:'Rejected',not_applicable:'Not applicable'};const rank={high:0,medium:1,low:2};async function load(){const r=await fetch('/distribution-workflow/api',{cache:'no-store'});if(!r.ok)throw Error('unauthorized');data=await r.json();render();}function render(){const counts={};data.items.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);const high=data.items.filter(t=>t.priority==='high'&&!['live','rejected','not_applicable'].includes(t.status)).length;document.querySelector('#stats').innerHTML=[['Actions',data.items.length],['Priority now',high],['Live',counts.live||0],['Scheduled',counts.scheduled||0],['Submitted',counts.submitted||0],['Ready',(counts.ready_to_submit||0)+(counts.research_required||0)]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');document.querySelector('#pack').textContent=Object.entries(data.submissionPack||{}).map(([k,v])=>`${k}: ${v}`).join('\n\n');const q=document.querySelector('#q').value.toLowerCase(),f=document.querySelector('#filter').value,p=document.querySelector('#priority').value;const items=[...data.items].sort((a,b)=>(rank[a.priority]??9)-(rank[b.priority]??9)||a.name.localeCompare(b.name));document.querySelector('#list').innerHTML=items.filter(t=>(!q||(t.name+' '+t.slug+' '+t.type).toLowerCase().includes(q))&&(!f||t.status===f)&&(!p||t.priority===p)).map(t=>`<div class="card ${t.priority==='high'?'priority-high':''}"><div><div class="name">${esc(t.name)}</div><span class="priority ${esc(t.priority||'medium')}">${esc(t.priority||'medium')} priority</span><div class="details" style="margin-top:7px">${esc(t.type)}<br>${esc(t.cost||'')}</div></div><div><span class="pill">${esc(labels[t.status]||t.status)}</span><div class="save">${esc(t.updated_at||'')}</div></div><div><div class="details">${esc(t.next_action||'Review submission requirements.')}</div><div class="actions">${t.action_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(t.action_url)}">Open signup / submit ↗</a>`:''}${t.url?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(t.url)}">Platform ↗</a>`:''}${t.live_url?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(t.live_url)}">Live listing ↗</a>`:''}<button class="btn alt" onclick="copyPack('${esc(t.slug)}')">Copy submission pack</button></div></div><div><select onchange="setStatus('${esc(t.slug)}',this.value)">${Object.keys(labels).map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${labels[s]}</option>`).join('')}</select><textarea id="n-${esc(t.slug)}" rows="3" placeholder="Notes or live listing URL">${esc(t.notes||'')}</textarea><button class="btn alt" onclick="saveNote('${esc(t.slug)}')">Save note</button></div></div>`).join('');}async function patch(slug,body){const r=await fetch('/distribution-workflow/api/'+encodeURIComponent(slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('save failed');await load();}function setStatus(slug,status){patch(slug,{status});}function saveNote(slug){const v=document.querySelector('#n-'+CSS.escape(slug)).value;const isUrl=/^https?:\/\//i.test(v.trim());patch(slug,isUrl?{live_url:v.trim(),notes:'Live listing URL supplied manually'}:{notes:v});}async function copyPack(slug){const t=data.items.find(x=>x.slug===slug);const p=data.submissionPack;const text=`Platform: ${t.name}\nProduct: ${p.product}\nWebsite: ${p.website}\nTagline: ${p.tagline}\nDescription: ${p.short_description}\nAudience: ${p.audience}\nDifferentiator: ${p.differentiator}\nFounder: ${p.founder}\nLocation: ${p.location}\n\nNext action: ${t.next_action}`;await navigator.clipboard.writeText(text);}document.querySelector('#q').oninput=render;document.querySelector('#filter').onchange=render;document.querySelector('#priority').onchange=render;load().catch(()=>document.body.innerHTML='<div class="private"><div class="eyebrow">ToolScout / Operations</div><h1>Private access required</h1><p class="muted">Sign in through ToolScout private access and reload this page.</p></div>');</script></body></html>
