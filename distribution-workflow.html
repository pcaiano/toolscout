<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ToolScout Distribution Workflow</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#101828;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1480px;margin:auto;padding:28px 18px 80px}h1{letter-spacing:-.04em;margin-bottom:4px}.muted{color:#667085}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:22px 0}.stat,.card,.pack{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px}.stat strong{font-size:28px;display:block}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.bar input,.bar select,select,textarea{border:1px solid #d0d5dd;border-radius:10px;padding:9px;background:#fff;font:inherit}.bar input{min-width:260px}.grid{display:grid;gap:12px}.card{display:grid;grid-template-columns:220px 160px minmax(340px,1fr) 220px;gap:14px;align-items:start}.card.priority-high{border:2px solid #101828;box-shadow:0 4px 14px rgba(16,24,40,.08)}.name{font-weight:800;font-size:17px}.pill,.priority{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2f4f7;font-size:11px}.priority{margin-top:7px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.priority.high{background:#101828;color:#fff}.priority.medium{background:#eef2f6;color:#344054}.priority.low{background:#f9fafb;color:#667085}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{display:inline-block;padding:8px 10px;border-radius:9px;background:#101828;color:#fff;text-decoration:none;border:0;cursor:pointer;font:inherit;font-size:12px}.btn.alt{background:#eef2f6;color:#101828}.details{font-size:12px;color:#667085;line-height:1.55}.pack{margin:20px 0}.pack pre{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:10px;font-size:12px}.save{font-size:11px;color:#667085;margin-top:5px}@media(max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:1fr}.bar input{min-width:0;width:100%}}</style></head><body><div class="wrap"><h1>Distribution Workflow</h1><div class="muted">Private ToolScout operating page · priority targets first · directories, launch platforms and distribution actions requiring signup</div><div class="stats" id="stats"></div><div class="pack"><b>Reusable submission pack</b><pre id="pack">Loading…</pre></div><div class="bar"><input id="q" placeholder="Search platforms"><select id="filter"><option value="">All statuses</option><option>live</option><option>scheduled</option><option>submitted</option><option>needs_info</option><option>ready_to_submit</option><option>research_required</option><option>rejected</option><option>not_applicable</option></select><select id="priority"><option value="">All priorities</option><option value="high">High priority</option><option value="medium">Medium priority</option><option value="low">Low priority</option></select></div><div class="grid" id="list"></div></div><script>let data={items:[],submissionPack:{}};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const labels={live:'Live',scheduled:'Scheduled',submitted:'Submitted',needs_info:'Needs info',ready_to_submit:'Ready to submit',research_required:'Research required',rejected:'Rejected',not_applicable:'Not applicable'};const rank={high:0,medium:1,low:2};async function load(){const r=await fetch('/distribution-workflow/api',{cache:'no-store'});if(!r.ok)throw Error('unauthorized');data=await r.json();render();}function render(){const counts={};data.items.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);const high=data.items.filter(t=>t.priority==='high'&&!['live','rejected','not_applicable'].includes(t.status)).length;document.querySelector('#stats').innerHTML=[['Actions',data.items.length],['Priority now',high],['Live',counts.live||0],['Scheduled',counts.scheduled||0],['Submitted',counts.submitted||0],['Ready',(counts.ready_to_submit||0)+(counts.research_required||0)]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');document.querySelector('#pack').textContent=Object.entries(data.submissionPack||{}).map(([k,v])=>`${k}: ${v}`).join('\n\n');const q=document.querySelector('#q').value.toLowerCase(),f=document.querySelector('#filter').value,p=document.querySelector('#priority').value;const items=[...data.items].sort((a,b)=>(rank[a.priority]??9)-(rank[b.priority]??9)||a.name.localeCompare(b.name));document.querySelector('#list').innerHTML=items.filter(t=>(!q||(t.name+' '+t.slug+' '+t.type).toLowerCase().includes(q))&&(!f||t.status===f)&&(!p||t.priority===p)).map(t=>`<div class="card ${t.priority==='high'?'priority-high':''}"><div><div class="name">${esc(t.name)}</div><span class="priority ${esc(t.priority||'medium')}">${esc(t.priority||'medium')} priority</span><div class="details" style="margin-top:7px">${esc(t.type)}<br>${esc(t.cost||'')}</div></div><div><span class="pill">${esc(labels[t.status]||t.status)}</span><div class="save">${esc(t.updated_at||'')}</div></div><div><div class="details">${esc(t.next_action||'Review submission requirements.')}</div><div class="actions">${t.action_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(t.action_url)}">Open signup / submit ↗</a>`:''}${t.url?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(t.url)}">Platform ↗</a>`:''}${t.live_url?`<a class="btn alt" target="_blank" rel="noopener" href="${esc(t.live_url)}">Live listing ↗</a>`:''}<button class="btn alt" onclick="copyPack('${esc(t.slug)}')">Copy submission pack</button></div></div><div><select onchange="setStatus('${esc(t.slug)}',this.value)">${Object.keys(labels).map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${labels[s]}</option>`).join('')}</select><textarea id="n-${esc(t.slug)}" rows="3" placeholder="Notes or live listing URL">${esc(t.notes||'')}</textarea><button class="btn alt" onclick="saveNote('${esc(t.slug)}')">Save note</button></div></div>`).join('');}async function patch(slug,body){const r=await fetch('/distribution-workflow/api/'+encodeURIComponent(slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('save failed');await load();}function setStatus(slug,status){patch(slug,{status});}function saveNote(slug){const v=document.querySelector('#n-'+CSS.escape(slug)).value;const isUrl=/^https?:\/\//i.test(v.trim());patch(slug,isUrl?{live_url:v.trim(),notes:'Live listing URL supplied manually'}:{notes:v});}async function copyPack(slug){const t=data.items.find(x=>x.slug===slug);const p=data.submissionPack;const text=`Platform: ${t.name}\nProduct: ${p.product}\nWebsite: ${p.website}\nTagline: ${p.tagline}\nDescription: ${p.short_description}\nAudience: ${p.audience}\nDifferentiator: ${p.differentiator}\nFounder: ${p.founder}\nLocation: ${p.location}\n\nNext action: ${t.next_action}`;await navigator.clipboard.writeText(text);}document.querySelector('#q').oninput=render;document.querySelector('#filter').onchange=render;document.querySelector('#priority').onchange=render;load().catch(()=>document.body.innerHTML='<div class="wrap"><h1>Private access required</h1><p class="muted">Sign in through ToolScout private access and reload this page.</p></div>');</script></body></html>
